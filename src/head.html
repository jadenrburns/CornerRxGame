<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corner Rx</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: a pharmacy counter. Left = the counter where patients ask questions on Rx labels.
   Right = the store (shelf scene, upgrades, franchise, mastery, review shelf). */
:root {
  --bg: #E6EFF0;
  --surface: #FFFFFF;
  --surface2: #F1F7F7;
  --ink: #10292C;
  --muted: #587174;
  --line: #CBDADC;
  --teal: #0E9A8E;
  --teal-ink: #07514B;
  --teal-soft: #D5F0EC;
  --amber: #F1A20E;
  --amber-soft: #FDEBC4;
  --coral: #E04F3A;
  --coral-soft: #FADBD5;
  --on-teal: #FFFFFF;
  --stage: #CFE7E9;
  --shadow: 0 1px 0 rgba(16,41,44,.04), 0 8px 24px -12px rgba(16,41,44,.25);
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1517; --surface: #11272B; --surface2: #17333A; --ink: #E3F1F0; --muted: #8DAAAD;
    --line: #25444B; --teal: #2CCDBB; --teal-ink: #8AEDE1; --teal-soft: #14403F; --amber: #FFBE3D;
    --amber-soft: #4A3912; --coral: #FF7A66; --coral-soft: #4B2620; --on-teal: #062A27; --stage: #0D2226;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1517; --surface: #11272B; --surface2: #17333A; --ink: #E3F1F0; --muted: #8DAAAD;
  --line: #25444B; --teal: #2CCDBB; --teal-ink: #8AEDE1; --teal-soft: #14403F; --amber: #FFBE3D;
  --amber-soft: #4A3912; --coral: #FF7A66; --coral-soft: #4B2620; --on-teal: #062A27; --stage: #0D2226;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--f-body);
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: radial-gradient(var(--line) 1px, transparent 1.2px);
  background-size: 22px 22px;
  background-attachment: fixed;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 8px; }
.shell { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font: 800 26px/1 var(--f-display); letter-spacing: -0.02em; }
.brand small { display: block; margin-top: 4px; font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; min-width: 104px; box-shadow: var(--shadow); }
.stat span { display: block; font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat b { display: block; margin-top: 5px; font: 800 20px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat.cash b { color: var(--amber); }
.stat small { font: 500 11px/1 var(--f-mono); color: var(--muted); margin-left: 4px; }
.repbar { height: 6px; border-radius: 6px; background: var(--surface2); margin-top: 7px; overflow: hidden; }
.repbar i { display: block; height: 100%; background: var(--teal); transition: width .4s; }
.repbar i.low { background: var(--coral); }

/* ---------- main grid ---------- */
.below { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 12px; font: 800 16px/1.1 var(--f-display); letter-spacing: -0.01em; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card h2 small { font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }


/* ---------- 3D stage ---------- */
.stage { position: relative; height: clamp(560px, 50vw, 680px); border-radius: 22px; overflow: hidden; border: 1.5px solid var(--ink); box-shadow: 6px 6px 0 var(--teal); background: var(--stage); touch-action: pan-y; }
.stage canvas { display: block; width: 100%; height: 100%; cursor: default; touch-action: pan-y; }
.stage canvas.grabbing { cursor: grabbing; }
.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag3d { position: absolute; left: 0; top: 0; pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 10px; font: 600 11px/1 var(--f-mono); box-shadow: 0 3px 0 rgba(0,0,0,.18); will-change: transform; }
.tag3d span { font-family: var(--f-body); font-weight: 700; }
.tag3d b { color: var(--teal-ink); font-weight: 700; }
.tag3d i { font-style: normal; font-weight: 700; background: var(--line); color: var(--muted); border-radius: 999px; padding: 4px 8px; }
.tag3d[data-state="can"] i { background: var(--amber); color: #2B1D00; }
.tag3d[data-state="can"] { animation: bob 1.6s ease-in-out infinite; }
.tag3d.hover { background: var(--teal); color: var(--on-teal); }
.tag3d.hover b { color: var(--on-teal); }
@keyframes bob { 50% { box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 0 0 4px rgba(241,162,14,.35); } }
.bub3d { position: absolute; left: 0; top: 0; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--amber); color: #2B1D00; border: 2px solid var(--ink); font: 800 16px/1 var(--f-display); pointer-events: none; will-change: transform; }
.say3d { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
.phonebtn { position: absolute; left: 10px; top: 54px; z-index: 3; padding: 9px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--amber); color: #2B1D00; font: 800 14px/1.2 var(--f-display); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; animation: ringbtn .5s infinite alternate; }
.phonebtn[hidden] { display: none; }
@keyframes ringbtn { from { transform: rotate(-2deg); } to { transform: rotate(2deg) scale(1.03); } }
@media (prefers-reduced-motion: reduce) { .phonebtn { animation: none; } }
.stage.flat .phonebtn { position: static; margin: 10px 12px 0; }
.toast3d { position: absolute; left: 50%; top: 12px; opacity: 0; visibility: hidden; transform: translate(-50%, -260%); max-width: calc(100% - 24px); padding: 8px 14px; border-radius: 12px; background: var(--coral); color: #fff; border: 2px solid var(--ink); font: 700 13px/1.3 var(--f-display); text-align: center; pointer-events: none; transition: transform .35s, opacity .3s, visibility 0s .35s; z-index: 4; }
.toast3d.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition: transform .35s, opacity .2s; }
.rx.phonecall .rx-head { background: var(--teal-soft); border-bottom-color: var(--teal); }
.callav { width: 64px; height: 64px; border-radius: 18px; background: var(--teal-soft); display: grid; place-items: center; font-size: 30px; flex: none; }
.qcall { font: 700 13px/1 var(--f-mono); padding: 8px 12px; }
.line3d { position: absolute; left: 134px; top: 14px; padding: 4px 11px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--ink); font: 700 12px/1.2 var(--f-mono); pointer-events: none; }
.rush3d { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: var(--amber); border: 2px solid var(--ink); font: 800 12px/1.2 var(--f-mono); letter-spacing: .06em; box-shadow: 0 3px 0 var(--ink); pointer-events: none; animation: rushp 1s infinite alternate; z-index: 4; }
.rush3d[hidden] { display: none; }
@keyframes rushp { to { transform: translateX(-50%) scale(1.05); } }
.line3d.busy { background: var(--amber-soft); }
.line3d.full { background: var(--coral); color: #fff; }
.say3d span.emo { font-size: 26px; line-height: 1.15; padding: 0 7px; border-radius: 14px; }
.say3d span { display: block; padding: 2px 9px; border-radius: 10px; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); font: 800 13px/1.3 var(--f-display); white-space: nowrap; animation: sayup 1.1s ease-out forwards; }
@keyframes sayup { 0% { opacity: 0; transform: translateY(6px) scale(.8); } 15% { opacity: 1; transform: translateY(0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
@media (prefers-reduced-motion: reduce) { .say3d span { animation: none; } }
.bub3d.ok { background: var(--teal); color: var(--on-teal); }
.bub3d.bad, .bub3d.kar { background: var(--coral); color: #fff; }
.bub3d.kar { animation: kar .5s infinite alternate; }
@keyframes kar { to { scale: 1.18; } }
.hud { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
.hud button { width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--surface); font: 700 15px/1 var(--f-mono); display: grid; place-items: center; padding: 0; }
.hud button.hudtxt { width: auto; padding: 0 12px 0 10px; gap: 6px; grid-auto-flow: column; font: 700 13px/1 var(--f-display); }
body.fx .hud button.hudtxt { width: auto; }
.hud button:hover { background: var(--surface2); }
.hud button svg { display: block; }
.hint3d { position: absolute; left: 12px; bottom: 12px; max-width: min(420px, calc(100% - 520px)); background: var(--surface); border: 1.5px solid var(--ink); border-radius: 12px; padding: 7px 11px; font: 500 12px/1.3 var(--f-mono); transition: opacity .6s; pointer-events: none; }
.hint3d.gone { opacity: 0; }
@media (max-width: 560px) { .tag3d span { display: none; } .tag3d { padding-left: 8px; } }
.tag3d[data-state="note"] i { background: var(--teal); color: var(--on-teal); }

/* ---------- in-world question panel ---------- */
.qpanel { position: absolute; right: 12px; top: 12px; bottom: 12px; width: min(470px, 46%); overflow: auto; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--ink); box-shadow: var(--shadow); display: flex; flex-direction: column; overscroll-behavior: contain; }
.qpanel.karen { border-color: var(--coral); box-shadow: 0 0 0 4px rgba(224,79,58,.35); animation: karenpulse 1s infinite alternate; }
@keyframes karenpulse { to { box-shadow: 0 0 0 8px rgba(224,79,58,.12); } }
.qbar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface2); flex-wrap: wrap; position: sticky; top: 0; z-index: 3; }
.qbar button { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 11px; font: 600 12.5px/1.2 var(--f-body); text-align: left; }
.qbar button:hover { border-color: var(--teal); }
.qbar button.on { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.qbar .qset { flex: 1 1 200px; min-width: 0; }
.qbar .qset span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.qbar svg { width: 16px; height: 16px; flex: none; }
.qpanel .rx { margin: 0; border: 0; border-radius: 0; box-shadow: none; overflow: visible; flex: 1; }
.rx.karen .rx-head { background: var(--coral-soft); border-bottom-color: var(--coral); }
.rx.karen .rx-sym, .rx.karen .rx-meta b { color: var(--coral); }
.rx.karen .bubble { background: var(--coral-soft); }
.rx.karen .bubble em { color: var(--coral); font-weight: 700; }
.rx.karen .timer i { background: var(--coral); }
.rx.sweaty .rx-head { background: var(--amber-soft); border-bottom-color: var(--amber); }
.rx.sweaty .bubble { background: var(--amber-soft); }
.rx.sweaty .bubble em { color: var(--ink); font-weight: 700; }
.opts .jim { grid-column: 1; z-index: 2; align-self: stretch; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px 12px; align-items: center; padding: 10px 12px; background: var(--amber-soft); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--amber); animation: jimin .25s ease-out; }
.jim .avatar { width: 52px; height: 52px; }
.jim p { margin: 0; font-weight: 700; font-size: 14px; line-height: 1.3; }
.jim .jbar { height: 5px; border-radius: 5px; background: var(--line); margin-top: 6px; overflow: hidden; }
.jim .jbar i { display: block; height: 100%; background: var(--amber); transform-origin: left; width: 100%; }
.jim button { grid-column: 2; justify-self: start; }
@keyframes jimin { from { transform: translateX(24px); opacity: 0; } }
.mepv { display: grid; place-items: center; }
.mepv-svg { width: 132px; height: 132px; }
.mepv-img { width: 190px; height: auto; border-radius: 22px; background: var(--surface2); border: 1.5px solid var(--line); }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--amber); }
.aw { display: grid; gap: 6px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.awh { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.awh span { font: 600 11.5px/1.4 var(--f-mono); color: var(--muted); }
.awbar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.awbar i { display: block; height: 100%; background: var(--teal); }
.awt { display: flex; flex-wrap: wrap; gap: 6px; }
.tier { font: 600 11.5px/1.3 var(--f-mono); padding: 4px 9px; border-radius: 999px; border: 1.5px dashed var(--line); color: var(--muted); }
.tier.on { border: 1.5px solid var(--amber); background: var(--amber-soft); color: var(--ink); }
.awps { display: grid; gap: 8px; }
.awp { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border: 1.5px dashed var(--line); border-radius: 14px; opacity: .75; }
.awp > span { font-size: 28px; filter: grayscale(1); }
.awp small { display: block; color: var(--muted); font-size: 12px; }
.awp.on { border: 1.5px solid var(--teal); background: var(--teal-soft); opacity: 1; }
.awp.on > span { filter: none; }
.empty-q { padding: 22px 18px; display: grid; gap: 12px; }
.empty-q p { margin: 0; color: var(--muted); }
.pane { padding: 16px 18px 20px; display: grid; gap: 16px; }
.pane h3 { margin: 0; font: 800 20px/1.1 var(--f-display); }
.pane .sub { margin: -8px 0 0; font-size: 13px; color: var(--muted); }
.grp { display: grid; gap: 8px; }
.grp > b { font: 700 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.grp > b .link { font: 600 12px var(--f-body); text-transform: none; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); }
.count { margin: 0; font: 600 13px var(--f-mono); color: var(--teal-ink); }
.deckrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); }
.deckrow b { font-weight: 700; overflow-wrap: anywhere; }
.deckrow span { font: 500 11.5px var(--f-mono); color: var(--muted); }
.deckrow .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.mini { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 5px 10px; font: 600 12px/1.2 var(--f-body); }
.mini:hover { border-color: var(--teal); }
.mini.on { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.mini.danger.arm { background: var(--coral); border-color: var(--coral); color: #fff; }
.field { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 9px 11px; font: 500 14px/1.4 var(--f-body); }
textarea.field { min-height: 170px; resize: vertical; font: 500 12.5px/1.5 var(--f-mono); }
.field:focus { outline: 3px solid var(--amber); outline-offset: 1px; border-color: var(--teal); }
.prev { border-radius: 12px; padding: 10px 12px; font-size: 13px; background: var(--surface2); display: grid; gap: 4px; }
.prev.err { background: var(--coral-soft); }
.prev.good { background: var(--teal-soft); }
.prev ul { margin: 0; padding-left: 18px; }
pre.help { margin: 0; padding: 10px 12px; background: var(--surface2); border-radius: 12px; font: 500 11.5px/1.5 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
details.how > summary { cursor: pointer; font: 600 13px var(--f-body); color: var(--teal-ink); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.stage.flat { height: auto; background: none; border: 0; box-shadow: none; overflow: visible; }
.stage.flat .qpanel { position: static; width: auto; max-height: none; overflow: visible; border-radius: 18px; }
.stage.flat .say3d, .stage.flat .line3d, .stage.flat .tags, .stage.flat .hud, .stage.flat .hint3d, .stage.flat .bub3d { display: none; }
@media (max-width: 900px) {
  .stage { height: clamp(620px, 98svh, 840px); }
  .qpanel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 66%; }
  .hint3d { display: none; }
}

/* ---------- focus chips ---------- */
.focus { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: 600 12.5px/1 var(--f-body); color: var(--muted); }
.chip:hover { border-color: var(--teal); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.tip { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }

/* ---------- Rx label card ---------- */
.rx { position: relative; margin-top: 14px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 20px; padding: 0; box-shadow: 6px 6px 0 var(--teal); overflow: hidden; }
.rx-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1.5px dashed var(--ink); background: var(--surface2); flex-wrap: wrap; }
.rx-sym { font: 800 34px/1 var(--f-display); color: var(--teal); }
.rx-meta { display: grid; gap: 3px; margin-right: auto; min-width: 0; }
.rx-meta b { font: 700 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.rx-meta span { font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.dots { display: inline-flex; gap: 4px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--amber); }
.timer { flex: 1 1 120px; max-width: 200px; height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--amber); transform-origin: left; }
.rx-body { padding: 18px; display: grid; gap: 16px; }
.patient { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: start; }
.avatar { width: 64px; height: 64px; }
.bubble { position: relative; background: var(--teal-soft); border-radius: 6px 18px 18px 18px; padding: 12px 16px; }
.bubble em { display: block; font-style: normal; font: 500 12px/1.3 var(--f-mono); color: var(--teal-ink); margin-bottom: 6px; }
.bubble p { margin: 0; font: 700 18px/1.3 var(--f-display); letter-spacing: -0.005em; text-wrap: balance; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px; font-weight: 600; transition: transform .08s, border-color .15s, background .15s; }
.opt kbd { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--surface2); font: 700 12px/1 var(--f-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--teal); transform: translateX(3px); }
.opt:disabled { cursor: default; }
.opt.gone { opacity: .28; text-decoration: line-through; }
.opt.ok { border-color: var(--teal); background: var(--teal-soft); }
.opt.ok kbd { background: var(--teal); color: var(--on-teal); }
.opt.bad { border-color: var(--coral); background: var(--coral-soft); animation: shake .35s; }
.opt.bad kbd { background: var(--coral); color: #fff; }

/* ---------- full-window 3D mode (body.fx is set when WebGL works) ---------- */
.drawerbtn, .scrim, .drawerhead, .qgrab { display: none; }

/* the stats and upgrades slide up as a sheet inside the window */
body.fx .below { position: fixed; left: 0; right: 0; bottom: 0; top: 8vh; top: 8dvh; z-index: 31; background: var(--bg); border-radius: 22px 22px 0 0; border-top: 2px solid var(--ink); padding: 62px max(14px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); overflow: auto; transform: translateY(110%); visibility: hidden; transition: transform .3s ease, visibility 0s .3s; box-shadow: 0 -10px 34px rgba(0,0,0,.3); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

}

.linkbtn { background: none; border: 0; padding: 2px 0; color: inherit; text-align: left; cursor: pointer; font: inherit; text-decoration: underline dotted; }

/* lost pills: vial button, dialogs, capsule reveal, tablet trip */
#vialbtn { position: relative; }
#vialbtn .vcount { position: absolute; right: -6px; top: -6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: var(--coral); color: #fff; border: 1.5px solid var(--ink); font: 800 11px/15px var(--f-mono); text-align: center; box-sizing: border-box; }
#vialbtn .vcount[hidden] { display: none; }
.vcard { width: min(400px, 100%); max-height: 92vh; overflow: auto; text-align: left; }
.vgrid { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.vpill { width: 52px; height: 52px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface2); display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--ink); }
.vpill[aria-pressed="true"] { border-color: var(--ink); background: var(--amber-soft); box-shadow: 0 3px 0 var(--ink); }
.vpill:focus-visible, .vcard .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.vdesc { font-size: 13.5px; line-height: 1.4; }
.capstage { position: relative; height: 110px; display: grid; place-items: center; margin: 6px 0 4px; }
.capbig { width: 210px; height: 105px; overflow: visible; }
.capbig .chalf { transition: transform .7s cubic-bezier(.2,.9,.3,1.2); transform-box: fill-box; }
.capstage:not(.open) .capbig { animation: capshake .9s ease-in-out; }
.capstage.open .chalf.l { transform: translate(-34px, -6px) rotate(-16deg); }
.capstage.open .chalf.r { transform: translate(34px, -6px) rotate(16deg); }
.reel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.2); font-size: 46px; line-height: 1; opacity: 0; transition: opacity .3s, transform .3s; }
.capstage.open .reel { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.reel.land { animation: reelland .6s cubic-bezier(.2,1.6,.4,1); }
.rname { font-size: 14px; line-height: 1.4; margin: 6px 0 8px; min-height: 2.8em; }
.capprev { display: block; margin: 0 auto 8px; max-height: 170px; width: auto; }
@keyframes capshake { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-9deg) translateX(-4px); } 30% { transform: rotate(8deg) translateX(4px); } 45% { transform: rotate(-7deg); } 60% { transform: rotate(6deg); } 75% { transform: rotate(-3deg); } }
@keyframes reelland { 0% { transform: translate(-50%,-50%) scale(.6); } 60% { transform: translate(-50%,-50%) scale(1.5) rotate(8deg); } 100% { transform: translate(-50%,-50%) scale(1); } }
.buffpill { position: fixed; left: 50%; transform: translateX(-50%); bottom: 14px; z-index: 70; max-width: calc(100vw - 24px); padding: 6px 14px; border-radius: 999px; background: #F2A516; color: #2B1D00; border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); font: 800 12px/1.25 var(--f-mono); text-align: center; pointer-events: none; }
.tripfx { position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: 0; mix-blend-mode: soft-light; background: conic-gradient(from 0deg at 50% 50%, #ff3d81, #ffb02e, #3fd07f, #2fb6ff, #8a63c9, #ff3d81); transition: opacity 1.2s; }
body.trip .tripfx { opacity: .55; animation: tripspin 9s linear infinite; }
body.trip #stage canvas { animation: tripwarp 7s ease-in-out infinite; transform-origin: 50% 50%; }
body.trip .stats .stat { animation: tripbob 1.4s ease-in-out infinite; }
@keyframes tripspin { to { transform: rotate(360deg) scale(1.4); } }
@keyframes tripwarp {
  0% { filter: hue-rotate(0deg) saturate(1.6) contrast(1.1); transform: scale(1.03) rotate(0deg) skewX(0deg); }
  25% { filter: hue-rotate(90deg) saturate(2) contrast(1.15) blur(.6px); transform: scale(1.06) rotate(.8deg) skewX(2deg); }
  50% { filter: hue-rotate(180deg) saturate(1.8) contrast(1.1); transform: scale(1.02) rotate(-.6deg) skewX(-1.5deg); }
  75% { filter: hue-rotate(270deg) saturate(2) contrast(1.2) blur(.6px); transform: scale(1.07) rotate(.5deg) skewX(2.5deg); }
  100% { filter: hue-rotate(360deg) saturate(1.6) contrast(1.1); transform: scale(1.03) rotate(0deg) skewX(0deg); }
}
@keyframes tripbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
@media (prefers-reduced-motion: reduce) {
  body.trip .tripfx { animation: none; opacity: .3; }
  body.trip #stage canvas { animation: none; filter: hue-rotate(40deg) saturate(1.5); }
  body.trip .stats .stat { animation: none; }
  .capstage:not(.open) .capbig { animation: none; } .capbig .chalf, .reel { transition: none; } .reel.land { animation: none; }
}

/* character screen: stacked slider rows */
.cpane .mepv.sticky { position: sticky; top: 52px; z-index: 3; padding: 6px 0; background: var(--surface); display: flex; justify-content: center; border-bottom: 1.5px dashed var(--line); }

.crows { display: grid; gap: 8px; margin: 10px 0; }
.crow { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; }
.clab { font: 700 11px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cslide { display: grid; grid-template-columns: 44px 1fr 44px; gap: 6px; align-items: center; }
.carr { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font: 800 24px/1 var(--f-display); cursor: pointer; box-shadow: 0 3px 0 var(--ink); padding: 0; }
.carr:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.carr:disabled { opacity: .35; cursor: default; box-shadow: none; }
.carr:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.cval { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 44px; padding: 4px 10px; border-radius: 12px; background: var(--surface2); border: 1.5px solid var(--line); font: 700 14px/1.2 var(--f-display); }
.cval span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cval small { font: 500 10px/1 var(--f-mono); color: var(--muted); white-space: nowrap; }
.csw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
@media (max-width: 420px) { .crow { grid-template-columns: 1fr; gap: 4px; } }
.reel img { width: 96px; height: 96px; display: block; filter: drop-shadow(0 3px 0 rgba(0,0,0,.18)); }
.capstage { height: 120px; }
.flaglink{display:inline-block;margin-left:10px;font-size:.85rem;color:#5b6b6b;text-decoration:underline;padding:8px 4px}.flaglink:hover{color:#0f766e}
.fsw{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:#F3E8C2;box-shadow:0 0 0 1.5px #E8D9A8}.fsw .fswl{font-weight:800;color:#3b2f10;line-height:1.2}.fsw small{display:block;font-weight:500;font-size:.78rem;color:#6b5b2a;margin-top:2px}.fsw.dis{opacity:.55}
.swt{flex:none;position:relative;width:54px;height:30px;border-radius:999px;border:2px solid #8F6E22;background:#fff;cursor:pointer;padding:0;transition:background .18s}.swt i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#8F6E22;transition:transform .18s}.swt[aria-checked=true]{background:#0f766e;border-color:#0f766e}.swt[aria-checked=true] i{transform:translateX(24px);background:#fff}.swt:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.swt:disabled{cursor:not-allowed}

.himfx { position: absolute; pointer-events: none; z-index: 40; }
.himfx.smash { left: 50%; top: 30%; font: 900 clamp(44px, 10vw, 104px)/1 var(--f-display); color: #FFD54A; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--ink); animation: himpop 1.4s ease-out forwards; }
.himfx.bless { left: 50%; top: 22%; font: 900 clamp(30px, 7vw, 64px)/1 var(--f-display); color: #FFF3B0; -webkit-text-stroke: 3px #8A5A00; paint-order: stroke fill; text-shadow: 0 0 18px #FFD54A, 4px 4px 0 #8A5A00; animation: himrise 2.4s ease-out forwards; }
.himfx.flash { inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255, 233, 150, .8), rgba(255, 213, 74, .22) 55%, transparent 80%); animation: himflash 2.6s ease-out forwards; }
@keyframes himpop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-7deg); opacity: 0; } 14% { transform: translate(-50%, -50%) scale(1.3) rotate(-7deg); opacity: 1; } 28% { transform: translate(-50%, -50%) scale(1) rotate(-7deg); } 80% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.05) rotate(-7deg); opacity: 0; } }
@keyframes himrise { 0% { transform: translate(-50%, 20px) scale(.6); opacity: 0; } 20% { transform: translate(-50%, 0) scale(1.1); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -40px) scale(1); opacity: 0; } }
@keyframes himflash { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
