<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corner Rx</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: a pharmacy counter. Left = the counter where patients ask questions on Rx labels.
   Right = the store (shelf scene, upgrades, franchise, mastery, review shelf). */
:root {
  --bg: #E6EFF0;
  --surface: #FFFFFF;
  --surface2: #F1F7F7;
  --ink: #10292C;
  --muted: #587174;
  --line: #CBDADC;
  --teal: #0E9A8E;
  --teal-ink: #07514B;
  --teal-soft: #D5F0EC;
  --amber: #F1A20E;
  --amber-soft: #FDEBC4;
  --coral: #E04F3A;
  --coral-soft: #FADBD5;
  --on-teal: #FFFFFF;
  --stage: #CFE7E9;
  --shadow: 0 1px 0 rgba(16,41,44,.04), 0 8px 24px -12px rgba(16,41,44,.25);
  --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1517; --surface: #11272B; --surface2: #17333A; --ink: #E3F1F0; --muted: #8DAAAD;
    --line: #25444B; --teal: #2CCDBB; --teal-ink: #8AEDE1; --teal-soft: #14403F; --amber: #FFBE3D;
    --amber-soft: #4A3912; --coral: #FF7A66; --coral-soft: #4B2620; --on-teal: #062A27; --stage: #0D2226;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1517; --surface: #11272B; --surface2: #17333A; --ink: #E3F1F0; --muted: #8DAAAD;
  --line: #25444B; --teal: #2CCDBB; --teal-ink: #8AEDE1; --teal-soft: #14403F; --amber: #FFBE3D;
  --amber-soft: #4A3912; --coral: #FF7A66; --coral-soft: #4B2620; --on-teal: #062A27; --stage: #0D2226;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 var(--f-body);
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background-image: radial-gradient(var(--line) 1px, transparent 1.2px);
  background-size: 22px 22px;
  background-attachment: fixed;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; border-radius: 8px; }
.shell { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }

/* ---------- top bar ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font: 800 26px/1 var(--f-display); letter-spacing: -0.02em; }
.brand small { display: block; margin-top: 4px; font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; min-width: 104px; box-shadow: var(--shadow); }
.stat span { display: block; font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat b { display: block; margin-top: 5px; font: 800 20px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat.cash b { color: var(--amber); }
.stat small { font: 500 11px/1 var(--f-mono); color: var(--muted); margin-left: 4px; }
.repbar { height: 6px; border-radius: 6px; background: var(--surface2); margin-top: 7px; overflow: hidden; }
.repbar i { display: block; height: 100%; background: var(--teal); transition: width .4s; }
.repbar i.low { background: var(--coral); }

/* ---------- main grid ---------- */
.below { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 12px; font: 800 16px/1.1 var(--f-display); letter-spacing: -0.01em; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card h2 small { font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }


/* ---------- 3D stage ---------- */
.stage { position: relative; height: clamp(560px, 50vw, 680px); border-radius: 22px; overflow: hidden; border: 1.5px solid var(--ink); box-shadow: 6px 6px 0 var(--teal); background: var(--stage); touch-action: pan-y; }
.stage canvas { display: block; width: 100%; height: 100%; cursor: default; touch-action: pan-y; }
.stage canvas.grabbing { cursor: grabbing; }
.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag3d { position: absolute; left: 0; top: 0; pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 10px; font: 600 11px/1 var(--f-mono); box-shadow: 0 3px 0 rgba(0,0,0,.18); will-change: transform; }
.tag3d span { font-family: var(--f-body); font-weight: 700; }
.tag3d b { color: var(--teal-ink); font-weight: 700; }
.tag3d i { font-style: normal; font-weight: 700; background: var(--line); color: var(--muted); border-radius: 999px; padding: 4px 8px; }
.tag3d[data-state="can"] i { background: var(--amber); color: #2B1D00; }
.tag3d[data-state="can"] { animation: bob 1.6s ease-in-out infinite; }
.tag3d.hover { background: var(--teal); color: var(--on-teal); }
.tag3d.hover b { color: var(--on-teal); }
@keyframes bob { 50% { box-shadow: 0 3px 0 rgba(0,0,0,.18), 0 0 0 4px rgba(241,162,14,.35); } }
.bub3d { position: absolute; left: 0; top: 0; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--amber); color: #2B1D00; border: 2px solid var(--ink); font: 800 16px/1 var(--f-display); pointer-events: none; will-change: transform; }
.say3d { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
.phonebtn { position: absolute; left: 10px; top: 54px; z-index: 3; padding: 9px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--amber); color: #2B1D00; font: 800 14px/1.2 var(--f-display); box-shadow: 3px 3px 0 var(--ink); cursor: pointer; animation: ringbtn .5s infinite alternate; }
.phonebtn[hidden] { display: none; }
@keyframes ringbtn { from { transform: rotate(-2deg); } to { transform: rotate(2deg) scale(1.03); } }
@media (prefers-reduced-motion: reduce) { .phonebtn { animation: none; } }
.stage.flat .phonebtn { position: static; margin: 10px 12px 0; }
.toast3d { position: absolute; left: 50%; top: 12px; opacity: 0; visibility: hidden; transform: translate(-50%, -260%); max-width: calc(100% - 24px); padding: 8px 14px; border-radius: 12px; background: var(--coral); color: #fff; border: 2px solid var(--ink); font: 700 13px/1.3 var(--f-display); text-align: center; pointer-events: none; transition: transform .35s, opacity .3s, visibility 0s .35s; z-index: 4; }
.toast3d.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition: transform .35s, opacity .2s; }
.rx.phonecall .rx-head { background: var(--teal-soft); border-bottom-color: var(--teal); }
.callav { width: 64px; height: 64px; border-radius: 18px; background: var(--teal-soft); display: grid; place-items: center; font-size: 30px; flex: none; }
.qcall { font: 700 13px/1 var(--f-mono); padding: 8px 12px; }
.line3d { position: absolute; left: 134px; top: 14px; padding: 4px 11px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--ink); font: 700 12px/1.2 var(--f-mono); pointer-events: none; }
.rush3d { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: var(--amber); border: 2px solid var(--ink); font: 800 12px/1.2 var(--f-mono); letter-spacing: .06em; box-shadow: 0 3px 0 var(--ink); pointer-events: none; animation: rushp 1s infinite alternate; z-index: 4; }
.rush3d[hidden] { display: none; }
@keyframes rushp { to { transform: translateX(-50%) scale(1.05); } }
.line3d.busy { background: var(--amber-soft); }
.line3d.full { background: var(--coral); color: #fff; }
.say3d span.emo { font-size: 26px; line-height: 1.15; padding: 0 7px; border-radius: 14px; }
.say3d span { display: block; padding: 2px 9px; border-radius: 10px; background: var(--surface); color: var(--ink); border: 2px solid var(--ink); font: 800 13px/1.3 var(--f-display); white-space: nowrap; animation: sayup 1.1s ease-out forwards; }
@keyframes sayup { 0% { opacity: 0; transform: translateY(6px) scale(.8); } 15% { opacity: 1; transform: translateY(0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
@media (prefers-reduced-motion: reduce) { .say3d span { animation: none; } }
.bub3d.ok { background: var(--teal); color: var(--on-teal); }
.bub3d.bad, .bub3d.kar { background: var(--coral); color: #fff; }
.bub3d.kar { animation: kar .5s infinite alternate; }
@keyframes kar { to { scale: 1.18; } }
.hud { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
.hud button { width: 34px; height: 34px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--surface); font: 700 15px/1 var(--f-mono); display: grid; place-items: center; padding: 0; }
.hud button:hover { background: var(--surface2); }
.hint3d { position: absolute; left: 12px; bottom: 12px; max-width: min(420px, calc(100% - 520px)); background: var(--surface); border: 1.5px solid var(--ink); border-radius: 12px; padding: 7px 11px; font: 500 12px/1.3 var(--f-mono); transition: opacity .6s; pointer-events: none; }
.hint3d.gone { opacity: 0; }
@media (max-width: 560px) { .tag3d span { display: none; } .tag3d { padding-left: 8px; } }
.tag3d[data-state="note"] i { background: var(--teal); color: var(--on-teal); }

/* ---------- in-world question panel ---------- */
.qpanel { position: absolute; right: 12px; top: 12px; bottom: 12px; width: min(470px, 46%); overflow: auto; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--ink); box-shadow: var(--shadow); display: flex; flex-direction: column; overscroll-behavior: contain; }
.qpanel.karen { border-color: var(--coral); box-shadow: 0 0 0 4px rgba(224,79,58,.35); animation: karenpulse 1s infinite alternate; }
@keyframes karenpulse { to { box-shadow: 0 0 0 8px rgba(224,79,58,.12); } }
.qbar { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface2); flex-wrap: wrap; position: sticky; top: 0; z-index: 3; }
.qbar button { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 11px; font: 600 12.5px/1.2 var(--f-body); text-align: left; }
.qbar button:hover { border-color: var(--teal); }
.qbar button.on { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.qbar .qset { flex: 1 1 200px; min-width: 0; }
.qbar .qset span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.qbar svg { width: 16px; height: 16px; flex: none; }
.qpanel .rx { margin: 0; border: 0; border-radius: 0; box-shadow: none; overflow: visible; flex: 1; }
.rx.karen .rx-head { background: var(--coral-soft); border-bottom-color: var(--coral); }
.rx.karen .rx-sym, .rx.karen .rx-meta b { color: var(--coral); }
.rx.karen .bubble { background: var(--coral-soft); }
.rx.karen .bubble em { color: var(--coral); font-weight: 700; }
.rx.karen .timer i { background: var(--coral); }
.rx.sweaty .rx-head { background: var(--amber-soft); border-bottom-color: var(--amber); }
.rx.sweaty .bubble { background: var(--amber-soft); }
.rx.sweaty .bubble em { color: var(--ink); font-weight: 700; }
.opts .jim { grid-column: 1; z-index: 2; align-self: stretch; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 6px 12px; align-items: center; padding: 10px 12px; background: var(--amber-soft); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--amber); animation: jimin .25s ease-out; }
.jim .avatar { width: 52px; height: 52px; }
.jim p { margin: 0; font-weight: 700; font-size: 14px; line-height: 1.3; }
.jim .jbar { height: 5px; border-radius: 5px; background: var(--line); margin-top: 6px; overflow: hidden; }
.jim .jbar i { display: block; height: 100%; background: var(--amber); transform-origin: left; width: 100%; }
.jim button { grid-column: 2; justify-self: start; }
@keyframes jimin { from { transform: translateX(24px); opacity: 0; } }
.mepv { display: grid; place-items: center; }
.mepv-svg { width: 132px; height: 132px; }
.mepv-img { width: 190px; height: auto; border-radius: 22px; background: var(--surface2); border: 1.5px solid var(--line); }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; }
.swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--amber); }
.aw { display: grid; gap: 6px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }
.awh { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.awh span { font: 600 11.5px/1.4 var(--f-mono); color: var(--muted); }
.awbar { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.awbar i { display: block; height: 100%; background: var(--teal); }
.awt { display: flex; flex-wrap: wrap; gap: 6px; }
.tier { font: 600 11.5px/1.3 var(--f-mono); padding: 4px 9px; border-radius: 999px; border: 1.5px dashed var(--line); color: var(--muted); }
.tier.on { border: 1.5px solid var(--amber); background: var(--amber-soft); color: var(--ink); }
.awps { display: grid; gap: 8px; }
.awp { display: flex; gap: 12px; align-items: center; padding: 9px 12px; border: 1.5px dashed var(--line); border-radius: 14px; opacity: .75; }
.awp > span { font-size: 28px; filter: grayscale(1); }
.awp small { display: block; color: var(--muted); font-size: 12px; }
.awp.on { border: 1.5px solid var(--teal); background: var(--teal-soft); opacity: 1; }
.awp.on > span { filter: none; }
.empty-q { padding: 22px 18px; display: grid; gap: 12px; }
.empty-q p { margin: 0; color: var(--muted); }
.pane { padding: 16px 18px 20px; display: grid; gap: 16px; }
.pane h3 { margin: 0; font: 800 20px/1.1 var(--f-display); }
.pane .sub { margin: -8px 0 0; font-size: 13px; color: var(--muted); }
.grp { display: grid; gap: 8px; }
.grp > b { font: 700 11px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.grp > b .link { font: 600 12px var(--f-body); text-transform: none; letter-spacing: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.note { margin: 0; font-size: 12.5px; color: var(--muted); }
.count { margin: 0; font: 600 13px var(--f-mono); color: var(--teal-ink); }
.deckrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); }
.deckrow b { font-weight: 700; overflow-wrap: anywhere; }
.deckrow span { font: 500 11.5px var(--f-mono); color: var(--muted); }
.deckrow .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.mini { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 5px 10px; font: 600 12px/1.2 var(--f-body); }
.mini:hover { border-color: var(--teal); }
.mini.on { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.mini.danger.arm { background: var(--coral); border-color: var(--coral); color: #fff; }
.field { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 9px 11px; font: 500 14px/1.4 var(--f-body); }
textarea.field { min-height: 170px; resize: vertical; font: 500 12.5px/1.5 var(--f-mono); }
.field:focus { outline: 3px solid var(--amber); outline-offset: 1px; border-color: var(--teal); }
.prev { border-radius: 12px; padding: 10px 12px; font-size: 13px; background: var(--surface2); display: grid; gap: 4px; }
.prev.err { background: var(--coral-soft); }
.prev.good { background: var(--teal-soft); }
.prev ul { margin: 0; padding-left: 18px; }
pre.help { margin: 0; padding: 10px 12px; background: var(--surface2); border-radius: 12px; font: 500 11.5px/1.5 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
details.how > summary { cursor: pointer; font: 600 13px var(--f-body); color: var(--teal-ink); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.stage.flat { height: auto; background: none; border: 0; box-shadow: none; overflow: visible; }
.stage.flat .qpanel { position: static; width: auto; max-height: none; overflow: visible; border-radius: 18px; }
.stage.flat .say3d, .stage.flat .line3d, .stage.flat .tags, .stage.flat .hud, .stage.flat .hint3d, .stage.flat .bub3d { display: none; }
@media (max-width: 900px) {
  .stage { height: clamp(620px, 98svh, 840px); }
  .qpanel { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 66%; }
  .hint3d { display: none; }
}

/* ---------- focus chips ---------- */
.focus { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font: 600 12.5px/1 var(--f-body); color: var(--muted); }
.chip:hover { border-color: var(--teal); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); color: var(--on-teal); }
.tip { margin: 10px 2px 0; font-size: 13px; color: var(--muted); }

/* ---------- Rx label card ---------- */
.rx { position: relative; margin-top: 14px; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 20px; padding: 0; box-shadow: 6px 6px 0 var(--teal); overflow: hidden; }
.rx-head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1.5px dashed var(--ink); background: var(--surface2); flex-wrap: wrap; }
.rx-sym { font: 800 34px/1 var(--f-display); color: var(--teal); }
.rx-meta { display: grid; gap: 3px; margin-right: auto; min-width: 0; }
.rx-meta b { font: 700 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.rx-meta span { font: 500 11px/1 var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.dots { display: inline-flex; gap: 4px; align-items: center; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--amber); }
.timer { flex: 1 1 120px; max-width: 200px; height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--amber); transform-origin: left; }
.rx-body { padding: 18px; display: grid; gap: 16px; }
.patient { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: start; }
.avatar { width: 64px; height: 64px; }
.bubble { position: relative; background: var(--teal-soft); border-radius: 6px 18px 18px 18px; padding: 12px 16px; }
.bubble em { display: block; font-style: normal; font: 500 12px/1.3 var(--f-mono); color: var(--teal-ink); margin-bottom: 6px; }
.bubble p { margin: 0; font: 700 18px/1.3 var(--f-display); letter-spacing: -0.005em; text-wrap: balance; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 14px; font-weight: 600; transition: transform .08s, border-color .15s, background .15s; }
.opt kbd { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--surface2); font: 700 12px/1 var(--f-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--teal); transform: translateX(3px); }
.opt:disabled { cursor: default; }
.opt.gone { opacity: .28; text-decoration: line-through; }
.opt.ok { border-color: var(--teal); background: var(--teal-soft); }
.opt.ok kbd { background: var(--teal); color: var(--on-teal); }
.opt.bad { border-color: var(--coral); background: var(--coral-soft); animation: shake .35s; }
.opt.bad kbd { background: var(--coral); color: #fff; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.btn { border: 1.5px solid var(--ink); background: var(--surface); border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: 14px; }
.btn:hover:not(:disabled) { background: var(--surface2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.go { background: var(--teal); border-color: var(--teal); color: var(--on-teal); box-shadow: 0 3px 0 var(--teal-ink); }
.btn.go:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--teal-ink); }
.keyhint { font: 500 11px/1 var(--f-mono); color: var(--muted); }

.result { border-top: 1.5px dashed var(--ink); padding: 16px 18px 18px; display: grid; gap: 10px; }
.result.good { background: var(--teal-soft); }

.pay span.big { background: var(--amber); border-color: var(--amber); color: #2B1D00; font-weight: 700; }
.pop { position: absolute; pointer-events: none; font: 800 22px/1 var(--f-display); color: var(--amber); text-shadow: 0 2px 0 rgba(0,0,0,.18); animation: floatUp 1s ease-out forwards; z-index: 5; }
@keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60px); } }

/* ---------- store ---------- */
.store-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; margin-bottom: 10px; }

.scene { width: 100%; height: auto; display: block; border-radius: 12px; }

.bar { height: 8px; border-radius: 8px; background: var(--surface2); margin-top: 6px; overflow: hidden; }

.buy:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: not-allowed; }

.fr p { margin: 0 0 10px; font-size: 13.5px; color: var(--muted); }
.fr .btn { width: 100%; }

.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; margin-bottom: 11px; font-size: 13px; }

.rev { display: grid; gap: 8px; }

.empty { margin: 0; color: var(--muted); font-size: 13.5px; }
.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 12px; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* first-person events: the side panel hides, a banner or portal sits over the scene */
.stage.fpmode .rush3d, .stage.fpmode .qpanel, .stage.fpmode .hint3d, .stage.fpmode .phonebtn, .stage.fpmode .hud { display: none; }
.fpq { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5; width: min(640px, calc(100% - 24px)); box-sizing: border-box; background: var(--surface); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 16px; font-size: 15px; line-height: 1.4; }

.portal .pwarn { flex: none; }
.portal .popts { flex: none; }

.portal .tiny { flex: none; }
.pptr { position: absolute; z-index: 6; width: 22px; height: 22px; pointer-events: none; transition: left .75s cubic-bezier(.45,.05,.25,1), top .75s cubic-bezier(.45,.05,.25,1); filter: drop-shadow(1px 2px 1px rgba(0,0,0,.35)); margin: -2px 0 0 -2px; }

@keyframes pptrpress { 50% { transform: scale(.78); } }

.portal .pbtn { display: block; width: 100%; box-sizing: border-box; text-align: left; margin: 4px 0; padding: 6px 10px; border: 1.5px solid #9AA8B8; border-radius: 6px; background: #fff; color: #17202A; font: 600 14px/1.25 inherit; cursor: pointer; }

.qbar .restock { margin-left: auto; }
.retire { border-top: 1.5px dashed var(--line); margin-top: 14px; padding-top: 12px; }
.retire h3 { margin: 0 0 4px; font: 800 16px/1.2 var(--f-display); }
.retire p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.datewrap { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; }

.deckrow small.lock { display: block; color: var(--coral); font-size: 12px; }

.retsum b { font-family: var(--f-display); }

.rweek { border: 1.5px solid var(--line); border-radius: 12px; margin: 8px 0; background: var(--surface); }

.rweek > summary em { font-style: normal; font: 700 11px/1 var(--f-mono); color: var(--on-teal); background: var(--teal); border-radius: 6px; padding: 2px 6px; margin-left: 6px; }
.rweek small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.rweek.lockedw { padding: 9px 12px; opacity: .65; }
.rdrug { border-top: 1px solid var(--line); }
.rdrug > summary { cursor: pointer; padding: 8px 12px; font-size: 14px; list-style: none; }
.rdrug > summary span { color: var(--teal-ink); margin-left: 6px; }

.rdrug .rbody { padding: 2px 12px 10px; font-size: 13px; line-height: 1.45; }
.rrow { margin: 5px 0; } .rrow b { display: block; font: 700 11px/1.2 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--teal-ink); }

.nbk { padding: 0; gap: 0; transform-origin: left center; perspective: 1200px; animation: nbopen .42s cubic-bezier(.2,.8,.25,1) both; background: #2F5D73; border-radius: 0 14px 14px 0; }

.nbcover { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px 10px 30px; color: #fff; position: sticky; top: 0; z-index: 3; background: #2F5D73; border-bottom: 3px solid #234757; }

.nbclose:hover { filter: brightness(1.06); } .nbclose:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.nbsheet { margin: 0 0 0 14px; padding: 16px 18px 20px 34px; display: grid; gap: 16px; position: relative; background: repeating-linear-gradient(#FFFDF4 0 27px, #D7E6EC 27px 28px); border-radius: 4px 0 12px 0; min-height: 100%; box-shadow: inset 8px 0 10px -8px rgba(0,0,0,.25); }

.nbsheet .field { background: #fff; }
.nbback { width: 100%; padding: 13px 14px; font-size: 15px; }

.expl { margin: 8px 0 4px; padding: 10px 12px; background: var(--surface2); border-radius: 12px; border-left: 4px solid var(--teal); display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 14px; line-height: 1.4; }

.expl dd { margin: 0; }
@media (max-width: 520px) { .expl { grid-template-columns: 1fr; gap: 0; } .expl dd { margin-bottom: 6px; } }

/* ---------- full-window 3D mode (body.fx is set when WebGL works) ---------- */
.drawerbtn, .scrim, .drawerhead, .qgrab { display: none; }
body.fx { --tb: calc(56px + env(safe-area-inset-top, 0px)); padding: 0; overflow: hidden; overscroll-behavior: none; background: var(--stage); }
body.fx .shell { display: block; max-width: none; margin: 0; }

body.fx .stat span { font-size: 9px; }

body.fx .drawerbtn { display: inline-flex; align-items: center; gap: 7px; pointer-events: auto; height: 44px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--ink); background: var(--amber); color: #2B1D00; font: 800 14px/1 var(--f-display); box-shadow: 0 3px 0 var(--ink); }
body.fx .drawerbtn span { font-size: 18px; }
body.fx .drawerbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
body.fx .hud { left: max(10px, env(safe-area-inset-left, 0px)); top: var(--tb); }
body.fx .hud button { width: 38px; height: 38px; }
body.fx .line3d { top: calc(var(--tb) + 5px); left: calc(max(10px, env(safe-area-inset-left, 0px)) + 176px); }

body.fx .qpanel { top: calc(var(--tb) + 8px); right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); }
body.fx .hint3d { bottom: max(12px, env(safe-area-inset-bottom, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); }
body.fx .stage canvas.grabbing { cursor: grabbing; }
/* the stats and upgrades slide up as a sheet inside the window */
body.fx .below { position: fixed; left: 0; right: 0; bottom: 0; top: 8vh; top: 8dvh; z-index: 31; background: var(--bg); border-radius: 22px 22px 0 0; border-top: 2px solid var(--ink); padding: 62px max(14px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); overflow: auto; transform: translateY(110%); visibility: hidden; transition: transform .3s ease, visibility 0s .3s; box-shadow: 0 -10px 34px rgba(0,0,0,.3); overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

body.fx.drawer .scrim { opacity: 1; pointer-events: auto; }
body.fx .below .btn, body.fx .qpanel button { touch-action: manipulation; }
body.fx .opt, body.fx .qbar button, body.fx .mini, body.fx .btn { min-height: 40px; }
@media (max-width: 900px) {
  body.fx .qpanel { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); top: auto; bottom: max(8px, env(safe-area-inset-bottom, 0px)); width: auto; max-height: 58vh; max-height: 58dvh; }
  body.fx .qgrab { display: flex; position: sticky; top: 0; z-index: 5; width: 100%; justify-content: center; align-items: center; border: 0; border-bottom: 1.5px solid var(--line); background: var(--surface2); padding: 7px 10px; font: 700 12px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); flex: none; }
  body.fx .qgrab span::before { content: '\25BE  '; }
  body.fx .qpanel.min .qgrab span::before { content: '\25B4  '; }
  body.fx .qpanel.min { overflow: hidden; }
  body.fx .qpanel.min #counter { display: none; }
  body.fx .hint3d { display: block; top: calc(var(--tb) + 50px); bottom: auto; left: 50%; right: auto; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); text-align: center; }
  body.fx .rush3d { top: calc(var(--tb) + 50px); }
  body.fx .phonebtn { left: auto; right: max(10px, env(safe-area-inset-right, 0px)); top: calc(var(--tb) + 4px); }
}
@media (max-width: 900px) {
  body.fx .qbar { gap: 5px; padding: 6px 8px; top: 29px; }
  body.fx .qbar button { min-height: 34px; padding: 5px 10px; font-size: 12.5px; }
}
@media (max-width: 640px) {
  body.fx .brand { display: none; }
  body.fx .top { gap: 6px; }
  body.fx .stats { flex: 1; min-width: 0; }

  body.fx .stat:nth-child(4) { display: none; }
  body.fx .stat span { font-size: 8.5px; letter-spacing: .06em; }

}

  body.fx { --tb: calc(56px + env(safe-area-inset-top, 0px)); }
  body.fx .stat:nth-child(4), body.fx .drawerbtn b { display: none; }
  body.fx .hint3d { max-width: calc(48% - 30px); }
  body.fx .brand { display: none; }
  body.fx .stat { padding: 3px 9px; } body.fx .stat b { font-size: 14px; margin-top: 2px; } body.fx .drawerbtn { height: 38px; }
  body.fx .qpanel { left: auto; top: calc(var(--tb) + 4px); bottom: max(6px, env(safe-area-inset-bottom, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: min(52%, 470px); max-height: none; }
  body.fx .qgrab { display: none; }
  body.fx .qbar { top: 0; }
  body.fx .qpanel.min #counter { display: block; }
  body.fx .hint3d { top: auto; bottom: 8px; left: max(10px, env(safe-area-inset-left, 0px)); transform: none; text-align: left; }
  body.fx .phonebtn { left: max(10px, env(safe-area-inset-left, 0px)); right: auto; top: calc(var(--tb) + 46px); }
  body.fx .rush3d { top: calc(var(--tb) + 2px); }
  body.fx .below { top: 4px; border-radius: 14px 14px 0 0; padding-top: 56px; } body.fx .drawerhead { top: 4px; }
}
body.fx .stage.fpmode .top .drawerbtn { display: none; }

body.fx .tag3d { display: none !important; }
body.fx[data-sheet="ups"] .sh-prog, body.fx[data-sheet="prog"] .sh-ups { display: none; }
body.fx .below { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }

<script>
/* Question bank: Q(category, difficulty 1-3, question, correct, [3 wrong], explanation) */
const BANK = [];
function Q(c, d, q, a, w, e) { BANK.push({ c, d, q, a, w, e }); }

/* ---------- Brand <-> Generic ---------- */
Q("BG",1,"Lipitor is the brand name of which drug?","atorvastatin",["simvastatin","rosuvastatin","pravastatin"],"Lipitor = atorvastatin, a high-intensity statin at 40-80 mg.");
Q("BG",1,"Zocor is the brand name of which drug?","simvastatin",["lovastatin","atorvastatin","pitavastatin"],"Zocor = simvastatin. Keep the dose at or below 20 mg with amlodipine, and avoid strong CYP3A4 inhibitors.");
Q("BG",1,"Crestor is the brand name of which drug?","rosuvastatin",["pravastatin","fluvastatin","atorvastatin"],"Crestor = rosuvastatin, a high-intensity statin that is less dependent on CYP3A4.");
Q("BG",1,"Norvasc is the brand name of which drug?","amlodipine",["nifedipine","diltiazem","felodipine"],"Norvasc = amlodipine, a dihydropyridine calcium channel blocker. Watch for peripheral edema.");
Q("BG",1,"Zestril and Prinivil are brand names of which drug?","lisinopril",["enalapril","ramipril","benazepril"],"Both brands are lisinopril, an ACE inhibitor.");
Q("BG",1,"Cozaar is the brand name of which drug?","losartan",["valsartan","irbesartan","olmesartan"],"Cozaar = losartan, an ARB. Hyzaar adds hydrochlorothiazide.");
Q("BG",2,"Toprol-XL is the brand name of which drug?","metoprolol succinate",["metoprolol tartrate","atenolol","carvedilol"],"Toprol-XL is extended-release metoprolol succinate (once daily, used in heart failure). Lopressor is metoprolol tartrate, taken twice daily.");
Q("BG",1,"Coreg is the brand name of which drug?","carvedilol",["labetalol","bisoprolol","nebivolol"],"Coreg = carvedilol, a non-selective beta-blocker with alpha-1 blockade. Take with food.");
Q("BG",1,"Lasix is the brand name of which drug?","furosemide",["bumetanide","torsemide","hydrochlorothiazide"],"Lasix = furosemide, a loop diuretic.");
Q("BG",1,"Zoloft is the brand name of which drug?","sertraline",["paroxetine","fluoxetine","citalopram"],"Zoloft = sertraline, an SSRI.");
Q("BG",1,"Lexapro is the brand name of which drug?","escitalopram",["citalopram","duloxetine","venlafaxine"],"Lexapro = escitalopram, the S-enantiomer of citalopram (Celexa).");
Q("BG",1,"Xanax is the brand name of which drug?","alprazolam",["lorazepam","clonazepam","diazepam"],"Xanax = alprazolam, a C-IV short-acting benzodiazepine.");
Q("BG",1,"Ambien is the brand name of which drug?","zolpidem",["eszopiclone","zaleplon","temazepam"],"Ambien = zolpidem, a C-IV sedative-hypnotic. Women are advised a lower starting dose.");
Q("BG",1,"Nexium is the brand name of which drug?","esomeprazole",["omeprazole","pantoprazole","lansoprazole"],"Nexium = esomeprazole. Prilosec is omeprazole, Protonix is pantoprazole, Prevacid is lansoprazole.");
Q("BG",1,"Synthroid is the brand name of which drug?","levothyroxine",["liothyronine","methimazole","propylthiouracil"],"Synthroid = levothyroxine (T4). Cytomel is liothyronine (T3).");
Q("BG",2,"Januvia is the brand name of which drug?","sitagliptin",["linagliptin","saxagliptin","alogliptin"],"Januvia = sitagliptin, a DPP-4 inhibitor. Tradjenta is linagliptin.");
Q("BG",2,"Jardiance is the brand name of which drug?","empagliflozin",["dapagliflozin","canagliflozin","ertugliflozin"],"Jardiance = empagliflozin, an SGLT2 inhibitor. Farxiga is dapagliflozin, Invokana is canagliflozin.");
Q("BG",2,"Eliquis is the brand name of which drug?","apixaban",["rivaroxaban","dabigatran","edoxaban"],"Eliquis = apixaban, a direct factor Xa inhibitor dosed twice daily.");
Q("BG",2,"Xarelto is the brand name of which drug?","rivaroxaban",["apixaban","dabigatran","warfarin"],"Xarelto = rivaroxaban, a factor Xa inhibitor. Higher doses should be taken with the evening meal.");
Q("BG",1,"Plavix is the brand name of which drug?","clopidogrel",["ticagrelor","prasugrel","cilostazol"],"Plavix = clopidogrel, a P2Y12 inhibitor. Brilinta is ticagrelor, Effient is prasugrel.");
Q("BG",2,"Singulair is the brand name of which drug?","montelukast",["zafirlukast","zileuton","theophylline"],"Singulair = montelukast, a leukotriene receptor antagonist. It has a boxed warning for neuropsychiatric events.");
Q("BG",1,"Neurontin is the brand name of which drug?","gabapentin",["pregabalin","topiramate","lamotrigine"],"Neurontin = gabapentin. Lyrica is pregabalin (C-V).");
Q("BG",2,"Seroquel is the brand name of which drug?","quetiapine",["olanzapine","risperidone","aripiprazole"],"Seroquel = quetiapine, an atypical antipsychotic. Zyprexa is olanzapine, Abilify is aripiprazole.");
Q("BG",2,"Keppra is the brand name of which drug?","levetiracetam",["lamotrigine","lacosamide","phenytoin"],"Keppra = levetiracetam. Watch for irritability and mood changes.");
Q("BG",2,"Flomax is the brand name of which drug?","tamsulosin",["finasteride","doxazosin","alfuzosin"],"Flomax = tamsulosin, an alpha-1A blocker for BPH. Proscar is finasteride.");
Q("BG",2,"Zofran is the brand name of which drug?","ondansetron",["promethazine","metoclopramide","granisetron"],"Zofran = ondansetron, a 5-HT3 antagonist. It can prolong the QT interval.");
Q("BG",1,"Zithromax is the brand name of which drug?","azithromycin",["clarithromycin","erythromycin","doxycycline"],"Zithromax = azithromycin, a macrolide. Biaxin is clarithromycin.");
Q("BG",1,"Bactrim is a combination of which two drugs?","sulfamethoxazole + trimethoprim",["amoxicillin + clavulanate","sulfasalazine + methotrexate","trimethoprim + nitrofurantoin"],"Bactrim = sulfamethoxazole + trimethoprim (SMX-TMP). Avoid in sulfa allergy and watch potassium and INR.");
Q("BG",1,"Augmentin is a combination of which two drugs?","amoxicillin + clavulanate",["ampicillin + sulbactam","piperacillin + tazobactam","amoxicillin + probenecid"],"Augmentin = amoxicillin + clavulanic acid, a beta-lactamase inhibitor. Take with food to reduce GI upset.");
Q("BG",2,"Wellbutrin contains which drug?","bupropion",["buspirone","venlafaxine","mirtazapine"],"Wellbutrin = bupropion, also sold as Zyban for smoking cessation. Buspirone (Buspar) is easy to mix up.");
Q("BG",2,"Ozempic and Wegovy contain which drug?","semaglutide",["liraglutide","dulaglutide","tirzepatide"],"Ozempic and Wegovy = semaglutide, a weekly GLP-1 agonist. Victoza is liraglutide, Trulicity is dulaglutide, Mounjaro is tirzepatide.");
Q("BG",3,"Entresto is a combination of which two drugs?","sacubitril + valsartan",["sacubitril + lisinopril","aliskiren + valsartan","azilsartan + chlorthalidone"],"Entresto = sacubitril (neprilysin inhibitor) + valsartan. Never combine with an ACE inhibitor because of angioedema risk; wait 36 hours after the last ACE inhibitor dose.");

/* ---------- Drug classes ---------- */
Q("CL",1,"Lisinopril belongs to which class?","ACE inhibitor",["Angiotensin receptor blocker","Calcium channel blocker","Beta-blocker"],"-pril = ACE inhibitor.");
Q("CL",1,"Valsartan belongs to which class?","Angiotensin II receptor blocker",["ACE inhibitor","Direct renin inhibitor","Aldosterone antagonist"],"-sartan = ARB. ARBs rarely cause the dry cough seen with ACE inhibitors.");
Q("CL",1,"Metoprolol is best described as a:","Selective beta-1 blocker",["Non-selective beta blocker","Alpha-1 blocker","Central alpha-2 agonist"],"Metoprolol is cardioselective (beta-1). Selectivity is lost at higher doses.");
Q("CL",1,"Hydrochlorothiazide is a:","Thiazide diuretic",["Loop diuretic","Potassium-sparing diuretic","Carbonic anhydrase inhibitor"],"HCTZ acts on the distal convoluted tubule.");
Q("CL",1,"Glipizide is a:","Sulfonylurea",["Biguanide","DPP-4 inhibitor","Thiazolidinedione"],"Glipizide, glyburide and glimepiride are sulfonylureas, which carry a hypoglycemia risk.");
Q("CL",2,"Sitagliptin (-gliptin) is a:","DPP-4 inhibitor",["SGLT2 inhibitor","GLP-1 receptor agonist","Alpha-glucosidase inhibitor"],"-gliptins block DPP-4, so incretins last longer.");
Q("CL",2,"Empagliflozin (-gliflozin) is a:","SGLT2 inhibitor",["DPP-4 inhibitor","Sulfonylurea","Meglitinide"],"-gliflozins block renal glucose reabsorption. They are also used in heart failure and CKD.");
Q("CL",2,"Liraglutide is a:","GLP-1 receptor agonist",["Amylin analog","DPP-4 inhibitor","Basal insulin analog"],"-tides such as liraglutide, semaglutide and dulaglutide are GLP-1 receptor agonists.");
Q("CL",1,"Omeprazole is a:","Proton pump inhibitor",["H2 receptor antagonist","Antacid","Prostaglandin analog"],"-prazole = PPI.");
Q("CL",1,"Famotidine is a:","H2 receptor antagonist",["Proton pump inhibitor","Antacid","Prokinetic agent"],"-tidine = H2 blocker.");
Q("CL",2,"Apixaban (-xaban) is a:","Direct factor Xa inhibitor",["Direct thrombin inhibitor","Vitamin K antagonist","Low molecular weight heparin"],"-xaban = factor Xa inhibitor.");
Q("CL",2,"Dabigatran is a:","Direct thrombin inhibitor",["Direct factor Xa inhibitor","Vitamin K antagonist","P2Y12 inhibitor"],"Dabigatran (-gatran) inhibits thrombin directly. Its reversal agent is idarucizumab.");
Q("CL",1,"Albuterol is a:","Short-acting beta-2 agonist",["Long-acting muscarinic antagonist","Inhaled corticosteroid","Leukotriene antagonist"],"Albuterol is a rescue inhaler (SABA).");
Q("CL",2,"Tiotropium is a:","Long-acting muscarinic antagonist (LAMA)",["Long-acting beta-2 agonist","Short-acting beta-2 agonist","Inhaled corticosteroid"],"Tiotropium (Spiriva) is a LAMA for COPD maintenance.");
Q("CL",2,"Venlafaxine is a:","Serotonin-norepinephrine reuptake inhibitor",["Selective serotonin reuptake inhibitor","Tricyclic antidepressant","Monoamine oxidase inhibitor"],"Venlafaxine and duloxetine are SNRIs. Venlafaxine can raise blood pressure at high doses.");
Q("CL",2,"Tamsulosin is a:","Alpha-1 blocker",["5-alpha reductase inhibitor","PDE5 inhibitor","Beta-blocker"],"Tamsulosin relaxes prostate and bladder neck smooth muscle.");
Q("CL",2,"Spironolactone is a:","Aldosterone antagonist (potassium-sparing diuretic)",["Loop diuretic","Thiazide diuretic","Carbonic anhydrase inhibitor"],"Spironolactone blocks the mineralocorticoid receptor. Monitor potassium.");
Q("CL",3,"Ezetimibe works as a:","Cholesterol absorption inhibitor",["Bile acid sequestrant","Fibrate","PCSK9 inhibitor"],"Ezetimibe blocks NPC1L1 in the intestine.");
Q("CL",3,"Linezolid is a(n):","Oxazolidinone",["Glycopeptide","Lipopeptide","Macrolide"],"Linezolid treats MRSA and VRE. It is a weak MAO inhibitor, so watch for serotonin syndrome.");
Q("CL",3,"Pioglitazone is a:","Thiazolidinedione (PPAR-gamma agonist)",["Sulfonylurea","Meglitinide","Biguanide"],"-glitazones cause fluid retention and are avoided in heart failure.");

/* ---------- Mechanisms ---------- */
Q("MOA",1,"Statins lower LDL by:","Inhibiting HMG-CoA reductase",["Blocking NPC1L1 absorption","Binding bile acids","Activating PPAR-alpha"],"HMG-CoA reductase is the rate-limiting step of cholesterol synthesis in the liver.");
Q("MOA",2,"Metformin works mainly by:","Decreasing hepatic glucose production and improving insulin sensitivity",["Closing K-ATP channels to release insulin","Blocking renal glucose reabsorption","Inhibiting the DPP-4 enzyme"],"Metformin (activates AMPK) lowers gluconeogenesis and does not cause hypoglycemia on its own.");
Q("MOA",2,"Clopidogrel works by:","Irreversibly blocking the platelet P2Y12 receptor",["Inhibiting COX-1","Blocking GP IIb/IIIa","Inhibiting PDE3"],"Clopidogrel is a prodrug activated by CYP2C19.");
Q("MOA",1,"Proton pump inhibitors work by:","Irreversibly inhibiting the H+/K+ ATPase",["Blocking H2 receptors","Neutralizing gastric acid","Coating ulcer craters"],"They shut down the final step of acid secretion in parietal cells.");
Q("MOA",2,"Warfarin works by:","Inhibiting vitamin K epoxide reductase, lowering factors II, VII, IX and X",["Directly inhibiting factor Xa","Enhancing antithrombin III","Directly inhibiting thrombin"],"Warfarin depletes the active vitamin K-dependent clotting factors. Effect takes days.");
Q("MOA",2,"Loop diuretics act on:","The Na-K-2Cl cotransporter in the thick ascending limb",["The Na-Cl cotransporter in the distal tubule","Aldosterone receptors in the collecting duct","Carbonic anhydrase in the proximal tubule"],"Loop diuretics are the most potent diuretics. They can cause hypokalemia and ototoxicity.");
Q("MOA",2,"Sulfonylureas lower glucose by:","Closing K-ATP channels on pancreatic beta cells to release insulin",["Activating PPAR-gamma","Slowing carbohydrate digestion","Increasing GLP-1 secretion"],"Insulin release does not depend on glucose, so hypoglycemia is the main risk.");
Q("MOA",2,"Fluoroquinolones kill bacteria by inhibiting:","DNA gyrase and topoisomerase IV",["The 30S ribosomal subunit","The 50S ribosomal subunit","Folate synthesis"],"Gyrase and topoisomerase IV are needed for DNA replication.");
Q("MOA",2,"Macrolides (azithromycin) bind to the:","50S ribosomal subunit",["30S ribosomal subunit","Penicillin-binding proteins","DNA gyrase"],"Mnemonic: macrolides, clindamycin and linezolid hit 50S. Aminoglycosides and tetracyclines hit 30S.");
Q("MOA",3,"Penicillins kill bacteria by:","Binding penicillin-binding proteins and blocking cell wall cross-linking",["Inhibiting DNA gyrase","Blocking the 30S ribosome","Inhibiting dihydrofolate reductase"],"Beta-lactams block transpeptidation, so the cell wall weakens and the bacteria lyse.");
Q("MOA",2,"Digoxin works by inhibiting:","The Na+/K+ ATPase",["The Na-K-2Cl cotransporter","Phosphodiesterase 3","The If channel"],"Higher intracellular calcium gives positive inotropy; vagal effects slow the AV node.");
Q("MOA",2,"Sildenafil works by inhibiting:","PDE5, which raises cGMP",["PDE3, which raises cAMP","Xanthine oxidase","Alpha-1 receptors"],"PDE5 inhibition gives vasodilation. Never combine with nitrates.");
Q("MOA",2,"Allopurinol lowers uric acid by inhibiting:","Xanthine oxidase",["URAT1","Uricase","Cyclooxygenase"],"Probenecid blocks URAT1 instead. Rasburicase is a recombinant uricase.");
Q("MOA",3,"Methotrexate inhibits:","Dihydrofolate reductase",["Thymidylate synthase","Topoisomerase II","Microtubule assembly"],"Leucovorin (folinic acid) rescues cells because it bypasses DHFR.");
Q("MOA",3,"Heparin works by:","Potentiating antithrombin III",["Inhibiting vitamin K epoxide reductase","Directly inhibiting factor Xa","Blocking P2Y12"],"Antithrombin III inactivates thrombin and factor Xa. Protamine reverses heparin.");
Q("MOA",2,"GLP-1 receptor agonists lower glucose by:","Increasing glucose-dependent insulin release, lowering glucagon and slowing gastric emptying",["Closing K-ATP channels regardless of glucose","Blocking SGLT2 in the kidney","Inhibiting alpha-glucosidase"],"Glucose-dependent action means low hypoglycemia risk unless paired with insulin or a sulfonylurea.");
Q("MOA",3,"Benzodiazepines enhance GABA-A by:","Increasing the frequency of chloride channel opening",["Increasing the duration of chloride channel opening","Blocking NMDA receptors","Activating 5-HT1A receptors"],"Barbiturates increase the duration of opening. Remember: BenzoFrequency, BarbiDuration.");

/* ---------- Adverse effects ---------- */
Q("AE",1,"Which adverse effect is characteristic of ACE inhibitors?","Dry cough",["Peripheral edema","Reflex tachycardia","Hypokalemia"],"Bradykinin builds up and causes a dry cough. ACE inhibitors also raise potassium (hyperkalemia) and rarely cause angioedema.");
Q("AE",1,"Statins most commonly raise concern for:","Myopathy and rhabdomyolysis",["Pulmonary fibrosis","Tendon rupture","Gingival hyperplasia"],"Report unexplained muscle pain or dark urine. Check CK if symptomatic.");
Q("AE",2,"Fluoroquinolones carry a boxed warning for:","Tendon rupture",["Ototoxicity","Red man syndrome","Gingival hyperplasia"],"Risk rises with age over 60, corticosteroids and transplant. Also tendinitis, neuropathy and CNS effects.");
Q("AE",2,"Aminoglycosides are most associated with:","Nephrotoxicity and ototoxicity",["Tendon rupture","Hepatic necrosis","Pulmonary fibrosis"],"Monitor levels and renal function. Avoid combining with other nephrotoxic drugs and loop diuretics.");
Q("AE",2,"Long-term amiodarone is associated with:","Pulmonary fibrosis, thyroid dysfunction and hepatotoxicity",["Gingival hyperplasia","Agranulocytosis","Peripheral edema only"],"Baseline and ongoing monitoring: chest X-ray, PFTs, TSH and liver tests.");
Q("AE",2,"Isoniazid commonly causes:","Peripheral neuropathy (give pyridoxine) and hepatotoxicity",["Optic neuritis","Orange body fluids","Hyperuricemia"],"Optic neuritis is ethambutol, orange fluids are rifampin, hyperuricemia is pyrazinamide.");
Q("AE",2,"Gingival hyperplasia is a classic effect of:","Phenytoin",["Valproate","Carbamazepine","Lamotrigine"],"Phenytoin also causes hirsutism and has non-linear (zero-order) kinetics at higher doses.");
Q("AE",2,"Digoxin toxicity may present with:","Nausea, yellow-green visual halos and arrhythmias",["Dry cough and angioedema","Hypoglycemia and tremor","Constipation and hirsutism"],"Toxicity is more likely with hypokalemia and renal impairment. Treat severe cases with digoxin immune Fab.");
Q("AE",2,"Long-term hydroxychloroquine requires monitoring for:","Retinopathy",["Ototoxicity","Peripheral edema","Tendon rupture"],"Baseline and periodic retinal screening are recommended.");
Q("AE",3,"Clozapine requires monitoring of the:","Absolute neutrophil count (agranulocytosis risk)",["Serum potassium","INR","Uric acid"],"Clozapine also causes sedation, hypersalivation, seizures and myocarditis.");
Q("AE",2,"Lithium toxicity or long-term use is associated with:","Tremor, hypothyroidism and nephrogenic diabetes insipidus",["Gingival hyperplasia and hirsutism","Dry cough and hyperkalemia","Photosensitivity and tendon rupture"],"Narrow therapeutic index. NSAIDs, ACE inhibitors and thiazides raise lithium levels.");
Q("AE",2,"Carbamazepine requires HLA-B*1502 screening in some patients because of the risk of:","Stevens-Johnson syndrome / TEN",["Agranulocytosis only","Pancreatitis","Hepatic steatosis"],"HLA-B*1502 is most common in patients of Asian ancestry. Hyponatremia is another common effect.");
Q("AE",2,"Spironolactone can cause:","Hyperkalemia and gynecomastia",["Hypokalemia and gout","Ototoxicity","Dry cough"],"Eplerenone is more selective and causes less gynecomastia.");
Q("AE",1,"Which electrolyte disturbance is typical of thiazide diuretics?","Hypokalemia",["Hyperkalemia","Hypocalcemia","Hypermagnesemia"],"Thiazides also cause hyponatremia, hypomagnesemia, hypercalcemia and hyperuricemia.");
Q("AE",2,"The most important safety risk of sulfonylureas is:","Hypoglycemia",["Lactic acidosis","Genital mycotic infections","Pancreatitis"],"Insulin secretion is not glucose dependent. Weight gain is also common.");
Q("AE",3,"Tamsulosin is linked to which eye-surgery complication?","Intraoperative floppy iris syndrome",["Angle-closure glaucoma","Optic neuritis","Retinal detachment"],"Tell patients to inform their ophthalmologist before cataract surgery.");
Q("AE",3,"Which risk is dose-related with bupropion?","Seizures",["Weight gain","Sedation","Sexual dysfunction"],"Bupropion lowers the seizure threshold. It is contraindicated in seizure and eating disorders.");
Q("AE",1,"Which is an anticholinergic effect?","Urinary retention",["Diarrhea","Bradycardia","Miosis"],"Think: dry mouth, blurred vision, constipation, urinary retention, confusion and tachycardia.");

/* ---------- Interactions and contraindications ---------- */
Q("DDI",2,"Which antibiotic most commonly raises the INR of a patient on warfarin?","Sulfamethoxazole-trimethoprim",["Rifampin","Nafcillin","Dicloxacillin"],"SMX-TMP inhibits CYP2C9. Rifampin, nafcillin and dicloxacillin lower the INR.");
Q("DDI",1,"Which combination is contraindicated?","Sildenafil + isosorbide mononitrate",["Sildenafil + metformin","Sildenafil + atorvastatin","Sildenafil + lisinopril"],"PDE5 inhibitors plus nitrates cause profound hypotension.");
Q("DDI",2,"Why should simvastatin be avoided with clarithromycin?","CYP3A4 inhibition raises simvastatin levels and the risk of rhabdomyolysis",["CYP3A4 induction lowers simvastatin","They chelate in the gut","Additive hypoglycemia"],"Clarithromycin is a strong CYP3A4 inhibitor. Azithromycin does not share this interaction.");
Q("DDI",2,"Grapefruit juice interacts with many drugs because it:","Inhibits intestinal CYP3A4",["Induces CYP2D6","Inhibits CYP2C9 in the liver only","Induces P-glycoprotein"],"It raises levels of drugs such as simvastatin, felodipine and some immunosuppressants.");
Q("DDI",2,"Which pair carries the highest hyperkalemia risk?","Lisinopril + spironolactone",["Lisinopril + furosemide","Amlodipine + hydrochlorothiazide","Metoprolol + furosemide"],"Both raise potassium. Loop and thiazide diuretics waste potassium instead.");
Q("DDI",2,"Which combination carries the highest risk of serotonin syndrome?","Phenelzine + sertraline",["Lisinopril + sertraline","Atorvastatin + fluoxetine","Metformin + escitalopram"],"Never combine MAOIs with SSRIs. Allow a washout of 14 days (5 weeks after fluoxetine).");
Q("DDI",2,"How should ciprofloxacin be scheduled with an aluminum or magnesium antacid?","Cipro at least 2 hours before or 6 hours after the antacid",["Take them together with food","Take the antacid 30 minutes before","No separation is needed"],"Polyvalent cations chelate quinolones and cut absorption.");
Q("DDI",2,"How should levothyroxine be separated from calcium or iron supplements?","By at least 4 hours",["By 30 minutes","Take together for better absorption","By 12 hours after dinner only"],"Calcium, iron, aluminum and bile acid binders all reduce levothyroxine absorption.");
Q("DDI",3,"Which acid suppressor is a CYP2C19 inhibitor that can blunt clopidogrel activation?","Omeprazole",["Pantoprazole","Famotidine","Sucralfate"],"Esomeprazole acts the same way. Pantoprazole is the preferred PPI with clopidogrel.");
Q("DDI",3,"Amiodarone is started in a patient on digoxin. What is expected?","Digoxin levels rise, so the digoxin dose is usually reduced",["Digoxin levels fall","No change","Digoxin renal clearance doubles"],"Amiodarone inhibits P-glycoprotein and reduces clearance.");
Q("DDI",2,"Which drug is a strong CYP3A4 inhibitor?","Ketoconazole",["Rifampin","Carbamazepine","Phenytoin"],"The other three are inducers. Inhibitors raise substrate levels; inducers lower them.");
Q("DDI",2,"Which herbal product can reduce the effectiveness of oral contraceptives?","St. John's wort",["Ginger","Melatonin","Fish oil"],"St. John's wort induces CYP3A4 and P-glycoprotein. It also risks serotonin syndrome with SSRIs.");
Q("DDI",3,"Methotrexate plus trimethoprim-sulfamethoxazole can cause:","Pancytopenia from additive antifolate effects",["Hypoglycemia","Serotonin syndrome","Torsades de pointes"],"Both drugs interfere with folate metabolism, and SMX-TMP may also reduce methotrexate clearance.");
Q("DDI",3,"What is the main concern when allopurinol is added to azathioprine?","Azathioprine toxicity (myelosuppression), so its dose must be reduced",["Reduced allopurinol efficacy","Serotonin syndrome","Prolonged QT interval"],"Xanthine oxidase breaks down 6-MP, the active metabolite of azathioprine.");
Q("DDI",1,"Which drug class is contraindicated in pregnancy?","ACE inhibitors",["Labetalol","Methyldopa","Nifedipine"],"ACE inhibitors and ARBs cause fetal renal injury. Labetalol, methyldopa and nifedipine are preferred.");
Q("DDI",2,"Metformin is contraindicated when eGFR falls below:","30 mL/min/1.73 m2",["60 mL/min/1.73 m2","45 mL/min/1.73 m2","15 mL/min/1.73 m2"],"Do not start metformin at eGFR 30-45. Contraindicated below 30 because of lactic acidosis risk.");
Q("DDI",2,"Which beta-blocker is best avoided in a patient with asthma?","Propranolol",["Metoprolol","Atenolol","Bisoprolol"],"Non-selective beta-blockers block beta-2 receptors and may trigger bronchospasm.");

/* ---------- Counseling ---------- */
Q("CN",1,"How should alendronate be taken?","With a full glass of plain water on an empty stomach, staying upright for 30 minutes",["With breakfast and milk","At bedtime, lying down","With coffee to improve absorption"],"This reduces the risk of esophageal irritation and improves absorption.");
Q("CN",1,"When should levothyroxine be taken?","On an empty stomach, 30-60 minutes before breakfast",["With a large breakfast","At bedtime with dairy","Only on days with symptoms"],"Take it consistently at the same time each day, with water.");
Q("CN",2,"A patient used one sublingual nitroglycerin tablet and the chest pain is not better after 5 minutes. What should they do?","Call 911 and then may take another dose",["Wait 30 minutes","Swallow three tablets together","Take a PPI"],"Dose can be repeated every 5 minutes up to 3 doses, but emergency services should be called after the first.");
Q("CN",1,"What should you advise after using an inhaled corticosteroid?","Rinse your mouth and spit",["Drink a glass of milk","Do not use water for 1 hour","Store the inhaler in the freezer"],"This prevents oral thrush and hoarseness.");
Q("CN",2,"Counseling on warfarin and diet should emphasize:","Keep vitamin K intake consistent",["Avoid all leafy greens","Eat leafy greens only on weekends","Diet has no effect on warfarin"],"Consistency matters more than avoidance, because it keeps the INR stable.");
Q("CN",2,"Which counseling point applies to metronidazole?","Avoid alcohol during treatment and for about 3 days after",["Avoid dairy products","Take with grapefruit juice","Avoid sunlight for 1 week"],"It may cause flushing, nausea and vomiting with alcohol.");
Q("CN",1,"Which counseling is most important for doxycycline?","Take with a full glass of water, stay upright, and use sun protection",["Take it only with dairy","Lie down after each dose","Stop when you feel better"],"Doxycycline can irritate the esophagus and causes photosensitivity. Separate from antacids, iron and calcium.");
Q("CN",2,"Where is an epinephrine autoinjector injected?","Outer mid-thigh, then call 911",["Upper arm vein","Buttock only","Abdomen after removing clothing"],"It can be injected through clothing. Emergency care is still needed even if symptoms improve.");
Q("CN",2,"A patient uses two different eye drops. How should they be spaced?","About 5 minutes apart",["Back to back","One hour apart","Mixed in a single bottle"],"Waiting prevents wash-out of the first drop. Gentle pressure on the inner corner of the eye also reduces systemic absorption.");
Q("CN",2,"What should you tell a patient about stopping sertraline?","Do not stop suddenly; taper with a clinician",["Stop as soon as you feel well","Double the dose first","Stop if you feel nausea"],"Abrupt stops can cause discontinuation symptoms such as dizziness, irritability and flu-like symptoms.");
Q("CN",2,"When should a PPI be taken?","30-60 minutes before the first meal of the day",["Right after dinner","At bedtime with a snack","Only when heartburn starts"],"PPIs work best on active pumps, which are stimulated by food.");
Q("CN",2,"How long can most in-use insulin vials and pens be kept before discarding?","About 28 days",["90 days","Until empty","6 months if refrigerated"],"Check the product label because some insulins differ. Unopened insulin is refrigerated until the expiration date.");
Q("CN",1,"How should a patient measure an antibiotic suspension?","Shake well and use an oral syringe or dosing cup",["Use a kitchen teaspoon","Dilute with hot water","Freeze it for storage"],"Household spoons vary widely. Always use the device supplied.");
Q("CN",2,"A patient misses one active combined birth control pill. What is the general advice?","Take it as soon as you remember, even if that means two pills in one day",["Skip it and continue the next day","Restart the pack","Double the next pill and stop the pack"],"If more than one pill is missed, backup contraception is advised.");

/* ---------- Antidotes ---------- */
Q("AD",1,"Antidote for acetaminophen overdose?","N-acetylcysteine",["Flumazenil","Fomepizole","Naloxone"],"NAC restores glutathione. Use the Rumack-Matthew nomogram to guide treatment.");
Q("AD",1,"Antidote for opioid overdose?","Naloxone",["Flumazenil","Physostigmine","Atropine"],"Naloxone is a short-acting opioid antagonist, so repeat dosing may be needed.");
Q("AD",1,"Antidote for benzodiazepine overdose?","Flumazenil",["Naloxone","Glucagon","Protamine"],"Flumazenil can precipitate seizures in chronic benzodiazepine users.");
Q("AD",1,"Reversal agent for warfarin?","Vitamin K (phytonadione)",["Protamine","Idarucizumab","Andexanet alfa"],"Add prothrombin complex concentrate (PCC) for life-threatening bleeding.");
Q("AD",1,"Reversal agent for heparin?","Protamine sulfate",["Vitamin K","Idarucizumab","Deferoxamine"],"Protamine neutralizes heparin.");
Q("AD",2,"Antidote for digoxin toxicity?","Digoxin immune Fab",["Flumazenil","Glucagon","Calcium gluconate"],"Reserved for life-threatening arrhythmias or very high levels.");
Q("AD",2,"Treatment for organophosphate poisoning?","Atropine plus pralidoxime",["Physostigmine","Naloxone","Hydroxocobalamin"],"Atropine treats muscarinic signs, pralidoxime reactivates cholinesterase.");
Q("AD",2,"Antidote for methanol or ethylene glycol poisoning?","Fomepizole",["N-acetylcysteine","Deferoxamine","Hydroxocobalamin"],"Fomepizole inhibits alcohol dehydrogenase.");
Q("AD",2,"Antidote for iron overdose?","Deferoxamine",["Dimercaprol","Fomepizole","Flumazenil"],"Deferoxamine is an iron chelator.");
Q("AD",2,"Antidote for cyanide poisoning?","Hydroxocobalamin",["Deferoxamine","Pralidoxime","Methylene blue"],"Hydroxocobalamin binds cyanide to form cyanocobalamin (vitamin B12).");
Q("AD",2,"Rescue agent for methotrexate toxicity?","Leucovorin",["N-acetylcysteine","Vitamin K","Folic acid alone"],"Leucovorin bypasses the DHFR block.");
Q("AD",2,"Reversal agent for dabigatran?","Idarucizumab",["Andexanet alfa","Protamine","Vitamin K"],"Idarucizumab (Praxbind) binds dabigatran directly.");
Q("AD",2,"Reversal agent for apixaban or rivaroxaban?","Andexanet alfa",["Idarucizumab","Protamine","Phytonadione alone"],"Andexanet alfa is a decoy factor Xa. Four-factor PCC is an alternative.");
Q("AD",2,"Antidote for beta-blocker overdose?","Glucagon",["Calcium gluconate","Flumazenil","Atropine only"],"Glucagon raises cAMP through a non-adrenergic route.");
Q("AD",2,"Treatment for tricyclic antidepressant overdose with QRS widening?","Sodium bicarbonate",["Flumazenil","Physostigmine","Naloxone"],"Bicarbonate reduces sodium channel blockade and alkalinizes the blood.");
Q("AD",2,"Isoniazid overdose with seizures is treated with:","Pyridoxine (vitamin B6)",["Vitamin K","Thiamine","Leucovorin"],"Isoniazid depletes GABA through B6 depletion.");
Q("AD",3,"Anticholinergic toxicity with severe agitation can be treated with:","Physostigmine",["Neostigmine","Pralidoxime","Atropine"],"Physostigmine crosses the blood-brain barrier. Use it carefully after checking the ECG.");

/* ---------- Sig codes and law ---------- */
Q("SIG",1,"What does BID mean?","Twice daily",["Before meals","Every other day","At bedtime"],"BID = bis in die. TID is three times daily, QID is four times daily.");
Q("SIG",1,"What does QHS mean?","Every night at bedtime",["Every hour","Four times daily","Every morning"],"QHS = quaque hora somni.");
Q("SIG",1,"What does PRN mean?","As needed",["Every day","By mouth","Before meals"],"PRN = pro re nata. PO = by mouth.");
Q("SIG",1,"What does AC mean on a sig?","Before meals",["After meals","With meals","At bedtime"],"AC = ante cibum. PC = post cibum (after meals).");
Q("SIG",2,"What does OS mean?","Left eye",["Right eye","Both eyes","Left ear"],"OD = right eye, OS = left eye, OU = both eyes. AD, AS and AU are for ears.");

function rint(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function fmtN(n) { return String(Math.round(n * 100) / 100); }
function mkCalc(d, q, correct, cands, unit, e) {
  const cs = fmtN(correct), out = [];
  cands.forEach(c => { const s = fmtN(c); if (c > 0 && s !== cs && out.indexOf(s) < 0) out.push(s); });
  const spare = [1.25, 0.75, 1.5, 0.5, 2, 0.6, 3, 1.1];
  for (let i = 0; out.length < 3 && i < spare.length; i++) {
    const s = fmtN(correct * spare[i]);
    if (s !== cs && out.indexOf(s) < 0) out.push(s);
  }
  const u = unit ? " " + unit : "";
  return { c: "CALC", d, q, a: cs + u, w: out.slice(0, 3).map(s => s + u), e, gen: true };
}

    const t = pick([[20, 5, 200], [10, 2, 500], [50, 10, 250], [25, 5, 300], [10, 2.5, 200]]);

    return mkCalc(2, `How many mL of a ${t[0]}% stock solution are needed to prepare ${t[2]} mL of a ${t[1]}% solution?`, v1,

able for severe infections","lo":"500 mg once daily","ty":"500 mg once daily","mx":"500 mg once daily"},{"id":144,"w":1,"g":"Nitrofurantoin","b":"Macrodantin, Macrobid","c":"Nitrofuran Antibiotic","m":"Synthetic nitrofuran that inactivates bacterial ribosomes and is bactericidal in urine at therapeutic doses. It is active against most bacteria that cause UTIs except nearly all strains of Pseudomonas are resistant.","i":["UTI, treatment and prophylaxis"],"cn":"May make urine brown; this is not harmful and is a breakdown product of the drug. Complete full course of therapy. For the suspension, shake well and store at room temperature, use within 30 d. Avoid mixing suspension with food or beverages, but food can be taken afterward. Symptoms should improve within 2-3 d; if they worsen, seek follow-up care.","p":"Nitrofurantoin does not reach effective levels in tissue and is only indicated for UTIs (not pyelonephritis). May resume normal activities after 24 h of antibiotics if afebrile. The drug is used primarily to prevent recurrent UTIs but is also effective in the treatment of uncomplicated UTIs.","lo":"50 mg four times daily","ty":"100 mg twice daily","mx":"100 mg four times daily"},{"id":66,"w":1,"g":"Amoxicillin/clavulanate","b":"Augmentin","c":"β-Lactam Antibiotic","m":"A semisynthetic penicillin derivative. Amoxicillin is not effective against β-lactamase–producing bacteria. Clavulanate, a β-lactamase inhibitor, has weak antibacterial activity but is a potent inhibitor of plasmid-mediated β-lactamases and protects amoxicillin from degradation by β-lactamases.","i":["Acute otitis media","Community-acquired pneumonia","Lower respiratory tract infection","Sinusitis","Urinary tract infection, acute cystitis","Urinary tract infection, pyelonephritis","Bite wound prophylaxis and treatment"],"cn":"Complete full course of therapy. Take dose with food to ensure proper absorption. For the suspension, shake well and store in the refrigerator. Note short expiration after reconstitution of 10 d. Avoid mixing suspension with food or beverages. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with health-care practitioner. May decrease effectiveness of oral contraceptives; encourage patients to use backup contraceptive method (eg, condom).","p":"Incidence of diarrhea is higher than with amoxicillin alone.","lo":"500 mg/125 mg every 12 hours","ty":"875 mg/125 mg every 12 hours","mx":"2000 mg/125 mg every 12 hours"},{"id":150,"w":1,"g":"Clindamycin oral","b":"Cleocin","c":"Lincosamide Antibiotic","m":"A semisynthetic 7-chloro-7-deoxylincomycin derivative that is active against most gram-positive organisms except enterococci and C. difficile. Gram-negative aerobes are resistant, but most anaerobes are sensitive. It inhibits bacterial protein synthesis by binding to the 50S ribosomal subunit; it is bactericidal or bacteriostatic depending on the concentration, organism, and inoculums.","i":["Skin and soft tissue infections","Abdominal infections","Lower respiratory tract infection","Osteomyelitis","Pelvic inflammatory disease","Bacterial vaginosis"],"cn":"Complete full course of therapy. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with HCP. Take with full glass of water. Remain upright for 30 min after dose to minimize risk of GI ulceration.","p":"May resume normal activities after 24 h of antibiotics and if afebrile. Prolonged use may result in fungal or bacterial superinfection, including C. difficile–associated diarrhea, which has been observed >2 mo postantibiotic treatment. Also available as injectable, topical, and vaginal formulations. Common antibiotic for anaerobic infections above the diaphragm.","lo":"150 mg every 6 hours","ty":"300 mg every 6-8 hours","mx":"450 mg every 6 hours"},{"id":152,"w":1,"g":"Acyclovir","b":"Zovirax","c":"Viral DNA Polymerase Inhibitor","m":"Competitively inhibits viral DNA synthesis by inactivation of viral DNA polymerase and incorporation into and termination of viral DNA replication","i":["Genital herpes simplex, treatment or suppression","Herpes zoster (shingles)","Varicella (chickenpox)","Cold sores"],"cn":"Complete full course of therapy. Ensure adequate hydration. For HSV, initiate treatment as soon as possible at first sign of lesion (treatment most effective if initiated within 24 h of lesion onset). For VZV, treatment should begin within 24 h of appearance of rash. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with HCP. If using for prophylaxis or suppression of infection, this medication should reduce the number of breakouts. Maintain adequate hydration during therapy.","p":"Not indicated for children <2 y of age. Treatment of genital herpes simplex may extend >10 d if lesions have not fully healed. Use caution with concurrent nephrotoxins. Topical and parenteral products also available. Multiple daily doses may be impractical compared to newer, less frequently administered analogues (eg, valacyclovir).","lo":"","ty":"","mx":""},{"id":86,"w":1,"g":"Cephalexin","b":"Keflex","c":"First-Generation Cephalosporin","m":"1st-generation cephalosporin that inhibits bacterial wall synthesis of actively dividing cells by binding to ≥1 penicillin-binding proteins (PBPs). Most gram-positive bacteria, including non–penicillinase- and penicillinase-producing staphylococci and streptococci. Activity against gram-negative bacteria is less s and is primarily restricted to E. coli, Klebsiella, and Proteus mirabilis.","i":["Skin and soft tissue infections","Otitis media","UTI","Pharyngitis","Osteomyelitis","Bacterial endocarditis"],"cn":"Seek medical attention if rash develops. Complete full course of therapy. For the suspension, shake well and store in the refrigerator. Note short expiration after reconstitution. Avoid mixing suspension with food or beverages, but food can be taken afterward. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with health-care practitioner.","p":"May resume normal activities after 24 h of antibiotics and if afebrile.","lo":"250 mg every 6 hours","ty":"500 mg every 6-12 hours","mx":"1000 mg every 6 hours"},{"id":230,"w":1,"g":"Penicillin","b":"Wycillin","c":"Antibiotic","m":"Penicillins are active against most gram-positive organisms and some gram-negative organisms, notably Neisseria spp., by interfering with late stages of bacterial cell wall synthesis; resistance is caused primarily by bacterial production of β-lactamases; some organisms have altered penicillin-binding protein targets (eg, Enterococci spp. and S. pneumoniae); others have impermeable outer cell wall layers.","i":["Pharyngitis","Otitis media","Bacterial endocarditis","Erysipelas","Pneumococcal infectious disease"],"cn":"Complete full course of therapy. Symptoms should improve within 2-3 d; if they worsen, seek medical care. Take on an empty stomach. Seek care for severe diarrhea, dark urine, yellowing of skin or eyes, unusual bruising or bleeding, blistering skin rash, or shortness of breath.","p":"Use caution in those with severe renal impairment and in those with seizure disorders. Typically may resume normal activities after 24 h of antibiotics if afebrile.","lo":"250 mg twice daily","ty":"250-500 q6h","mx":"500mg q6h"},{"id":77,"w":1,"g":"Doxycycline hyclate, doxycyline monohydrate","b":"Vibramycin","c":"Tetracycline Antibiotic","m":"A broad-spectrum bacteriostatic compound that inhibits protein synthesis at the 30S ribosomal subunit. Activity includes gram-positive, gram-negative, aerobic, and anaerobic bacteria, as well as spirochetes, mycoplasmas, rickettsiae, chlamydiae, and some protozoa. Many bacteria have developed plasmid-mediated resistance.","i":["Acne vulgaris","Gonorrhea","Skin and soft tissue infection","Community acquired pneumonia","Otitis media","Acinetobacter infection"],"cn":"May take with food that does not contain calcium. Complete full course of therapy. Symptoms should improve within 2-3 d. May cause photosensitivity; discontinue at first sign of skin erythema. Wear sunscreen and avoid prolonged exposure to sunlight and ultraviolet light. Administer with 240 mL of water.","p":"May resume normal activities after 24 h of antibiotics if afebrile. Not for use in children <8 y of age (causes bone and tooth discoloration).","lo":"100 mg once daily","ty":"100 mg twice daily","mx":"200 mg twice daily"},{"id":10,"w":2,"g":"Omeprazole","b":"Prilosec","c":"Proton Pump Inhibitor (PPI)","m":"Proton pump inhibitors (PPIs) block gastric acid secretion by irreversibly binding to and inhibiting the hydrogen-potassium ATPase pump that resides on the luminal surface of the parietal cell membrane.","i":["GERD","Peptic Ulcers","H. pylori GI tract infection"],"cn":"Take on an empty stomach 1 h before eating. Do not take simultaneously with antacids unless as IR formulation found in Zegerid. Can open capsule and add to applesauce. Not for immediate relief of heartburn.","p":"More effective than H2-antagonists for relief of heartburn and dyspepsia. Approved for OTC use for up to two weeks. Daily use recommended in patients with severe GERD (Barretts esophagus, strictures, grade C/D esophagitis). For non-severe GERD, taper to lowerest effect dose. May cause rebound hypersecretion with abrupt discontinuation. Finite treatment (~8 weeks) for peptic ulcers/mild esophageal erosions.","lo":"20 mg once daily","ty":"20-40 mg once daily","mx":"40 mg BID"},{"id":176,"w":2,"g":"Verapamil","b":"Calan","c":"Non-DHP Calcium Channel Blocker","m":"Inhibits calcium “slow channels” on vascular smooth muscle and myocardium producing relaxation of muscle and vasodilation. Increases myocardial oxygen delivery and slow conduction through the AV node.","i":["HTN","Angina","Atrial arrhythmia and paroxysmal supraventricular tachycardia prophylaxis"],"cn":"Do not crush or chew extended-release products. Contents of extended-release capsules may be sprinkled on food and swallowed without chewing, followed by water. Report symptomatic hypotension, bradyarrhythmia, peripheral edema, or syncope. Avoid sudden discontinuation of drug, as this may precipitate hypertensive rebound/crisis. Rise slowly from a sitting or lying position to avoid dizziness. Avoid alcohol and grapefruit juice.","p":"Not approved in children <18 y of age.","lo":"","ty":"","mx":""},{"id":72,"w":2,"g":"Paroxetine","b":"Paxil","c":"SSRI Antidepressant","m":"A highly selective and potent inhibitor of serotonin reuptake (SSRI).","i":["Depression","Anxiety","OCD","Panic disorder","PTSD","Premenstrual syndrome","Vasomotor symptoms of menopause"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). May cause nausea, sedation, headache, constipation, and dry mouth. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"May be more sedating and anticholinergic than other SSRI antidepressants, but morning or nightime dosing is acceptable. Withdrawal syndromes more common and slower titrations off medication needed. Not FDA approved for use in children.","lo":"10 mg once daily","ty":"20-40 mg once daily","mx":"60 mg once daily"},{"id":183,"w":2,"g":"Carbamazepine","b":"Tegretol","c":"Anticonvulsant","m":"Acts presynaptically to block firing of action potentials, which decreases the release of excitatory neurotransmitters, and postsynaptically by blocking high-frequency repetitive discharge initiated at cell bodies.","i":["Epilepsy","Trigeminal neuralgia","Neuropathic pain","Bipolar disease, acute manic and mixed episodes"],"cn":"May decrease effectiveness of oral contraceptives; use an alternative form of birth control. Avoid activities requiring mental alertness or coordination until drug effects are realized. Take with food, but not alcohol, grapefruit, or grapefruit juice. Avoid abrupt discontinuation.","p":"Suspension is dosed 3-4 times per day. Not effective for absence seizures. Testing for HLA-B*15:02 and HLA-A*31:01 should be performed in Asian patients. Potent inducer of CYP 450 enzymes - monitor and adjust for drug interactions","lo":"","ty":"","mx":""},{"id":90,"w":2,"g":"Amitriptyline","b":"Elavil","c":"Tricyclic Antidepressant","m":"Tricyclic antidepressant that blocks presynaptic reuptake of serotonin and norepinephrine with subsequent downregulation of adrenergic receptors.","i":["Depression","Migraine or tension-type headache prophylaxis (off-label)","Chronic pain (off-label)","Insomnia (off-label)","Sialorrhea (off-label)"],"cn":"Takes weeks for full effects for depression, anxiety, and pain condition; insomnia may improve after first dose. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). Nightime dosing is common due to sedation. May cause nausea, sedation, headache, constipation, and dry mouth. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"This drug can cause anticholinergic side effects and QTc prolongation. Safety and effectiveness in children <12 y of age have not been established.","lo":"10 mg once nightly","ty":"25-100 mg once nightly","mx":"150 mg per day"},{"id":196,"w":2,"g":"Metronidazole","b":"Flagyl","c":"Nitroimidazole Antibiotic, Antiprotozoal","m":"A synthetic nitroimidazole active against T. vaginalis (trichomoniasis), E. histolytica (amebiasis), and G. lamblia (giardiasis); it is bactericidal against nearly all obligate anaerobic bacteria including B. fragilis.","i":["Bacterial vaginosis","Abscess, anaerobic","Trichomoniasis","Ambe
