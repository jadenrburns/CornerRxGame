P("Adrenergics",2,"A man taking tamsulosin is scheduled for cataract surgery. What should his surgeon know?","It can cause intraoperative floppy iris syndrome",["It can cause permanent lens opacity","It prevents pupil dilation permanently","It raises intraocular pressure"],"α1A blockade relaxes the iris dilator muscle, so the iris billows during surgery (IFIS). The surgeon needs to know about prior or current use.");
P("Adrenergics",1,"Which β blocker is β1-selective?","Metoprolol",["Propranolol","Timolol","Nadolol"],"Metoprolol, atenolol, bisoprolol and nebivolol are β1-selective. Propranolol, timolol and nadolol are nonselective (β1 and β2).");
P("Adrenergics",2,"Which β blocker also blocks α1 receptors, adding vasodilation?","Carvedilol",["Atenolol","Metoprolol","Timolol"],"Carvedilol (and labetalol) block α1 as well as β. Carvedilol is a guideline drug in heart failure with reduced ejection fraction and is taken with food.");
P("Adrenergics",2,"Which β1-selective blocker also causes nitric oxide-mediated vasodilation?","Nebivolol",["Atenolol","Propranolol","Metoprolol"],"Nebivolol is β1-selective with endothelial NO release. It has fewer metabolic and sexual side effects than older β blockers.");
P("Adrenergics",2,"Which β blocker is lipophilic, nonselective, and commonly used for essential tremor, migraine prophylaxis and performance anxiety?","Propranolol",["Atenolol","Metoprolol","Nebivolol"],"Propranolol crosses the blood-brain barrier and blocks peripheral β receptors, blunting tremor, palpitations and sweating. It also treats thyrotoxicosis symptoms and infantile hemangioma.");
P("Adrenergics",1,"Which β blocker is used as eye drops to lower intraocular pressure in open-angle glaucoma?","Timolol",["Carvedilol","Atenolol","Metoprolol"],"Timolol drops reduce aqueous humor production. Systemic absorption can still cause bradycardia and bronchospasm, so press on the tear duct after instilling.");
P("Adrenergics",3,"Which group of β blockers has proven mortality benefit in heart failure with reduced ejection fraction?","Carvedilol, metoprolol succinate and bisoprolol",["Atenolol, propranolol and timolol","Metoprolol tartrate, atenolol and nadolol","Propranolol, labetalol and sotalol"],"Only carvedilol, extended-release metoprolol succinate and bisoprolol have outcome data in HFrEF. Atenolol, propranolol and metoprolol tartrate do not.");
P("Adrenergics",2,"Which β blocker is most likely to worsen asthma?","Propranolol",["Metoprolol","Atenolol","Nebivolol"],"Nonselective β blockers block bronchial β2 receptors and can cause bronchospasm. β1-selective agents are safer but selectivity is lost at high doses.");
P("Adrenergics",2,"A patient with diabetes on insulin takes propranolol. Which hypoglycemia sign may be hidden?","Tachycardia and tremor",["Sweating","Confusion","Hunger"],"β blockers mask adrenergic warning signs like fast heart rate and shakiness. Sweating is cholinergic-mediated and is often preserved, so it becomes the key sign.");
P("Adrenergics",2,"What can happen if a patient suddenly stops a β blocker after long-term use?","Rebound tachycardia, angina or myocardial infarction",["Severe bradycardia","Hypoglycemia","Hyperkalemia"],"Chronic β blockade up-regulates β receptors. Abrupt withdrawal unmasks them, so taper over one to two weeks.");
P("Adrenergics",3,"Which β blocker is eliminated mainly by the kidneys and needs dose reduction in chronic kidney disease?","Atenolol",["Metoprolol","Propranolol","Carvedilol"],"Atenolol is hydrophilic and renally cleared. Metoprolol is CYP2D6-metabolized, propranolol and carvedilol are hepatically cleared.");
P("Adrenergics",3,"A patient on metoprolol starts paroxetine. What is the main concern?","Higher metoprolol levels and bradycardia from CYP2D6 inhibition",["Lower metoprolol levels and loss of effect","Serotonin syndrome from the combination","Hyperkalemia"],"Paroxetine (and fluoxetine, bupropion) strongly inhibit CYP2D6, which metabolizes metoprolol. Monitor heart rate and blood pressure.");
P("Adrenergics",2,"Methylphenidate raises synaptic dopamine and norepinephrine mainly by:","Blocking the dopamine and norepinephrine transporters",["Reversing transporters and causing release","Inhibiting MAO","Blocking D2 receptors"],"Methylphenidate is a reuptake blocker. Amphetamines also reverse the transporters and push transmitter out of the terminal (and inhibit VMAT2 and MAO).");
P("Adrenergics",2,"Which stimulant is a prodrug that must be converted by red blood cells to dextroamphetamine?","Lisdexamfetamine",["Methylphenidate","Dexmethylphenidate","Amphetamine mixed salts"],"Lisdexamfetamine requires enzymatic cleavage, which lowers abuse potential and smooths the effect. It is also approved for binge-eating disorder.");
P("Adrenergics",2,"How does dexmethylphenidate relate to methylphenidate?","It is the active d-enantiomer, so the dose is about half",["It is a prodrug of methylphenidate","It is an amphetamine derivative","It is a nonstimulant α2 agonist"],"Dexmethylphenidate is the pharmacologically active d-threo isomer of methylphenidate. Doses are typically half.");
P("Adrenergics",1,"What is the first-line, life-saving drug for anaphylaxis?","Epinephrine IM",["Diphenhydramine","Albuterol","Methylprednisolone"],"Epinephrine reverses vasodilation (α1), bronchospasm (β2) and cardiac depression (β1). Antihistamines and steroids are adjuncts only and never replace it.");
P("Adrenergics",2,"Which vasopressor is first-line for septic shock?","Norepinephrine",["Dopamine","Phenylephrine","Isoproterenol"],"Norepinephrine raises blood pressure through α1 vasoconstriction with some β1 support. Dopamine has more arrhythmias.");
P("Adrenergics",2,"Which pure α1 agonist is used for hypotension and as a nasal decongestant, and can cause reflex bradycardia?","Phenylephrine",["Epinephrine","Dobutamine","Isoproterenol"],"Phenylephrine constricts vessels without β effects, so the baroreflex slows the heart. Oral phenylephrine has poor bioavailability as a decongestant.");
P("Adrenergics",3,"A patient taking phenelzine asks for a decongestant. Which is the most dangerous choice?","Pseudoephedrine",["Saline nasal spray","Fluticasone nasal spray","Loratadine"],"Pseudoephedrine is an indirect sympathomimetic that releases norepinephrine. With an MAOI it can cause a hypertensive crisis, as with tyramine-rich foods.");
P("Adrenergics",2,"Which nonselective α blocker is used for pheochromocytoma and to treat extravasation of norepinephrine?","Phentolamine",["Prazosin","Propranolol","Clonidine"],"Phentolamine blocks α1 and α2 reversibly. Infiltrating it into the tissue reverses vasoconstriction from vasopressor extravasation.");
P("Adrenergics",2,"Which drug blocks both α1 and β receptors and is preferred for hypertension in pregnancy and hypertensive emergencies?","Labetalol",["Atenolol","Propranolol","Metoprolol"],"Labetalol is safe in pregnancy and available IV and PO. Atenolol is avoided in pregnancy because of fetal growth restriction.");
P("Adrenergics",2,"Which drug is an oral α1 agonist prodrug used for orthostatic hypotension, with supine hypertension as a key risk?","Midodrine",["Prazosin","Clonidine","Albuterol"],"Midodrine's active metabolite desglymidodrine constricts vessels. Do not take it within 4 hours of bedtime and keep the head elevated when lying down.");
P("Adrenergics",3,"Which β3 agonist is used for overactive bladder and can raise blood pressure?","Mirabegron",["Tamsulosin","Albuterol","Oxybutynin"],"Mirabegron activates β3 receptors in the detrusor muscle, causing relaxation. Unlike antimuscarinics it does not cause dry mouth or constipation.");

/* ---------- Anxiolytics ---------- */
P("Anxiolytics",1,"Which drug classes are first-line for long-term treatment of generalized anxiety disorder?","SSRIs and SNRIs",["Benzodiazepines","β blockers","Barbiturates"],"SSRIs and SNRIs work over 2 to 6 weeks without dependence. Benzodiazepines relieve symptoms quickly but are for short-term bridging.");
P("Anxiolytics",1,"Which anxiolytic is a serotonin 5-HT1A partial agonist with no sedation and no dependence?","Buspirone",["Hydroxyzine","Lorazepam","Gabapentin"],"Buspirone treats generalized anxiety disorder only. It takes 2 to 4 weeks to work, so it is not for PRN use or panic attacks.");
P("Anxiolytics",2,"A patient with panic attacks wants relief within the hour. Why is buspirone a poor choice?","Its effect takes weeks to develop",["It is a controlled substance","It causes severe sedation","It is only available as an injection"],"Buspirone has no immediate anxiolytic effect. It does not substitute for benzodiazepines and does not treat their withdrawal.");
P("Anxiolytics",2,"Which anxiolytic is a first-generation H1 antihistamine used as needed and is not a controlled substance?","Hydroxyzine",["Buspirone","Alprazolam","Pregabalin"],"Hydroxyzine causes sedation and anticholinergic effects and can prolong the QT interval. Older adults should avoid it (Beers list).");
P("Anxiolytics",3,"Hydroxyzine HCl and hydroxyzine pamoate differ in that:","Only the HCl salt comes as injectable and syrup; both treat anxiety and itching orally",["Pamoate is the injectable form","HCl is an antipsychotic","They have different mechanisms"],"Both salts are the same drug. HCl comes as tablets, syrup and IM injection; pamoate as capsules and suspension.");
P("Anxiolytics",1,"Benzodiazepines work by:","Increasing the frequency of GABA-A chloride channel opening",["Increasing the duration of channel opening","Blocking NMDA receptors","Inhibiting serotonin reuptake"],"Benzodiazepines are positive allosteric modulators and need GABA present. Barbiturates prolong channel opening and can open it without GABA, which is why they are more dangerous in overdose.");
P("Anxiolytics",2,"Which benzodiazepine is short-acting with fast onset, used for panic disorder, and is the most associated with interdose withdrawal and misuse?","Alprazolam",["Clonazepam","Diazepam","Lorazepam"],"Alprazolam's short half-life gives rebound anxiety between doses. Clonazepam is a long-acting alternative for panic disorder.");
P("Anxiolytics",2,"Which benzodiazepine has a long duration and is also used for panic disorder and seizure disorders?","Clonazepam",["Alprazolam","Lorazepam","Temazepam"],"Clonazepam lasts 18 to 50 hours, so it gives smoother coverage. It is used for panic disorder and as add-on therapy for some seizures.");
P("Anxiolytics",3,"Which benzodiazepine is preferred in older adults or those with liver disease because it is glucuronidated with no active metabolites?","Lorazepam",["Diazepam","Clonazepam","Flurazepam"],"Lorazepam, oxazepam and temazepam (LOT) skip CYP oxidation. Diazepam has long-acting active metabolites (desmethyldiazepam) that accumulate.");
P("Anxiolytics",2,"Which benzodiazepine has the fastest onset and active metabolites, and is used for alcohol withdrawal and muscle spasm?","Diazepam",["Lorazepam","Alprazolam","Temazepam"],"Diazepam enters the brain quickly and its metabolites give a self-tapering effect in alcohol withdrawal. It is also IV or rectal for seizures.");
P("Anxiolytics",2,"What is the boxed warning about combining benzodiazepines with opioids?","Profound sedation, respiratory depression, coma and death",["Serotonin syndrome","QT prolongation","Hepatotoxicity"],"Benzodiazepines and opioids both depress respiration. Boxed warnings also cover abuse, misuse, dependence and withdrawal reactions.");
P("Anxiolytics",2,"Which drug is a benzodiazepine receptor antagonist used to reverse benzodiazepine sedation?","Flumazenil",["Naloxone","Physostigmine","Buspirone"],"Flumazenil is a competitive antagonist. It can precipitate seizures in chronic benzodiazepine users or with tricyclic overdose.");
P("Anxiolytics",2,"Which SSRI has the longest half-life and the lowest risk of discontinuation syndrome?","Fluoxetine",["Paroxetine","Sertraline","Escitalopram"],"Fluoxetine and its active metabolite norfluoxetine last for days, giving a self-taper. Paroxetine has a short half-life and the worst discontinuation symptoms.");
P("Anxiolytics",2,"Which SSRI is the most anticholinergic, most likely to cause weight gain, and is the strongest CYP2D6 inhibitor with the worst discontinuation syndrome?","Paroxetine",["Sertraline","Escitalopram","Fluoxetine"],"Paroxetine has muscarinic activity and a short half-life. It is also avoided in pregnancy because of possible cardiac malformations.");
P("Anxiolytics",2,"Which SSRI carries a maximum dose limit (40 mg, or 20 mg in older adults) because of dose-dependent QT prolongation?","Citalopram",["Sertraline","Fluoxetine","Paroxetine"],"Citalopram prolongs QT in a dose-dependent way. Escitalopram has a similar but milder effect.");
P("Anxiolytics",2,"Which two drugs are SNRIs?","Duloxetine and desvenlafaxine",["Sertraline and paroxetine","Citalopram and escitalopram","Buspirone and hydroxyzine"],"SNRIs also treat pain: duloxetine is approved for diabetic neuropathy, fibromyalgia and chronic musculoskeletal pain. Venlafaxine is the parent of desvenlafaxine.");
P("Anxiolytics",2,"Which SNRI is approved for generalized anxiety disorder and also for diabetic neuropathic pain and fibromyalgia?","Duloxetine",["Desvenlafaxine","Escitalopram","Fluoxetine"],"Duloxetine is the SNRI with the broadest pain and GAD labeling. Desvenlafaxine is approved for depression only. Avoid duloxetine in heavy alcohol use or liver disease.");
P("Anxiolytics",2,"Which SSRI is approved for generalized anxiety disorder and has one of the cleanest CYP interaction profiles?","Escitalopram",["Fluoxetine","Fluvoxamine","Sertraline"],"Escitalopram is the active S-enantiomer of citalopram, approved for GAD and depression, with little CYP inhibition. Fluoxetine and fluvoxamine are strong CYP inhibitors, and sertraline is not FDA-approved for GAD.");
P("Anxiolytics",3,"Which SSRI is approved for PTSD, panic disorder, social anxiety disorder, OCD and PMDD?","Sertraline",["Escitalopram","Citalopram","Duloxetine"],"Sertraline has the widest anxiety-spectrum labeling and fewer interactions. Diarrhea is a common early side effect.");
P("Anxiolytics",2,"Why do SSRIs sometimes worsen anxiety in the first weeks?","Initial activation or jitteriness; benefits take weeks",["They block GABA receptors","They cause dopamine depletion","They inhibit the GABA transporter"],"Start low and go slow. A short benzodiazepine bridge may be used. Counsel patients to continue despite early jitteriness.");
P("Anxiolytics",2,"What boxed warning applies to SSRIs and SNRIs?","Increased suicidal thinking in children, adolescents and young adults",["Hepatic failure","Serotonin syndrome","Agranulocytosis"],"Monitor closely when starting or changing doses, especially in patients under 25.");
P("Anxiolytics",2,"Gabapentin and pregabalin work by binding the:","α2δ subunit of voltage-gated calcium channels",["GABA-A receptor","NMDA receptor","Serotonin transporter"],"Despite the name, gabapentinoids do not act on GABA receptors. They reduce presynaptic calcium entry and glutamate release.");
P("Anxiolytics",3,"Which statement about gabapentin and pregabalin is correct?","Both are renally eliminated and need dose adjustment in kidney disease",["Both are metabolized by CYP3A4","Both are strong enzyme inducers","Both are highly protein-bound"],"Neither is metabolized, so dose by creatinine clearance. Pregabalin is a federal Schedule V controlled substance.");
P("Anxiolytics",2,"A violinist needs help with tremor and palpitations only during concerts. Which drug is a reasonable PRN choice?","Propranolol",["Alprazolam","Buspirone","Fluoxetine"],"Propranolol blocks peripheral β receptors, blunting the physical symptoms of performance anxiety without sedation or cognitive impairment.");

/* ---------- Sedatives and hypnotics ---------- */
P("Sedatives and hypnotics",1,"What is the first-line treatment for chronic insomnia?","Cognitive behavioral therapy for insomnia (CBT-I)",["Zolpidem","Diphenhydramine","Temazepam"],"Guidelines recommend CBT-I before medications. Drugs are short-term adjuncts.");
P("Sedatives and hypnotics",2,"Which three drugs are the \"Z-drugs\"?","Zolpidem, zaleplon and eszopiclone",["Temazepam, triazolam and estazolam","Ramelteon, suvorexant and doxepin","Alprazolam, clonazepam and lorazepam"],"Z-drugs are nonbenzodiazepines that act on the α1-containing GABA-A receptor. They are CIV drugs with a boxed warning for complex sleep behaviors.");
P("Sedatives and hypnotics",2,"What boxed warning do zolpidem, zaleplon and eszopiclone carry?","Complex sleep behaviors such as sleepwalking and sleep driving",["Hepatotoxicity","Serotonin syndrome","Respiratory failure only in overdose"],"Patients have driven, cooked or made calls while asleep with no memory. Stop the drug if it happens.");
P("Sedatives and hypnotics",2,"Which Z-drug has the shortest half-life (about 1 hour), and can be taken in the middle of the night if at least 4 hours remain for sleep?","Zaleplon",["Eszopiclone","Zolpidem extended-release","Temazepam"],"Zaleplon treats sleep onset only. Eszopiclone has a longer duration that helps sleep maintenance.");
P("Sedatives and hypnotics",2,"Which hypnotic has a metallic or bitter taste as a common adverse effect?","Eszopiclone",["Zolpidem","Zaleplon","Ramelteon"],"Eszopiclone's longer half-life (about 6 hours) covers both onset and maintenance, with a morning-after impairment risk.");
P("Sedatives and hypnotics",3,"What dosing advice applies to zolpidem in women?","Use a lower starting dose because of slower clearance",["Use a higher dose because of faster clearance","Take it with a high-fat meal","Take it in the morning"],"FDA lowered the zolpidem starting dose for women (5 mg IR, 6.25 mg ER) after next-morning impairment data. Take it immediately before bed with 7 to 8 hours available for sleep. Food delays onset.");
P("Sedatives and hypnotics",2,"Which hypnotic is a melatonin MT1/MT2 receptor agonist with no abuse potential and is not scheduled?","Ramelteon",["Suvorexant","Zolpidem","Doxepin"],"Ramelteon treats sleep onset insomnia. It is contraindicated with fluvoxamine (CYP1A2).");
P("Sedatives and hypnotics",2,"Which hypnotic blocks orexin receptors to promote sleep and is a Schedule IV drug?","Suvorexant",["Ramelteon","Doxepin","Eszopiclone"],"Suvorexant, lemborexant and daridorexant are dual orexin receptor antagonists. Possible effects include next-day somnolence and sleep paralysis. Avoid strong CYP3A4 inhibitors.");
P("Sedatives and hypnotics",2,"Low-dose doxepin (3 to 6 mg) helps sleep by blocking which receptor?","Histamine H1",["Melatonin MT1","Orexin","GABA-A"],"Very low doses are selective for H1, helping sleep maintenance. Antidepressant doses (75 mg and above) block many receptors and cause anticholinergic effects.");
P("Sedatives and hypnotics",2,"Which OTC sleep aid is a first-generation antihistamine that older adults should avoid?","Diphenhydramine",["Melatonin","Ramelteon","Zaleplon"],"Diphenhydramine is strongly anticholinergic (confusion, urinary retention, falls) and tolerance develops within days. Doxylamine is similar.");
P("Sedatives and hypnotics",1,"Which supplement helps shift circadian rhythm and is useful for jet lag and delayed sleep phase?","Melatonin",["Valerian","Diphenhydramine","Kava"],"Melatonin is a chronobiotic rather than a strong sedative. Low doses (0.5 to 3 mg) taken at the right time of day work best.");
P("Sedatives and hypnotics",2,"Which benzodiazepine is FDA-approved as a hypnotic and has no active metabolites?","Temazepam",["Alprazolam","Clonazepam","Diazepam"],"Temazepam (one of LOT) is glucuronidated and has an intermediate half-life. Alprazolam is labeled for anxiety, clonazepam for seizures and panic, and diazepam for several uses.");
P("Sedatives and hypnotics",3,"Why are benzodiazepines poor choices for insomnia in older adults?","Falls, fractures, confusion and cognitive impairment",["They cause serotonin syndrome","They cause hypertension","They stimulate respiration"],"Beers criteria advise against benzodiazepines and Z-drugs in older adults. Next-day impairment raises fall risk.");
P("Sedatives and hypnotics",2,"Flumazenil reverses the sedation of:","Benzodiazepines",["Opioids","Alcohol","Barbiturates"],"Flumazenil competitively blocks the benzodiazepine site. It does not reverse alcohol, barbiturate or opioid effects. Naloxone is the opioid antagonist.");
P("Sedatives and hypnotics",3,"A patient receives flumazenil after a benzodiazepine overdose and becomes sedated again hours later. Why?","Flumazenil is short-acting, so the benzodiazepine outlasts it",["Flumazenil induces benzodiazepine receptors","Flumazenil is metabolized to a benzodiazepine","Flumazenil causes an allergic reaction"],"Flumazenil lasts about an hour. Observe and redose as needed. Avoid it in chronic users or with tricyclic overdose because of seizure risk.");
P("Sedatives and hypnotics",2,"Which is an off-label but commonly used sedating antidepressant for insomnia?","Trazodone",["Fluoxetine","Bupropion","Venlafaxine"],"Low-dose trazodone blocks H1, 5-HT2A and α1 receptors. It is non-habit-forming but can cause orthostasis and rarely priapism.");
P("Sedatives and hypnotics",2,"Which hypnotic type is best for someone who falls asleep easily but wakes at 3 AM?","One that helps sleep maintenance, such as low-dose doxepin or suvorexant",["Zaleplon at bedtime","Ramelteon","Melatonin"],"Sleep-onset drugs (zaleplon, ramelteon) have short action. Maintenance needs a longer-acting agent such as doxepin, suvorexant or eszopiclone.");
P("Sedatives and hypnotics",2,"Which drug used for insomnia has the highest potential for physical dependence?","Temazepam",["Ramelteon","Suvorexant","Low-dose doxepin"],"Benzodiazepines cause tolerance and withdrawal with regular use. Ramelteon, doxepin and DORAs have little or no dependence liability.");
P("Sedatives and hypnotics",3,"Why can Z-drugs and benzodiazepines both produce next-day impairment and falls?","Residual GABA-A activity during morning hours",["Residual dopamine blockade","Rebound serotonin release","Orexin up-regulation"],"Both enhance GABA-A signaling. Impaired driving can persist after the dose, especially with extended-release products or alcohol.");

/* PharmTox Exam 3: general and local anesthetics */

/* ---------- General anesthesia ---------- */
P("General anesthesia",1,"What does MAC (minimum alveolar concentration) measure?","The alveolar concentration of an inhaled anesthetic that prevents movement to surgical incision in 50% of patients",["The concentration that causes unconsciousness in 100% of patients","The maximum safe dose of the anesthetic","The speed of induction"],"MAC is the standard measure of potency for inhaled anesthetics. A lower MAC means a more potent drug.");
P("General anesthesia",2,"An inhaled anesthetic has a very low MAC. What does that tell you?","It is highly potent",["It is weak and has low potency","It has a slow onset","It is highly water-soluble"],"MAC is inversely related to potency. Nitrous oxide has a MAC over 100%, so it is the weakest, while halothane and isoflurane are about 1%.");
P("General anesthesia",2,"Which property best predicts how fast an inhaled anesthetic produces induction and recovery?","Low blood:gas partition coefficient",["High lipid solubility","High molecular weight","High MAC"],"A less blood-soluble drug saturates blood quickly, so the brain partial pressure rises (and falls) fast. Desflurane and nitrous oxide have the lowest blood:gas coefficients.");
P("General anesthesia",2,"Which inhaled anesthetic has the lowest blood solubility among the volatile agents, giving the fastest recovery, but is pungent and irritates the airway?","Desflurane",["Sevoflurane","Isoflurane","Halothane"],"Desflurane's pungency causes coughing and breath-holding, so it is not used for inhalational induction. It needs a heated vaporizer and can cause tachycardia.");
P("General anesthesia",2,"Which volatile anesthetic is nonpungent and well suited to inhalational induction, especially in children?","Sevoflurane",["Desflurane","Isoflurane","Enflurane"],"Sevoflurane smells pleasant, is a bronchodilator and has low solubility. At low gas flows it can form compound A, which is nephrotoxic in animals.");
P("General anesthesia",2,"Which older volatile anesthetic is associated with immune-mediated hepatitis and arrhythmias from sensitization of the heart to catecholamines?","Halothane",["Sevoflurane","Desflurane","Nitrous oxide"],"Halothane \"hepatitis\" is rare but severe (trifluoroacetylated proteins). It is no longer used in the US but remains an exam classic.");
P("General anesthesia",2,"Which inhaled anesthetic is associated with seizure-like EEG activity and renal toxicity from fluoride, and is no longer used?","Enflurane",["Isoflurane","Sevoflurane","Desflurane"],"Enflurane lowers the seizure threshold and releases fluoride. It was replaced by isoflurane, sevoflurane and desflurane.");
P("General anesthesia",2,"Which gas has a MAC above 100% so it cannot produce surgical anesthesia alone, but provides analgesia and rapid recovery?","Nitrous oxide",["Sevoflurane","Isoflurane","Desflurane"],"Nitrous oxide is used as an adjunct. It has very low blood solubility (fast onset and recovery) and minimal cardiovascular effects.");
P("General anesthesia",3,"What problem can occur when nitrous oxide is discontinued at the end of surgery?","Diffusion hypoxia",["Malignant hyperthermia","Adrenal suppression","Propofol infusion syndrome"],"Nitrous oxide rushes out of the blood into the alveoli and dilutes oxygen. Give 100% oxygen for several minutes after stopping it.");
P("General anesthesia",3,"Why should nitrous oxide be avoided in a patient with a pneumothorax or bowel obstruction?","It diffuses into closed air spaces and expands them",["It causes bronchospasm","It causes severe hypotension","It is metabolized to a toxin"],"Nitrous oxide is far more soluble than nitrogen, so it enters air-filled spaces faster than nitrogen leaves. It also inactivates vitamin B12-dependent methionine synthase.");
P("General anesthesia",1,"Which drug is the treatment for malignant hyperthermia?","Dantrolene",["Naloxone","Flumazenil","Sugammadex"],"Dantrolene blocks the ryanodine receptor (RyR1) to stop calcium release from the sarcoplasmic reticulum. Stop the trigger and give oxygen and cooling.");
P("General anesthesia",2,"Which agents trigger malignant hyperthermia?","Volatile anesthetics and succinylcholine",["Propofol and etomidate","Nitrous oxide and ketamine","Midazolam and fentanyl"],"Genetic RYR1 variants cause uncontrolled muscle calcium release with high fever, rigidity and hypercarbia. Halogenated gases and succinylcholine are triggers. Nitrous oxide is not.");
P("General anesthesia",1,"Which IV induction agent is a milky white lipid emulsion, causes pain on injection, and has antiemetic properties?","Propofol",["Etomidate","Ketamine","Methohexital"],"Propofol acts at GABA-A with very rapid onset. Recovery is fast because of redistribution. It supports bacterial growth, so discard within 6 hours.");
P("General anesthesia",3,"A critically ill patient on a high-dose, multi-day propofol infusion develops metabolic acidosis, rhabdomyolysis and cardiac failure. What is this?","Propofol infusion syndrome",["Malignant hyperthermia","Neuroleptic malignant syndrome","Serotonin syndrome"],"PRIS occurs with prolonged high-dose infusions, particularly in children and with concurrent catecholamines or steroids. Triglycerides also rise from the lipid vehicle.");
P("General anesthesia",2,"Which IV anesthetic maintains hemodynamic stability, making it a favorite in hypotensive or cardiac patients, but suppresses the adrenal cortex?","Etomidate",["Propofol","Thiopental","Methohexital"],"Etomidate inhibits 11β-hydroxylase, lowering cortisol even after a single dose. Myoclonus and postoperative nausea are also common.");
P("General anesthesia",1,"Which IV anesthetic is an NMDA receptor antagonist that produces dissociative anesthesia with strong analgesia?","Ketamine",["Propofol","Etomidate","Thiopental"],"Ketamine keeps airway reflexes and spontaneous breathing. It raises blood pressure and heart rate and is a bronchodilator, so it is useful in shock and asthma.");
P("General anesthesia",2,"Which adverse effect is characteristic of ketamine?","Hallucinations and emergence delirium",["Adrenal suppression","Respiratory arrest at induction","Hepatitis"],"Vivid dreams and agitation on recovery can be reduced with a benzodiazepine such as midazolam. Ketamine is Schedule III. Esketamine is its nasal spray form for treatment-resistant depression.");
P("General anesthesia",2,"Which IV general anesthetic increases blood pressure, heart rate and intracranial pressure (a relative caution in head injury and hypertension)?","Ketamine",["Propofol","Thiopental","Midazolam"],"Ketamine increases sympathetic outflow. Propofol and barbiturates decrease blood pressure and cerebral blood flow.");
P("General anesthesia",2,"Which two IV anesthetics are barbiturates?","Thiopental and methohexital",["Propofol and etomidate","Ketamine and fospropofol","Midazolam and lorazepam"],"Barbiturates enhance GABA-A chloride channel duration of opening. Thiopental is no longer marketed in the US. Methohexital is still used for brief procedures and ECT.");
P("General anesthesia",3,"Which barbiturate anesthetic is chosen for electroconvulsive therapy because it has a short duration and does not suppress seizures?","Methohexital",["Thiopental","Phenobarbital","Etomidate"],"Methohexital provides short unconsciousness for ECT with a minimal anticonvulsant effect. It can lower seizure threshold, so it is avoided in epilepsy.");
P("General anesthesia",3,"Why are barbiturates such as thiopental contraindicated in acute intermittent porphyria?","They induce ALA synthase and can precipitate an attack",["They inhibit heme excretion","They are metabolized to porphyrin","They block cytochrome P450 permanently"],"Barbiturates induce CYP enzymes and ALA synthase, increasing heme precursors. Avoid them (and many other inducers) in porphyria.");
P("General anesthesia",3,"Which general anesthetic is a water-soluble prodrug of propofol, with perineal paresthesias and a slower onset?","Fospropofol",["Propofol","Etomidate","Methohexital"],"Fospropofol is converted by alkaline phosphatase to propofol (plus formaldehyde and phosphate). It was used for procedural sedation and is no longer marketed.");
P("General anesthesia",2,"Which benzodiazepine is the usual preoperative sedative that also causes anterograde amnesia?","Midazolam",["Lorazepam at bedtime","Flumazenil","Diazepam suppository"],"Midazolam is water-soluble, short-acting and rapid onset. Lorazepam and diazepam are used less often as adjuncts.");
P("General anesthesia",2,"In balanced anesthesia, which agents are typically used to induce anesthesia and which to maintain it?","IV agents (propofol, etomidate) to induce; inhaled agents to maintain",["Inhaled agents to induce; IV agents to maintain","Only inhaled agents for both","Only local anesthetics for both"],"Balanced anesthesia combines a hypnotic, an opioid analgesic and a muscle relaxant. IV drugs give fast induction; volatile agents are easy to titrate.");
P("General anesthesia",2,"Which anesthetic is the best choice for inducing anesthesia in a patient with severe asthma and low blood pressure?","Ketamine",["Thiopental","Propofol","Etomidate"],"Ketamine bronchodilates and supports blood pressure. Barbiturates can trigger bronchospasm and cause hypotension. Etomidate is also acceptable for hypotension.");
P("General anesthesia",3,"Which inhaled anesthetic is least metabolized (<0.1%) and so least likely to cause organ toxicity?","Desflurane",["Halothane","Sevoflurane","Enflurane"],"Metabolism of halothane is about 20%, sevoflurane about 3%, enflurane about 2% and desflurane under 0.1%. Higher metabolism means more potentially toxic metabolites.");

/* ---------- Local anesthesia ---------- */
P("Local anesthesia",1,"Local anesthetics work by blocking:","Voltage-gated sodium channels",["Voltage-gated potassium channels","NMDA receptors","Opioid receptors"],"The anesthetic enters the nerve, binds the open or inactivated channel from inside (use-dependent block), and prevents action potentials.");
P("Local anesthesia",1,"What name clue helps you tell amide from ester local anesthetics?","Amides have two \"i\" letters in the name (e.g., lidocaine); esters have one",["Esters end in -caine; amides do not","Amides always contain a benzene ring","Esters are always topical"],"Amides: lidocaine, bupivacaine, mepivacaine, prilocaine, articaine. Esters: procaine, chloroprocaine, tetracaine, cocaine, benzocaine.");
P("Local anesthesia",2,"Which group are ester-type local anesthetics?","Procaine, chloroprocaine and tetracaine",["Lidocaine, mepivacaine and prilocaine","Bupivacaine, articaine and lidocaine","Prilocaine, mepivacaine and bupivacaine"],"Esters are hydrolyzed by plasma pseudocholinesterase to PABA, which can trigger allergic reactions. Amides are metabolized by the liver.");
P("Local anesthesia",2,"A patient is allergic to procaine. Which local anesthetic is the safest alternative?","Lidocaine",["Tetracaine","Chloroprocaine","Benzocaine"],"Ester anesthetics share the PABA metabolite, so cross-reactivity occurs among esters. Amides rarely cross-react.");
P("Local anesthesia",2,"Which type of local anesthetic requires caution in severe liver disease?","Amides",["Esters","Both equally","Neither is affected"],"Amides are metabolized by hepatic enzymes (CYP1A2, CYP3A4), so accumulation can cause toxicity. Esters are cleared in plasma, so abnormal pseudocholinesterase prolongs their action.");
P("Local anesthesia",2,"Why is local anesthesia less effective in infected (acidic) tissue?","More drug is ionized and cannot cross the nerve membrane",["The drug is destroyed by bacteria","Blood flow is decreased","The drug binds more albumin"],"Local anesthetics are weak bases. In acidic tissue they are mostly charged and cannot cross the lipid membrane, so onset slows. Sodium bicarbonate can speed onset.");
P("Local anesthesia",2,"In what order are sensations lost as a local anesthetic takes effect?","Pain, then temperature, touch and pressure, and last motor function",["Motor first, then touch and pain","Touch first, then pain, then motor","All fibers at the same time"],"Small myelinated and unmyelinated fibers are blocked first. A patient may feel pressure but not pain. Recovery happens in reverse order, so motor function returns first.");
P("Local anesthesia",2,"Which local anesthetic characteristic mainly determines its onset speed?","A lower pKa, giving more uncharged drug at physiologic pH",["Higher protein binding","Greater molecular weight","Higher water solubility"],"Only the uncharged base crosses the membrane. Lidocaine (pKa about 7.9) is faster than bupivacaine (8.1). Lipid solubility drives potency; protein binding drives duration.");
P("Local anesthesia",1,"Which local anesthetic is also a class IB antiarrhythmic used for ventricular arrhythmias?","Lidocaine",["Bupivacaine","Procaine","Tetracaine"],"IV lidocaine blocks sodium channels in ischemic or depolarized myocardium. It has an intermediate duration as a local anesthetic.");
P("Local anesthesia",1,"Which local anesthetic is the only one with intrinsic vasoconstrictor activity because it blocks norepinephrine and dopamine reuptake?","Cocaine",["Lidocaine","Procaine","Bupivacaine"],"Cocaine is an ester used topically in ENT surgery (Schedule II). Other local anesthetics are vasodilators, which is why epinephrine is added.");
P("Local anesthesia",2,"Why is epinephrine added to a local anesthetic solution?","It constricts vessels, prolonging duration and reducing systemic absorption and bleeding",["It speeds metabolism","It raises the pH","It blocks sodium channels"],"The effect lasts longer and the total dose can be higher. Avoid epinephrine in end-artery areas (digits, penis, nose, ears) and use cautiously in uncontrolled hypertension or arrhythmias.");
P("Local anesthesia",3,"What is the usual maximum dose of plain lidocaine for infiltration?","About 4.5 mg/kg (7 mg/kg with epinephrine)",["About 1 mg/kg","About 15 mg/kg","No maximum dose exists"],"Epinephrine slows absorption and allows a higher limit. Always count all sources, including topical and nerve blocks.");
P("Local anesthesia",2,"Which long-acting amide local anesthetic is the most cardiotoxic, causing refractory arrhythmias after accidental IV injection?","Bupivacaine",["Lidocaine","Mepivacaine","Prilocaine"],"Bupivacaine binds sodium channels tightly and dissociates slowly. The 0.75% concentration is contraindicated in obstetric epidurals. Ropivacaine is safer.");
P("Local anesthesia",1,"What is the antidote for severe local anesthetic systemic toxicity (LAST)?","IV lipid emulsion",["Flumazenil","Naloxone","Dantrolene"],"Lipid emulsion is thought to act as a sink for lipophilic drug. Give seizure control (benzodiazepines) and supportive care. Early signs are perioral numbness, metallic taste and tinnitus.");
P("Local anesthesia",2,"Which ester local anesthetic has a very short duration and low systemic toxicity because plasma cholinesterase destroys it quickly?","Chloroprocaine",["Tetracaine","Bupivacaine","Mepivacaine"],"Chloroprocaine's fast metabolism makes it useful for short procedures and obstetrics. Its duration is short, which can limit use for longer surgery.");
P("Local anesthesia",2,"Which ester local anesthetic is long-acting and used topically (eye, spinal) and as spinal anesthesia?","Tetracaine",["Procaine","Chloroprocaine","Lidocaine"],"Tetracaine is the most potent and longest-acting ester. Procaine and chloroprocaine are short-acting.");
P("Local anesthesia",2,"Which local anesthetic is the prototype short-acting ester, with poor tissue penetration, and is also the carrier in penicillin G procaine?","Procaine",["Tetracaine","Bupivacaine","Articaine"],"Procaine is rarely used for anesthesia today. It forms PABA, so ester allergy applies.");
P("Local anesthesia",3,"Which local anesthetic can cause methemoglobinemia through its metabolite o-toluidine, and is a component of EMLA cream?","Prilocaine",["Lidocaine","Bupivacaine","Procaine"],"EMLA is lidocaine plus prilocaine. Methemoglobinemia is a risk in infants, G6PD deficiency and large doses. Benzocaine also causes it.");
P("Local anesthesia",2,"Which local anesthetic is commonly used in dentistry, is an amide with an ester side chain, and has a short half-life because plasma esterases break it down?","Articaine",["Mepivacaine","Tetracaine","Procaine"],"Articaine contains a thiophene ring and an ester linkage. It diffuses well through bone and is generally paired with epinephrine in dentistry (4%).");
P("Local anesthesia",3,"Which amide is intermediate in duration and causes less vasodilation than lidocaine, making it useful in dental procedures without epinephrine?","Mepivacaine",["Bupivacaine","Procaine","Chloroprocaine"],"Mepivacaine is a good plain option when epinephrine is undesirable. Its duration is 2 to 3 hours with infiltration.");
P("Local anesthesia",2,"Rank by duration: which choice lists the correct order from shortest to longest?","Chloroprocaine, then lidocaine, then bupivacaine",["Bupivacaine, then lidocaine, then chloroprocaine","Lidocaine, then bupivacaine, then chloroprocaine","Tetracaine, then lidocaine, then procaine"],"Chloroprocaine and procaine are short; lidocaine, mepivacaine and prilocaine are intermediate; bupivacaine and tetracaine are long.");
P("Local anesthesia",2,"Early symptoms of local anesthetic systemic toxicity include:","Perioral numbness, metallic taste and ringing in the ears",["Fever and rigidity","Bradycardia and hypothermia","Wheezing and hives"],"As blood levels rise: CNS excitation, seizures and then CNS depression, followed by cardiovascular collapse. Treat early to stop progression.");
/* PharmTox Exam 3: epilepsy, dopamine, psychosis and mania */

/* ---------- Epilepsy ---------- */
P("Epilepsy",2,"Which drug is first-line for absence seizures when no generalized tonic-clonic seizures are present?","Ethosuximide",["Carbamazepine","Phenytoin","Gabapentin"],"Ethosuximide blocks T-type calcium channels in thalamic neurons. Carbamazepine, phenytoin and gabapentin can worsen absence and myoclonic seizures.");
P("Epilepsy",2,"Which antiseizure drug has a broad spectrum but causes neural tube defects, hepatotoxicity, pancreatitis and hyperammonemia?","Valproate",["Levetiracetam","Lamotrigine","Gabapentin"],"Valproate treats focal, absence, myoclonic and tonic-clonic seizures and bipolar mania and migraine. Avoid it in women who may become pregnant. Divalproex is the delayed-release form of valproate.");
P("Epilepsy",2,"Which antiseizure drug is associated with HLA-B*1502-linked Stevens-Johnson syndrome in patients of Asian ancestry and has autoinduction of CYP3A4?","Carbamazepine",["Levetiracetam","Gabapentin","Topiramate"],"Screen for HLA-B*1502 before starting carbamazepine in at-risk groups. Hyponatremia (SIADH), aplastic anemia and many drug interactions are also notable.");
P("Epilepsy",3,"How does oxcarbazepine differ from carbamazepine?","It induces CYP enzymes less and has no autoinduction, but still causes hyponatremia",["It works by a different mechanism","It is safe in HLA-B*1502 carriers","It prevents absence seizures"],"Oxcarbazepine is a keto-analogue activated to a monohydroxy derivative. It is still a sodium channel blocker and can cause hyponatremia, but with fewer interactions and no epoxide metabolite.");
P("Epilepsy",2,"Which antiseizure drug shows zero-order (nonlinear) kinetics at therapeutic doses, so small dose increases can cause toxic levels?","Phenytoin",["Levetiracetam","Gabapentin","Lamotrigine"],"Phenytoin's metabolic enzymes saturate within the therapeutic range. Gingival hyperplasia, hirsutism, ataxia and nystagmus are other classic effects. Fosphenytoin is the IV prodrug with fewer infusion reactions.");
P("Epilepsy",3,"A patient with low albumin has a total phenytoin level in the therapeutic range but shows toxicity. Why?","Free (active) phenytoin is higher because less is protein-bound",["Phenytoin is metabolized faster","The drug is concentrated in bone","Total level overestimates clearance"],"Phenytoin is highly albumin-bound. In low albumin or renal failure, free fraction rises, so check a free level or use a correction formula.");
P("Epilepsy",2,"Which antiseizure drug requires slow titration because of the risk of serious rash (Stevens-Johnson syndrome)?","Lamotrigine",["Levetiracetam","Gabapentin","Topiramate"],"Rash risk rises with rapid titration and with valproate co-therapy. Lamotrigine also treats bipolar maintenance, especially preventing depressive episodes.");
P("Epilepsy",3,"A patient on lamotrigine starts valproate. What must be done with the lamotrigine dose?","Reduce it by about half, because valproate roughly doubles lamotrigine levels",["Double it","No change is needed","Switch to once weekly"],"Valproate inhibits glucuronidation of lamotrigine. Estrogen-containing contraceptives do the opposite and lower levels; enzyme inducers like carbamazepine also lower them.");
P("Epilepsy",2,"Which antiseizure drug acts by binding SV2A and has minimal drug interactions but may cause irritability and mood changes?","Levetiracetam",["Phenytoin","Carbamazepine","Valproate"],"Levetiracetam is renally cleared, broad-spectrum and available IV. \"Keppra rage\" is irritability or aggression. Dose-adjust for kidney function.");
P("Epilepsy",2,"Which antiseizure drug causes kidney stones, paresthesias, cognitive slowing, weight loss and metabolic acidosis, and is also used for migraine prophylaxis?","Topiramate",["Levetiracetam","Lamotrigine","Phenytoin"],"Topiramate inhibits carbonic anhydrase. It can cause acute angle-closure glaucoma and cleft palate in pregnancy.");
P("Epilepsy",2,"Gabapentin is most appropriate for which seizure indication?","Adjunct therapy for focal seizures",["Absence seizures","Status epilepticus","Primary generalized tonic-clonic seizures alone"],"Gabapentin and pregabalin are add-on drugs for focal seizures and also treat neuropathic pain. They are not effective for generalized epilepsies.");
P("Epilepsy",3,"Which antiseizure drug requires monitoring for aplastic anemia and hepatic failure so it is reserved for refractory epilepsy such as Lennox-Gastaut syndrome?","Felbamate",["Lamotrigine","Levetiracetam","Ethosuximide"],"Felbamate has a serious boxed warning. It is rarely used. Patients must give informed consent.");
P("Epilepsy",3,"Which antiseizure drug irreversibly inhibits GABA transaminase and carries a risk of permanent visual field loss?","Vigabatrin",["Tiagabine","Lacosamide","Perampanel"],"Vigabatrin is used for infantile spasms and refractory focal seizures through a restricted REMS program. Vision testing is required.");
P("Epilepsy",3,"Which antiseizure drug inhibits GABA reuptake (GAT-1)?","Tiagabine",["Vigabatrin","Gabapentin","Phenobarbital"],"Tiagabine increases synaptic GABA by blocking GAT-1. Vigabatrin raises GABA by blocking its breakdown.");
P("Epilepsy",3,"Which antiseizure drug enhances slow inactivation of sodium channels and can prolong the PR interval?","Lacosamide",["Perampanel","Levetiracetam","Topiramate"],"Lacosamide is Schedule V. Use caution with heart block or other PR-prolonging drugs.");
P("Epilepsy",3,"Which antiseizure drug is an AMPA receptor antagonist with a boxed warning for serious psychiatric and behavioral reactions?","Perampanel",["Lacosamide","Tiagabine","Ethosuximide"],"Perampanel blocks glutamate AMPA receptors. Warn about hostility, aggression and homicidal ideation.");
P("Epilepsy",3,"Which antiseizure drug opened KCNQ potassium channels but was withdrawn because it caused retinal pigmentation and blue-gray skin discoloration?","Retigabine (ezogabine)",["Rufinamide","Vigabatrin","Perampanel"],"It was the first potassium-channel opener for epilepsy and was discontinued in 2017.");
P("Epilepsy",2,"Which barbiturate is an inexpensive antiseizure drug that induces liver enzymes and causes sedation?","Phenobarbital",["Methohexital","Thiopental","Zolpidem"],"Phenobarbital prolongs GABA-A channel opening. It remains used for neonatal seizures and in resource-limited settings. It is Schedule IV.");
P("Epilepsy",3,"Which antiseizure drug is used for Lennox-Gastaut syndrome and shortens the QT interval?","Rufinamide",["Felbamate","Vigabatrin","Ethosuximide"],"Rufinamide is a sodium channel blocker contraindicated in familial short QT syndrome. Take with food.");
P("Epilepsy",2,"Which drug class is first-line for acute treatment of status epilepticus?","Benzodiazepines such as IV lorazepam, IM midazolam or IV diazepam",["Phenytoin alone","Valproate alone","Gabapentin"],"Benzodiazepines act fast and stop most seizures. Fosphenytoin, levetiracetam or valproate follow as second-line therapy.");
P("Epilepsy",2,"Which antiseizure drugs can decrease the effectiveness of oral contraceptives through enzyme induction?","Carbamazepine, phenytoin and phenobarbital",["Levetiracetam, gabapentin and lamotrigine","Ethosuximide, gabapentin and valproate","Levetiracetam, vigabatrin and pregabalin"],"Inducers speed up hormone clearance, so use a backup or alternative method. Topiramate over 200 mg/day and oxcarbazepine are weaker inducers.");
P("Epilepsy",2,"Which antiseizure drug should be avoided in women planning pregnancy because of the highest risk of major malformations and lower IQ in children?","Valproate",["Lamotrigine","Levetiracetam","Gabapentin"],"Valproate has the highest teratogenic risk. Lamotrigine and levetiracetam have the lowest risk. All women of childbearing age taking antiseizure drugs should take folic acid.");
P("Epilepsy",3,"Which drugs can WORSEN absence and myoclonic seizures?","Carbamazepine and phenytoin",["Valproate and ethosuximide","Lamotrigine and valproate","Levetiracetam and topiramate"],"Sodium channel blockers aggravate generalized spike-wave discharges. Match the drug to the seizure type.");
P("Epilepsy",2,"Which drug is used for infantile spasms?","Vigabatrin",["Ethosuximide","Gabapentin","Carbamazepine"],"First-line options are ACTH or oral corticosteroids; vigabatrin is also first-line, particularly with tuberous sclerosis.");

/* ---------- Dopamine ---------- */
P("Dopamine",1,"Why is carbidopa given together with levodopa?","It inhibits peripheral dopa decarboxylase, so more levodopa reaches the brain and nausea decreases",["It crosses the blood-brain barrier to boost dopamine","It blocks D2 receptors","It inhibits MAO-B in the brain"],"Carbidopa does not cross the blood-brain barrier. It allows lower levodopa doses and less nausea, vomiting and orthostasis.");
P("Dopamine",2,"What dietary advice applies to levodopa?","High-protein meals can reduce absorption and brain entry",["Take with grapefruit juice","Avoid all fluids","Take with a high-calcium meal to absorb it"],"Large neutral amino acids compete with levodopa at the gut and the blood-brain barrier. Taking doses 30 to 60 minutes before meals helps, with food if nausea occurs.");
P("Dopamine",2,"Long-term levodopa therapy commonly causes:","Wearing-off and dyskinesias",["Hepatic failure","Agranulocytosis","Pulmonary fibrosis"],"Motor fluctuations and involuntary movements emerge after years. Adding a COMT inhibitor, MAO-B inhibitor or dopamine agonist can extend response.");
P("Dopamine",2,"Which two drugs are non-ergot D2/D3 agonists used for Parkinson disease and restless legs syndrome?","Pramipexole and ropinirole",["Bromocriptine and pergolide","Levodopa and carbidopa","Selegiline and rasagiline"],"They can cause sleep attacks, impulse control disorders (gambling), hallucinations, nausea and edema. Ropinirole is a CYP1A2 substrate; pramipexole is renally cleared.");
P("Dopamine",2,"Which dopamine agonist is delivered as a transdermal patch?","Rotigotine",["Pramipexole","Ropinirole","Bromocriptine"],"The once-daily patch gives continuous stimulation. Rotate sites; skin reactions are common.");
P("Dopamine",3,"Which ergot-derived dopamine agonist is also used for hyperprolactinemia, acromegaly and type 2 diabetes (Cycloset)?","Bromocriptine",["Pramipexole","Rotigotine","Ropinirole"],"Bromocriptine is a D2 agonist that lowers prolactin. Ergot derivatives can cause cardiac valvulopathy and fibrosis. Nausea and orthostasis are common.");
P("Dopamine",3,"Why was pergolide removed from the US market?","Cardiac valvular fibrosis",["Hepatic failure","Agranulocytosis","QT prolongation"],"Ergot-derived dopamine agonists activate 5-HT2B receptors on valves. Non-ergot agonists are now preferred.");
P("Dopamine",2,"Which two ADHD drug classes are CNS stimulants that raise dopamine and norepinephrine?","Methylphenidate and amphetamine products",["Guanfacine and clonidine","Atomoxetine and viloxazine","Buspirone and hydroxyzine"],"Stimulants are Schedule II with a boxed warning for abuse and dependence. They cause insomnia, decreased appetite, and higher blood pressure and heart rate.");
P("Dopamine",2,"Which antidepressant is a norepinephrine-dopamine reuptake inhibitor, also used for smoking cessation, and lowers seizure threshold?","Bupropion",["Sertraline","Mirtazapine","Trazodone"],"Bupropion does not cause sexual dysfunction or weight gain. It is contraindicated in seizure disorders and eating disorders, and with abrupt alcohol or benzodiazepine withdrawal.");
P("Dopamine",3,"Which drugs inhibit COMT to prolong the effect of levodopa?","Entacapone and tolcapone",["Selegiline and rasagiline","Pramipexole and ropinirole","Benztropine and trihexyphenidyl"],"COMT inhibitors reduce peripheral breakdown of levodopa and treat wearing-off. Tolcapone is limited by liver toxicity.");
P("Dopamine",3,"Which Parkinson disease drugs inhibit MAO-B?","Selegiline and rasagiline",["Entacapone and tolcapone","Amantadine and benztropine","Bromocriptine and pergolide"],"MAO-B inhibitors reduce dopamine breakdown. Avoid combining with meperidine, tramadol, SSRIs or other serotonergic drugs.");
P("Dopamine",3,"Which Parkinson disease drug class is best avoided in older adults because of confusion, constipation and urinary retention?","Anticholinergics such as benztropine and trihexyphenidyl",["Dopamine agonists","COMT inhibitors","MAO-B inhibitors"],"Anticholinergics help tremor but are on the Beers list. They are also used for antipsychotic-induced parkinsonism and dystonia.");

/* ---------- Psychosis and mania ---------- */
P("Psychosis and mania",1,"Which antipsychotic is a high-potency first-generation (typical) drug with a high risk of extrapyramidal symptoms?","Haloperidol",["Quetiapine","Olanzapine","Clozapine"],"Haloperidol is a strong D2 antagonist and is available as a long-acting decanoate injection. It also prolongs QT. Low-potency typicals are more sedating and anticholinergic.");
P("Psychosis and mania",1,"Which antipsychotic is reserved for treatment-resistant schizophrenia and reduces suicide risk?","Clozapine",["Haloperidol","Aripiprazole","Risperidone"],"Clozapine has little EPS but boxed warnings for severe neutropenia, orthostasis, seizures, myocarditis and increased mortality in dementia. It is dispensed through a monitoring program.");
P("Psychosis and mania",2,"Which laboratory test is required regularly for patients taking clozapine?","Absolute neutrophil count",["Serum sodium","Serum creatinine only","INR"],"Severe neutropenia (agranulocytosis) can occur. Monitoring frequency decreases after the first months.");
P("Psychosis and mania",3,"A patient on stable clozapine quits smoking. What happens to the clozapine level?","It rises, because CYP1A2 induction from smoke is lost",["It falls","It is unchanged","It becomes unmeasurable"],"Tobacco smoke induces CYP1A2. Stopping smoking can cause toxicity, so reduce the dose. Ciprofloxacin and fluvoxamine also raise levels by inhibiting CYP1A2.");
P("Psychosis and mania",2,"Which atypical antipsychotic is most associated with hyperprolactinemia?","Risperidone",["Aripiprazole","Quetiapine","Clozapine"],"Strong D2 blockade in the tuberoinfundibular pathway raises prolactin, causing galactorrhea, amenorrhea and gynecomastia.");
P("Psychosis and mania",2,"Which atypical antipsychotics have the greatest risk of weight gain and metabolic syndrome?","Olanzapine and clozapine",["Aripiprazole and ziprasidone","Lurasidone and ziprasidone","Haloperidol and aripiprazole"],"Monitor weight, waist, glucose or A1c and lipids. Aripiprazole, ziprasidone and lurasidone are more weight-neutral.");
P("Psychosis and mania",2,"Aripiprazole is unusual among antipsychotics because it acts as a:","D2 partial agonist",["D2 antagonist only","5-HT2A inverse agonist","D1 agonist"],"Partial agonism gives lower rates of prolactin elevation and weight gain. Akathisia (restlessness) is a common side effect.");
P("Psychosis and mania",2,"Which antipsychotic is a 5-HT2A inverse agonist approved for Parkinson disease psychosis, with no dopamine blockade?","Pimavanserin",["Haloperidol","Olanzapine","Risperidone"],"Dopamine antagonists worsen parkinsonism. Pimavanserin avoids D2 blockade but still carries the boxed warning for increased mortality in elderly dementia patients.");
P("Psychosis and mania",3,"Lurasidone must be taken with food because:","Absorption is reduced without at least 350 calories",["Food prevents nausea only","It is destroyed by stomach acid","Food blocks CYP3A4"],"Absorption roughly doubles with food. It is a CYP3A4 substrate, so avoid strong inhibitors and inducers. It is also approved for bipolar depression.");
P("Psychosis and mania",2,"Which antipsychotic is the most sedating and is often used (off-label) for insomnia, with antihistamine and α1-blocking effects?","Quetiapine",["Aripiprazole","Lurasidone","Haloperidol"],"Quetiapine has low EPS but causes orthostatic hypotension, sedation and metabolic effects at low doses. It is also approved for bipolar depression.");
P("Psychosis and mania",1,"Which drug is the classic mood stabilizer with a narrow therapeutic index (about 0.6 to 1.2 mEq/L)?","Lithium",["Valproate","Lamotrigine","Quetiapine"],"Lithium is renally cleared. Toxicity causes coarse tremor, vomiting, confusion and ataxia. Check levels, kidney and thyroid function.");
P("Psychosis and mania",2,"Which drugs raise lithium levels and cause toxicity?","Thiazide diuretics, NSAIDs and ACE inhibitors",["Loop diuretics only","Acetaminophen and aspirin only","Calcium channel blockers"],"Lithium is reabsorbed with sodium in the proximal tubule. Any drug causing sodium or volume depletion, or reducing renal clearance, increases lithium levels. Aspirin and sulindac are the exceptions among NSAIDs.");
P("Psychosis and mania",2,"Long-term lithium commonly causes:","Hypothyroidism, nephrogenic diabetes insipidus and tremor",["Hepatic failure","Agranulocytosis","Pulmonary fibrosis only"],"Lithium also is teratogenic (Ebstein anomaly). Counsel patients to stay hydrated and keep salt intake steady.");
P("Psychosis and mania",2,"Which anticonvulsant is best for preventing the depressive pole of bipolar disorder and has weight-neutral effects but risks Stevens-Johnson syndrome?","Lamotrigine",["Valproate","Carbamazepine","Lithium"],"Lamotrigine is better for maintenance against depression than mania. It is not effective for acute mania.");
P("Psychosis and mania",2,"Which two anticonvulsants are used for acute mania?","Valproate (divalproex) and carbamazepine",["Gabapentin and levetiracetam","Lamotrigine and ethosuximide","Topiramate and phenobarbital"],"Valproate loads rapidly for acute mania. Carbamazepine requires watching interactions, sodium and blood counts.");
P("Psychosis and mania",2,"Which extrapyramidal reaction appears within hours to days after starting an antipsychotic and is treated with benztropine or diphenhydramine?","Acute dystonia",["Tardive dyskinesia","Neuroleptic malignant syndrome","Serotonin syndrome"],"Sudden muscle spasms of the neck, jaw or eyes (oculogyric crisis) respond quickly to an anticholinergic. Younger males on high-potency drugs are at highest risk.");
P("Psychosis and mania",2,"Which extrapyramidal side effect presents as inner restlessness and an inability to sit still, treated with propranolol, benzodiazepines or dose reduction?","Akathisia",["Acute dystonia","Tardive dyskinesia","Parkinsonism"],"Akathisia is common with aripiprazole and high-potency agents. Anticholinergics are less effective for it.");
P("Psychosis and mania",2,"Which movement disorder arises after months to years of antipsychotic therapy and may be treated with a VMAT2 inhibitor?","Tardive dyskinesia",["Acute dystonia","Akathisia","Neuroleptic malignant syndrome"],"Valbenazine and deutetrabenazine reduce involuntary movements of the face and tongue. Anticholinergics can worsen TD.");
P("Psychosis and mania",3,"A patient on haloperidol develops fever, severe muscle rigidity, altered mental status and a high creatine kinase. This is:","Neuroleptic malignant syndrome",["Serotonin syndrome","Malignant hyperthermia","Anticholinergic toxicity"],"NMS develops over days with lead-pipe rigidity and autonomic instability. Stop the antipsychotic and give supportive care. Dantrolene or bromocriptine are used in severe cases.");
P("Psychosis and mania",3,"Which feature helps separate serotonin syndrome from neuroleptic malignant syndrome?","Serotonin syndrome has hyperreflexia, clonus and rapid onset",["Serotonin syndrome has lead-pipe rigidity","NMS has diarrhea","NMS has rapid onset within hours"],"Serotonin syndrome develops within hours with hyperreflexia, clonus, diarrhea and mydriasis. NMS evolves over days with bradyreflexia and lead-pipe rigidity.");
P("Psychosis and mania",2,"What is the boxed warning for all antipsychotics in older adults with dementia?","Increased mortality",["Hepatic failure","Agranulocytosis","Seizures"],"Deaths were mostly cardiovascular or infectious. Antipsychotics are not approved for treating dementia-related psychosis.");
P("Psychosis and mania",2,"Which symptom group of schizophrenia is the least responsive to antipsychotic drugs?","Negative symptoms such as apathy and social withdrawal",["Hallucinations","Delusions","Agitation"],"Antipsychotics treat positive symptoms (hallucinations, delusions) mainly through D2 blockade. Negative symptoms remain hard to treat with any drug.");
P("Psychosis and mania",2,"Which antipsychotic combines with fluoxetine as an approved option for bipolar depression and treatment-resistant depression?","Olanzapine",["Haloperidol","Ziprasidone","Risperidone"],"The olanzapine-fluoxetine combination (Symbyax) is approved for both. Weight gain and metabolic monitoring remain essential.");
P("Psychosis and mania",3,"Which antipsychotic is chiefly associated with QT prolongation, and should be avoided with other QT-prolonging drugs?","Ziprasidone",["Aripiprazole","Lurasidone","Paliperidone"],"Ziprasidone should be taken with a meal of at least 500 calories. Haloperidol (especially IV) and citalopram are other QT concerns.");
/* ---------- Compounding pharmacy: calculation + kinetics generators ---------- */
function fmtS(n) { return String(Number(Number(n).toPrecision(3))); }

function labEval(src, ans) {

    if (id === 'e') return Math.E;
    if (id === 'ans') return ans || 0;

const DRUGS = [{"id":23,"w":1,"g":"Amoxicillin","b":"Amoxil","c":"β-Lactam Antibiotic","m":"Semisynthetic penicillin derivative that inhibits the biosynthesis of bacterial cell wall mucopeptide. Typically active against Streptococcus, Enterococcus, Staphylococcus, and Enterobacteriaceae.","i":["Acute otitis media","Lower respiratory tract infection","Pharyngitis, tonsillitis","Streptococcal pharyngitis","Ear, nose, and throat infection, infection of skin and/or subcutaneous tissue, infection of genitourinary system","H. pylori GI tract infection"],"cn":"Complete full course of therapy. For the suspension, shake well and store in the refrigerator. Note short expiration after reconstitution. Can take with food if causes upset stomach. Avoid mixing suspension with food or beverages and use with measuring device that comes with prescription. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with health-care practitioner. May decrease effectiveness of oral contraceptives; encourage patients to use backup contraceptive method (eg, condom).","p":"May resume normal activities after 24 h of antibiotics if afebrile. Extended release tablet not approved for children <12 y of age.","lo":"250 mg three times daily","ty":"500 mg three times daily","mx":"875 mg twice daily"},{"id":98,"w":1,"g":"Valacyclovir","b":"Valtrex","c":"Viral DNA Polymerase Inhibitor","m":"A prodrug of acyclovir. Acyclovir is an acyclic nucleoside analogue of deoxyguanosine that is selectively phosphorylated by the virus-encoded thymidine kinase to its monophosphate form. Cellular enzymes then convert the monophosphate to the active antiviral acyclovir triphosphate, which inhibits viral DNA synthesis by incorporation into viral DNA, resulting in chain termination. Acyclovir has potent activity against herpes simplex virus (HSV) 1 and 2 and varicella-zoster virus (VZV).","i":["Genital herpes simplex, treatment or suppression","Herpes zoster (shingles)","Varicella","Herpes labialis (cold sores)"],"cn":"Seek medical attention if decreased urination, unusual bruising or bleeding, blistering skin rash, or shortness of breath. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with HCP. If using for prophylaxis, this medication should reduce the number of breakouts. Maintain adequate hydration during therapy to prevent renal complications.","p":"Not indicated for children <2 y of age. Use caution with concurrent nephrotoxins. Drug of choice for herpes zoster infection. Improved oral bioavailability over acyclovir, allowing twice daily dosing of valacyclovir (compared to 5 times/d dosing of acyclovir).","lo":"","ty":"","mx":""},{"id":65,"w":1,"g":"Azithromycin","b":"Zithromax","c":"Macrolide Antibiotic","m":"Binds to the 50S ribosomal subunit, thus interfering with microbial protein synthesis. It is a macrolide antibiotic that is slightly less active than erythromycin against gram-positive bacteria but substantially more active against M. (B.), Haemophilus sp., Legionella sp., Neisseria sp., Bordetella sp., Mycoplasma sp., and C. trachomatis.","i":["Acute infective exacerbation of COPD,","Community-acquired pneumonia","Sexually transmitted infections","Streptococcal pharyngitis","Traveler’s diarrhea"],"cn":"Complete full course of therapy. Take tablets with or without food, although some patients report increased tolerability when given with food. Avoid mixing suspension with food or beverages, but food can be taken afterward. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with healthcare practitioner. Higher doses associated with increased occurrence of diarrhea.","p":"Use with caution in severe renal, hepatic, or cardiac disease. Pediatric use of oral tablets is restricted to community-acquired pneumonia. Max dose in children is 500 mg. There is a small absolute increase in the risk of cardiovascular death during a 5-d course of oral azithromycin. Also available as ophthalmic for bacterial conjunctivitis, and injectable for severe infections","lo":"500 mg once daily","ty":"500 mg once daily","mx":"500 mg once daily"},{"id":144,"w":1,"g":"Nitrofurantoin","b":"Macrodantin, Macrobid","c":"Nitrofuran Antibiotic","m":"Synthetic nitrofuran that inactivates bacterial ribosomes and is bactericidal in urine at therapeutic doses. It is active against most bacteria that cause UTIs except nearly all strains of Pseudomonas are resistant.","i":["UTI, treatment and prophylaxis"],"cn":"May make urine brown; this is not harmful and is a breakdown product of the drug. Complete full course of therapy. For the suspension, shake well and store at room temperature, use within 30 d. Avoid mixing suspension with food or beverages, but food can be taken afterward. Symptoms should improve within 2-3 d; if they worsen, seek follow-up care.","p":"Nitrofurantoin does not reach effective levels in tissue and is only indicated for UTIs (not pyelonephritis). May resume normal activities after 24 h of antibiotics if afebrile. The drug is used primarily to prevent recurrent UTIs but is also effective in the treatment of uncomplicated UTIs.","lo":"50 mg four times daily","ty":"100 mg twice daily","mx":"100 mg four times daily"},{"id":66,"w":1,"g":"Amoxicillin/clavulanate","b":"Augmentin","c":"β-Lactam Antibiotic","m":"A semisynthetic penicillin derivative. Amoxicillin is not effective against β-lactamase–producing bacteria. Clavulanate, a β-lactamase inhibitor, has weak antibacterial activity but is a potent inhibitor of plasmid-mediated β-lactamases and protects amoxicillin from degradation by β-lactamases.","i":["Acute otitis media","Community-acquired pneumonia","Lower respiratory tract infection","Sinusitis","Urinary tract infection, acute cystitis","Urinary tract infection, pyelonephritis","Bite wound prophylaxis and treatment"],"cn":"Complete full course of therapy. Take dose with food to ensure proper absorption. For the suspension, shake well and store in the refrigerator. Note short expiration after re  of viral DNA replication","i":["Genital herpes simplex, treatment or suppression","Herpes zoster (shingles)","Varicella (chickenpox)","Cold sores"],"cn":"Complete full course of therapy. Ensure adequate hydration. For HSV, initiate treatment as soon as possible at first sign of lesion (treatment most effective if initiated within 24 h of lesion onset). For VZV, treatment should begin within 24 h of appearance of rash. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with HCP. If using for prophylaxis or suppression of infection, this medication should reduce the number of breakouts. Maintain adequate hydration during therapy.","p":"Not indicated for children <2 y of age. Treatment of genital herpes simplex may extend >10 d if lesions have not fully healed. Use caution with concurrent nephrotoxins. Topical and parenteral products also available. Multiple daily doses may be impractical compared to newer, less frequently administered analogues (eg, valacyclovir).","lo":"","ty":"","mx":""},{"id":86,"w":1,"g":"Cephalexin","b":"Keflex","c":"First-Generation Cephalosporin","m":"1st-generation cephalosporin that inhibits bacterial wall synthesis of actively dividing cells by binding to ≥1 penicillin-binding proteins (PBPs). Most gram-positive bacteria, including non–penicillinase- and penicillinase-producing staphylococci and streptococci. Activity against gram-negative bacteria is less s and is primarily restricted to E. coli, Klebsiella, and Proteus mirabilis.","i":["Skin and soft tissue infections","Otitis media","UTI","Pharyngitis","Osteomyelitis","Bacterial endocarditis"],"cn":"Seek medical attention if rash develops. Complete full course of therapy. For the suspension, shake well and store in the refrigerator. Note short expiration after reconstitution. Avoid mixing suspension with food or beverages, but food can be taken afterward. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with health-care practitioner.","p":"May resume normal activities after 24 h of antibiotics and if afebrile.","lo":"250 mg every 6 hours","ty":"500 mg every 6-12 hours","mx":"1000 mg every 6 hours"},{"id":230,"w":1,"g":"Penicillin","b":"Wycillin","c":"Antibiotic","m":"Penicillins are active against most gram-positive organisms and some gram-negative organisms, notably Neisseria spp., by interfering with late stages of bacterial cell wall synthesis; resistance is caused primarily by bacterial production of β-lactamases; some organisms have altered penicillin-binding protein targets (eg, Enterococci spp. and S. pneumoniae); others have impermeable outer cell wall layers.","i":["Pharyngitis","Otitis media","Bacterial endocarditis","Erysipelas","Pneumococcal infectious disease"],"cn":"Complete full course of therapy. Symptoms should improve within 2-3 d; if they worsen, seek medical care. Take on an empty stomach. Seek care for severe diarrhea, dark urine, yellowing of skin or eyes, unusual bruising or bleeding, blistering skin rash, or shortness of breath.","p":"Use caution in those with severe renal impairment and in those with seizure disorders. Typically may resume normal activities after 24 h of antibiotics if afebrile.","lo":"250 mg twice daily","ty":"250-500 q6h","mx":"500mg q6h"},{"id":77,"w":1,"g":"Doxycycline hyclate, doxycycline monohydrate","b":"Vibramycin","c":"Tetracycline Antibiotic","m":"A broad-spectrum bacteriostatic compound that inhibits protein synthesis at the 30S ribosomal subunit. Activity includes gram-positive, gram-negative, aerobic, and anaerobic bacteria, as well as spirochetes, mycoplasmas, rickettsiae, chlamydiae, and some protozoa. Many bacteria have developed plasmid-mediated resistance.","i":["Acne vulgaris","Gonorrhea","Skin and soft tissue infection","Community acquired pneumonia","Otitis media","Acinetobacter infection"],"cn":"May take with food that does not contain calcium. Complete full course of therapy. Symptoms should improve within 2-3 d. May cause photosensitivity; discontinue at first sign of skin erythema. Wear sunscreen and avoid prolonged exposure to sunlight and ultraviolet light. Administer with 240 mL of water.","p":"May resume normal activities after 24 h of antibiotics if afebrile. Not for use in children <8 y of age (causes bone and tooth discoloration).","lo":"100 mg once daily","ty":"100 mg twice daily","mx":"200 mg twice daily"},{"id":10,"w":2,"g":"Omeprazole","b":"Prilosec","c":"Proton Pump Inhibitor (PPI)","m":"Proton pump inhibitors (PPIs) block gastric acid secretion by irreversibly binding to and inhibiting the hydrogen-potassium ATPase pump that resides on the luminal surface of the parietal cell membrane.","i":["GERD","Peptic Ulcers","H. pylori GI tract infection"],"cn":"Take on an empty stomach 1 h before eating. Do not take simultaneously with antacids unless as IR formulation found in Zegerid. Can open capsule and add to applesauce. Not for immediate relief of heartburn.","p":"More effective than H2-antagonists for relief of heartburn and dyspepsia. Approved for OTC use for up to two weeks. Daily use recommended in patients with severe GERD (Barretts esophagus, strictures, grade C/D esophagitis). For non-severe GERD, taper to lowest effect dose. May cause rebound hypersecretion with abrupt discontinuation. Finite treatment (~8 weeks) for peptic ulcers/mild esophageal erosions.","lo":"20 mg once daily","ty":"20-40 mg once daily","mx":"40 mg BID"},{"id":176,"w":2,"g":"Verapamil","b":"Calan","c":"Non-DHP Calcium Channel Blocker","m":"Inhibits calcium “slow channels” on vascular smooth muscle and myocardium producing relaxation of muscle and vasodilation. Increases myocardial oxygen delivery and slow conduction through the AV node.","i":["HTN","Angina","Atrial arrhythmia and paroxysmal supraventricular tachycardia prophylaxis"],"cn":"Do not crush or chew extended-release products. Contents of extended-release capsules may be sprinkled on food and swallowed without chewing, followed by water. Report symptomatic hypotension, bradyarrhythmia, peripheral edema, or syncope. Avoid sudden discontinuation of drug, as this may precipitate hypertensive rebound/crisis. Rise slowly from a sitting or lying position to avoid dizziness. Avoid alcohol and grapefruit juice.","p":"Not approved in children <18 y of age.","lo":"","ty":"","mx":""},{"id":72,"w":2,"g":"Paroxetine","b":"Paxil","c":"SSRI Antidepressant","m":"A highly selective and potent inhibitor of serotonin reuptake (SSRI).","i":["Depression","Anxiety","OCD","Panic disorder","PTSD","Premenstrual syndrome","Vasomotor symptoms of menopause"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). May cause nausea, sedation, headache, constipation, and dry mouth. May exacerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"May be more sedating and anticholinergic than other SSRI antidepressants, but morning or nighttime dosing is acceptable. Withdrawal syndromes more common and slower titrations off medication needed. Not FDA approved for use in children.","lo":"10 mg once daily","ty":"20-40 mg once daily","mx":"60 mg once daily"},{"id":183,"w":2,"g":"Carbamazepine","b":"Tegretol","c":"Anticonvulsant","m":"Acts presynaptically to block firing of action potentials, which decreases the release of excitatory neurotransmitters, and postsynaptically by blocking high-frequency repetitive discharge initiated at cell bodies.","i":["Epilepsy","Trigeminal neuralgia","Neuropathic pain","Bipolar disease, acute manic and mixed episodes"],"cn":"May decrease effectiveness of oral contraceptives; use an alternative form of birth control. Avoid activities requiring mental alertness or coordination until drug effects are realized. Take with food, but not alcohol, grapefruit, or grapefruit juice. Avoid abrupt discontinuation.","p":"Suspension is dosed 3-4 times per day. Not effective for absence seizures. Testing for HLA-B*15:02 and HLA-A*31:01 should be performed in Asian patients. Potent inducer of CYP 450 enzymes - monitor and adjust for drug interactions","lo":"","ty":"","mx":""},{"id":90,"w":2,"g":"Amitriptyline","b":"Elavil","c":"Tricyclic Antidepressant","m":"Tricyclic antidepressant that blocks presynaptic reuptake of serotonin and norepinephrine with subsequent downregulation of adrenergic receptors.","i":["Depression","Migraine or tension-type headache prophylaxis (off-label)","Chronic pain (off-label)","Insomnia (off-label)","Sialorrhea (off-label)"],"cn":"Takes weeks for full effects for depression, anxiety, and pain condition; insomnia may improve after first dose. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). Nighttime dosing is common due to sedation. May cause nausea, sedation, headache, constipation, and dry mouth. May exacerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"This drug can cause anticholinergic side effects and QTc prolongation. Safety and effectiveness in children <12 y of age have not been established.","lo":"10 mg once nightly","ty":"25-100 mg once nightly","mx":"150 mg per day"},{"id":196,"w":2,"g":"Metronidazole","b":"Flagyl","c":"Nitroimidazole Antibiotic, Antiprotozoal","m":"A synthetic nitroimidazole active against T. vaginalis (trichomoniasis), E. histolytica (amebiasis), and G. lamblia (giardiasis); it is bactericidal against nearly all obligate anaerobic bacteria including B. fragilis.","i":["Bacterial vaginosis","Abscess, anaerobic","Trichomoniasis","Ambec dysentery","C. difficile infection","H. Pylori GI tract infection"],"cn":"Complete full course of therapy. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with health-care practitioner. May be administered with food to minimize stomach upset.","p":"Alternative for mild-moderate C. difficile infection (after vancomycin and fidaxomicin). Injectable and various topical formulations also available.","lo":"250 mg 3 times daily","ty":"500 mg 2-3 times daily","mx":"750 mg three times daily (2250 mg per day)"},{"id":112,"w":2,"g":"Celecoxib","b":"Celebrex","c":"Cyclooxygenase-2 Inhibitor","m":"Inhibition of the COX-2 enzyme isoform is thought to be responsible for the anti-inflammatory effects of NSAIDs.","i":["Osteoarthritis","Rheumatoid arthritis","Ankylosing spondylitis","Acute pain","Acute gout attack"],"cn":"May take with food or milk to decrease GI upset. May open capsule and pour into a teaspoon of applesauce.","p":"Elderly patients are at increased risk of GI ulceration. Patients with underlying cardiac dysfunction are at increased risk for cardiovascular effects. Celecoxib has less risk of GI effects than other NSAIDs, but increased cardiovascular toxicity. May cause significant edema. Use the lowest dose for the shortest period of time to avoid adverse effects.","lo":"100 mg twice daily","ty":"200 mg once daily","mx":"400 mg per day"},{"id":265,"w":2,"g":"Efavirenz","b":"Sustiva","c":"Antiretroviral Agent, Reverse Transcriptase Inhibitor","m":"Binds to HIV reverse transcriptase, blocking the RNA-dependent and DNA-dependent DNA polymerase activities including HIV-1 replication.","i":["Treatment of HIV-1 infection"],"cn":"Multiple, potentially serious drug interactions; do not take new medications, OTCs, or herbals without consulting HCP. Take on an empty stomach at bedtime. Do not open, chew, or crush capsule. Does not prevent transmission of HIV, practice safe sex. May cause drowsiness; avoid driving and concurrent CNS depressants.","p":"
