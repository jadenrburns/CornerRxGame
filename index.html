evated triglycerides. Use with caution and monitor closely for rhabdomyolysis if co-administered with HMG-CoA reductase inhibitors.","lo":"48 mg once daily","ty":"145 mg once daily","mx":"145 mg once daily"},{"id":12,"w":17,"g":"Rosuvastatin","b":"Crestor","c":"HMG-CoA Reductase Inhibitor","m":"HMG-CoA reductase inhibitors competitively inhibit conversion of HMG-CoA to mevalonate, an early rate-limiting step in cholesterol synthesis. A compensatory increase in LDL receptors, which bind and remove circulating LDL-cholesterol, results. Production of LDL-cholesterol can also decrease because of decreased production of VLDL-cholesterol or increased VLDL removal by LDL receptors.","i":["Hyperlipidemia","Familial hypercholesterolemia, homozygous","Hypertriglyceridemia","Mixed dyslipidemia"],"cn":"Take any time of day","p":"can get to high intensity dosing. Has long half-life can be used qod in patients with statin myopathy","lo":"5 mg once daily","ty":"10-20 mg once daily","mx":"40 mg once daily"},{"id":133,"w":17,"g":"Lovastatin","b":"Altoprev","c":"HMG-CoA Reductase Inhibitor","m":"HMG-CoA reductase inhibitors competitively inhibit conversion of HMG-CoA to mevalonate, an early rate-limiting step in cholesterol synthesis","i":["Hypercholesterolemia, primary and mixed","Familial hypercholesterolemia, heterozygous"],"cn":"Take in the evening","p":"can't get to high intensity dosing","lo":"10 mg once daily","ty":"20-40 mg once daily","mx":"80 mg per day"},{"id":19,"w":17,"g":"Semaglutide","b":"Ozempic; Rybelsus","c":"Glucagon-Like Peptide-1 (GLP-1) Receptor Agonist","m":"Analog of glucagon-like peptide-1, which increases glucose-dependent insulin secretion in response to oral glucose intake, decreases inappropriate glucagon secretion, slows gastric emptying, and increases satiety.","i":["T2DM","Chronic weight management (under brand name Wegovy)"],"cn":"Injectable (Ozempic) once-weekly dosing or daily oral (Rybelsus) option. GI effects are common dose-dependent ADR (N/V. appetite change), dose titration may help reduce this effect. Counsel on weight loss benefit. Ozempic storage: Keep refrigerated prior to first use, can be stored at RT for up to 56 days after first use. Ozempic missed dose: if >5 days since missed dose, skip and give at next scheduled weekly dose; Rybelsus storage: protect from moisture and store in original blister card- do not remove tablets before use. Administer tablet on an empty stomach >30 mins before breakfast with 4 oz water.","p":"First-line option for those with ASCVD or high ASCVD risk. Demonstrated CV benefit with use of semaglutide, liraglutide, or dulaglutide. BBW for CI in personal or family hx of medullary thyroid carcinoma or multiple endocrine neoplasia syndrome type 2. Low risk of hypoglycemia when used as monotherapy, but may increase risk of hypoglycemia if used with insulin or sulfonylurea. Use caution in patients with GI motility disorders. Monitor renal function. *Note: Wegovy has different dosing than T2DM formulations.","lo":"Injection: 0.25 mg once weekly; Tablet: 3 mg once daily","ty":"Injection: 0.5-1 mg once weekly; Tablet: 7-14 mg once daily","mx":"Injection: 2 mg once weekly; Tablet: 14 mg once daily"},{"id":134,"w":17,"g":"Pioglitazone","b":"Actos","c":"Thiazolidinedione","m":"A thiazolidinedione antihyperglycemic and a potent peroxisome proliferator-activated receptor-𝛾 (PPAR-𝛾) agonist used to improve insulin sensitivity in liver, muscle, and adipose tissue.","i":["T2DM"],"cn":"Take with or without food at same time every day. Can cause weight gain and edema. Low risk of hypoglycemia when used as monotherapy. ADRs include HA, upper respiratory symptoms including URTI. May take weeks to see full effects. Increased risk of bladder cancer (rare) - counsel to report hematuria or painful urination.","p":"BBW: Pioglitazone causes edema, which may exacerbate underlying heart failure; contraindicated with NYHA III/IV heart failure. Lowers triglycerides. Stimulates ovulation. Premenopausal anovulatory individuals may resume ovulation. Increased risk of pregnancy in premenopausal women with diabetes; use effective birth control. Evidence for risk of increased bone fracture, acute hepatic failure.","lo":"15-30 mg once daily","ty":"30-45 mg once daily","mx":"45 mg per day"},{"id":22,"w":17,"g":"Simvastatin","b":"Zocor","c":"HMG-CoA Reductase Inhibitor","m":"HMG-CoA reductase inhibitors competitively inhibit conversion of HMG-CoA to mevalonate, an early rate-limiting step in cholesterol synthesis. A compensatory increase in LDL receptors, which bind and remove circulating LDL-cholesterol, results. Production of LDL-cholesterol also can decrease because of decreased production of VLDL-cholesterol or increased VLDL removal by LDL receptors.","i":["Hyperlipidemia","Primary and secondary prevention of atherosclerotic cardiovascular disease","Familial hypercholesterolemia, homozygous"],"cn":"Take in the evening. There are multiple significant drug-drug interactions with simvastatin. Consult a health-care professional prior to starting any new medications, including OTC and herbal drugs.","p":"Can't get to high intensity dosing","lo":"5 mg once daily","ty":"20-40 mg once daily","mx":"80 mg once daily"},{"id":212,"w":17,"g":"Omega-3-acid ethyl esters","b":"Lovaza","c":"Omega-3 Fatty Acids","m":"Potential mechanisms of action include inhibition of acyl-CoA:1,2-diacylglycerol acyltransferase, increased mitochondrial and peroxisomal β-oxidation in the liver, decreased lipogenesis in the liver, and increased plasma lipoprotein lipase activity. Lovaza may reduce the synthesis of triglycerides in the liver because eicosapentaenoic acid (EPA) and docosahexaenoic acid (DHA) are poor substrates for the enzymes re","i":["Hypertriglyceridemia","Familial combined hyperlipidemia","Heart failure"],"cn":"Swallow the whole capsule; take with food. Seek medical attention if severe rash, chest pain, heart palpitations, or shortness of breath","p":"Omega-3-acid ethyl esters are available OTC as fish oil and contain lower amounts of DHA and EPA than the prescription version. OTC products have varying amounts of DHA and EPA. Each Lovaza capsule contains ∼375 mg of DHA and 465 mg of EPA. Treatment of hypertriglyceridemia with omega-3-acid ethyl esters has shown to be equivalent to gemfibrozil in efficacy. Omega-3-acid ethyl esters have not been shown to decrease cardiovascular mortality. Freezing capsules may decrease fishy taste.","lo":"2 g twice daily","ty":"4 g once daily","mx":"4 g per day"},{"id":70,"w":17,"g":"Ezetimibe","b":"Zetia","c":"Cholesterol Absorption Inhibitor, Antihyperlipidemic","m":"Localizes at the brush border of the small intestine and inhibits the absorption of cholesterol, leading to a decrease in the delivery of intestinal cholesterol to the liver. This causes a reduction of hepatic cholesterol stores and an increase in clearance of cholesterol from the blood; this distinct mechanism is complementary to that of statins and of fenofibrate.","i":["Familial hypercholesterolemia - homozygous","Mixed hyperlipidemia","Primary hypercholesterolemia"],"cn":"Take with or without food and may be taken at the same time as a concurrent statin. In patients receiving a bile acid sequestrant concurrently, ezetimibe should be taken at least 2 h before or 4 h after the bile acid sequestrant is taken","p":"Statins are the most effective lipid-altering agents for decreasing LDL-cholesterol and are considered drugs of choice. Ezetimibe has modest single-agent activity and is used in combination with statin or in combination with fenofibrate. Ezetimibe is also available in fixed-dose combination with simvastatin.","lo":"10 mg once daily","ty":"10 mg once daily","mx":"10 mg once daily"},{"id":251,"w":17,"g":"Gemfibrozil","b":"Lopid","c":"Antihyperlipidemic, Fibric Acid","m":"Fibric acid derivatives activate PPAR-α, which increases lipolysis and elimination of triglyceride-rich particles from plasma by activating lipoprotein lipase and reducing production of apoprotein C-III (an inhibitor of lipoprotein lipase activity). Activation of PPAR-α also induces an increase in the synthesis of apoproteins A-I and A-II and HDL-cholesterol.","i":["Familial combined hyperlipidemia prophylaxis","Coronary arteriosclerosis","Familial type V hyperlipoproteinemia"],"cn":"Take 30 min before breakfast and dinner. .","p":"Not first- or second-line treatment for hyperlipidemia. HMG CoA reductase inhibitors are the first line of therapy for most dyslipidemias, due to evidence of lower rates of cardiovascular events and death. Fibrates should be reserved for patients with triglycerides of 500 mg/dL or higher after failing lifestyle changes and ruling out secondary causes of elevated triglycerides. Due to heightened risk of rhabdomyolysis, should not be coadministered with HMG CoA reductase inhibitors.","lo":"600 mg twice daily","ty":"600 mg twice daily","mx":"600 mg twice daily"},{"id":4,"w":18,"g":"Lisinopril","b":"Prinivil, Zestril","c":"ACE-I, Antihypertensive","m":"ACEI prevents conversion of angiotensin I to angiotensin II (a vasoconstrictor). It also reduces serum aldosterone, leading to decreased sodium retention, potentiates the vasodilator kallikrein–kinin system, and inhibits the tissue renin-angiotensin system.","i":["HTN","Heart failure with reduced ejection fraction","STEMI and NSTEMI   *Proteinuric chronic kidney disease, diabetic or nondiabetic"],"cn":"*best to avoid potassium salts or supplements unless under supervision *may cause dizziness especially when going from sitting to standing (report if it does)*overall well tolerated","p":"• Do not combine with ARBs or aliskiren • • Risk of hyperkalemia, especially with CKD, K supplements, K-sparing drugs;monitor electrolytes and renal fxn • • Avoid in pregnancy. *dry cough can occur in up to 20% of patients due to inhibition of bradykinin breakdown","lo":"5 mg once daily","ty":"10-40 mg once daily","mx":"40 mg once daily"},{"id":135,"w":18,"g":"Irbesartan","b":"Avapro","c":"Angiotensin II Receptor Antagonist","m":"A selective, reversible, competitive antagonist of angiotensin II receptor (AT1), which is responsible for the physiologic effects of angiotensin II including vasoconstriction, aldosterone secretion, sympathetic outflow, and stimulation of renal sodium reabsorption.","i":["HTN","Diabetic nephropathy"],"cn":"Seek medical attention if angioedema (swelling of the face, eyes, lips, tongue, or throat), excessive fluid loss (vomiting, diarrhea, or excessive perspiration), hyperkalemia (confusion, body weakness, uneven heartbeat, or numbness/tingling in hands or feet), reduction in urination, jaundice, or skin rash occurs. Avoid pregnancy. Avoid abrupt discontinuation. Use potassium supplements or salt substitutes only under medical supervision. This medicine may cause dizziness. Avoid alcohol or driving.","p":"Safety and efficacy have not been established in children. Observe patients who are volume depleted for at least 2 h after taking the initial dose and consider a lower starting dose if adverse effects occur. FDA reported some ARBs contain nitrosamine impurities (eg, N-nitrosodimethylamine); recommend patients continue to take medication a replacement or a different treatment option is selected.","lo":"","ty":"","mx":""},{"id":16,"w":18,"g":"Hydrochlorothiazide","b":"Microzide","c":"Thiazide Diuretic","m":"Thiazides increase sodium and chloride excretion by interfering with their reabsorption in the cortical diluting segment of the nephron.","i":["HTN","Edema"],"cn":"May be taken with or without food. Take early in the day to avoid nocturia, even if taken more than once/d (eg, bid administration at 8 AM and 2 PM). May cause dizziness. Report signs/symptoms of hypotension. Eat high-potassium foods during therapy. Avoid alcohol and using NSAIDs.","p":"","lo":"12.5 mg once daily","ty":"25 mg once daily","mx":"50 mg once daily"},{"id":171,"w":18,"g":"Benazepril","b":"Lotensin","c":"ACE-I, Antihypertensive","m":"ACEI prevents conversion of angiotensin I to angiotensin II (a vasoconstrictor). It also reduces serum aldosterone, leading to decreased sodium retention, potentiates the vasodilator kallikrein–kinin system, and inhibits the tissue renin-angiotensin system.","i":["HTN","Heart failure with reduced ejection fraction","STEMI and NSTEMI   *Proteinuric chronic kidney disease, diabetic or nondiabetic"],"cn":"*best to avoid potassium salts or supplements unless under supervision *may cause dizziness especially when going from sitting to standing (report if it does)*overall well tolerated","p":"• Do not combine with ARBs or aliskiren • • Risk of hyperkalemia, especially with CKD, K supplements, K-sparing drugs;monitor electrolytes and renal fxn • • Avoid in pregnancy. *dry cough can occur in up to 20% of patients due to inhibition of bradykinin breakdown","lo":"10 mg once daily","ty":"20-40 mg once daily","mx":"80 mg per day"},{"id":85,"w":18,"g":"Valsartan","b":"Diovan","c":"Angiotensin II Receptor Antagonist","m":"A selective, reversible, competitive antagonist of the angiotensin II receptor, which is responsible for the physiologic effects of angiotensin II, including vasoconstriction, aldosterone secretion, sympathetic outflow, and stimulation of renal sodium reabsorption.","i":["HTN","Heart failure","Myocardial infarction"],"cn":"Do not discontinue abruptly. Use potassium supplements or salt substitutes only under medical supervision. This medicine may cause dizziness. Avoid driving, using machinery, or doing anything else that could be dangerous if not alert. Recommend avoiding alcohol and NSAIDs while taking this drug.","p":"ARBs can cause injury or death to the developing fetus when used during 2nd and 3rd trimesters. Therapy should be stopped as soon as possible when pregnancy is detected. In hypertensive patients with chronic kidney disease, either an ACEI or ARB is recommended as first-line therapy to improve kidney outcomes. While ACEIs are recommended as first-line therapy, in patients with heart failure or with ST-elevation AMIs, ARBs are recommended for patients unable to tolerate ACEIs. Commercially available oral solution and tablet formulations are not therapeutically equivalent. A higher dose may be required when converting from oral solution to tablet form. Ongoing recalls due to trace amounts of NDMA, a potential human carcinogen, being found in valsartan products.","lo":"","ty":"","mx":""},{"id":182,"w":18,"g":"Telmisartan","b":"Micardis","c":"Angiotensin II Receptor Antagonist","m":"A nonpeptide AT1 angiotensin II receptor antagonist. Telmisartan binding prevents angiotensin II from binding to the receptor thereby blocking the vasoconstriction and the aldosterone secreting effects of angiotensin II.","i":["HTN","Cardiovascular risk reduction"],"cn":"Do not discontinue abruptly. Use potassium supplements or salt substitutes only under medical supervision. This medicine may cause dizziness. Avoid driving, using machinery, or doing anything else that could be dangerous if not alert. Avoid alcohol and NSAIDs while taking this drug.","p":"ARBs can cause injury or death to the developing fetus when used during 2nd and 3rd trimesters. Therapy should be stopped as soon as possible when pregnancy is detected. In hypertensive patients with chronic kidney disease, either an ACEI or ARB is recommended as first-line therapy to improve kidney outcomes. While ACEIs are recommended as first-line therapy, in patients with heart failure or with ST-elevation AMIs, ARBs are recommended for patients unable to tolerate ACEIs.","lo":"","ty":"","mx":""},{"id":96,"w":18,"g":"Olmesartan","b":"Benicar","c":"Angiotensin II Receptor Antagonist","m":"A selective, reversible, competitive antagonist of the angiotensin II receptor (AT1).","i":["HTN"],"cn":"Avoid pregnancy. Use potassium supplements or salt substitutes only under medical supervision. May cause dizziness that may worsen if dehydrated. Seek care if angioedema, excessive fluid loss, hyperkalemia, reduction in urination, or jaundice occurs. May cause orthostatic hypotension.","p":"Observe patients who are volume depleted for at least 2 h after taking the initial dose and consider a lower starting dose. Titrate dose after 2 wk of treatment.","lo":"","ty":"","mx":""},{"id":202,"w":18,"g":"Ramipril","b":"Altace","c":"ACE-I, Antihypertensive","m":"A competitive ACEI. It is also a prodrug for the more potent ACEI ramiprilat. ACEI prevents conversion of angiotensin I to angiotensin II (a vasoconstrictor). It also reduces serum aldosterone, leading to decreased sodium retention, potentiates the vasodilator kallikrein–kinin system, and inhibits the tissue renin-angiotensin system.","i":["HTN","Heart failure with reduced ejection fraction","STEMI and NSTEMI   *Proteinuric chronic kidney disease, diabetic or nondiabetic"],"cn":"*best to avoid potassium salts or supplements unless under supervision *may cause dizziness especially when going from sitting to standing (report if it does)*overall well tolerated","p":"• Do not combine with ARBs or aliskiren • • Risk of hyperkalemia, especially with CKD, K supplements, K-sparing drugs;monitor electrolytes and renal fxn • • Avoid in pregnancy. *dry cough can occur in up to 20% of patients due to inhibition of bradykinin breakdown","lo":"2.5 mg once daily","ty":"5-10 mg once daily","mx":"20 mg once daily"},{"id":124,"w":18,"g":"Chlorthalidone","b":"Not Used","c":"Thiazide Diuretic","m":"Increases sodium and chloride excretion by interfering with their reabsorption in the cortical-diluting segment of the nephron.","i":["HTN","Edema"],"cn":"Instruct patient to report signs/symptoms of dyspnea, hypotension, gout, or heart failure. Avoid alcohol (may cause hypotension) and NSAIDs (may decrease effectiveness). This medicine may cause dizziness or blurred vision. Avoid driving, using machinery, or doing anything else that could be dangerous if not alert.","p":"often preferred over hctz due to longer half life, more potent. Monitor electrolytes: hyponatremia, hypokalemia, uric acid, calcium","lo":"12.5 mg once daily","ty":"25 mg once daily","mx":"100 mg once daily"},{"id":257,"w":18,"g":"Bisoprolol; hydrochlorothiazide","b":"Ziac","c":"Beta Blocker; Thiazide Diuretic","m":"Bisoprolol: Blocks beta-1 adrenergic receptors; Hydrochlorothiazide: Inhibits sodium reabsorption","i":["Hypertension"],"cn":"- Take the medication as prescribed to control blood pressure. - Rise slowly from sitting or lying down to prevent postural hypotension.","p":"#NAME?","lo":"2.5 mg/6.25 mg once daily","ty":"5 mg/6.25 mg once daily","mx":"10 mg/6.25 mg once daily"},{"id":29,"w":19,"g":"Apixaban","b":"Eliquis","c":"Factor Xa Inhibitor","m":"An orally bioavailable factor Xa inhibitor that selectively blocks the active site of factor Xa and does not require a cofactor (such as antithrombin III) for activity. Activation of factor X to factor Xa via the intrinsic and extrinsic pathways plays a central role in the cascade of blood coagulation.","i":["Atrial fibrillation","Hip or knee replacement surgery (prophylaxis","DVT or PE (treatment and to reduce the future risk)","Heparin-induced thrombocytopenia with thrombosis"],"cn":"Educate patient on signs and symptoms of bleeding and interactions with other anticoagulant or antiplatelet medications, including OTC medications. Emphasize the importance of taking the same time every day and not missing doses.","p":"Dose depends on indication. For patients with afib, lower dose used if 2 of 3 criteria are met: age >80, weight < 60, Scr > 1.5. Patients with CrCl <25 mL/min or SCr >2.5 mg/dL have been excluded from the trials. No regular monitoring of anticoagulation activity required. Fewer drug interactions compared to warfarin, but still requires vigilance","lo":"2.5 mg twice daily","ty":"5 mg twice daily","mx":"10 mg twice daily for 7 days"},{"id":187,"w":19,"g":"Nebivolol","b":"Bystolic","c":"β-Adrenergic Blocker, Cardioselective, B1 Selective","m":"A long-acting cardioselective β1-adrenoceptor antagonist without intrinsic sympathomimetic activities. The mechanism of action of the antihypertensive response of nebivolol is not fully understood. Possible mechanisms include decreased HR, decreased myocardial contractility and vasodilation, and decreased peripheral vascular resistance","i":["HTN"],"cn":"Report signs/symptoms of hypotension, worsening heart failure, or bronchospastic disease. Diabetic patients should carefully monitor blood sugar levels as beta-blockers may mask symptoms of hypoglycemia. Do not discontinue drug abruptly, as this may cause rebound angina or, in some cases, AMI.","p":"Safety and efficacy not established in children. Patients should limit concomitant use of calcium channel blockers, as concomitant use may significantly affect HR or heart rhythm.","lo":"5 mg once daily","ty":"5-10 mg once daily","mx":"40 mg once daily"},{"id":88,"w":19,"g":"Rivaroxaban","b":"Xarelto","c":"Factor Xa Inhibitor","m":"An orally bioavailable factor Xa inhibitor that selectively blocks the active site of factor Xa and does not require a cofactor (such as antithrombin III) for activity. Activation of factor X to factor Xa via the intrinsic and extrinsic pathways plays a central role in the cascade of blood coagulation.","i":["Prevention of thromboembolism after orthopedic surgery","Prevention of thromboembolism in nonvalvular atrial fibrillation","Treatment and prevention of DVT and PE","Coronary and peripheral artery disease"],"cn":"Educate patient on signs and symptoms of bleeding and interactions with other anticoagulant or antiplatelet medications, including OTC medications. Doses ≥15 mg should be taken with food. Emphasize the importance of taking the same time every day and not missing doses.","p":"Dosing depends on indication. Patients with atrial fibrillation use lower dose if CrCl < 50 mL/min. Patients with CrCl <25 mL/min were excluded from trials. No regular monitoring of anticoagulation activity required. Fewer drug interactions compared to warfarin, but still requires vigilance","lo":"10 mg once daily","ty":"15 mg once daily","mx":"15 mg twice daily for 21 days"},{"id":192,"w":19,"g":"Tadalafil","b":"Cialis (erectile dysfunction)\nAdcirca (pulmonary hypertension)","c":"Erectile Dysfunction Agent, Pulmonary HTN Agent","m":"Inhibition of phosphodiesterase type 5 (PDE5) by tadalafil increases the amount of cyclic GMP results in smooth muscle thereby causing vasodilation . Penile erection during sexual stimulation is mediated by the release of nitric oxide (NO) from nerve terminals and endothelial cells, which stimulates the synthesis of cyclic GMP in smooth muscle cells. Cyclic GMP causes smooth muscle relaxation and increased blood flow into the corpus cavernosum and vasodilation in the pulmonary bed.","i":["Erectile dysfunction","Pulmonary HTN"],"cn":"Can take daily or prn. If using prn, take 30 min prior to anticipated sexual activity. Do not take more frequently than once q24h. Seek medical attention if severe skin rash, chest pain, erection lasting >4 h, tinnitus, dizziness, or shortness of breath.","p":"Tadalafil may be preferred over sildenafil in those desiring “full-day coverage.” Sexual stimulation is required to initiate the local release of NO; the inhibition of PDE5 has no effect in the absence of sexual stimulation. Many antidepressant and antihypertensive agents cause erectile dysfunction. Advise patients that lifestyle modifications (stopping smoking, weight loss) can also improve sexual functioning. Adcirca is FDA approved for pulmonary artery HTN and is taken daily.","lo":"ED: 2.5 mg once daily OR 5 mg prn\n\nPAH: 20 mg daily","ty":"ED: 2.5 - 5 mg once daily or 10 mg prn\n\nPAH: 40 mg daily","mx":"ED: 5 mg once daily or 20 mg prn\n\nPAH: 40 mg daily"},{"id":110,"w":19,"g":"Hydralazine","b":"Apresoline","c":"Peripheral Vasodilator","m":"A vasodilator that reduces total peripheral resistance by direct action on vascular smooth muscle, with an effect greater on arterioles than on veins.","i":["HTN","Heart Failure"],"cn":"Patient should not drink alcohol while taking drug. Advise patient against sudden discontinuation of drug as this may cause rebound HTN. This medicine may cause dizziness. Patient should report chest pain, palpitations, signs/symptoms of tachyarrhythmia, hypotension, agranulocytosis, systemic lupus erythematosus, or hepatotoxicity.","p":"Hydralazine is not a first-line therapy for HTN. Hydralazine may cause drug-induced lupus erythematosus (DILE) and has a higher incidence compared to other drugs associated with DILE. Thiazide diuretics, calcium channel blockers, ACEIs, and ARBs are preferred. Hydralazine may be beneficial in patients intolerant of ACEIs or ARBs and when added ACEIs or ARBs in African Americans. Commonly used off-label in conjunction with nitrates in various subgroups of patients with systolic heart failure. Injectable formulation also available.","lo":"","ty":"","mx":""},{"id":220,"w":19,"g":"Labetalol","b":"Normodyne","c":"α/β-Adrenergic Blocker","m":"An adrenergic receptor blocking drug that has selective α1- and nonselective β-adrenergic receptor blocking actions.","i":["HTN"],"cn":"Report signs/symptoms of hypotension with initial dosing and dose changes. Avoid alcohol while taking drug. May cause dizziness. Instruct patient to rise slowly from a sitting/supine position, as labetalol may cause orthostatic hypotension. Report signs/symptoms of bronchospasm, slow HR, hepatotoxicity, or syncope. Advise diabetic patients to carefully follow blood sugar levels as beta-blockers may mask symptoms of hypoglycemia. Advise patients against sudden discontinuation of drug as this may cause rebound HTN.","p":"Safety and efficacy not established in pediatric patients <6 y of age. Is not a first-line agent for managing HTN; ACEIs and ARBs, are preferred for initial management. Injectable formulation also available.","lo":"100 mg twice daily","ty":"200-400 mg twice daily","mx":"2400 mg per day"},{"id":120,"w":19,"g":"Nifedipine","b":"Adalat","c":"DHP Calcium Channel Blocker","m":"A calcium ion influx inhibitor that selectively inhibits the transmembrane influx of calcium ions into cardiac muscle and smooth muscle. Nifedipine does not alter serum calcium concentrations.","i":["HTN","Stable angina","Variant angina","Raynaud phenomenon"],"cn":"Take Adalat CC on an empty stomach. Report signs/symptoms of hypotension, exacerbation of angina, peripheral edema, fatigue, or hypotension. Avoid sudden discontinuation of drug as this may cause rebound HTN. May cause dizziness; avoid driving or using hazardous machinery until effects are known. Avoid grapefruit juice. May see tablet or shell of dosage form in stool.","p":"Titrate doses over 7-14 d. With Adalat CC, two 30 mg tablets may be interchanged for one 60 mg tablet, but using three 30 mg tablets results in 29% higher peak plasma concentrations than a single 90 mg tablet; not considered interchangeable. Immediate release nifedipine has been associated with significant adverse effects including AMI, stroke, and death, and should be avoided. First-line agent for tocolysis in women 32-34 wk gestation.","lo":"","ty":"","mx":""},{"id":267,"w":19,"g":"Enoxaparin","b":"Lovenox","c":"Anticoagulant, Low-Molecular-Weight Heparin","m":"A low-molecular-weight heparin which binds to antithrombin and potentiates its inhibition of factor Xa and factor IIa. Inhibition of factor Xa is greater than that of factor IIa (approximately 2:1).","i":["DVT treatment and prophylaxis","Acute STEMI","Mechanical heart valve bridging","Unstable angina and non-Q-wave AMI"],"cn":"Patients use prefilled syringes to self-inject subcutaneously. Store at room temperature. Can cause bruising at injection site, do not rub injection site after administration. Rotate injection sites. Do not expel air bubble from syringe before injecting. Monitor for signs of thrombosis and bleeding complications.","p":"Preferred anticoagulant in pregnancy. Not routinely monitored but can measure activity using Anti–factor Xa levels if needed. Does not increase INR. Dose adjustments may be required when administered to obese patients or patients with renal insufficiency.","lo":"30 - 40 mg daily (prophylaxis)","ty":"1 mg/kg twice daily\nOR\n1.5 mg/kg daily\n(treatment)","mx":"1 mg/kg twice daily"},{"id":153,"w":19,"g":"Sildenafil","b":"Viagra (erectile dysfunction)\nRevatio (pulmonary HTN)","c":"Erectile Dysfunction Agent, Pulmonary HTN Agent","m":"Inhibition of phosphodiesterase type 5 (PDE5) by sildenafil increases the amount of cyclic guanosine monophosphate (GMP) enhancing erectile function and pulmonary vasculature relaxation. Penile erection during sexual stimulation is mediated by the release of nitric oxide (NO) from nerve terminals and endothelial cells, which stimulates the synthesis of cyclic GMP in smooth muscle cells. Cyclic GMP causes smooth muscle relaxation and increased blood flow into the corpus cavernosum and vasodilation in the pulmonary bed.","i":["Erectile dysfunction","Pulmonary HTN"],"cn":"Take 30 min-4 h prior to anticipated sexual activity, but do not take more frequently than once q24h. Seek medical attention if severe skin rash, chest pain, erection lasting >4 h, tinnitus, dizziness, or shortness of breath.","p":"Tadalafil may be preferred over sildenafil in those desiring “full-day coverage.” Sexual stimulation is required to initiate the local release of NO; the inhibition of PDE5 has no effect in the absence of sexual stimulation. Many antidepressant and antihypertensive agents cause erectile dysfunction. Advise patients that lifestyle modifications (stopping smoking, weight loss) can also improve sexual functioning.Revatio is brand name for PAH indication and is dosed three-times daily. Injectable formulation also available for PAH.","lo":"ED: 25 mg once daily prn\n\nPAH: 20 mg TID","ty":"ED: 50 mg once daily prn\n\nPAH: 20 - 40 mg TID","mx":"ED: 100 mg once daily\n\nPAH: 80 mg TID"},{"id":286,"w":19,"g":"Prasugrel","b":"Effient","c":"Antiplatelet Agent (P2Y12)","m":"An inhibitor of platelet activation and aggregation through the irreversible binding of its active metabolite to the P2Y12 class of ADP receptors on platelets.","i":["Prevention of stent thromboembolism after PCI and","Prevention of thromboembolism in ACS"],"cn":"May be taken with or without food. Tablet may be crushed but should not be split for purposes of dividing doses.","p":"After percutaneous coronary intervention, continue up to 12 mo DES - less if high bleed risk. In patients weighing <60 kg, >75 y/o may consider dose of 5 mg po daily due to increased risk of bleeding. Contraindicated with Hx of stroke or TIA; May be superior to ticagrelor in STEMI; When converting from clopidogrel to prasugrel, initiate prasugrel 10 mg once daily or a 60 mg loading dose followed in 24 h with 10 mg po daily, 24 h after last clopidogrel dose.","lo":"","ty":"","mx":""},{"id":189,"w":20,"g":"Torsemide","b":"Demadex","c":"Loop Diuretic","m":"A loop diuretic that is actively secreted via the nonspecific organic acid transport system into the lumen of the thick ascending limb of Henle’s loop, where it decreases sodium reabsorption by competing for the chloride site on the Na+-K+-2Cl- cotransporter.","i":["Edema related to heart failure, renal failure, hepatic cirrhosis","HTN"],"cn":"Avoid alcohol and NSAIDs. Increased risk of sun-sensitivity; use sunscreen and avoid tanning. Report signs/symptoms of hypotension or decreased urine output; severe skin reactions. Eat high-potassium foods, as directed by HCP. Monitor weights daily.","p":"Furosemide is drug of first choice for volume overload related to heart failure; however, it has somewhat erratic absorption. If inadequate response to furosemide, a trial of torsemide is warranted as it has both better absorption and a longer half-life than furosemide. Loop diuretics are rarely used for management of HTN. A dose of 10-20 mg of torsemide is equivalent to approximately 40 mg of furosemide.","lo":"","ty":"","mx":""},{"id":30,"w":20,"g":"Furosemide","b":"Lasix","c":"Loop Diuretic","m":"A loop diuretic that is actively secreted via the nonspecific organic acid transport system into the lumen of the thick ascending limb of Henle’s loop, where it decreases sodium reabsorption by competing for the chloride site on the Na+-K+-2Cl- cotransporter.","i":["Edema related to heart failure, renal failure","HTN"],"cn":"Avoid alcohol and NSAIDs. Increased risk of sun-sensitivity; use sunscreen and avoid tanning. Avoid activities requiring coordination until drug effects are realized, as drug may cause dizziness, vertigo, or blurred vision. Report signs/symptoms of hypotension, decreased urine output, or ototoxicity; severe skin reactions. Eat high-potassium foods, as directed by health-care professional.","p":"Drug of first choice for edema. 1mg bumetanide to 20mg of torsemide to 40mg furosemide","lo":"","ty":"","mx":""},{"id":190,"w":20,"g":"Enalapril","b":"Vasotec","c":"ACE-I, Antihypertensive","m":"A prodrug that is rapidly converted to its active metabolite, enalaprilat. ACEI prevents conversion of angiotensin I to angiotensin II (a vasoconstrictor). It also reduces serum aldosterone, leading to decreased sodium retention, potentiates the vasodilator kallikrein–kinin system, and inhibits the tissue renin-angiotensin system.","i":["HTN","Heart failure with reduced ejection fraction","STEMI and NSTEMI   *Proteinuric chronic kidney disease, diabetic or nondiabetic"],"cn":"*best to avoid potassium salts or supplements unless under supervision *may cause dizziness especially when going from sitting to standing (report if it does)*overall well tolerated","p":"• Do not combine with ARBs or aliskiren • • Risk of hyperkalemia, especially with CKD, K supplements, K-sparing drugs;monitor electrolytes and renal fxn • • Avoid in pregnancy. *dry cough can occur in up to 20% of patients due to inhibition of bradykinin breakdown","lo":"2.5 mg once daily","ty":"5-20 mg once daily","mx":"40 mg per day"},{"id":35,"w":20,"g":"Empagliflozin","b":"Jardiance","c":"Sodium-Glucose Co-Transporter 2 (SGLT2) Inhibitor","m":"Inhibits SGLT2 in the proximal renal tubules, which reduces reabsorption of filtered glucose and sodium from the tubular lumen; increases urinary excretion of glucose, sodium, and uric acid.","i":["T2DM","Heart failure                         *CKD at risk of progression"],"cn":"Take once daily in the morning without regard to meals. Associated with weight loss and mild diuretic effects. Patients may notice increased frequency of urination. ADRs: Be aware of symptoms of dehydration (dizziness, low BP, decreased urination), and genitourinary infections and report to HCP. Counsel on s/sx of hypoglycemia. Risk of ketoacidosis (rare), provide sick-day counseling and consider d/c with surgery.","p":"First-line option for patients with T2DM and ASCVD, high ASCVD risk, HF or CKD (empagliflozin cardiorenal benefit in MACE, HF, DKD). Has been shown to reduce cardiovascular death and hospitalization in patients with heart failure, regardless of presence of diabetes. Monitor SCr & renal function, use with caution in renal impairment.","lo":"10 mg once daily","ty":"25 mg once daily","mx":"25 mg once daily"},{"id":198,"w":20,"g":"Nitroglycerin","b":"Minitran, Nitro-Dur","c":"Nitrate, Antianginal","m":"Believed to be converted to nitric oxide (NO) by vascular endothelium. NO activates guanylate cyclase, increasing cyclic GMP that in turn decreases intracellular calcium, resulting in direct relaxation of vascular smooth muscle. In myocardial ischemia, nitrates dilate large epicardial vessels, enhance collateral size and flow, and reduce coronary vasoconstriction.","i":["Angina, prophylaxis and acute","Anal fissure"],"cn":"Sit prior to using sublingual tablets, lingual aerosol, or spray. Tablet should be dissolved under tongue or in buccal pouch at first sign of angina; do not swallow or chew tablet. Do not eat or drink after placement of tablets. Spray should be sprayed onto or under tongue; do not inhale; do not spit out or rinse mouth after use. Rise slowly from a sitting position in order to prevent light-headedness. Allow a 10- to 12-h/d drug-free interval to avoid development of nitrate tolerance for both patches and extended-release capsules. Avoid concurrent use of alcohol, CNS depressants, antihypertensives, or other drugs that cause hypotension. Do not use with PDEIs, which may result in hypotension. The ointment may stain clothing. When treating acute angina, instruct patient to call 911 if symptoms are not resolved by the first dose.","p":"Safety and efficacy not established in children. Patch contains aluminum; remove before MRI. Injectable formulation also available. When safe to do so, it can be preferable to dispense in a non–child-proof container as child-proof containers can be difficult to open during severe angina episodes.","lo":"","ty":"","mx":""},{"id":45,"w":20,"g":"Potassium chloride","b":"Klor-Con","c":"Electrolyte, Potassium","m":"Potassium is an electrolyte required for maintenance of the excitatory properties of neuromuscular tissues, and the resting membrane potential of cells is related to potassium concentrations, varying directly with the ratio of intracellular to extracellular potassium level.","i":["Hypokalemia"],"cn":"Take with food. Take the powder, granule, or oral liquid only after mixing in 4 oz of water or juice. Crush or break only specifically designed extended-release formulations. Capsules may be opened, sprinkled on apple sauce, and ingested immediately. Completely dissolve effervescent tablets in liquid and sip slowly over a 5-10 min period.","p":"The total potassium content in a 70-kg male is approximately 3500 mEq. Some drugs (insulin, β-agonists) decrease potassium levels by causing an intracellular shift of potassium. If replacement does not normalize potassium level, check magnesium levels and calcium levels and replace as necessary. 750 mg potassium chloride = elemental potassium 390 mg = potassium 10 mEq = potassium 10 mmol. Injectable formulation also available.","lo":"20 mEq once daily","ty":"40-100 mEq once daily","mx":"100 mEq per day"},{"id":252,"w":20,"g":"Ranolazine","b":"Ranexa","c":"Antianginal Agent","m":"Inhibits the late phase of the inward sodium channel during cardiac repolarization reducing intracellular sodium concentrations and thereby reducing calcium influx via Na+-Ca2+ exchange that in turn reduces ventricular tension and myocardial oxygen consumption.","i":["Chronic coronary artery disease"],"cn":"Do not crush or chew but may be taken with or without meals. There are multiple significant drug interactions so talk to HCP before starting any new medications or herbal supplements. Ranolazine will not stop an acute angina episode.","p":"May be used in combination with beta-blockers or alone in patients who do not respond to or tolerate beta-blockers; used in refractory cases or microvascular disease","lo":"","ty":"","mx":""},{"id":92,"w":20,"g":"Dapagliflozin","b":"Farxiga","c":"Sodium-Glucose Cotransporter 2 (SGLT2) Inhibitor","m":"Inhibits SGLT2 in the proximal renal tubules, which reduces reabsorption of filtered glucose and sodium from the tubular lumen; increases urinary excretion of glucose, sodium, and uric acid.","i":["T2DM","Heart failure                         *CKD at risk of progression"],"cn":"Take once daily in the morning without regard to meals. Associated with weight loss and mild diuretic effects. Patients may notice increased frequency of urination. ADRs: Be aware of symptoms of dehydration (dizziness, low BP, decreased urination), and genitourinary infections and report to HCP. Counsel on s/sx of hypoglycemia. Risk of ketoacidosis (rare), provide sick-day counseling and consider d/c with surgery.","p":"First-line option for patients with T2DM and HF or CKD (dapagliflozin cardiorenal benefits for HF and CKD). Has been shown to reduce cardiovascular death and hospitalization in patients with heart failure, regardless of presence of diabetes. Monitor SCr & renal function, use with caution in renal impairment.","lo":"5 mg once daily","ty":"10 mg once daily","mx":"10 mg once daily"},{"id":260,"w":20,"g":"Candesartan","b":"Atacand","c":"Angiotensin II Receptor Antagonist","m":"A selective, reversible, competitive antagonist of the angiotensin II receptor type 1 (AT1).","i":["Heart failure","HTN","Acute coronary syndrome","Proteinuric chronic kidney disease"],"cn":"Avoid pregnancy and notify physician immediately if become pregnant. Use potassium supplements or salt substitutes only under medical supervision. May cause dizziness that may worsen if dehydrated. Seek care if angioedema, excessive fluid loss, hyperkalemia, reduction in urination, or jaundice occurs.","p":"Not indicated for use in children <1 y of age. Observe volume-depleted patient for hypotension with first dose. Monitor renal function and potassium at baseline and periodically throughout treatment. Also supplied in combination product with HCTZ.","lo":"","ty":"","mx":""},{"id":6,"w":20,"g":"Metoprolol tartrate (ir), metoprolol succinate (er)","b":"Lopressor","c":"β-Adrenergic Blocker, Cardioselective","m":"A cardioselective β-adrenergic blocker used in arrhythmias, HTN, angina pectoris, and heart failure. It is also effective in decreasing post-MI mortality.","i":["Heart failure with reduced ejection fraction","HTN","Angina","AMI","Atrial Fibrillation","Cardiac dysrhythmia"],"cn":"Take on an empty stomach and avoid alcohol. Avoid abrupt discontinuation, exacerbations of angina may occur. Instruct patients to report signs/symptoms of hypotension, heart failure, or exacerbation of angina with initial dosing and dose changes. Advise diabetic patients to carefully follow blood sugar levels as beta-blockers may mask symptoms of hypoglycemia.","p":"Limit concomitant use of diltiazem or verapamil if LVSD or bradycardia. Increase dose weekly when titrating for HTN/angina but every 2 wk for heart failure. Injectable metoprolol is also used for cardioversion in atrial fibrillation patients. Conversion from IV metoprolol to po metoprolol is 2.5 mg po to 1 mg IV. Succinate salt has HF indication","lo":"","ty":"","mx":""},{"id":5,"w":21,"g":"Amlodipine","b":"Norvasc","c":"DHP Calcium Channel Blocker","m":"inhibit the influx of calcium across the cell membrane. Acts on vascular smooth muscle to produce peripheral arterial vasodilation reducing peripheral vascular resistance and blood pressure","i":["HTN","Stable angina","Raynaud phenomenon"],"cn":"Take as prescribed, may cause dizziness(report if it does)","p":"dose related leg edema is a potential AE; preferred in blacks","lo":"2.5 mg once daily","ty":"5-10 mg once daily","mx":"10 mg once daily"},{"id":125,"w":21,"g":"Isosorbide dinitrate","b":"Isordil","c":"Nitrate","m":"Dilates blood vessels, reducing preload and afterload","i":["Angina"],"cn":"- Take the medication as prescribed for the prevention and treatment of angina. - Follow the recommended dosing schedule.","p":"- Isosorbide dinitrate can cause hypotension and headache. - Educate about the risk of tolerance and rebound angina. - Monitor blood pressure and symptoms of angina.","lo":"","ty":"","mx":""},{"id":36,"w":21,"g":"Carvedilol","b":"Coreg","c":"selective α1- and nonselective β-adrenergic blocker","m":"A selective α1- and nonselective β-adrenergic blocker that decreases AV nodal conduction in supraventricular tachycardias and blockade of catecholamine-induced dysrhythmia.","i":["Heart failure with reduced ejection fraction","HTN","Impaired left ventricular function post-MI","Angina pectoris","Cardiac dysrhythmia"],"cn":"Take carvedilol with food or milk. Report signs/symptoms of heart failure, bradyarrhythmias, bronchospasm, hypotension, syncope, or exacerbation of angina with initial dosing and dose changes. Avoid abrupt discontinuation, may cause rebound HTN. Avoid driving, using machinery, or doing anything else that could be dangerous if not alert. Diabetic patients should carefully follow blood sugar levels as beta-blockers may mask symptoms of hypoglycemia.","p":"Safety and efficacy not established in pediatric patients. Reduce dose with bradycardia (<55 beats/min) unless pacemaker present.","lo":"","ty":"","mx":""},{"id":126,"w":21,"g":"Isosorbide mononitrate","b":"Imdur","c":"Long-Acting Nitrate, Antianginal","m":"The active 5-mononitrate metabolite of isosorbide dinitrate. Nitroglycerin and other organic nitrates are converted to NO by vascular endothelium. NO activates guanylate cyclase, increasing cyclic GMP that in turn decreases intracellular calcium, resulting in direct relaxation of vascular smooth muscle.","i":["Angina prophylaxis"],"cn":"It is best to take this medicine on an empty stomach with at least half a glass of water. Swallow the extended-release tablet whole. Do not break, crush, or chew it. This medicine can cause headaches, which is a sign that the medicine is working. Acetaminophen may be used to relieve the headache. Talk with your doctor if the headache is severe. This medicine can cause dizziness. Avoid driving, using machines, or doing anything else that could be dangerous if not alert. Stand up slowly if this medicine causes light-headedness from orthostatic hypotension. Do not stop using this medicine suddenly without asking a health-care provider. The dose may need to be slowly decreased before stopping it completely. Avoid concomitant use of PDEIs as this may increase risk of severe hypotension. Avoid drinking alcohol while taking this drug. Scored tablets may be split. Doses of immediate release formulation should be taken at least 7 h apart.","p":"Safety and efficacy have not established in children. Combining long-acting nitrates with antihypertensive medications can increase risk of hypotension. To avoid tolerance, include an 8-h nitrate-free interval in every 24-h period.","lo":"","ty":"","mx":""},{"id":69,"w":21,"g":"Propranolol","b":"Inderal","c":"β-Adrenergic Blocker, Nonselective","m":"A nonselective β-adrenergic blocker that competitively blocks β1 and β2 receptors, thereby preventing β-adrenergic stimulation. The mechanism of its antihypertensive and antimigraine effects is not completely understood.","i":["Cardiac dysrhythmia","Angina","HTN","Migraine, prophylaxis","Anxiety"],"cn":"Take immediate-release tablets on an empty stomach; ER can be taken with or without food but consistently. Avoid alcohol. Avoid abrupt discontinuation; exacerbations of angina may occur. Report signs/symptoms of hypotension, CHF, or exacerbation of angina with initial dosing and dose changes. This medicine may cause dizziness. Diabetic patients should carefully follow blood glucose as beta-blockers may mask symptoms of hypoglycemia.","p":"When discontinuing propranolol, dosage should be gradually reduced. Avoid in patients with poorly controlled asthma or bronchospasm as beta-blockade may exacerbate symptoms. Consider cardioselective beta-blocker as an alternative.","lo":"","ty":"","mx":""},{"id":193,"w":21,"g":"Sacubitril/valsartan","b":"Entresto","c":"Neprilysin Inhibitor, Angiotensin II Receptor Antagonist","m":"Sacubitril is a prodrug that inhibits neprilysin through the active metabolite LBQ657, leading to increased levels of peptides, including natriuretic peptides. Valsartan is a selective, reversible, competitive antagonist of the angiotensin II receptor, which is responsible for the physiologic effects of angiotensin II, including vasoconstriction, aldosterone secretion, sympathetic outflow, and stimulation of renal sodium reabsorption.","i":["Heart failure with reduced ejection fraction"],"cn":"Do not discontinue abruptly. Use potassium supplements or salt substitutes only under medical supervision. This medicine may cause dizziness. Avoid driving, using machinery, or doing anything else that could be dangerous if not alert. Avoid NSAIDs while taking this drug.","p":"Sacubitril and valsartan are superior to enalapril in reducing all-cause mortality in patients with heart failure. When switching from ACE inhibitor to sacubitril and valsartan, sacubitril and valsartan is started at least 36 h after the last dose of ACE inhibitor.","lo":"","ty":"","mx":""},{"id":75,"w":21,"g":"Atenolol","b":"Tenormin","c":"β-Adrenergic Blocker, Cardioselective","m":"A cardioselective β-adrenergic that decreases AV nodal conduction in supraventricular tachycardias and blockade of catecholamine-induced dysrhythmias.","i":["Angina pectoris","HTN","AMI"],"cn":"Take on an empty stomach. Avoid abrupt discontinuation; exacerbations of angina may occur. Report signs/symptoms of bradycardia, hypotension, heart failure, or exacerbation of angina with initial dosing and dose changes. May cause dizziness or drowsiness. Diabetic patients to carefully follow blood sugar levels as β-blockers may mask symptoms of hypoglycemia. Drug may cause sexual side effects, fatigue, and depression.","p":"Safety and efficacy not established in children. Full effectiveness may not be seen for 1-2 wk. Taper slowly before stopping as sudden discontinuation can cause angina or MI. Atenolol is the only renally eliminated β-blocker.","lo":"","ty":"","mx":""},{"id":211,"w":21,"g":"Bisoprolol","b":"Zebeta","c":"Cardioselective β-Adrenergic Blocke","m":"A cardioselective β-adrenergic blocker that decreases AV nodal conduction in supraventricular tachycardia and blockade of catecholamine-induced dysrhythmias. The antihypertensive mechanism is unknown, but contributing factors are renin blockade and decrease in myocardial contractility and cardiac output.","i":["Hypertension","Atrial fibrillation","HFrEF"],"cn":"Instruct patient to report signs/symptoms of dyspnea, hypotension, or heart failure. May cause dizziness, depression, or sexual dysfunction. Drug may mask signs of low blood sugar. Avoid activities that require alertness during initiation. Rise slowly from a sitting/supine position, as drug may cause orthostatic hypotension. Avoid abrupt discontinuation; may cause rebound hypertension.","p":"Safety in children has not been established.","lo":"","ty":"","mx":""},{"id":106,"w":21,"g":"Diltiazem","b":"Cardizem","c":"Non-DHP Calcium Channel Blocker","m":"A calcium-channel-blocking drug that decreases HR, prolongs AV nodal conduction, and decreases arteriolar and coronary vascular tone. It also has negative inotropic properties.","i":["HTN","Stable angina","Atrial arrhythmia and paroxysmal supraventricular tachycardia","Pulmonary arterial HTN"],"cn":"Report symptomatic hypotension, bradyarrhythmia, peripheral edema, or syncope. This drug is available in multiple brand names with varying properties by brand. Instruct patient to follow administration instructions specific to the prescribed brand with regards to meals and timing. Do not drink alcohol while taking this drug. Some products may be opened and sprinkled on a spoonful of applesauce (applesauce should not be hot, and should be swallowed without chewing, followed by a glass of water). Administer at same time of day, either morning or evening.","p":"Patient should avoid concomitant use of beta-blockers or digoxin during drug therapy, unless otherwise directed by health-care professional. Injectable formulation also available, for IV bolus and infusion in acutely ill patients. When infused >24 h, decreased clearance and increase in adverse effects possible.","lo":"","ty":"","mx":""},{"id":226,"w":21,"g":"Bumetanide","b":"Bumex","c":"Loop Diuretic","m":"Inhibits sodium reabsorption in the kidneys similar to torsemide and furosemide","i":["Edema, hypertension"],"cn":"- Take the medication as prescribed to reduce edema or control blood pressure. - Rise slowly from sitting or lying down to prevent postural hypotension.","p":"- Bumetanide is a potent diuretic and can cause electrolyte imbalances and hypotension. - Monitor renal function, blood pressure, and electrolytes.","lo":"","ty":"","mx":""},{"id":2,"w":22,"g":"Metformin","b":"Glucophage","c":"Biguanide","m":"It is a biguanide antihyperglycemic agent. It does not affect insulin secretion; rather, it reduces hepatic glucose production and enhances glucose utilization by muscle.","i":["T2DM","PCOS"],"cn":"Take with meals to minimize GI effects. N/V, diarrhea are common-- address with slow titration and use of ER formulation. Avoid excessive alcohol use due to increased risk of lactic acidosis. Weight neutral.","p":"Use ER formulation and titrate from low dose to minimize effects.Hold metformin prior to administering iodinated contrast and for 48 h following the procedure. Restart metformin only after kidney function has been reevaluated and is normal. Metformin is one of the first-line therapies for diabetes mellitus type 2. Metformin does not cause hypoglycemia when used as a single agent. Response typically not seen at doses <1500 mg/d. Dose adjustments in renal impairment. Increased risk of lactic acidosis in renal impairment, hepatic impairment, EtOH use, CHF. Can cause B12 deficiency, periodic monitoring recommended.","lo":"500 mg once daily","ty":"500-1000 mg twice daily","mx":"850 mg three times daily (2550 mg per day)"},{"id":102,"w":22,"g":"Insulin aspart","b":"NovoLog","c":"Rapid-Acting Insulin","m":"Facilitates cellular uptake of glucose and promotes glycogen storage","i":["Diabetes mellitus"],"cn":"Administer before meals as directed. Counsel on s/sx of hypoglycemia and appropriate treatment. Rotate injection sites to prevent lipodystrophy. Monitor blood glucose and adjust dosage based on blood glucose monitoring as directed by prescriber.","p":"Typical onset: 15-30 min. Typical duration of action: 3-5 hr. Used for mealtime or prandial insulin, can also be used in insulin pumps. In-use vials & pens can be stored at RT for up to 28 days.","lo":"Individualized","ty":"Individualized","mx":"Individualized"},{"id":31,"w":22,"g":"Insulin glargine","b":"Glargine U-100: Lantus, Basaglar, Semglee (biosimilar product); Glargine U-300: Toujeo","c":"Long-Acting Insulin (U-100), Ultra-Long Acting Insulin (U-300)","m":"Facilitates cellular uptake of glucose and promotes glycogen storage","i":["Diabetes mellitus"],"cn":"Counsel on s/sx of hypoglycemia and appropriate treatment. Rotate injection sites to prevent lipodystrophy. Monitor blood glucose and adjust dosage based on blood glucose monitoring as directed by prescriber.","p":"Typical onset: 3-6 hours. Typical duration of action: U-100 = 20-24 hr, U-300 = 36 hr. Glargine U-300 and degludec U-200 ultra-long acting insulin associated with less hypoglycemia than other basal insulins.","lo":"Individualized","ty":"Individualized","mx":"Individualized"},{"id":123,"w":22,"g":"Sitagliptin","b":"Januvia","c":"Dipeptidyl Peptidase IV Inhibitor (DPP-4i)","m":"A DPP-4 enzyme inhibitor that inhibits the degradation of incretin hormones by DPP-4, and enhances the function of GLP-1 and GIP to slow gastric emptying, increase insulin release in response to oral glucose intake and elevated blood glucose and decrease glucagon levels in the circulation in a glucose-dependent manner.","i":["T2DM"],"cn":"Take with or without food. Generally well tolerated with low risk of hypoglycemia as monotherapy; weight neutral. Can cause nasopharyngitis, HA, GI effects. Rare ADR of joint pain, pancreatitis.","p":"Should not be used in conjunction with GLP-1 RA/GIP RA (shared MOA). May increase risk of hypoglycemia when administered concurrently with insulin or sulfonylureas; avoid use with complex insulin regimens (e.g., basal + prandial). Renal dose adjustment required.","lo":"25 mg once daily","ty":"100 mg once daily","mx":"100 mg once daily"},{"id":43,"w":22,"g":"Glipizide","b":"Glucotrol","c":"Sulfonylurea","m":"Stimulates insulin release from pancreatic beta cells, reduces secretion of glucagon","i":["T2DM"],"cn":"Take with food (with first main meal of the day if taking once daily). Counsel on s/sx of hypoglycemia and appropriate hypoglycemia management; May need to reduce dose or hold doses if not eating. May cause weight gain. Associated with photosensitivity (counsel on sun safety). Rare hypersensitivity reactions.","p":"Glipizide has lowest risk of hypoglycemia vs other sulfonylureas (glipizide < glimepiride < glyburide); may be preferred in renal impairment if sulfonylurea is required; discontinue when more complex insulin regimens begin (e.g., basal + prandial); use caution in older adults. Sulfonylureas lose effectiveness over time.","lo":"2.5 mg once daily","ty":"5-10 mg once daily","mx":"20 mg per day"},{"id":154,"w":22,"g":"Insulin degludec","b":"Tresiba","c":"Ultra long-Acting Insulin","m":"Facilitates cellular uptake of glucose and promotes glycogen storage","i":["Diabetes mellitus"],"cn":"Administer once daily for basal insulin. Counsel on s/sx of hypoglycemia and appropriate treatment. Rotate injection sites to prevent lipodystrophy. Monitor blood glucose and adjust dosage based on blood glucose monitoring as directed by prescriber.","p":"Typical onset: 1 hour. Typical duration of action: 36-42 hr. Glargine U-300 and degludec U-200 ultra-long acting insulins associated with less hypoglycemia than other basal insulins. In-use vials & pens can be stored at RT for up to 56 days.","lo":"Individualized","ty":"Individualized","mx":"Individualized"},{"id":64,"w":22,"g":"Dulaglutide","b":"Trulicity","c":"Glucagon-Like Peptide-1 Receptor Agonist","m":"Analog of glucagon-like peptide-1, which increases glucose-dependent insulin secretion in response to oral glucose intake, decreases inappropriate glucagon secretion, slows gastric emptying, and increases satiety.","i":["T2DM"],"cn":"Inject subcutaneously once weekly into the upper arm, thigh, or abdomen; use a different injection site each week. Administer on the same day each week, without regard to meals or time of day. GI effects are common dose-dependent ADR (N/V, appetite change), dose titration may help reduce this effect. Counsel on weight loss benefit. If a dose is missed and it is <3 days until next scheduled dose, skip dose and resume at next scheduled weekly dose. If multiple weeks are missed, patient may need to re-titrate from starting dose (0.75 mg) to target dose to avoid GI ADRs. Keep refrigerated until first use, may be stored at RT after first use for up to 14 d.","p":"First-line option for those with ASCVD or high ASCVD risk. Demonstrated CV benefit with use of semaglutide, liraglutide, or dulaglutide. BBW for CI in personal or family hx of medullary thyroid carcinoma or multiple endocrine neoplasia syndrome type 2. Low risk of hypoglycemia when used as monotherapy, but may increase risk of hypoglycemia if used with insulin or sulfonylurea. Use caution in patients with GI motility disorders. Monitor renal function.","lo":"0.75 mg once weekly","ty":"1.5-3 mg once weekly","mx":"4.5 mg once weekly"},{"id":200,"w":22,"g":"Liraglutide","b":"Victoza","c":"Glucagon-Like Peptide-1 Receptor Agonist","m":"Analog of glucagon-like peptide-1, which increases glucose-dependent insulin secretion in response to oral glucose intake, decreases inappropriate glucagon secretion, slows gastric emptying, and increases satiety.","i":["T2DM","Chronic weight management (under brand name Saxenda)"],"cn":"Inject subcutaneously once daily without regard to meals. Keep refrigerated until use. Can be stored at RT after first use, discard after 30 d at RT. Common ADR: nausea (up to 20%), rare injection site reactions. Dose must be titrated from 0.6mg starting dose (X 1 week) to target dose; if doses have been missed >3 d in a row then restart at 0.6 mg daily to reduce nausea. Change needle for each injection; do not share pens, even if needle is changed. If also using insulin, administer with separate injection in a nonadjacent area.","p":"First-line option for those with ASCVD or high ASCVD risk. Demonstrated CV benefit with use of semaglutide, liraglutide, or dulaglutide. BBW for CI in personal or family hx of medullary thyroid carcinoma or multiple endocrine neoplasia syndrome type 2. Low risk of hypoglycemia with monotherapy, but may increase risk of hypoglycemia when taking with insulin or sulfonylurea. Use with caution in those with GI motility disorders. Available in combination product with insulin degludec/liraglutide (Xultophy). Monitor renal function. *Note Saxenda has different dosing than T2DM formulations.","lo":"0.6 mg once daily","ty":"1.2-1.8 mg once daily","mx":"1.8 mg once daily"},{"id":84,"w":22,"g":"Insulin lispro","b":"Humalog","c":"Rapid-Acting Insulin","m":"Facilitates cellular uptake of glucose and promotes glycogen storage","i":["Diabetes mellitus"],"cn":"Administer before meals as directed. Counsel on s/sx of hypoglycemia and appropriate treatment. Rotate injection sites to prevent lipodystrophy. Monitor blood glucose and adjust dosage based on blood glucose monitoring as directed by prescriber.","p":"Typical onset: 15-30 min. Typical duration of action: 3-5 hr. Used for mealtime or prandial insulin, can also be used in insulin pumps. In-use vials & pens can be stored at RT for up to 28 days.","lo":"Individualized","ty":"Individualized","mx":"Individualized"},{"id":259,"w":22,"g":"Canagliflozin","b":"Invokana","c":"Antidiabetic Agent, Renal preservation\nSodium-Glucose Cotransporter 2 (SGLT2) Inhibitor","m":"Inhibits SGLT2 in the proximal renal tubules, which reduces reabsorption of filtered glucose from the tubular lumen. Inhibits Na-H exchanger in cardiomyocytes optimizing intracellular Ca and improving autophagy","i":["Diabetes mellitus, type 2 *Renal preservation in HF syndromes"],"cn":"Take before the first meal of the day to help reduce post meal hyperglycemia. Be aware of symptoms of foot ulcers, pain or tenderness or dehydration (dizzy, low BP, decreased urination), and vaginal infections and report to HCP.","p":"Initial therapy for type 2 diabetes is lifestyle modifications and metformin. An SGLT2 can be added to metformin for those with cardiovascular disease and not reaching glycemic control goals. Both dapagliflozin and canagliflozin have cardiovascular benefits; however, increased risk of lower limb amputation is reported with canagliflozin, but not other SGLT2 inhibitors.","lo":"","ty":"","mx":""},{"id":8,"w":23,"g":"Losartan","b":"Cozaar","c":"Angiotensin II Receptor Antagonist","m":"A selective, reversible, competitive antagonist of the angiotensin II receptor (AT1), which is responsible for the physiologic effects of angiotensin II including vasoconstriction, aldosterone secretion, sympathetic outflow, and stimulation of renal sodium reabsorption.","i":["HTN","Diabetic nephropathy","Heart Failure","Cardiovascular event risk reduction","ACS"],"cn":"Avoid pregnancy. Avoid sudden discontinuation; rebound HTN can occur. Use potassium supplements or salt substitutes only under medical supervision. May cause dizziness that may worsen if dehydrated. Seek medical attention if angioedema, excessive fluid loss, hyperkalemia, reduction in urination, or jaundice occurs.","p":"Observe patients who are volume depleted for at least 2 h after taking the initial dose and consider a lower starting dose. Higher doses may be more effective for patients with heart failure with reduced ejection fraction.","lo":"","ty":"","mx":""},{"id":207,"w":23,"g":"Ticagrelor","b":"Brilinta","c":"Antiplatelet Agent (P2Y12)","m":"A reversible and noncompetitive binder of the adenosine diphosphate (ADP) P2Y12 receptor on the platelet surface which prevents ADP-mediated activation platelets.","i":["ACS * stent restenosis","History of AMI"],"cn":"Report signs/symptoms of bleeding, especially if used concomitantly with anticoagulant therapy. Do not stop therapy abruptly without first talking with HCP to minimize the risk of re-thrombosis, particularly after stent placement. Ticagrelor should be discontinued 5 d prior to elective surgery, if an antiplatelet effect is not desired. Avoid OTC NSAIDs. Do not take more than 100 mg/d of aspirin. Report to cardiology if you have any signs of bleeding or shortness of breath or fainting.","p":"All patients presenting with ACS or MI are treated with antiplatelet therapy combining aspirin with a P2Y12 (prasugrel, clopidogrel ticlopidine, ticagrelor, and cangrelor). With the exception of cangrelor, all are orally administered. Can increase endogenous adenosine-monitor for bradycardia, syncope, and SOB; CYP 3A4 inhibitor - monitor for interaction","lo":"","ty":"","mx":""},{"id":42,"w":23,"g":"Clopidogrel","b":"Plavix","c":"Antiplatelet Agent (P2Y12)","m":"An antiplatelet agent that prevents ADP - mediated platelet activation by blocking P2Y12 receptors.This action is irreversible; therefore, platelets exposed to clopidogrel are inhibited for their lifespans.","i":["Acute STEMI and NSTEMI prevention of stent thrombosis; can replace ASA with ASA allergy","Thrombosis prevention"],"cn":"Report signs/symptoms of bleeding, especially if used concomitantly with anticoagulant therapy. Do not stop therapy abruptly without first talking with prescriber to minimize the risk of re-thrombosis, particularly after stent placement.","p":"Clopidogrel should be discontinued 5 d prior to elective surgery, if an antiplatelet effect is not desired. Safety and efficacy not established in pediatric patients. Clopidogrel effectiveness is dependent on its activation to an active metabolite by CYP2C19. In patients who are CYP2C19 poor metabolizers or taking concurrent CYP2C19 inhibitors; requires LD (600mg); Use Ticag or Pras if known poor metabolizer. When transitioning from prasugrel of ticagrelor to clopidogrel in the acute phase, a 600-mg loading dose should be given 24 h after the last dose followed by 75 mg once daily.","lo":"","ty":"","mx":""},{"id":209,"w":23,"g":"Amiodarone","b":"Cordarone","c":"Antiarrhythmic","m":"Class III antiarrhythmic (K channel blocker) that prolongs the effective refractory period of atrial and ventricular tissue.","i":["Secondary prophylaxis of ventricular arrhythmias","Atrial fibrillation, rate control, prophylaxis, & cardioversion","Supraventricular arrhythmia"],"cn":"highly lipophilic so will deposit widely; monitor LFT, Thyroid, PFT (DLCO), Ophthalmic; watch for neurotoxicity; use sunscreen; CYP450 inhibitor so Multiple drug interactions so inform providers about all medications you are taking. Take consistently with regard to meals. Patient medication guide must be dispensed with this medication.","p":"Also available in IV formulation but rarely used; May exacerbate arrhythmias. Very long t1/2 so requires LD. May cause skin to turn bluish-gray in color due to deposition in skin and then photosensitivity reaction; Monitor QTc","lo":"","ty":"","mx":""},{"id":47,"w":23,"g":"Aspirin","b":"Bayer","c":"Nonsteroidal Anti-Inflammatory Drug","m":"Inhibits prostaglandin synthesis","i":["Pain, fever, inflammation"],"cn":"- Take the medication as directed for pain relief or as recommended by a healthcare professional. - Follow the recommended dosage.","p":"- Aspirin has analgesic, antipyretic, and anti-inflammatory properties. - Monitor for signs of gastrointestinal bleeding or adverse effects. - Educate about the risk of Reye's syndrome in children.","lo":"","ty":"","mx":""},{"id":213,"w":23,"g":"Flecainide","b":"Tambocor","c":"Antiarrhythmic","m":"VW Class Ic (Na Channel blocker)-delays automaticity","i":["Atrial Fibrillation"],"cn":"May cause SOB, HA, Nausea; Report new instances of CP, palpitations, fatigue, fluid retention","p":"Flecainide requires monitoring of cardiac function (QRS widening, Aflutter) and may cause proarrhythmia or exacerbation of arrhythmias. -Contraindicated in patients with CAD, HF, structurally deficient hearts.","lo":"","ty":"","mx":""},{"id":59,"w":23,"g":"Pravastatin","b":"Pravachol","c":"HMG-CoA Reductase Inhibitor","m":"HMG-CoA reductase inhibitors competitively inhibit conversion of HMG-CoA to mevalonate, an early rate-limiting step in cholesterol synthesis. A compensatory increase in LDL receptors, which bind and remove circulating LDL-cholesterol, results. Production of LDL-cholesterol decreases because of decreased production of VLDL-cholesterol or increased VLDL removal by LDL receptors.","i":["Hyperlipidemia","Familial hypercholesterolemia","Cerebrovascular accident prevention"],"cn":"Take any time of day","p":"can't get to high intensity dosing","lo":"10 mg once daily","ty":"20-40 mg once daily","mx":"80 mg once daily"},{"id":263,"w":23,"g":"Digoxin","b":"Digitek","c":"Digitalis Glycoside","m":"Digitalis glycosides exert positive inotropic effects through improved availability of calcium to myocardial contractile elements, thereby increasing cardiac output in heart failure. Antiarrhythmic actions are caused primarily by an increase in AV nodal refractory period via increased vagal tone, sympathetic withdrawal, and direct mechanisms.","i":["Atrial fibrillation rate control","Heart failure secondary role","Supraventricular tachyarrhythmia"],"cn":"Take after morning meals (and after evening meals if giving in divided doses). Report signs/symptoms of bradycardia, N/V, confusion. Do not discontinue drug suddenly.","p":"Tablet and solution not interchangeable—PO 70% bioavail compared to IV. Use lower dose in elderly. monitor serum levels to avoid toxicity. Injectable formulation also available, generally for administration of loading doses in acutely ill patients. IV route preferred over IM injection, as injectable form is highly irritating.","lo":"","ty":"","mx":""},{"id":116,"w":23,"g":"Warfarin","b":"Coumadin","c":"Vitamin K Antagonist","m":"Prevents the conversion of vitamin K back to its active form from vitamin K epoxide. This impairs formation of the vitamin K–dependent clotting factors II, VII, IX, and X (prothrombin) and proteins C and S (physiologic anticoagulants).","i":["Atrial fibrillation","DVT and PE treatment and prophylaxis"],"cn":"Educate patient on signs and symptoms of bleeding and how to respond. Numerous drug interactions exist, including OTC medications, check with provider if medications change. Emphasize the importance of taking the same time every day and not missing doses. Educate on keeping a consistent dietary intake of Vitamin K and limiting alcohol intake. Requires regular monitoring of INR.","p":"Generally considered 2nd line anticoagulant after DOACs. Still preferred anticoagulant for patients with mechanical heart valves, rheumatic valvular disease, or antiphospholipid antibodies. Because of slow onset, requires overlap with parenteral anticoagulant for at least 5 days when prescribed to treat a newly diagnosed clot.","lo":"0.5 - 1 mg daily","ty":"2-10 mg once daily","mx":"Individualized, unlikely to exceed 20 mg"},{"id":290,"w":23,"g":"Sotalol","b":"Betapace, Betapace AF","c":"Beta Blocker, Class III Antiarrhythmic","m":"Non-selective beta receptor antagonist (L-isomer); V-W Class III (K channel blocker) antiarrhythmic (D-Isomer)","i":["atrial and ventricular Arrhythmias"],"cn":"Take the medication as prescribed to control heart rhythm. - Report any new or worsening symptoms (palpitations, fainting)","p":"Sotalol requires monitoring of cardiac function (QT prolongation) and may cause proarrhythmia or exacerbation of arrhythmias. Ok with CAD but Contraindicated in HFrEF unless closely monitored by cardiology. Adjust dose with renal insufficiency.","lo":"","ty":"","mx":""},{"id":3,"w":24,"g":"Levothyroxine","b":"Synthroid","c":"Thyroid Supplement","m":"A synthetic thyroid hormone (T4 only, converted to T3 in liver). The endogenous thyroid hormones, T3 and T4, diffuse into the cell nucleus and bind to thyroid receptor proteins attached to DNA. This hormone nuclear receptor complex activates gene transcription and synthesis of messenger RNA and cytoplasmic proteins.","i":["Hypothyroidism","Thyroid stimulating hormone suppression"],"cn":"Dose requires titration to target TSH/symptom management. May require 6-8 wk before symptoms improve, recommend f/u TSH 4-6 weeks after initiation or dose change. Ideally take on an empty stomach, with water 60 min before meal but most important to maintain consistent regimen that encourages adherence. Separate administration w/ dairy, calcium, iron, AlOH by 4 hours. Missed doses should be made up, even if it means double dose on one day.","p":"Encourage consistent use of same branded or generic levothyroxine formulation-- if a patient must switch, recommend f/u TSH in 4-6 weeks after change. Gastric acidity promotes absorption, monitor use of PPIs and H2RAs and check TSH levels 4-6 weeks after starting or stopping PPI or H2RA. Dose requirements typically lower in older patients.","lo":"","ty":"","mx":""},{"id":173,"w":24,"g":"Magnesium salts","b":"Mag-Ox, Slow-Mag, Milk of Magnesia","c":"Mineral Supplement","m":"Magnesium is a cofactor in many enzymatic reactions involving protein synthesis and carbohydrate metabolism. Actions on lipoprotein lipase involved in reducing serum cholesterol and on sodium/potassium ATPase in promoting polarization (eg. Neuromuscular functioning). Also acts as antacid and laxative in GI tract.","i":["Magnesium deficiency, constipation, heartburn"],"cn":"Take the medication as directed. May cause diarrhea.","p":"Magnesium salts are available in various formulations, including tablets, capsules, and solutions. - Monitor Magnesium levels and renal function. Avoid in renal failure as may accumulate.","lo":"250 mg once daily","ty":"400 mg once daily","mx":"400 mg per day"},{"id":49,"w":24,"g":"Ergocalciferol","b":"Vitamin D2, D2","c":"Vitamin D Supplement","m":"Increases intestinal absorption of calcium and promotes bone mineralization","i":["Vitamin D deficiency"],"cn":"- Take the medication as directed for vitamin D supplementation. - Follow the recommended dosage.","p":"- Ergocalciferol is available in various formulations, including capsules or oral solutions. - Monitor vitamin D levels and assess for hypervitaminosis D.","lo":"#N/A","ty":"#N/A","mx":"#N/A"},{"id":194,"w":24,"g":"Calcium","b":"Tums, Caltrate","c":"Calcium Supplement","m":"Calcium source to prevent or reduce bone loss, moderates nerve and muscle performance and allows normal cardiac function. Neutralizes gastric acid in GI tract, binds with dietary phosphate to form insoluble calcium-phosphate salt which is then excreted in the feces to lower phosphate levels.","i":["Calcium deficiency, osteoporosis, antacid, hyperphosphatemia, hypoparathyroidism"],"cn":"Available in different salt forms with varying percent elemental calcium. Calcium carbonate highest elemental calcium at 40%. Take with meals for best absorption of calcium (except citrate does not need acid for absorption). Calcium acetate used as phosphate binder with meals.","p":"Calcium supplementation may interfere with the absorption of certain medications. May cause constipation.","lo":"500 mg once daily","ty":"1000 mg once daily","mx":"2000 mg per day"},{"id":68,"w":24,"g":"Cholecalciferol","b":"Vitamin D3, D3","c":"Vitamin D Supplement","m":"Increases intestinal absorption of calcium and promotes bone mineralization","i":["Vitamin D deficiency"],"cn":"- Take the medication as directed for vitamin D supplementation. - Follow the recommended dosage.","p":"- Cholecalciferol is available in various formulations, including capsules or oral solutions. - Monitor vitamin D levels and assess for hypervitaminosis D.","lo":"400 IU once daily","ty":"1000-2000 IU once daily","mx":"4000 IU once daily"},{"id":210,"w":24,"g":"Liothyronine","b":"Cytomel, Triostat","c":"Thyroid Hormone","m":"Acts as a synthetic form of triiodothyronine (T3)","i":["Hypothyroidism"],"cn":"Administer at same time each day; dosing titrated to target TSH levels and symptom management. Typically taken with T4. Uncommon CV ADRs (arrhythmia)","p":"Faster onset than T4 with better bioavailability; patients may report better symptom control when added to T4. Preferred in myxedema coma. Higher CV risk when compared to T4.","lo":"","ty":"","mx":""},{"id":114,"w":24,"g":"Alendronate","b":"Fosamax","c":"Bisphosphonate","m":"Binds to bone hydroxyapatite and, at the cellular level, inhibits osteoclast activity, thereby inhibiting bone resorption and modulating bone metabolism.","i":["osteoporosis prophylaxis or treatment","Paget's disease"],"cn":"Swallow the non-effervescent tablet whole with a large glass (240 mL) of plain water only. Dissolve 1 effervescent tablet in 120 mL of room temperature plain water only (not mineral water or flavored water); once effervescence stops, wait ≥5 min and stir the solution for ∼10 s and then drink. Remain upright at least 30 min after you swallow the tablet before you eat or drink anything or take any other medicines. This will help your body absorb the medicine. Do not lie down for at least 30 min after taking this medicine, and do not lie down until after you have eaten some food.","p":"Concurrent chemotherapy, radiation therapy, and poor oral hygiene increase the risk of osteonecrosis of the jaw. Atypical fractures of the thigh have been reported in patients taking bisphosphonates for osteoporosis; discontinue therapy in patients who develop evidence of a femoral shaft fracture. For patients at lower risk for fracture, consider drug discontinuation after 3-5 y of use. Adequate calcium and vitamin intake required for efficacy. Men >70 y of age and women >50 y of age should consume 1200 mg of elemental calcium from all sources (dietary + supplements), and all adults >50 y of age should consume 800-1000 units of vitamin D daily with a target serum level of >30 ng/mL.","lo":"5 mg once daily","ty":"10 mg once daily","mx":"40 mg per day"},{"id":231,"w":24,"g":"Calcitriol","b":"Rocaltrol","c":"Vitamin D Analog","m":"Increases intestinal absorption of calcium and promotes bone mineralization","i":["Hypocalcemia, secondary hyperparathyroidism in chronic kidney disease"],"cn":"- Take the medication as directed for calcium and vitamin D supplementation. - Follow the recommended dosage.","p":"- Calcitriol is the active form of vitamin D and requires monitoring of calcium and vitamin D levels. - Monitor for signs of hypercalcemia or hypocalcemia. - Educate about dietary calcium intake and sun exposure.","lo":"0.25 mcg once daily","ty":"0.5 mcg once daily","mx":"2 mcg per day"},{"id":142,"w":24,"g":"Dessicated thyroid","b":"Armour, Nature-Throid","c":"Thyroid Supplement","m":"A naturally derived thyroid replacement containing both levothyroxine (T4) and liothyronine (T3). The endogenous thyroid hormones, T3 and T4, diffuse into the cell nucleus and bind to thyroid receptor proteins attached to DNA. This hormone nuclear receptor complex activates gene transcription and synthesis of messenger RNA and cytoplasmic proteins.","i":["Hypothyroidism"],"cn":"Dose requires titration to target TSH/symptom management. May require 6-8 wk before symptoms improve, recommend f/u TSH 4-6 weeks after initiation or dose change. Ideally take on an empty stomach, with water 60 min before meal but most important to maintain consistent regimen that encourages adherence. Separate administration w/ dairy, calcium, iron, AlOH by 4 hours.","p":"Encourage consistent use of same branded or generic formulation-- if a patient must switch, recommend f/u TSH in 4-6 weeks after change. Contains both T3 and T4, some patients may report better symptom resolution vs T4 alone.","lo":"","ty":"","mx":""},{"id":234,"w":24,"g":"Methimazole","b":"Tapazole","c":"Antithyroid Agent","m":"Inhibits thyroid hormone synthesis and secretion","i":["Hyperthyroidism"],"cn":"Take the medication as prescribed to treat hyperthyroidism. ADRs: rash, GI upset, arthralgias, mild leukopenia. Rare but serious agranulocytosis risk, Monitor with CBC at baseline and if unexplained fever/sore throat or other signs of infection develop.","p":"Results in <50% rate of cure for hyperthyroidism. BBW for hepatotoxicity-- monitor LFTs and s/sx of liver injury (e.g., anorexia, pruritis, RUQ pain). Requires regular monitoring of TSH levels throughout tx.","lo":"","ty":"","mx":""},{"id":109
