min D levels. - Monitor for signs of hypercalcemia or hypocalcemia. - Educate about dietary calcium intake and sun exposure.","lo":"0.25 mcg once daily","ty":"0.5 mcg once daily","mx":"2 mcg per day"},{"id":142,"w":24,"g":"Dessicated thyroid","b":"Armour, Nature-Throid","c":"Thyroid Supplement","m":"A naturally derived thyroid replacement containing both levothyroxine (T4) and liothyronine (T3). The endogenous thyroid hormones, T3 and T4, diffuse into the cell nucleus and bind to thyroid receptor proteins attached to DNA. This hormone nuclear receptor complex activates gene transcription and synthesis of messenger RNA and cytoplasmic proteins.","i":["Hypothyroidism"],"cn":"Dose requires titration to target TSH/symptom management. May require 6-8 wk before symptoms improve, recommend f/u TSH 4-6 weeks after initiation or dose change. Ideally take on an empty stomach, with water 60 min before meal but most important to maintain consistent regimen that encourages adherence. Separate administration w/ dairy, calcium, iron, AlOH by 4 hours.","p":"Encourage consistent use of same branded or generic formulation-- if a patient must switch, recommend f/u TSH in 4-6 weeks after change. Contains both T3 and T4, some patients may report better symptom resolution vs T4 alone.","lo":"","ty":"","mx":""},{"id":234,"w":24,"g":"Methimazole","b":"Tapazole","c":"Antithyroid Agent","m":"Inhibits thyroid hormone synthesis and secretion","i":["Hyperthyroidism"],"cn":"Take the medication as prescribed to treat hyperthyroidism. ADRs: rash, GI upset, arthralgias, mild leukopenia. Rare but serious agranulocytosis risk, Monitor with CBC at baseline and if unexplained fever/sore throat or other signs of infeciton develop.","p":"Results in <50% rate of cure for hyperthyroidism. BBW for hepatotoxicity-- monitor LFTs and s/sx of liver injury (e.g., anorexia, pruritis, RUQ pain). Requires regular monitoring of TSH levels throughout tx.","lo":"","ty":"","mx":""},{"id":109,"w":25,"g":"Triamcinolone topical","b":"Kenalog","c":"Topical Corticosteroid","m":"Has anti-inflammatory, antipruritic, and vasoconstrictive properties. Corticosteroids are thought to act by the induction of phospholipase A2 inhibitory proteins, lipocortins. It is postulated that these proteins control the biosynthesis of potent mediators of inflammation such as prostaglandins and leukotrienes by inhibiting the release of their common precursor, arachidonic acid.","i":["Skin disorders"],"cn":"Apply thin layer to affected area of skin. Skin should be clean and intact at site of application. Wash hands before and after application. Avoid contact with eyes and do not ingest by mouth. Avoid occlusive dressings or tight-fitting clothes over site of administration.","p":"Large number of dosage formulations (foams, gels, shampoos, etc), both by prescription and OTC, are available. Oral and inhaled formulations, administered for systemic action, also available and used for similar indications as other oral corticosteroids. Application to large surface areas, prolonged use, and occlusive dressings increase risk of systemic absorption and toxicity; pediatric patients are more susceptible to systemic absorption. TAC is an error-prone abbreviation; avoid.","lo":"","ty":"","mx":""},{"id":180,"w":25,"g":"Hydrocortisone topical","b":"Westcort","c":"Topical Corticosteroid","m":"Has anti-inflammatory, antipruritic, and vasoconstrictive properties. Corticosteroids are thought to act by the induction of phospholipase A2-inhibitory proteins, lipocortins. It is postulated that these proteins control the biosynthesis of potent mediators of inflammation such as prostaglandins and leukotrienes by inhibiting the release of their common precursor, arachidonic acid. Arachidonic acid is released from membrane phospholipids by phospholipase A2.","i":["Skin disorders"],"cn":"Apply thin layer to affected area of skin. Skin should be clean and intact at site of application. Avoid contact with eyes and do not ingest by mouth. Avoid occlusive dressings or tight-fitting clothes over site of administration. Wash hands after application.","p":"Large number of dosage formulations (foams, gels, shampoos, etc), both by prescription and over the counter, are available. Oral and rectal formulations, administered for systemic action, also available and used for similar indications as other oral corticosteroids (eg, prednisone). Application to large surface areas, prolonged use, and occlusive dressings may increase risk of systemic absorption and toxicity; pediatric patients are more susceptible to systemic absorption.","lo":"","ty":"","mx":""},{"id":130,"w":25,"g":"Clobetasol","b":"Impoyz, Temovate","c":"Topical Corticosteroid","m":"Has anti-inflammatory, antipruritic, and vasoconstrictive properties. Corticosteroids are thought to act by the induction of phospholipase A2-inhibitory proteins, lipocortins. It is postulated that these proteins control the biosynthesis of potent mediators of inflammation such as prostaglandins and leukotrienes by inhibiting the release of their common precursor, arachidonic acid. Arachidonic acid is released from membrane phospholipids by phospholipase A2.","i":["Skin disorders","Plaque psoriasis"],"cn":"Apply thin layer to affected area of skin. Wash hands after administration. Skin should be clean and intact at site of application. Avoid contact with eyes and do not ingest by mouth. Avoid occlusive dressings or tight-fitting clothes over site of administration.","p":"Various dosage forms (foams, gels, shampoos, etc) available. Very high-potency corticosteroid. Application to large surface areas, prolonged use, and occlusive dressings may increase risk of systemic absorption and toxicity. Pediatric patients are more susceptible to systemic absorption.","lo":"","ty":"","mx":""},{"id":221,"w":25,"g":"Nystatin topical","b":"Mycostatin","c":"Polyene Antifungal","m":"Binds to the sterols in fungal cell walls, damaging the fungal cell wall membrane and altering its permeability allowing for leakage of cellular contents.","i":["Candidiasis of skin"],"cn":"Apply to affected area of skin. Skin should be intact. Do not get it in eyes, nose, or mouth. Avoid occlusive dressings, tight-fitting diapers, and plastic pants if using on diaper area of children.","p":"As effective as clotrimazole in treating topical Candida infections. Vaginal tablet for vaginal Candida infections is still available but infrequently used. Miconazole and terconazole are both more effective than nystatin and are available OTC for vaginal candidiasis.","lo":"","ty":"","mx":""},{"id":141,"w":25,"g":"Ketoconazole topical","b":"Nizoral","c":"Imidazole Antifungal","m":"Inhibits biosynthesis of ergosterol or other sterols, damaging the fungal cell wall membrane and altering its permeability.","i":["Candidiasis of skin","Dandruff","Seborrheic dermatitis","Pityriasis","Tinea pedis","Tinea cruris","Tinea corporis"],"cn":"Apply thin layer to affected area of skin. Skin should be intact. Do not get it in your eyes, nose, mouth, or vagina. Do not wash the areas where you applied this medicine for at least 3 h after application. Cosmetics (makeup or sunscreens) may be put on the affected areas 20 min after application. Topical products are alcohol based and flammable immediately after application","p":"Topical products typically not effective in toenail onychomycosis. Resistant infections typically require oral therapy.","lo":"","ty":"","mx":""},{"id":223,"w":25,"g":"Moxifloxacin ophthalmic","b":"Vigamox","c":"Fluoroquinolone Antibiotic","m":"A fluoroquinolone that inhibits bacterial topoisomerase II and IV. It has a broad spectrum of activity, including gram-positive and gram-negative organisms, Chlamydia, and anaerobes. It is effective for respiratory tract infections caused by S. pneumoniae, H. influenzae, and others.","i":["Skin and soft tissue infections","Community-acquired pneumonia","Bacterial sinusitis","Complicated intra-abdominal infections","Acute bacterial exacerbation of chronic bronchitis"],"cn":"Seek medical attention if decreased urination, yellowing of eyes, blistering skin rash or extreme fatigue, unusual bruising or bleeding, shortness of breath or chest pain, tendon pain, muscle weakness, a “pins and needles” tingling or pricking sensation, numbness in the arms or legs, confusion or hallucinations. Complete full course of therapy. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with health-care practitioner. If tendon pain develops, discontinue use and seek medical attention. Patients >65 y of age and on concurrent steroids are at increased risk. You may take this medicine with or without food. Do not take this medicine with milk, yogurt, or other dairy products or calcium-fortified products (some juices and breads). If using antacids, sucralfate, or mineral supplements and multivitamins with calcium, iron, or zinc, take moxifloxacin at least 4 h before or 8 h after these medicines. Wear sunscreen.","p":"Moxifloxacin is not approved for children <18 y of age. Oral and IV dosing is interchangeable. May be used for patients with β-lactam allergy or if initial therapy fails. Due to risk of adverse reactions and availability of alternatives, patients with common infections (acute bacterial sinusitis, acute uncomplicated cystitis, etc) should not receive quinolone therapy.","lo":"","ty":"","mx":""},{"id":151,"w":25,"g":"Clindamycin topical","b":"Cleocin T","c":"Lincosamide Antibiotic","m":"A semisynthetic 7-chloro-7-deoxylincomycin derivative that is active against most gram-positive organisms except enterococci and C. difficile. Gram-negative aerobes are resistant, but most anaerobes are sensitive. It inhibits bacterial protein synthesis by binding to the 50S ribosomal subunit; it is bactericidal or bacteriostatic depending on the concentration, organism, and inoculums","i":["Acne vulgaris","Bacterial vaginosis","Rosacea"],"cn":"Wash and dry face prior to application. Use on skin only, avoid eyes and mucous membranes, avoid cut or broken skin. Shake well before use. Liquid is flammable; avoid smoking while applying or exposure to heat or open flame. For the foam, apply to tissue and use that to apply to face.","p":"May have increased sensitivity to sun; may use sunscreen but wait 1-2 h after applying clindamycin topical solution. Also available as injectable, oral, and vaginal formulations. Due to likelihood of bacterial resistance, topical clindamycin is not recommended as monotherapy; for mild acne, use in conjunction with benzoyl peroxide; for moderate to severe acne, use in conjunction with topical retinoid or systemic antibacterial.","lo":"","ty":"","mx":""},{"id":233,"w":25,"g":"Terbinafine","b":"Lamisil","c":"Antifungal","m":"An allylamine antifungal that inhibits squalene epoxidase, thus inhibiting the biosynthesis of ergosterol, an essential component of fungal cell membrane. This results in fungal cell death primarily due to the increased membrane permeability. Terbinafine has been shown to be active against most clinical infections of Trichophyton mentagrophytes and Trichophyton rubrum.","i":["Cutaneous sporotrichosis","Lymphpcutaneous sporotrichosis","Dermatophyte folliculitis","Tinea corporis, cruris, faciei, pedis, manuum"],"cn":"Instruct patients to report signs/symptoms of rash, infection, or hepatotoxicity. Symptomatic improvement of nail beds may not be seen for several months.","p":"Several topical products containing terbinafine, including both prescription and OTC products, are also available for treatment of skin infections.","lo":"","ty":"","mx":""},{"id":170,"w":25,"g":"Mupirocin","b":"Bactroban","c":"Topical Antibiotic","m":"An antibacterial agent active against a wide range of gram-positive bacteria including methicillin-resistant Staphylococcus aureus. It is also active against certain gram-negative bacteria. Mupirocin inhibits bacterial protein synthesis by reversibly and specifically binding to bacterial isoleucyl transfer-RNA synthetase. Because of this unique mode of action, mupirocin demonstrates no in vitro cross-resistance with other classes of antimicrobial agents.","i":["Impetigo","Secondary skin infections","Eradication of nasal colonization of MRSA"],"cn":"Instruct patients on proper application technique. Avoid drug exposure to open wounds, burns, or eyes.","p":"The area treated may be covered with gauze dressing if desired.","lo":"","ty":"","mx":""},{"id":248,"w":25,"g":"Ketotifen","b":"Alaway, Zaditor","c":"Antihistamine","m":"Blocks histamine receptors and stabilizes mast cells","i":["Allergic conjunctivitis"],"cn":"- Use the medication as prescribed to relieve allergic conjunctivitis symptoms. - Administer eye drops as instructed.","p":"- Ketotifen eye drops may cause temporary blurred vision or stinging upon application. - Avoid contact lens use during treatment. - Monitor for signs of ocular hypersensitivity or allergic reactions.","lo":"","ty":"","mx":""},{"id":27,"w":26,"g":"Fluticasone nasal","b":"Flonase","c":"Intranasal Adrenal Glucocorticosteroid","m":"Has anti-inflammatory, antipruritic, and vasoconstrictive properties. Corticosteroids are thought to act by the induction of phospholipase A2-inhibitory proteins, lipocortins. It is postulated that these proteins control the biosynthesis of potent mediators of inflammation such as prostaglandins and leukotrienes by inhibiting the release of their common precursor, arachidonic acid. Arachidonic acid is released from membrane phospholipids by phospholipase A2.","i":["Allergic rhinitis","Nonallergic rhinitis","Nasal polyps"],"cn":"Advise patients on the proper administration technique for this product. Instruct patients to monitor for signs of toxicity, especially adrenal insufficiency. Inform patient there may a scent associated with this product. Relief and/or adverse effects may not occur for several days after initiation.","p":"Fluticasone nasal inhaler available OTC. Oral inhalation and topical dosage forms of fluticasone also available by prescription for treatment of asthma and other allergic disorders. Intranasal corticosteroids are considered first-line therapy for treatment of allergic rhinitis, as they are effective at treating nasal symptoms with limited systemic absorption and fewer adverse effects than oral corticosteroids or oral antihistamines.","lo":"1 spray in each nostril once daily","ty":"2 sprays in each nostril once daily","mx":"2 sprays in each nostril twice daily"},{"id":159,"w":26,"g":"Levocetirizine","b":"Xyzal","c":"Antihistamine","m":"An enantiomer of cetirizine, a low-sedating, long-acting H1-receptor antagonist that is a metabolite of hydroxyzine. It competitively inhibits the interaction of histamine with H1 receptors, thereby preventing the allergic response.","i":["Seasonal allergic rhinitis"],"cn":"Patients should avoid activities requiring mental alertness or coordination until drug effects are known, as drug may cause dizziness or sedative effects.","p":"An expensive alternative to racemic version (cetirizine) that is available generically and over the counter. Limited evidence suggesting any advantage over racemic compound.","lo":"","ty":"","mx":""},{"id":56,"w":26,"g":"Cetirizine","b":"Zyrtec","c":"Antihistamine","m":"A low-sedating, long-acting H1-receptor antagonist that is a metabolite of hydroxyzine. Cetirizine competitively inhibits the interaction of histamine with H1 receptors, thereby preventing the allergic response.","i":["Perennial or seasonal allergic rhinitis","Urticaria, chronic"],"cn":"Patients should avoid activities requiring mental alertness or coordination until drug effects are known, as drug may cause dizziness or sedative effects.","p":"Product is available in several nonprescription dosage forms. Ophthalmic formulation (Zerviate) available by prescription. May suppress the wheal and flare reaction to skin test antigens.","lo":"","ty":"","mx":""},{"id":241,"w":26,"g":"Mometasone nasal","b":"Nasonex","c":"Intranasal Corticosteroid","m":"Has anti-inflammatory, antipruritic, and vasoconstrictive properties. Corticosteroids are thought to act by the induction of phospholipase A2-inhibitory proteins, lipocortins. It is postulated that these proteins control the biosynthesis of potent mediators of inflammation such as prostaglandins and leukotrienes by inhibiting the release of their common precursor, arachidonic acid. Arachidonic acid is released from membrane phospholipids by phospholipase A2","i":["Rhinosinusitis"],"cn":"Advise patients on the proper administration technique for this product. Nasal spray needs to be primed before using and if not used for 1 wk. Instruct patients to monitor for signs of toxicity, especially adrenal insufficiency.","p":"Oral inhalation and topical dosage forms of mometasone are also available for treatment of other allergic disorders. Also available as a drug-eluting stent implanted during surgery for chronic sinusitis (Propel). • Intranasal corticosteroids are considered first-line therapy for treatment of allergic rhinitis, as they are effective at treating nasal symptoms with limited systemic absorption and fewer adverse effects than oral corticosteroids or oral antihistamines. May begin treatment for seasonal allergic rhinitis 2-4 wk before the expected start of allergy season at the dose approved for the treatment of allergic rhinitis. For nasal polyps, a nasal implant can be placed in ethmoid sinus by a HCP.","lo":"2 sprays in each nostril once daily","ty":"2 sprays in each nostril once daily","mx":"2 sprays in each nostril once daily"},{"id":105,"w":26,"g":"Loratadine","b":"Claritin","c":"Antihistamine","m":"Blocks histamine receptors in the body","i":["Allergic rhinitis, urticaria"],"cn":"- Take the medication as directed for the relief of allergy symptoms. - Avoid driving or operating machinery if drowsiness occurs. - Do not exceed the recommended dosage.","p":"- Loratadine is less sedating compared to other antihistamines. - It has a long duration of action, allowing once-daily dosing. - Monitor for signs of allergic reactions or severe skin reactions.","lo":"","ty":"","mx":""},{"id":255,"w":26,"g":"Atazanavir","b":"Reyataz","c":"Antiretroviral Agent, Protease Inhibitor","m":"Binds to the site of HIV-1 protease activity and inhibits cleavage of viral Gag-Pol polyprotein precursors into individual functional proteins required for infectious HIV. This results in the formation of immature, noninfectious viral particles.","i":["Treatment of HIV-1 infection"],"cn":"Multiple, potentially serious drug interactions; do not take new medications without consulting HCP. Take with food. Do not open, chew, or crush capsule. Does not prevent transmission of HIV; practice safe sex. Do not skip doses. Report cardiac symptoms to physician. Do not take antacids within 2 h of this medication.","p":"Not recommended for infants <3 mo of age. Atazanavir dose varies with concurrent medications, pregnancy, and prior HIV therapy. Always use with 2 other concurrent antiretrovirals and do not discontinue use without consulting a provider.","lo":"","ty":"","mx":""},{"id":108,"w":26,"g":"Triamcinolone nasal","b":"Nasacort","c":"Intranasal Adrenal Glucocorticosteroid","m":"Has anti-inflammatory, antipruritic, and vasoconstrictive properties. Corticosteroids are thought to act by the induction of phospholipase A2 inhibitory proteins, lipocortins, resulting in suppression of the immune system. It is postulated that these proteins control the biosynthesis of potent mediators of inflammation such as prostaglandins and leukotrienes by inhibiting the release of their common precursor, arachidonic acid.","i":["Seasonal allergic rhinitis"],"cn":"Use proper administration technique for this product. Monitor for signs of toxicity, especially adrenal insufficiency, especially growth delay in children.","p":"Injectable, oral inhalation, and topical dosage forms of triamcinolone also available for treatment of other allergic disorders. Intranasal corticosteroids are considered first-line therapy for treatment of allergic rhinitis, as they are effective at treating nasal symptoms with limited systemic absorption and fewer adverse effects than oral corticosteroids or oral antihistamines.Also available OTC.","lo":"1 spray in each nostril once daily","ty":"1-2 sprays in each nostril once daily","mx":"2 sprays in each nostril once daily"},{"id":266,"w":26,"g":"Emtricitabine; tenofovir disoproxil","b":"Truvada","c":"Nucleoside Reverse Transcriptase Inhibitor","m":"Inhibits reverse transcriptase, preventing viral DNA synthesis","i":["HIV infection, pre-exposure prophylaxis"],"cn":"- Take the medication as prescribed for the treatment or prevention of HIV infection. - Use with other antiretroviral agents as part of a combination regimen.","p":"- Emtricitabine-tenofovir is used as part of combination therapy for HIV infection. - Monitor renal function, liver function, and HIV viral load. - Educate about safe sex practices and adherence to therapy.","lo":"","ty":"","mx":""},{"id":143,"w":26,"g":"Azelastine","b":"Astelin","c":"Nasal Antihistamine","m":"A selective H1-receptor antagonist that blocks release of histamine from cells involved in the allergic response. It also inhibits other mediators of allergic reactions (eg, leukotrienes, etc), and reduces chemotaxis and eosinophil activation.","i":["Perennial allergic rhinitis","Seasonal allergic rhinitis","Vasomotor rhinitis"],"cn":"Avoid spraying in eyes. Somnolence has been reported with nasal administration; instruct patient to avoid alcohol use and hazardous activities such as driving or operating machinery until level of sedation is known. Review proper instillation technique, including priming the spray with initial use and if not used for ≥3 d. Blow nose prior to using. Do not spray into wall separating nostrils (septum). May cause taste disturbances that are typically transient and temporary. To prevent contamination, keep tip of nose spray clean.","p":"Also available as ophthalmic product for ocular rhinitis symptoms. Also available in nasal product in combination with fluticasone.","lo":"","ty":"","mx":""},{"id":280,"w":26,"g":"Maraviroc","b":"Selzentry","c":"CCR5 Antagonist, Antiretroviral Agent","m":"Selectively and reversibly binds to the chemokine (C-C motif receptor 5 [CCR5]) coreceptors located on human CD4 cells. CCR5 antagonism prevents interaction between the human CCR5 coreceptor and the gp120 subunit of the viral envelope glycoprotein, thereby inhibiting gp120 conformational change required for CCR5-tropic HIV-1 fusion with the CD4 cell and subsequent cell entry.","i":["Treatment of CCR5-tropic HIV-1 infection"],"cn":"Take with or without food. Do not chew or crush tablet. Does not prevent transmission of HIV, practice safe sex, do not share needles, etc. May cause drowsiness; avoid driving and concurrent CNS depressants.","p":"Not recommended for children <2 y of age or <30 kg. HIV may enter the cell via CCR5, CXCR4, or both receptors (called dual or mixed). Maraviroc is only indicated for HIV strains that only use CCR5 for cell entry. Does not cure HIV. Medication guide required at dispensing. Typically reserved for use as “salvage” therapy with standard treatment regimens have failed due to acquired resistance.","lo":"","ty":"","mx":""},{"id":264,"w":27,"g":"Diphtheria toxoid","b":"Adacel, Boostrix","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of diphtheria"],"cn":"Return to provider for each dose in the series.","p":"Use the same brand of vaccine to complete the entire series, if possible. Some formulations contain thimerosal. Some packaging may contain latex; check product-specific information and screen for allergy.","lo":"","ty":"","mx":""},{"id":277,"w":27,"g":"Influenza virus vaccine","b":"Afluria, Fluad, Flublok, Fluzone, FluLaval, Fluarix","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of influenza infection"],"cn":"Annual seasonal immunization is recommended. Inactivated influenza vaccine does not cause influenza illness. Persons vaccinated with influenza vaccine occasionally experience mild fever or muscle aches. Inform patients these symptoms are not the same as having influenza. If vaccination occurs during influenza season, inform patients protective immunity takes 1-2 wk to develop following vaccine administration; avoid persons with known influenza illness.","p":"Choose the vaccine preparation for appropriate age group. Use current year vaccine only (virus strains and vaccine vary year to year). Not all influenza vaccines are licensed for young children. Intradermal influenza vaccine licensed for adults aged 18-64 y. High-dose influenza vaccine licensed for individuals aged ≥65 y. Flublok is a recombinant influenza vaccine for ages 18-49 y and can be used in egg-allergic individuals. Afluria is not recommended for children <9 y of age due to risk of febrile seizures. Recommended for pregnant females. The CDC recommends against use of live attenuated influenza vaccine intranasal spray (Flumist), citing poor vaccine effectiveness, except in situations where a patient refuses injectable vaccination and would otherwise not be vaccinated at all. Some packaging may contain latex. Check specific product information and screen for allergy. Adults with history of egg allergy that results in hives only can receive any age-appropriate inactivated or recombinant influenza vaccine. Adults with history of egg allergy with symptoms other than hives only (angioedema, respiratory distress, recurrent emesis, or who required emergency medical intervention) should be referred to a setting equipped to recognize and respond to severe allergic reactions for vaccine administration.","lo":"","ty":"","mx":""},{"id":273,"w":27,"g":"Haemophilus influenzae, type b vaccine","b":"Hiberix, PedvaxHIB, ActHIB","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of invasive H. influenzae type b infection"],"cn":"Return to provider for each dose in the series.","p":"Clinicians can exchange among brands of vaccines for the primary series (with the exception of Hiberix). Seroconversion after 1 dose is 75-90%. Onset of action is 1-2 wk and immunity lasts 1.5 y. Some packaging may contain latex; check product-specific information and screen for allergy.","lo":"","ty":"","mx":""},{"id":281,"w":27,"g":"Measles, mumps, rubella vaccine","b":"MMR-II","c":"Vaccine, Live","m":"N/A","i":["Prevention of measles, mumps, rubella infections"],"cn":"Some children may experience mild fever and rash 7-10 d after vaccine administration. Avoid pregnancy for 28 d following vaccine administration.","p":"Individuals born before 1957 can be considered immune. Administer to females found to be seronegative to rubella following completion of pregnancy. If not administered simultaneously, MMR must be separated by at least 4 wk from other live vaccines. Ensure that persons attending colleges, working in health-care facilities, and international travelers are appropriately immunized. Avoid confusion with MMRV, which also contains varicella vaccine. Administer 2nd dose at least 28 d after 1st dose. Vaccine may interfere with tuberculin skin test (TST); delay TST following vaccine administration for at least 28 d. In times of mumps outbreak, 3rd dose may be required.","lo":"","ty":"","mx":""},{"id":274,"w":27,"g":"Hepatitis a vaccine","b":"Havrix, Vaqta","c":"Vaccine, Inactivated","m":"N/A","i":["Hepatitis A prophylaxis","Hepatitis A postexposure prophylaxis"],"cn":"Return to provider for each dose of the series (frequency depending on product initially used).","p":"Not indicated for children <12 mo of age. The vaccines are interchangeable, so 2nd dose can be administered with the other brand of vaccine. Administer 2 wk prior to exposure (travel or international adoption of child). Vaccination recommended for all children ≥12 mo of age, and adults at risk for hepatitis A infection, including homosexual men, IV drug users, patients with chronic liver disease, international travelers, and those in close contact with those from endemic areas (Africa, India, etc). Hepatitis A transmits via oral/fecal route. After vaccination, 94-100% seroconversion within 1 mo. Pediatric and adult formulations of both brands are available; potency and dosage volume differ; the formulations are not interchangeable. Some packaging may contain latex; check product-specific information and screen for allergy.","lo":"","ty":"","mx":""},{"id":282,"w":27,"g":"Meningococcal vaccine","b":"Menactra, Menveo","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of invasive meningococcal disease caused by serotypes A, B, C, Y , W-135"],"cn":"Used to prevent meningitis and other serious infections. In addition to recommended primary vaccination, patients at risk for infection (asplenic, immune compromised) should receive boosters every 5 y; 1st-y college students up through age 21 y living in dormitories should be vaccinated if not vaccinated on or after their 16th birthday. Infants at high risk of invasive infection (asplenia, immune compromised) should be immunized starting at age 2 mo with Menveo.","p":"MenACWY-CRM is used to describe Menveo, while MenACWY-D is used to describe Menactra. MenACWY is used to describe all vaccines in this category. Use caution to avoid confusing products. MenACWY should be used to immunize individuals aged 2 mo (Menveo) or 9 mo (Menactra) up to age 55 y. Use MenACWY for individuals ≥56 y of age who require immunization. Immunized individuals remain at risk for invasive disease caused by N. meningitides serogroup B. Serogroup B meningococcal vaccines (Bexsero and Trumenba) are also available for use in specific subgroups of preteens and teens. Dosing schedule varies during outbreaks (versus routine vaccination).","lo":"","ty":"","mx":""},{"id":275,"w":27,"g":"Hepatitis b vaccine","b":"Engerix-B, Recombivax HB","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of hepatitis B infection"],"cn":"Return to provider for all doses in the series.","p":"The brands of vaccines are considered interchangeable for the series. Recommended for all infants, adolescents, health-care personnel, patients with renal failure, individuals with hepatitis C, residents and staff of psychiatric institutions, household and contacts of individuals with chronic hepatitis B, those with frequent exposure to blood products, international travelers, those at increased risk due to sexual practices, prisoners, and injection drug users. Lifetime immunity achieved in those with initial response. Some packaging may contain latex; check product-specific information and screen for allergy.","lo":"","ty":"","mx":""},{"id":283,"w":27,"g":"Pertussis vaccine","b":"Daptacel, Adacel, Boostrix, Infanrix","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of pertussis"],"cn":"Return to provider for each dose in the series.","p":"Use the same brand of vaccine to complete the entire series, if possible. Adacel not for use in children <11 y of age. Daptacel not for use in children <6 wk or >6 y of age. Use caution to avoid confusing Tdap and DTaP products. Vaccination with DTaP may need to be delayed in children with known or suspected neurologic conditions until the condition is evaluated, treated, and stable. Local reactions may be more frequent after the 4th or 5th dose of the series. Routine vaccination should NOT be delayed because of the COVID-19 pandemic.","lo":"","ty":"","mx":""},{"id":276,"w":27,"g":"Human papillomavirus vaccine","b":"Gardasil, Cervarix","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of human papillomavirus infection"],"cn":"Return to provider for all doses in the series.","p":"Gardasil (protection against 4 subtypes) was discontinued in 2017; everyone now should be vaccinated with Gardasil 9. Syncope is common following vaccine administration. Negative HPV test not required for vaccination; however, individuals already infected with HPV will not be protected by vaccine. Does not treat active HPV infection or other subtypes of HPV not included in vaccine. HPV types 16 and 18 cause 70% of cervical cancers. HPV types 6 and 11 cause 90% of genital warts. Specific dosing recommendations for immunocompromised patients should be followed. Both males and females should be vaccinated—product is indicated for both genders.","lo":"","ty":"","mx":""},{"id":285,"w":27,"g":"Pneumococcal vaccine","b":"Prevnar13, Pneumovax23","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of invasive pneumococcal disease"],"cn":"Monitor for syncope, fever, or anaphylactic hypersensitivity reaction after administration.","p":"May administer antipyretics to reduce fever after vaccine administration.","lo":"","ty":"","mx":""},{"id":13,"w":28,"g":"Pantoprazole","b":"Protonix","c":"Proton Pump Inhibitor (PPI)","m":"Proton pump inhibitors (PPIs) block gastric acid secretion by irreversibly binding to and inhibiting the hydrogen-potassium ATPase pump that resides on the luminal surface of the parietal cell membrane.","i":["GERD","H. pylori GI tract infection","Peptic Ulcers"],"cn":"Take on an empty stomach 1 h before eating. Avoid taking simultaneously with antacids as stomach acid is needed to activate the PPI. Not for immediate relief of heartburn.","p":"More effective than H2-antagonists for relief of heartburn and dyspepsia. Approved for OTC use for up to two weeks. Daily use recommended in patients with severe GERD (Barretts esophagus, strictures, grade C/D esophagitis). For non-severe GERD, taper to lowerest effect dose. May cause rebound hypersecretion with abrupt discontinuation. Intravenous formulation available--preferred for initial treatment of bleeding ulcers.","lo":"20 mg once daily","ty":"40 mg once daily","mx":"80 mg BID"},{"id":191,"w":28,"g":"Polyethylene glycol","b":"Glycolax, Miralax, Colyte","c":"Hyperosmotic Laxative","m":"Polyethylene glycol (PEG) is a hyperosmotic solution that induces laxation by the osmotic effect and also softens stools by pulling water into the bowel. Colyte also contains electrolytes for faster onset for bowel evacuation prior to colonscopy.","i":["Colonoscopy or barium enema preparation","Constipation"],"cn":"If using for bowel evacuation: Shake container vigorously to ensure powder is completely dissolved. Tastes better chilled. This preparation may cause nausea, anal irritation, or vomiting. If severe bloating, abdominal distension, or abdominal pain occurs, slow the consumption of solution, and once symptoms have resolved, may resume administration. Avoid solid foods for 3-4 h before beginning this treatment.","p":"Most PEG is sold as OTC product for routine constipation use. Powder may be put in water, juice, coffee, etc to drink. May be used to treat opioid-induced constipation since causes laxation and softens stool.","lo":"17 g once daily","ty":"17 g once daily","mx":"34 g once daily"},{"id":34,"w":28,"g":"Famotidine","b":"Pepcid","c":"Histamine H2 Antagonist","m":"A competitive inhibitor of histamine H2 receptors. The primary clinically important pharmacologic activity of famotidine is inhibition of gastric secretion. Both the acid concentration and the volume of gastric secretion are suppressed by famotidine.","i":["GERD","Gastric or duodenal ulcer","Indigestion, heartburn"],"cn":"Take at bedtime or before meals/exercise to prevent GERD. May take with antacids. May become less effective with prolonged use, best used as needed.","p":"Famotidine available OTC. Not as effective as PPIs and rarely should be used with a PPI. Injectable dosage form also available; when the IV route is used, treatment should be converted to oral route as soon as possible to avoid cost and risks associated with IV therapy.","lo":"10 mg once daily","ty":"20-40 mg once daily or in two divided doses","mx":"40 mg twice daily"},{"id":225,"w":28,"g":"Sennosides","b":"Senokot","c":"Stimulant Laxative","m":"Increases intestinal motility and stimulates peristalsis","i":["Constipation"],"cn":"- Take the medication as directed for relief of constipation. - Follow the recommended dosage.","p":"- Sennosides are stimulant laxatives and may cause abdominal cramping or electrolyte imbalances. - Educate about proper hydration and lifestyle measures for constipation prevention. - Monitor electrolytes and hydration status.","lo":"8.6 mg once daily","ty":"17.2 mg once daily","mx":"34.4 mg per day"},{"id":145,"w":28,"g":"Adalimumab","b":"Humira","c":"Tumor Necrosis Factor (TNF) Blocker","m":"Binds to TNF, reducing inflammation and immune response","i":["Rheumatoid arthritis","psoriasis","Crohn's disease","ulcerative colitis"],"cn":"Store syringe/pen in refrigerator but allow 15 - 30 minutes at room temperature before injection. Can remain at room temp up to 2 weeks. Walk patient through package instructions for pen and syringe. Inject subcutaneously into anterior thighs or abdomen & rotate injection site. Monitor for signs of infection/injection site reaction and promptly seek medical attention.","p":"Adalimumab is a biologic therapy with immunosuppressive effects and incrases risk of infection & malignancy. Injection site reactions may be a sign of anti-drug antibody formation. Need to assess for latent tuberculosis & latent hepatitis b infection before initiation. Avoid live vaccines during treatment.","lo":"40 mg every other week","ty":"40 mg every other week","mx":"80 - 160 mg \n(induction dose)"},{"id":237,"w":28,"g":"Pancrelipase","b":"Creon, Zenpep, Pancreaze, Ultresa","c":"Pancreatic Enzyme","m":"Supplementation of pancreatic enzymes for digestion of carbohydrates, fats, and proteins","i":["Pancreatic exocrine insufficiency"],"cn":"Take the medication as prescribed with meals or snacks. - Swallow capsules whole; do not crush or chew. - Follow the recommended dosage.","p":"Pancrelipase products may be formulated differently based on lipase content. - Adjust dosage based on clinical response and nutritional requirements. - Monitor for signs of fibrosing colonopathy or allergic reactions.","lo":"5000 units per meal","ty":"10,000-12,000 units per meal","mx":"16,000 units per meal"},{"id":148,"w":28,"g":"Esomeprazole","b":"Nexium","c":"Proton Pump Inhibitor (PPI)","m":"Proton pump inhibitors (PPIs) effectively block gastric acid secretion by irreversibly binding to and inhibiting the hydrogen-potassium ATPase pump that resides on the luminal surface of the parietal cell membrane","i":["GERD","Peptic Ulcers","H. pylori GI tract infection"],"cn":"Take on an empty stomach 1 h before eating. Avoid taking simultaneously with antacids as stomach acid is needed to activate the PPI. Can open capsule and add to water. Not for immediate relief of heartburn.","p":"More effective than H2-antagonists for relief of heartburn and dyspepsia. Approved for OTC use for up to two weeks. Daily use recommended in patients with severe GERD (Barretts esophagus, strictures, grade C/D esophagitis). For non-severe GERD, taper to lowerest effect dose. May cause rebound hypersecretion with abrupt discontinuation. Finite treatment (~8 weeks) for peptic ulcers.","lo":"20 mg once daily","ty":"20-40 mg once daily","mx":"40 mg BID"},{"id":250,"w":28,"g":"Lansoprazole","b":"Prevacid","c":"Proton Pump Inhibitor (PPI)","m":"Proton pump inhibitors (PPIs) block gastric acid secretion by irreversibly binding to and inhibiting the hydrogen-potassium ATPase pump that resides on the luminal surface of the parietal cell membrane.","i":["GERD","Peptic Ulcers","H. pylori GI tract infection"],"cn":"Take on an empty stomach 1 h before eating. Avoid taking simultaneously with antacids as stomach acid is needed to activate the PPI. Not for immediate relief of heartburn. Can open capsule and add to applesauce.","p":"More effective than H2-antagonists for relief of heartburn and dyspepsia. Approved for OTC use for up to two weeks. Daily use recommended in patients with severe GERD (Barretts esophagus, strictures, grade C/D esophagitis). For non-severe GERD, taper to lowerest effect dose. May cause rebound hypersecretion with abrupt discontinuation. Finite treatment (~8 weeks) for peptic ulcers.","lo":"15 mg once daily","ty":"15 - 30 mg once daily","mx":"30 mg BID"},{"id":149,"w":28,"g":"Docusate","b":"Colace","c":"Stool Softener","m":"Promotes water penetration into the stool, making it easier to pass","i":["Constipation"],"cn":"- Take the medication as directed for relief of constipation. - Follow the recommended dosage.","p":"- Docusate is generally well-tolerated but can cause abdominal cramping or diarrhea. - It may interact with other laxatives or medications. - Educate about proper hydration and lifestyle measures for constipation prevention.","lo":"100 mg once daily","ty":"100 mg once daily","mx":"300 mg per day"},{"id":299,"w":28,"g":"Mesalamine","b":"Lialda, Asacol HD, Pentasa, Apriso","c":"Aminosalicylate (5-ASA); anti-inflammatory for IBD","m":"Acts locally on the colonic mucosa to reduce inflammation; the exact mechanism is not fully known but is thought to involve inhibiting cyclooxygenase and lipoxygenase pathways and reducing prostaglandin and leukotriene production.","i":["Ulcerative colitis (induction and maintenance of remission)"],"cn":"Swallow delayed-release tablets whole; do not crush or chew. Take with or without food as directed by the product. Report severe abdominal cramping, bloody diarrhea, fever or rash.","p":"Contains salicylate: use caution with salicylate allergy. Monitor renal function (interstitial nephritis is rare). Differences between brands relate to release site, so products are not interchangeable by dose.","lo":"","ty":"","mx":"","sup":1},{"id":46,"w":29,"g":"Allopurinol","b":"Zyloprim","c":"Xanthine Oxidase Inhibitor","m":"Decreases the production of uric acid by inhibiting the action of xanthine oxidase, the enzyme that converts hypoxanthine to xanthine and xanthine to uric acid.","i":["Gout","Hyperuricemia Tumor Lysis Syndrome","Nephrolithiasis prophylaxis"],"cn":"Counsel on risk of increased frequency of gout flares during early prophylactic treatment and importance of adherence and treating to target serum urate <6 mg/dL for optimal effect. ADRs: GI effects are common (take after meals to lessen gastric irritation), rare but life-threatening hypersensitivity reactions can occur in first 4-6 weeks of tx (flu-like symptoms progressing to SJS, toxic necrosis). Maintain adequate hydration during therapy to prevent kidney stones.","p":"Start with low dose (<100 mg/day) and titrate to target serum urate <6mg/dL. An increase in gout flares is typically seen when initiating urate-lowering therapy and prophylactic therapy (NSAID, colchicine, corticosteroid) at initiation of therapy for 3-6 mo may be beneficial to prevent gout flares. Renal dose adjustments recommended; DDIs with warfarin. Pgx testing for HLA-B*5801 is recommended in patients of SE Asian or African-American descent, monitor serum urate q2-4 weeks after initiation and during titration","lo":"","ty":"","mx":""},{"id":235,"w":29,"g":"Metoclopramide","b":"Reglan","c":"Dopamine Antagonist","m":"Stimulates motility of the upper GI tract without stimulating gastric, biliary, or pancreatic secretions.","i":["GERD","Diabetic gastroparesis"],"cn":"Take this medicine on an empty stomach, 30 min before each meal and at bedtime. Can cause or worsen diarrhea.","p":"Can cause Extrapyramidal symptoms (EPS). Avoid use with other antipyschotics. Avoid in pt's with Parkinson's disease.","lo":"5 mg three times daily","ty":"10 mg three times daily","mx":"15 mg four times daily"},{"id":54,"w":29,"g":"Ondansetron","b":"Zofran","c":"Antiemetic","m":"A selective 5-HT3 receptor antagonist.","i":["Chemotherapy induced nausea and vomiting","Prevention of postoperative nausea and vomiting","Radiation induced nasua and vomiting","Severe hyperemesis associated with pregnancy"],"cn":"ODT: dry hands before handling disintegrating tablet. Do not open the blister pack that contains the tablet until you are ready to take it. Do not push the oral disintegrating tablet ize side effects of anti-folate therapy (e.g. methotrexate)"],"cn":"For folate deficient anemia, symptoms improve within 1 week. May require several weeks for maximum effect. Generally well tolerated. If folate deficient, continue for at least 3 months to replete folate stores after anemia resolves.","p":"To reduce the risk of neural tube defects and other birth defects (imperforate anus, cleft lip), start at least 1 month before conception. Foods that contain folic acid include enriched grain products, dark green leafy vegetables, citrus fruits and juices, and lentils. Heavy ethanol consumption may impair absorption. Available in IV formulation.","lo":"0.4 mg once daily","ty":"0.4 - 1 mg once daily","mx":"5 mg once daily"},{"id":268,"w":29,"g":"Epoetin","b":"Epogen, Procrit","c":"Erythropoietic Stimulating Agent; Hematopoietic Agent","m":"A recombinant human erythropoietin. It binds to the erythropoietin receptor on erythroid progenitor cells, stimulating production/differentiation of mature red cells.","i":["Anemia due to chemotherapy","Anemia due to CKD","Anemia in HIV-infected patients","Perioperative collection of blood for allogeneic infusion"],"cn":"Do not shake, dilute, or expose to light. Store in box in refrigerator, do not freeze. Do not combine remainders from different vials; each vial is single use. May require several weeks for maximum effect.","p":"Typically administered in hospitals and clinics only. In cancer patients with certain tumor types (eg, breast, non-small cell lung, head and neck, lymphoid, cervical), epoetin and darbepoetin shortened overall survival and/or increased the risk of tumor progression or recurrence in some clinical studies. Discontinue after the completion of the chemotherapy course and if no response after 8 wk of therapy. Renal failure patients experienced greater risks of death, stroke, and serious cardiovascular events when administered erythropoiesis-stimulating agent to target Hgb levels of 13 g/dL or higher in clinical studies. Clinical trials have shown that epoetin provides no improvement in quality of life, fatigue, or well-being.","lo":"Individualized","ty":"Individualized","mx":"Individualized"},{"id":131,"w":29,"g":"Methotrexate","b":"Not used","c":"Antimetabolite","m":"Reversibly inhibits dihydrofolate reductase (DHFR). Dihydrofolates are reduced to tetrahydrofolates by DHFR before they are used in DNA synthesis. Methotrexate interferes with DNA synthesis, repair, and cellular replication.","i":["Cancers, Non-Hodgkin lymphoma","Psoriasis","Crohns Disease","Rheumatoid arthritis"],"cn":"Numerous dosing regimens are used; do not confuse daily and weekly dosing strategies. Avoid pregnancy while taking (male and female). Causes nausea and vomiting, which can minimized by using subcutaneous route; Avoid sun exposure. May take with food.","p":"Baseline and regular CBC w/diff, platelet, LFTs, and renal monitoring are mandatory. High-dose methotrexate is used for cancer treatment and requires additional precautions. Fluid overload can resulting in prolonged half-life and toxicity. Avoid use of “MTX” as an error prone abbreviation. To reduce stomatitis when used for rheumatoid arthritis, supplementation with folic acid (1 mg po daily) should be given on days methotrexate is not given.","lo":"7.5 mg once weekly\n(non-cancer indication)","ty":"7.5-25 mg once weekly\n(non-cancer indication)","mx":"25 mg per week\n(non-cancer indication)"},{"id":288,"w":29,"g":"Prochlorperazine","b":"Compazine","c":"Phenothiazine","m":"Dopamine (D2) receptor antagonist","i":["Nausea and vomiting"],"cn":"May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid concurrent use of other CNS depressants.","p":"Use caution in elderly; appear more sensitive to the effects. Blocks Dopamine (D2) receptors in brain; avoid in pt's with Parkinson's disease.","lo":"5 mg three times daily","ty":"10 mg three to four times daily","mx":"40 mg per day"},{"id":228,"w":29,"g":"Dexamethasone"," dy’s immune responses to diverse stimuli, and are used primarily for their anti-inflammatory effects in disorders of many organ systems.","i":["Inflammatory and autoimmune conditions","Allergic Reactions","Asthma/COPD","Adrenocorticoid deficiency"],"cn":"Take with meals to prevent GI upset and in the morning to help prevent insomnia. For high dose or long-term treatment, advise patients to monitor for signs of hyperglycemia, osteoporosis, adrenocortical insufficiency, and infection. Patient may experience insomnia, anxiety, aggression at higher doses.","p":"Only available orally.Prednisone is converted via liver metabolism to the active metabolite, prednisolone. Use the lowest effective dose and discontinue as soon as possible to avoid serious long-term adverse effects. Use with caution in patient with history of diabetes. Longer therapies (~ 2 weeks) need to be tapered to avoid adrenal insufficiency.","lo":"5 mg once daily","ty":"5-60 mg once daily or divided doses","mx":"100 mg once daily or divided doses"},{"id":156,"w":30,"g":"Ciprofloxacin oral","b":"Cipro","c":"Fluoroquinolone Antibiotic","m":"A fluoroquinolone that inhibits bacterial DNA gyrase. It is highly active against aerobic, gram-negative bacilli.","i":["Urinary tract infectious disease","Infection of bone, skin, or soft tissue","Bacterial prostatitis, chronic","Anthrax","Lower respiratory tract infections"],"cn":"Seek medical attention if decreased urination, yellowing of eyes, blistering skin rash or extreme fatigue, unusual bruising or bleeding, shortness of breath or chest pain, tendon pain, muscle weakness, a “pins and needles” tingling or pricking sensation, numbness in the arms or legs, confusion or hallucinations. Take with or without food, but not with milk or other dairy products. Take ciprofloxacin at least 2 h before or 6 h after antacids, sucralfate, or mineral supplements and multivitamins with calcium, iron, or zinc. If using the suspension, shake well before use; suspension may be stored at room temperature","p":"Not approved in children <18 y of age except for anthrax and complicated UTIs. Due to risk of adverse reactions and availability of alternatives, patients with common infections (acute bacterial sinusitis, acute uncomplicated cystitis, etc) should not receive quinolone therapy. Requires medication guide when dispensed. Also available in injectable, otic, and ophthalmic formulations.","lo":"250 mg twice daily","ty":"500 mg twice daily","mx":"750 mg twice daily"},{"id":89,"w":30,"g":"Ferrous sulfate","b":"Feosol","c":"Iron Supplement","m":"Iron is a essential component of hemoglobin. Deficiency leads to inadequate hemoglobin production and microcytic anemia. Iron deficiency can also cause restless leg syndrome. Supplementation corrects the deficiency.","i":["Iron deficiency anemia","Restless leg syndrome"],"cn":"Gastrointestinal upset is common with oral iron (abdominal pain, nausea, constipation). Taking with food or using an extended release product can improve tolerability but will decrease absorption. Taking one dose every other day may improve tolerability. Will often turn stools black.","p":"Acid suppression can decrease iron abosprtion. Vit C may improve absorption for patients with reduced stomach acid. If hemoglobin does not increase by 1 g/dL in one month, patient may have impaired absorption/poor adherence and may require intravenous iron.","lo":"325 mg every other day","ty":"325 mg once daily","mx":"325 mg three times daily"},{"id":166,"w":30,"g":"Cefdinir","b":"Omnicef","c":"Third-Generation Cephalosporin","m":"3rd-generation cephalosporin with activity against a number of gram-positive and gram-negative bacteria including β-lactamase–producing strains.","i":["Acute otitis media","Bronchitis","Community-acquired pneumonia","COPD, acute exacerbation","UTI, including pyelonephritis","Pharyngitis"],"cn":"Complete full course of therapy. For the suspension, shake well and can be stored at room temperature. Note 10 d expiration after reconstitution. Avoid mixing suspension with food or beverages, but food can be taken afterward. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with HCP. Separate administration of antacids, iron, and vitamins by 2 h.","p":"May resume normal activities after 24 h of antibiotics and if afebrile.","lo":"300 mg twice daily","ty":"300 mg twice daily","mx":"600 mg per day"},{"id":104,"w":30,"g":"Cyanocobalamin","b":"Cobalamin","c":"Essential Vitamin B12","m":"B12 is an essential cofactor in DNA synthesis. In deficiency, red blood cell production is impaired, leading to anemia. B12 is also essential to maintainance of the myelin sheath in neurons. Thus, B12 deficiency can also cause neuropathy.","i":["Cobalamin deficiency"],"cn":"Available in many formulations. Oral (immediate-release) or IM route should be used in deficiency, with IM preferred if neuropathy is present. Improves symptoms of B12 deficient anemia within one week. May take several months to see full improvement for B12 deficient neuropathy. Limit alcohol as it inhibits the absorption of B12.","p":"Metformin and acid suppressants decrease B12 concentrations. Heavy ethanol consumption may impair absorption. B12 is found in animal-derived foods. Vegans often require supplementation.","lo":"100 mcg once daily","ty":"1000 - 2000 mcg once daily","mx":"2000 mcg once daily"},{"id":218,"w":30,"g":"Promethazine","b":"Phenergan","c":"Phenothiazine Antihistamine","m":"Anti-muscarinic effect for nausea & vomiting. Competes with histamine (H1) receptors without blocking the secretion of histamine.","i":["Motion sickness","Allergy","Nausea and vomiting"],"cn":"May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol.","p":"Use caution in elderly; appear more sensitive to the anticholinergic adverse effects. May take with food or milk to reduce GI adverse effects. Injectable formulation available, which has a black box warning regarding risk of tissue injury.","lo":"12.5 mg once daily","ty":"25 mg every 4-6 hours as needed","mx":"50 mg every 4-6 hours as needed"},{"id":113,"w":30,"g":"Acetaminophen","b":"Tylenol","c":"Analgesic, Antipyretic","m":"Analgesia by activation of descending serotonergic inhibitory pathways in CNS. Antipyretic action by inhibition of the hypothalamic heat-regulatory center.","i":["Pain, fever, headache"],"cn":"Take the medication as directed for pain or fever relief. - Do not exceed the recommended dosage of 3 g/day. - Avoid concomitant use with other products containing acetaminophen.","p":"Acetaminophen is generally well-tolerated but can cause hepatotoxicity at high doses. - Educate about the potential risk of liver damage. Does not increase bleed risk. Works better scheduled rather than PRN for pain.","lo":"325 mg every 4-6 hours as needed","ty":"500-1000 mg every 4-6 hours as needed","mx":"4000 mg per day"},{"id":219,"w":30,"g":"Levofloxacin","b":"Levaquin","c":"Fluoroquinolone Antibiotic","m":"A fluoroquinolone that inhibits bacterial DNA gyrase, an enzyme responsible for the unwinding of DNA for transcription and subsequent supercoiling of DNA for packaging into chromosomal subunits. It is highly active against aerobic, gram-negative bacilli.","i":["Skin and soft tissue infections","Bacterial sinusitis, acute","Community-acquired pneumonia","Bacterial prostatitis, chronic","Pyleonephritis","Bronchitis"],"cn":"Seek medical attention if decreased urination, yellowing of eyes, blistering skin rash or extreme fatigue, unusual bruising or bleeding, shortness of breath or chest pain, tendon pain, muscle weakness, a “pins and needles” tingling or pricking sensation, numbness in the arms or legs, confusion or hallucinations. Take with or without food, but not with milk, yogurt, or other dairy products or calcium-fortified products (some juices and breads). If using antacids, sucralfate, or mineral supplements and multivitamins with calcium, iron, or zinc, take levofloxacin at least 2 h before or 6 h dase Inhibitor, Antiviral","m":"An inhibitor of influenza virus neuraminidase, which prevents viral progeny detaching from the cellular envelope","i":["Influenza virus types A and B, treatment and prophylaxis"],"cn":"Complete full course of therapy. Symptoms should improve within 2-3 d; if they worsen, seek care. Suspension is available in a 6 mg/mL concentration and is packaged with an oral syringe calibrated in milliliters up to a total of 10 mL. Instructions to the patient should be provided based on these units of measure (ie, mL). When providing oseltamivir suspension for children <1 y of age, use a lower calibrated (ie, <10 mL) oral syringe to ensure accurate dosing. If suspension unavailable, open capsules and compound a 6-mg/mL suspension. Take with food to minimize GI irritation. Take missed dose as soon as possible, if next dose is within 2 h, skip missed dose.","p":"Candidates for prophylaxis include close contacts of a confirmed or suspected case during their infectious period who are at high risk for influenza complications, health-care workers and emergency medical personnel, and pregnant women; treatment must start within 48 h of exposure or onset of symptoms. Capsules may be opened and administered in liquid or via nasogastric tube. Severely ill patients may require longer treatment.","lo":"","ty":"","mx":""}];

function parseStudy(text, defaultDeckName) {
  const out = { deckName: defaultDeckName || 'My notes', deckFrom: '', items: [], errors: [], warnings: [] };
  const raw = String(text || '').replace(/\r\n?/g, '\n').trim();
  if (!raw) { out.errors.push({ line: 0, msg: 'Nothing to add yet. Paste questions in the standard format.' }); return out; }
  let drafts = [];
  if (raw[0] === '[' || raw[0] === '{') {
    try {
      let arr = JSON.parse(raw); if (!Array.isArray(arr)) arr = arr.questions || arr.items || [arr];
      if (!Array.isArray(arr)) throw new Error('not a list');
      arr.forEach((o, i) => drafts.push({ q: o.q || o.question, a: o.a || o.answer, w: (o.w || o.wrong || []).slice(0, 3), e: o.e || o.explanation, d: o.d || o.difficulty, t: o.t || o.topic, s: o.s || o.start || o.from || '', line: i + 1 }));
    } catch (e) { out.errors.push({ line: 1, msg: 'Could not read JSON: ' + e.message }); return out; }
  } else {
    const lines = raw.split('\n'); let b = null, last = null;
    const flush = () => { if (b && (b.q || b.a || b.w.length || b.e)) drafts.push(b); b = null; last = null; };
    const fresh = (n) => ({ q: '', a: '', w: [], e: '', d: '', t: '', s: '', line: n });
    lines.forEach((ln, idx) => {
      const n = idx + 1, s = ln.trim();
      if (!s || /^-{3,}$/.test(s)) { flush(); return; }
      let m = s.match(/^#?\s*deck\s*[:：]\s*(.+)$/i);
      if (m) { out.deckName = m[1].trim().slice(0, 60); return; }
      m = s.match(/^#?\s*(?:start|from|date)\s*[:：]\s*(\d{4}-\d{2}-\d{2})\s*$/i);
      if (m) { out.deckFrom = m[1]; return; }
      if (s[0] === '#') return;
      m = s.match(/^(Q|A|W\d?|E|D|T|S)\s*[:：]\s*(.*)$/i);
      if (m) {
        const k = m[1][0].toUpperCase(), v = m[2].trim();
        if (k === 'Q' && b && b.q && (b.a || b.w.length)) flush();
        if (!b) b = fresh(n);
        if (k === 'Q') { b.q = v; last = 'q'; }
        else if (k === 'A') { b.a = v; last = 'a'; }
        else if (k === 'W') { if (b.w.length >= 3) out.warnings.push({ line: n, msg: 'More than 3 wrong answers; extra ignored.' }); else b.w.push(v); last = 'w'; }
        else if (k === 'E') { b.e = v; last = 'e'; }
        else if (k === 'D') { b.d = v; last = 'd'; }
        else if (k === 'S') { b.s = v; last = 's'; }
        else { b.t = v; last = 't'; }
        return;
      }
      if ((s.indexOf(' | ') > 0 || s.indexOf('\t') > 0) && !b) {
        const p = s.split(s.indexOf('\t') > 0 ? '\t' : ' | ').map(x => x.trim());
        drafts.push({ q: p[0], a: p[1], w: [], e: p[2] || '', d: '', t: '', s: '', line: n }); return;
      }
      if (b && last) {
        if (last === 'w') b.w[b.w.length - 1] += ' ' + s; else b[last] += ' ' + s; return;
      }
      out.errors.push({ line: n, msg: 'Line not recognized (start with Q:, A:, W:, E:, D: or T:, or use "question | answer").' });
    });
    flush();
  }
  const ok = drafts.filter(d => {
    if (!d.q || !d.a) { out.errors.push({ line: d.line, msg: 'Each question needs both a Q: and an A: line.' }); return false; }
    return true;
  });
  ok.forEach(d => {
    d.w = d.w.filter(Boolean);
    const need = 3 - d.w.length;
    if (need > 0) {
      const same = ok.filter(o => o !== d && o.a && o.a.toLowerCase() !== d.a.toLowerCase() && d.t && o.t === d.t).map(o => o.a);
      const any = ok.filter(o => o !== d && o.a && o.a.toLowerCase() !== d.a.toLowerCase()).map(o => o.a);
      const seen = new Set([d.a.toLowerCase()].concat(d.w.map(x => x.toLowerCase())));
      const pool = [];
      same.concat(any).forEach(x => { if (!seen.has(x.toLowerCase())) { seen.add(x.toLowerCase()); pool.push(x); } });
      if (pool.length < need) { d.bad = true; out.errors.push({ line: d.line, msg: 'Needs 3 wrong answers (W:) or at least 4 questions in this paste so wrong answers can be filled in.' }); return; }
      // prefer same-topic answers, then random others
      const pref = pool.slice(0, same.length), rest = pool.slice(same.length);
      for (let i = rest.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      for (let i = pref.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pref[i], pref[j]] = [pref[j], pref[i]]; }
      d.w = d.w.concat(pref.concat(rest).slice(0, need)); d.auto = true;
    }
    const set = new Set([d.a].concat(d.w).map(x => x.toLowerCase()));
    if (set.size !== 4) { d.bad = true; out.errors.push({ line: d.line, msg: 'Answer choices must all be different.' }); }
  });
