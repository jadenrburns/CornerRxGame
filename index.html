c dysentery","C. difficile infection","H. Pylori GI tract infection"],"cn":"Complete full course of therapy. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with health-care practitioner. May be administered with food to minimize stomach upset.","p":"Alternative for mild-moderate C. difficile infection (after vancomycin and fidaxomicin). Injectable and various topical formulations also available.","lo":"250 mg 3 times daily","ty":"500 mg 2-3 times daily","mx":"750 mg three times daily (2250 mg per day)"},{"id":112,"w":2,"g":"Celecoxib","b":"Celebrex","c":"Cyclooxygenase-2 Inhibitor","m":"Inhibition of the COX-2 enzyme isoform is thought to be responsible for the anti-inflammatory effects of NSAIDs.","i":["Osteoarthritis","Rheumatoid arthritis","Ankylosing spondylitis","Acute pain","Acute gout attack"],"cn":"May take with food or milk to decrease GI upset. May open capsule and pour into a teaspoon of applesauce.","p":"Elderly patients are at increased risk of GI ulceration. Patients with underlying cardiac dysfunction are at increased risk for cardiovascular effects. Celecoxib has less risk of GI effects than other NSAIDs, but increased cardiovascular toxicity. May cause significant edema. Use the lowest dose for the shortest period of time to avoid adverse effects.","lo":"100 mg twice daily","ty":"200 mg once daily","mx":"400 mg per day"},{"id":265,"w":2,"g":"Efavirenz","b":"Sustiva","c":"Antiretroviral Agent, Reverse Transcriptase Inhibitor","m":"Binds to HIV reverse transcriptase, blocking the RNA-dependent and DNA-dependent DNA polymerase activities including HIV-1 replication.","i":["Treatment of HIV-1 infection"],"cn":"Multiple, potentially serious drug interactions; do not take new medications, OTCs, or herbals without consulting HCP. Take on an empty stomach at bedtime. Do not open, chew, or crush capsule. Does not prevent transmission of HIV, practice safe sex. May cause drowsiness; avoid driving and concurrent CNS depressants.","p":"Not recommended for children <3 y of age. In children, CYP2B6 genotype testing should be performed prior to initiating therapy to identify extensive and slow metabolizers, and choosing alternative treatment in those cases. Some patients may experience “CNS disengagement.” The drug has a low-resistance ceiling that may limit utility.","lo":"","ty":"","mx":""},{"id":174,"w":2,"g":"Fluconazole","b":"Diflucan","c":"Imidazole Antifungal","m":"Inhibits biosynthesis of ergosterol or other sterols, damaging the fungal cell wall membrane and altering its permeability.","i":["Candidal vulvovaginitis","Cryptococcal meningitis","Oropharyngeal candidiasis","Tinea"],"cn":"Many medications, including OTC medications, interact with fluconazole. Do not take any new medications without consulting your doctor or pharmacist. If taking a weekly dose, take on same day and time each week.","p":"Injectable formulation also available. Oral and injectable doses are interchangeable. Amphotericin is more effective than fluconazole in treating serious fungal infections; fluconazole is typically used as adjunctive therapy or maintenance therapy. In vaginal candidiasis, single-dose fluconazole is at least as effective as a 5-d course of oral ketoconazole or a 3-d course of intravaginal clotrimazole. Potential risk of miscarriage with oral fluconazole used to treat yeast infections in pregnant women; use only topical antifungals recommended in CDC guidelines.","lo":"","ty":"","mx":""},{"id":300,"w":2,"g":"Nirmatrelvir/ritonavir","b":"Paxlovid","c":"SARS-CoV-2 3CL protease inhibitor (nirmatrelvir) boosted by a CYP3A4 inhibitor (ritonavir)","m":"Nirmatrelvir inhibits the SARS-CoV-2 main protease (3CL protease), blocking viral polyprotein cleavage and replication. Ritonavir inhibits CYP3A4 to raise nirmatrelvir levels.","i":["Mild-to-moderate COVID-19 in adults at high risk of progression to severe disease"],"cn":"Start within 5 days of symptom onset. Take 2 nirmatrelvir tablets plus 1 ritonavir tablet together twice daily for 5 days, with or without food. Finish the full course. Review every medicine, supplement and herbal product first.","p":"Major drug interactions (strong CYP3A4 inhibition by ritonavir): many drugs must be held or adjusted, including some statins, anticoagulants, antiarrhythmics and sedatives. Renal dose adjustment is required; not recommended in severe renal or hepatic impairment.","lo":"","ty":"","mx":"","sup":1},{"id":122,"w":3,"g":"Benzonatate","b":"Tessalon","c":"Antitussive","m":"Acts peripherally by anesthetizing the stretch receptors located in the respiratory passages, lungs, and pleura by dampening their activity and thereby reducing the cough reflex at its source.","i":["Cough"],"cn":"Do not chew or crush capsules or allow capsules to dissolve in mouth as oropharyngeal anesthesia will occur, plus the liquid in the capsule has an incredibly foul taste. Administer with food or milk if GI upset occurs. Accidental ingestion of as few as 1-2 capsules by children <2 y of age has been fatal. The drug appearance (round, clear liquid-filled capsules) may be attractive to children, so particular care should be taken to keep out of reach.","p":"Very little pharmacologic or pharmacokinetic data exist for this product. Do not spill the bottle—will take you hours to track down capsules that are spilled.","lo":"","ty":"","mx":""},{"id":269,"w":3,"g":"Erenumab","b":"Aimovig","c":"Calcitonin Gene-Related Peptide (CGRP) Inhibitor","m":"Binds to CGRP receptor, preventing CGRP-mediated vasodilation","i":["Migraine prevention"],"cn":"- Take the medication as prescribed to reduce the frequency and severity of migraines. - Injection sites can be rotated between the thighs, abdomen, or upper arms.","p":"- Erenumab is administered via subcutaneous injection once a month. - It may take several weeks to experience the full effects of the medication. - Monitor for adverse reactions, including hypersensitivity or constipation.","lo":"","ty":"","mx":""},{"id":132,"w":3,"g":"Hydroxychloroquine","b":"Plaquenil","c":"Aminoquinoline","m":"The mechanism of action is unknown. Malaria tx: It is effective in treating P. vivax, P. malariae, and susceptible strains of P. falciparum.","i":["Lupus erythematosus, rheumatoid arthritis, malaria"],"cn":"If taking weekly, take on same day each week. Take with food or milk. Do not crush.Do not take antacids within 4 hours. May cause photosensitivity - counsel on sun safety. Do not stop abruptly.","p":"The onset of action of hydroxychloroquine for rheumatoid arthritis is up to 6 wk. Monitor CBC (with differential), liver function, and renal function at baseline and periodically during therapy. Risk of retinopathy associated with long-term treatment, recommend eye exam at baseline and annually after 5 years of use.","lo":"","ty":"","mx":""},{"id":289,"w":3,"g":"Raltegravir","b":"Isentress","c":"Antiretroviral Agent, Integrase Inhibitor","m":"Inhibits the catalytic activity of HIV-1 integrase, thus preventing integration of the viral DNA into the host strand.","i":["Treatment of HIV-1 infection"],"cn":"Take with or without food. May chew or crush the chewable tablet. For the oral suspension, add contents of foil pack (100 mg) to 10 mL water and swirl for 45 s; do not shake. Use oral syringe to obtain correct dose. Administer within 30 min. Does not prevent transmission of HIV; practice safe sex.","p":"Not recommended for children <2 y of age. Recommended as a first-line therapy with tenofovir/emtricitabine in antiretroviral naïve patients. Chewable tablet and oral suspension have higher bioavailability than oral tablet; do not interchange these products.","lo":"","ty":"","mx":""},{"id":242,"w":3,"g":"Phenazopyridine","b":"Pyridium","c":"Urinary Tract Analgesic","m":"Excreted in the urine where it exerts a topical analgesic effect on the mucosa of the urinary tract. This action helps relieve pain, burning, urgency, and frequency. The precise mechanism of action is not known.","i":["Dysuria"],"cn":"Drug may discolor urine and sclera to red or orange, causing staining of undergarments and contact lenses. Take drug with food to minimize gastric irritation.","p":"When used in the treatment of a UTI, phenazopyridine should not exceed 2 d because there is a lack of evidence that the combined administration of phenazopyridine and an antibacterial provides greater benefit than administration of the antibacterial alone after 2 d. Many OTC products containing phenazopyridine are also available.","lo":"100 mg three times daily","ty":"200 mg three times daily","mx":"600 mg per day"},{"id":293,"w":3,"g":"Tetanus toxoid","b":"Decavac","c":"Vaccine, Inactivated","m":"N/A","i":["Prevention of tetanus"],"cn":"Return to provider for each dose in the series.","p":"Use the same brand of vaccine to complete the entire series, if possible. After childhood immunization, adults should substitute a 1-time dose of Tdap for Td booster then boost with Td (tetanus with diphtheria) vaccination every 10 y. Pregnant women should receive 1 dose of Tdap vaccine during each pregnancy, preferred during 27-36 wk gestation regardless of interval of last Td or Tdap vaccine. Individuals with wounds requiring medical attention should be vaccinated with Td if vaccination status is inadequate or unknown, or if >5 y since last vaccination. Some packaging may contain latex; check product specific information and screen for allergy. Routine vaccination should NOT be delayed because of the COVID-19 pandemic.","lo":"","ty":"","mx":""},{"id":244,"w":3,"g":"Cefuroxime","b":"Ceftin","c":"Second-Generation Cephalosporin","m":"2nd-generation cephalosporin whose activity is better than cefazolin but less than cefotaxime, against H. influenzae, including β-lactamase–producing strains. The activity of cefuroxime against S. aureus is slightly less than that of cefazolin. Its activity against anaerobes is poor.","i":["Acute otitis media","Pharyngitis","Community-acquired pneumonia","COPD, acute exacerbation","Uncomplicated UTI","Gonorrhea","Bronchitis"],"cn":"Seek medical attention if rash develops. Complete full course of therapy. For the suspension, shake well and store in the refrigerator. Note 10 d expiration after reconstitution. Avoid mixing suspension with food or beverages, but food can be taken afterward. Symptoms should improve within 2-3 d; if they worsen, seek follow-up with health-care practitioner.","p":"May resume normal activities after 24 h of antibiotics if afebrile. Suspension formulation discontinued by brand-name manufacturer and no generic suspension available for over 2 years. Also available in injectable formulation.","lo":"250 mg twice daily","ty":"250-500 mg twice daily","mx":"500 mg twice daily (1000 mg per day)"},{"id":297,"w":3,"g":"Varicella vaccine","b":"Varivax","c":"Vaccine, Live","m":"N/A","i":["prevention of varicella infection"],"cn":"Some children may experience mild fever and rash 7-10 d after vaccine administration. Female patients of child bearing age should avoid pregnancy for 1-3 mo following vaccination.","p":"Varicella vaccine contains the same virus as zoster vaccine, but the doses are dramatically different and are not interchangeable. Indicators of varicella immunity include birth in the United States before 1980, physician-documented history of disease, laboratory evidence of immunity, or 2 doses of varicella vaccine after 12 mo of age. Individuals born in the United States before 1980 can be considered immune to varicella unless health-care worker or immunocompromised. Transmission of the vaccine virus to susceptible individuals without serious lasting consequences has been documented. If not administered simultaneously, varicella vaccine must be separated by at least 4 wk from other live vaccines. Febrile seizure is more common with the combination measles-mumps-rubella-varicella vaccine compared to MMR and varicella vaccines given as separate injections. Pregnant women exposed to varicella should not receive vaccine; instead, they should receive varicella zoster immune globulin. History of contact dermatitis reaction to neomycin is not a contraindication to vaccine.","lo":"","ty":"","mx":""},{"id":245,"w":3,"g":"Ciprofloxacin otic","b":"Cetraxal","c":"Fluoroquinolone\nAntibiotic","m":"A fluoroquinolone that inhibits bacterial DNA gyrase. It is highly active against aerobic, gram-negative bacilli.","i":["Otitis externa, acute","Otitis media"],"cn":"Warm solution by holding container in hands for at least 1 min before administering. Patient should lie with affected ear upward; position should be maintained for at least 1 min after instillation; repeat in the opposite ear if necessary","p":"Ciprofloxacin otic is not approved in children <1 y of age. Not for ophthalmologic use, otic use only. Also available as injectable, ophthalmic, and oral formulations. Intratympanic product for use only during tympanostomy tube placement. Available in otic formulation in combination with hydrocortisone (Cipro HC).","lo":"","ty":"","mx":""},{"id":298,"w":3,"g":"Zoster vaccine","b":"Zostavax, Shingrix","c":"Vaccine, Live, Viral (Zostavax); Vaccine Recombinant (Shingrix)","m":"N/A","i":["Prevention of herpes zoster"],"cn":"About 1 in 3 individuals develops a rash at the injection site, which resolves after a few days with no treatment. The zoster vaccine is not 100% effective in preventing zoster. However, the disease and its consequences are less severe in immunized individuals who develop zoster.","p":"Vaccine efficacy is higher in persons 60-69 y of age and declines with increasing age. A history of chicken pox need not be obtained prior to zoster vaccine administration as birth before 1980 is considered evidence of varicella immunity. Vaccine is approved by the FDA for persons ≥50 y of age; the ACIP does not recommend vaccination until 60 y of age due to insufficient evidence regarding duration of vaccine protection against herpes zoster. Single dose recommended for all adults aged ≥60 y without regard to history of shingles; zoster vaccine may be administered to individuals on inhaled, topical, or intra-articular steroids or low-dose oral steroids; treated with low-dose methotrexate (<0.4 mg/kg/wk) or 6-mercaptopurine (<1.5 mg/kg/d), anticipating immunosuppressive therapy if vaccine can be administered at least 14 d prior or on antiviral therapy if it is stopped 1 d prior to vaccine administration and held for 14 d. Zoster vaccine can be administered to individuals with HIV if no manifestations of AIDS and CD4 count >200/mm3. History of contact dermatitis reaction due to neomycin is not a contraindication to vaccine. Recombinant vaccine preferred over live in immunocompetent individuals. Zoster vaccine live is not a substitute for varicella vaccine and should not be administered to children or adolescents.","lo":"","ty":"","mx":""},{"id":107,"w":4,"g":"Sumatriptan","b":"Imitrex","c":"Serotonin Receptor Agonist","m":"Binds with high affinity to serotonin (5-HT) subtypes 1B, 1D, and 1F receptors. It has no significant affinity or pharmacologic activity at adrenergic α1, α2, or β; dopaminergic D1 or D2; muscarinic; or opioid receptors. Serotonin receptor agonists are believed to be effective in migraine either through vasoconstriction (via activation of 5-HT1 receptors located on intracranial blood vessels) or through activation of 5-HT1 receptors on sensory nerve endings in the trigeminal system resulting in the inhibition of proinflammatory neuropeptide release.","i":["Migraine","Headaches"],"cn":"Avoid activities requiring mental alertness or coordination until drug effects are realized, as this drug may cause dizziness or somnolence.","p":"Sumatriptan is also available in formulations for injectable administration, and as an oral dosage form in combination with naproxen. These agents are not for prophylaxis; only for the treatment of acute migraine headache. Several serotonin agonists (“triptans”) exist for migraine, administered via a variety of routes (oral, inhaled, and injected). Each differs in onset and duration of action. If 1 agent is ineffective at max dose, recommend changing agents or route.","lo":"","ty":"","mx":""},{"id":205,"w":4,"g":"Mirabegron","b":"Myrbetriq","c":"Beta-3 Agonist","m":"Activates β3-adrenergic receptors resulting in relaxation of the detrusor smooth muscle and increasing bladder capacity.","i":["Overactive bladder"],"cn":"Monitor BP and HR and contact HCP for fast heartbeat or elevations in BP, bladder irritation or difficulty with urination.","p":"Life-style changes, including avoiding fluids at bedtime and reducing consumption of mild diuretics like caffeine and alcohol is first line therapy for managing bladder symptoms. Many patients also benefit from pelvic floor training. Initial pharmacologic therapy includes alpha adrenergic agents and 5 alpha-reductase inhibitors in men. Anticholinergics (tolterodine, oxybutynin, darifenacin, solifenacin, fesoterodine, and trospium) are also commonly used, effective, and inexpensive options. Mirabegron has less dry mouth.","lo":"25 mg once daily","ty":"50 mg once daily","mx":"50 mg once daily"},{"id":115,"w":4,"g":"Oxybutynin","b":"Ditropan","c":"Urinary Antispasmodic","m":"Oxybutynin is a competitive muscarinic receptor antagonist. Muscarinic receptors play an important role in several major cholinergically mediated functions, including contractions of the urinary bladder smooth muscle and stimulation of salivary secretion","i":["Overactive or neurogenic bladder"],"cn":"This drug may cause anticholinergic effects, including constipation, urinary retention, blurred vision, dyspepsia, or xerostomia. Heat prostration (due to decreased sweating) can occur when used in a hot environment.","p":"Patients should be advised to exercise caution in decisions to engage in potentially dangerous activities until the drug’s effects have been determined. May note decline in cognitive function, especially in elderly. The transdermal patch is available OTC","lo":"5 mg once daily","ty":"5-10 mg twice daily","mx":"5 mg three times daily"},{"id":227,"w":4,"g":"Solifenacin","b":"Vesicare","c":"Urinary Antispasmodic; Anticholinergic Agent","m":"A competitive muscarinic receptor antagonist. Muscarinic receptors play an important role in several major cholinergically mediated functions, including contractions of the urinary bladder smooth muscle and stimulation of salivary secretion.","i":["Overactive bladder"],"cn":"This drug may cause anticholinergic effects, including constipation, urinary retention, blurred vision, dyspepsia, or xerostomia. Heat prostration (due to decreased sweating) can occur when used in a hot environment and/or exercise.","p":"Patients should be advised to exercise caution in driving or other tasks that require alertness until the drug’s effects have been determined. May cause decline in cognitive function, especially in the elderly.","lo":"5 mg once daily","ty":"5-10 mg once daily","mx":"10 mg once daily"},{"id":127,"w":4,"g":"Donepezil","b":"Aricept","c":"Central Cholinesterase Inhibitor","m":"Enhances the action of acetylcholine by reversibly inhibiting acetylcholinesterase (AChE), the enzyme responsible for its hydrolysis. It has a high degree of selectivity for AChE in the CNS, which might explain the relative lack of peripheral side effects.","i":["Alzheimer disease"],"cn":"Takes weeks for full effects. Take at bedtime, with or without food. Adverse effects (diarrhea/reduced heart rate) more frequent at dose escalation and tend to resolve with continued use. Report signs/symptoms of GI bleeding.Allow disintegrating tablet to dissolve on tongue and follow with a glass of water.","p":"Slows memory impairment related to Alzheimer disease, but there is no curative treatment. Also available in a combination product with memantine (Namzaric).","lo":"5 mg once daily","ty":"10 mg once daily","mx":"23 mg once daily"},{"id":247,"w":4,"g":"Diphenoxylate/atropine","b":"Lomotil","c":"Antidiarrheal, C-V","m":"Diphenoxylate is a synthetic meperidine congener without analgesic activity that slows GI motility. Because high doses of diphenoxylate (40-60 mg) cause systemic opioid activity, atropine is added in subtherapeutic amounts to decrease abuse potential.","i":["Diarrhea"],"cn":"This drug can cause dry mouth, blurred vision, drowsiness, or dizziness; use caution while driving or performing other tasks requiring alertness, coordination, or physical dexterity. Avoid alcohol and other CNS depressants. Seek medical attention if diarrhea persists or if fever, palpitations, or abdominal distention occurs. Ensure max daily dose is not exceeded to avoid toxicity. Oral solution may be administered with food to decrease GI upset; use calibrated measuring device for administration (do not use household teaspoon).","p":"Signs of atropine toxicity often referred to as “dry as a bone, hot as a hare, red as a beet, blind as a bat, mad as a hatter.” Higher than usual doses may be administered to patients receiving irinotecan. Use of the liquid formulation recommended for children <13 y of age.","lo":"2.5 mg/0.025 mg once daily","ty":"2.5 mg/0.025 mg four times daily","mx":"2.5 mg/0.025 mg four times daily (20 mg/0.2 mg per day)"},{"id":188,"w":4,"g":"Dicyclomine","b":"Bentyl","c":"Antimuscarinic","m":"Relieves smooth muscle spasm of the GI tract via a specific anticholinergic effect (antimuscarinic) at the acetylcholine-receptor sites and a direct effect on smooth muscle (musculotropic).","i":["Irritable bowel syndrome"],"cn":"May cause drowsiness; avoid driving and operating heavy equipment. Heat prostration (due to decreased sweating) can occur when used in a hot environment.","p":"There are reports that administration of dicyclomine to infants has been followed by serious respiratory symptoms (dyspnea, shortness of breath, breathlessness, respiratory collapse, apnea, asphyxia), seizures, syncope, pulse rate fluctuations, muscular hypotonia, and coma. Death has been reported. Injectable formulation also available for IM use only (not to be used IV).","lo":"10 mg three times daily","ty":"20 mg four times daily","mx":"160 mg per day"},{"id":262,"w":4,"g":"Darifenacin","b":"Enablex","c":"Urinary Antispasmodic","m":"A competitive muscarinic receptor antagonist. Muscarinic receptors play an important role in several major cholinergically mediated functions, including contractions of the urinary bladder smooth muscle and stimulation of salivary secretion.","i":["Overactive Bladder"],"cn":"This drug may cause anticholinergic effects, including constipation, urinary retention, blurred vision, dyspepsia, or xerostomia. Heat prostration (due to decreased sweating) can occur when used in a hot environment. Can be taken with or without food. Seek medical attention for signs and symptoms of angioedema (swelling of tongue or laryngopharynx, difficulty breathing, etc).","p":"May note decline in cognitive function, especially in elderly patients.","lo":"7.5 mg once daily","ty":"7.5-15 mg once daily","mx":"15 mg once daily"},{"id":199,"w":4,"g":"Rizatriptan","b":"Maxalt","c":"Serotonin Receptor Agonist","m":"Binds with high affinity to serotonin (5HT) receptor subtypes 1B and 1D. Serotonin receptor agonists are believed to be effective in migraine either through vasoconstriction (via activation of 5-HT1 receptors located on intracranial blood vessels) or through activation of 5-HT1 receptors on sensory nerve endings in the trigeminal system resulting in the inhibition of proinflammatory neuropeptide release.","i":["Migraine"],"cn":"Avoid alcohol, CNS depressants. Caution with driving and other tasks requiring alertness. Allow disintegrating tablet to dissolve on tongue and then swallow, do not chew.","p":"Serotonin agonists are not for prophylaxis; only for the treatment of acute migraine headache. Several serotonin agonists (“triptans”) are available for migraine, administered via a variety of routes (oral, inhaled, and injected). Each differs in onset and duration of action. If one agent is ineffective at max dose, recommend changing agents or route.","lo":"","ty":"","mx":""},{"id":295,"w":4,"g":"Umeclidinium","b":"Incruse Ellipta","c":"Long-Acting Anticholinergic","m":"Blocks muscarinic receptors in the airways","i":["Chronic obstructive pulmonary disease (COPD)"],"cn":"inhaler technique","p":"- Umeclidinium is a long-acting anticholinergic for maintenance treatment of COPD. - Monitor for signs of paradoxical bronchospasm or acute narrow-angle glaucoma.","lo":"62.5 mcg once daily","ty":"62.5 mcg once daily","mx":"125 mcg once daily"},{"id":7,"w":5,"g":"Albuterol","b":"ProAir HFA, Ventolin HFA","c":"Selective β2-Adrenergic Agonist","m":"A selective β2-adrenergic agonist that acts on β2-adrenergic receptors of intracellular adenylyl cyclase to increase cyclic AMP levels resulting in bronchial smooth muscle relaxation","i":["Asthma","Chronic obstructive pulmonary disease"],"cn":"Instruct patient on inhaler technique, including priming and shaking well before using","p":"used prn. not considered first line for persistent asthma","lo":"90 mcg every 4-6 hours as needed","ty":"90-180 mcg every 4-6 hours as needed","mx":"1080 mcg per day"},{"id":164,"w":5,"g":"Tiotropium","b":"Spiriva","c":"Anticholinergic Bronchodilator LABA","m":"A long-acting antimuscarinic agent, which is often referred to as an anticholinergic. It has similar affinity to the subtypes of muscarinic receptors, M1-M5. In the airways, it exhibits pharmacologic effects through inhibition of M3-receptors at the smooth muscle leading to bronchodilation. The bronchodilation following inhalation of tiotropium is predominantly a site-specific effect.","i":["COPD","Asthma"],"cn":"Advise patients that this drug is not indicated for acute bronchospasm (rescue therapy). This drug may cause anticholinergic side effects. Comes as a respimat and handihaler Warn patients that the drug capsules are for inhalation only and are not to be swallowed; instruct patients on the use of the inhalation device. When using HandiHaler, patients should inhale the contents of each capsule twice to ensure drug delivery.","p":"Proper inhaler technique for all inhalers","lo":"18 mcg once daily","ty":"18 mcg once daily","mx":"18 mcg once daily"},{"id":20,"w":5,"g":"Montelukast","b":"Singulair","c":"Leukotriene Receptor Antagonist","m":"Leukotrienes are products of arachidonic acid metabolism and are released from various cells, including mast cells and eosinophils, and bind to leukotriene receptors. Montelukast binds with leukotriene receptors to inhibit physiologic actions of leukotriene.","i":["Asthma","Seasonal allergic rhinitis"],"cn":"Not indicated for acute asthma attacks. Report increased use of short-acting inhaled bronchodilators and advise patients not to discontinue or decrease the dose of other asthma medications unless instructed by a health-care professional. Patients with asthma or allergic rhinitis should take dose in the evening.","p":"NOT FIRST LINE FOR ANYTHING. CHOOSE ICS over mntelukast in asthma","lo":"4 mg once daily","ty":"10 mg once daily","mx":"10 mg once daily"},{"id":179,"w":5,"g":"Ipratropium/albuterol","b":"Combivent","c":"Antichoinergic/bronchodilator SABA/SAMA","m":"A selective β2-adrenergic agonist that produces bronchodilation Ipratropium is a competitive antagonist of acetylcholine at peripheral, but not central, muscarinic receptors. It appears to produce bronchodilation by inhibition of cholinergic receptors on bronchial smooth muscle.","i":["COPD","Asthma exacerbation"],"cn":"Instruct patient on appropriate inhaler technique.(Twist Open Press(TOP)) Wash the mouthpiece in warm water and air dry thoroughly daily (may cease to deliver medication if mouthpiece becomes blocked). Store the inhaler at room temperature; avoid excessive humidity; do not freeze. Nebulizer technique: use entire vial of inhalation solution immediately after opening to avoid contamination; deliver over 5-15 min. Seek medical attention if the prescribed dose does not provide relief or if symptoms worsen.","p":"","lo":"20 mcg/100 mcg per inhalation four times daily","ty":"20 mcg/100 mcg per inhalation four times daily","mx":"20 mcg/100 mcg per inhalation six times daily"},{"id":81,"w":5,"g":"Tizanidine","b":"Zanaflex","c":"Centrally Acting Skeletal Muscle Relaxant, α2-Agonist","m":"A centrally acting muscle relaxant. The drug is an imidazole derivative, structurally unrelated to other muscle relaxants. Tizanidine is an agonist of α2-adrenergic receptors, which decreases spasticity by increasing presynaptic inhibition; however, it does not have antihypertensive properties.","i":["Muscle spasticity"],"cn":"Be cautious of risk of dizziness and somnolence when initiating therapy; do not drive until effects of drug are known. Rise slowly from a lying/sitting position, as this drug may cause hypotension. May cause xerostomia (dry mouth) and asthenia (weakness).","p":"While this drug may be taken with or without food, patients should take the drug in the same way (fasting or fed) every time to avoid inconsistent absorption patterns and resulting changes in efficacy and adverse effects. Effect of food on extent of absorption differs for tablets and capsules. Abrupt discontinuation can cause rebound HTN and tachycardia. Taper dose by 2-4 mg/d if used at high dose (20-28 mg daily) or for an extended period of time. Should avoid concurrent use with opioids. Capsules and tablets are not interchangeable.","lo":"2 mg once daily","ty":"2-4 mg 1-3 times daily","mx":"36 mg per day"},{"id":239,"w":5,"g":"Guanfacine","b":"Intuniv (extended-release); Tenex (immediate-release)","c":"α2-Adrenergic Agonist","m":"Stimulates postsynaptic α2-adrenergic receptors in the CNS by activating inhibitory neurons to decrease sympathetic outflow.","i":["ADHD","HTN"],"cn":"Takes weeks for full effects. Take every day and do not abruptly discontinue unless instructed by your provider. Common side effects are dizziness, sedation, and lowered heart rate and blood pressure. Avoid activities requiring mental alertness or coordination until drug effects are realized. Growth rate and weight loss is lower risk with non-stimulants in ADHD. Report new or worsened psychiatric problems, chest pain, palpitations, dyspnea, or signs/symptoms of cardiac dysrhythmias, MI, or cerebrovascular accident.","p":"Guanfacine and other α-adrenergic agents are rarely used for HTN. Not as efficacious as stimulants for ADHD, but may be used as monotherapy or combination with stimulants. Can be used in children with coexisting behavioral condition or tic disorder. When discontinuing , taper slowly, to reduce rebound hypertension.","lo":"1 mg once daily","ty":"1-4 mg once daily","mx":"4 mg once daily"},{"id":82,"w":5,"g":"Clonidine","b":"Catapres","c":"α2-Adrenergic Agonist","m":"Stimulates presynaptic α2-adrenergic receptors and blocks postsynaptic α2-adrenergic receptors in the CNS by activating inhibitory neurons to decrease sympathetic outflow. Clonidine is not a complete agonist, so some of its effects might result from antagonist actions at presynaptic α-receptors. These actions reduce peripheral vascular resistance, renal vascular resistance, HR, and BP.","i":["HTN","ADHD","Nictoine dependence","Spasticity"],"cn":"Avoid alcohol, CNS depressants. Use caution with driving and other tasks requiring alertness. May cause nausea, vomiting, insomnia, constipation, fatigue, or dry mouth. Swallow extended-release tablet whole. Apply patch to hairless area of intact skin on upper outer arm or chest; rotate patch location. If patch loosens during the 7-d wearing, secure adhesive cover. Report signs/symptoms of hypotension, exacerbation of angina peripheral edema, fatigue, hypotension, or hepatic dysfunction with initial dosing and dose changes. Avoid abrupt discontinuation to avoid rebound HTN.","p":"Safety and efficacy of the immediate-release tablet for the treatment of HTN not established in children. Extended-release tablets and immediate-release tablet formulation are not interchangeable. Injectable formulation available for epidural infusion (pain management), and is a high-risk medication due to the risk of error and the serious patient consequences when not used appropriately.","lo":"0.1 mg once daily","ty":"0.1-0.2 mg twice daily","mx":"0.6 mg twice daily (1.2 mg per day)"},{"id":249,"w":5,"g":"Umeclidinium; vilanterol","b":"Anoro Ellipta","c":"Long-Acting Anticholinergic; Long-Acting Beta2 Agonist","m":"Umeclidinium: Blocks muscarinic receptors; Vilanterol: Stimulates beta2 adrenergic receptors","i":["Chronic obstructive pulmonary disease (COPD)"],"cn":"#NAME?","p":"- Umeclidinium-vilanterol is a combination inhaler for maintenance treatment of COPD. - Monitor for signs of paradoxical bronchospasm or acute narrow-angle glaucoma.","lo":"62.5 mcg/25 mcg once daily","ty":"62.5 mcg/25 mcg once daily","mx":"125 mcg/25 mcg once daily"},{"id":87,"w":5,"g":"Baclofen","b":"Lioresal","c":"Centrally Acting Skeletal Muscle Relaxant","m":"Inhibits both monosynaptic and polysynaptic reflexes at the spinal level, possibly by hyperpolarization of afferent terminals, although actions at supraspinal sites may also occur and contribute to its clinical effect. Baclofen is an analogue of γ-aminobutyric acid (GABA), but there is no conclusive evidence that actions on GABA systems are involved in the production of its clinical effects.","i":["Spasticity","Hiccups"],"cn":"Because of the possibility of sedation, patients should be cautioned regarding the operation of motor vehicles or dangerous machinery while taking baclofen. Patients should be cautioned that the CNS effects of baclofen may be additive to those of alcohol and other CNS depressants.","p":"Implantable pumps that administer baclofen intrathecally are also available for patients with spasticity. Constipation occurs in 100% of patients undergoing intrathecal administration, and abrupt discontinuation of intrathecal therapy (intentional or inadvertent) can result in seizures, coma, and death. Avoid concomitant use with opioids.","lo":"5 mg three times daily","ty":"20-80 mg per day","mx":"20 mg four times daily (80 mg per day)"},{"id":296,"w":5,"g":"Varenicline","b":"Chantix","c":"Smoking Cessation Agent","m":"Binds with high affinity and selectivity at α4β2 neuronal nicotinic acetylcholine receptors. Its efficacy in smoking cessation is believed to be the result of activity at α4β2 subtype of the nicotinic receptor where its binding produces agonist activity, while simultaneously preventing nicotine binding to these receptors.","i":["Smoking cessation"],"cn":"Take drug after eating and with a full glass (8 oz) of water. If you experience sleepwalking, seizures signs of hypersensitivity (shortness of breath), mental status changes or suicidal ideation, stop taking and contact HCP. May be used with other nicotine replacement products to help alleviate withdrawal from nicotine. Limit alcohol use.","p":"The FAA has banned its use in pilots and air traffic controllers. Patients and HCPs should weigh the risks of taking varenicline against the benefits of smoking cessation. In a recent meta-analysis, there was an increased, but not statistically significant, incidence of major adverse cardiovascular events (a combined outcome of cardiovascular-related death, nonfatal AMI, and nonfatal stroke) in patients using varenicline when compared to placebo. Dispense with FDA-approved medication guide. Initiating therapy up to 35 d prior to quit date and extending therapy to 24 wk have been shown to improve quit rate and long-term abstinence rates.","lo":"","ty":"","mx":""},{"id":26,"w":6,"g":"Fluticasone furoate oral inhaler","b":"Arnuity ellipta","c":"Inhaled Adrenal Corticosteroid","m":"potent glucocorticoid activity. Bind to the glucocorticoid receptor, inhibiting pro-inflammatory signals","i":["Asthma"],"cn":"Proper administration technique for the specific inhaled product prescribed. Instruct on rinsing mouth with water after each use to prevent oral infections. May take several weeks and up to several months to work effectivley","p":"not indicated for acute exacerbations *the furoate salt has higher affinity for lung and nasal tiusse, and higher potency with twice the receptor binding than the propionate salt","lo":"88 mcg twice daily","ty":"100-500 mcg twice daily","mx":"1000 mcg twice daily (2000 mcg per day)"},{"id":163,"w":6,"g":"Budesonide","b":"Pulmicort","c":"Inhaled Corticosteroid","m":"An anti-inflammatory with potent glucocorticoid and weak mineralocorticoid activity. It exhibits a broad range of active inhibition against multiple cell types and mediators involving allergic and nonallergic/irritant-mediated inflammation.","i":["Asthma","COPD"],"cn":"Advise patient on proper inhalation technique. Gently swirl nebulizer suspension before use. Use entire vial of inhalation suspension immediately after opening to avoid contamination; deliver over 5-15 min using a jet nebulizer with mouthpiece or face mask. After administration, rinse mouth with water and spit, and wash face to minimize risk of developing oral candidiasis. Provided as a strip of 5 small plastic containers with sealed caps; each container holds 1 dose. The strip of containers is sealed inside a foil pouch. Keep any unused containers inside the pouch. Once foil pouch is opened, the containers will only be good for 2 wk.","p":"This drug is not indicated for acute asthma attacks. Respules indicated only in children; budesonide in MDI form available for treatment of older children and adults. Also available in nasal formulation (both by prescription and OTC) for allergic rhinitis; OTC formulation only appropriate for adults and children >6 y of age. MDI formulation in combination with formoterol also available. Oral tablets and capsules available for systemic treatment of Crohn disease and ulcerative colitis, and rectal formulation available, indicated for treatment of ulcerative colitis. Use in patients with COPD is recommended in those with a history of hospitalization(s) for exacerbations of COPD, ≥2 moderate exacerbations of COPD per year, blood eosinophils >300 cells/μL, and concomitant or history of asthma. Combination therapy may also be considered in patients with 1 moderate exacerbation of COPD per year and blood eosinophils of 100-300 cells/μL.","lo":"1-2 mg twice daily","ty":"2 mg twice daily","mx":"2 mg twice daily (4 mg per day)"},{"id":62,"w":6,"g":"Fluticasone/salmeterol","b":"Advair, AirDuo Respiclick, wixela inhub","c":"Inhaled Corticosteroid and Long-Acting β2-Adrenergic Agonist Combination","m":"Fluticasone is a synthetic trifluorinated corticosteroid with anti-inflammatory effects. It is a human glucocorticoid receptor agonist that inhibits multiple cell types and mediator production or secretion involved in asthma and COPD. Salmeterol is a long-acting β2-adrenergic agonist, stimulates intracellular adenylyl cyclase in catalyzing the conversion of adenosine triphosphate (ATP) to cyclic-3',5'-adenosine monophosphate (cyclic AMP). The increased cyclic AMP levels result in the relaxation of bronchial smooth muscle and inhibition of the release of mediators of instantaneous hypersensitivity from mast cells.","i":["Asthma","COPD"],"cn":"Proper administration technique for specific inhaled product prescribed; rinse mouth with water after each use to prevent oral infections. Monitor for signs of toxicity, especially adrenal insufficiency, oral candidiasis, and worsening pulmonary function.","p":"","lo":"100 mcg/50 mcg twice daily","ty":"250 mcg/50 mcg twice daily","mx":"500 mcg/50 mcg twice daily"},{"id":229,"w":6,"g":"Epinephrine autoinjector","b":"Not used","c":"Alpha/Beta Agonist, Anaphylaxis Agent","m":"Stimulates α- and β-adrenergic receptors. Alpha agonism results in vascular smooth muscle constriction which increased BP. Beta-1 agonism will increase HR and contractility. Beta-2 agonism results in bronchial smooth muscle relaxation thus alleviating bronchospasm, wheezing, and dyspnea.","i":["Emergency treatment of acute anaphylaxis due to allergic reaction"],"cn":"Immediately seek medical assistance, even if the patient feels better after epinephrine use. Inject into the muscle of the anterolateral aspect of thigh, and not into buttock, digits, hands, or feet. Leg should be held firmly during injection. Needle should remain in thigh for about 3 seconds. Use second autoinjector if symptoms worsen or do not improve in 5 - 15 minutes.","p":"Epinephrine autoinjectors are intended for immediate self-administration as emergency supportive therapy only and are not a substitute for immediate medical care. When treating anaphylaxis, IV route should not be used as arrhythmias may occur.","lo":"0.3 mg as needed","ty":"0.3 mg as needed","mx":"0.3 mg as needed, up to 2 doses"},{"id":74,"w":6,"g":"Budesonide/formoterol","b":"Symbicort","c":"Inhaled Corticosteroid/\nBronchodialator Combination","m":"An anti-inflammatory with potent glucocorticoid and weak mineralocorticoid activity. It exhibits a broad range of active inhibition against multiple cell types and mediators involving allergic and nonallergic/irritant-mediated inflammation. Formoterol is a long-acting selective β2-adrenergic agonist that produces bronchodilation.","i":["Asthma","COPD"],"cn":"proper inhaler technique, when to use","p":"can be used for maintanece and rescue","lo":"80 mcg/4.5 mcg twice daily","ty":"160 mcg/4.5 mcg twice daily","mx":"320 mcg/9 mcg twice daily"},{"id":256,"w":6,"g":"Beclomethasone","b":"QVAR (ICS)","c":"Inhaled Corticosteroid","m":"Reduces airway inflammation and hyperresponsiveness","i":["Asthma"],"cn":"- Use the inhaler as prescribed to control asthma symptoms. - Rinse the mouth with water after each use to minimize the risk of oral thrush.","p":"Beclomethasone is not intended for acute asthma attacks. -Oropharyngeal candidiasis","lo":"40 mcg twice daily","ty":"80-160 mcg twice daily","mx":"320 mcg twice daily"},{"id":118,"w":6,"g":"Fluticasone; umeclidinium; vilanterol","b":"Trelegy Ellipta","c":"Corticosteroid; Anticholinergic; Long-Acting Beta2 Agonist(ICS/LAMA/LABA)","m":"Fluticasone: Reduces airway inflammation; Umeclidinium: Blocks muscarinic receptors; Vilanterol: Stimulates beta2 adrenergic receptors(bronchodilation)","i":["Chronic obstructive pulmonary disease (COPD)"],"cn":"- Use the inhaler as prescribed to manage symptoms of COPD. - Rinse the mouth with water after each use to minimize the risk of oral thrush.","p":"Trelegy Ellipta is a combination inhaler for maintenance treatment of COPD and asthma. - Monitor for signs of pneumonia, paradoxical bronchospasm","lo":"100 mcg/62.5 mcg/25 mcg once daily","ty":"100-200 mcg/62.5 mcg/25 mcg once daily","mx":"200 mcg/62.5 mcg/25 mcg once daily"},{"id":272,"w":6,"g":"Formoterol; mometasone","b":"Dulera","c":"Long-Acting Beta2 Agonist; Corticosteroid","m":"Formoterol: Stimulates beta2 adrenergic receptors; Mometasone: Reduces airway inflammation","i":["Asthma"],"cn":"- Use the inhaler as prescribed to manage asthma symptoms. - Rinse the mouth with water after each use to minimize the risk of oral thrush.","p":"Formoterol-mometasone is a combination inhaler for maintenance treatment of asthma. can be considered for prn use since it has formoterol","lo":"5 mcg/100 mcg twice daily","ty":"5 mcg/200 mcg twice daily","mx":"10 mcg/400 mcg twice daily (20 mcg/800 mcg per day)"},{"id":140,"w":6,"g":"Fluticasone; vilanterol","b":"Breo Ellipta","c":"Corticosteroid; Long-Acting Beta2 Agonist(ISA/LABA)","m":"Fluticasone: Reduces airway inflammation; Vilanterol: Stimulates beta2 adrenergic receptors","i":["Asthma, chronic obstructive pulmonary disease (COPD)"],"cn":"- Use the inhaler as prescribed to manage asthma or COPD symptoms. - Rinse the mouth with water after each use to minimize the risk of oral thrush.","p":"- Fluticasone-vilanterol is a combination inhaler for the treatment of asthma and COPD. - Monitor for signs of paradoxical bronchospasm or acute narrow-angle glaucoma.","lo":"100 mcg/25 mcg once daily","ty":"200 mcg/25 mcg once daily","mx":"200 mcg/25 mcg once daily"},{"id":278,"w":6,"g":"Levalbuterol","b":"Xopenex","c":"Selective β2-Agonist, Bronchodilator","m":"Activation of β2-adrenergic receptors on airway smooth muscle leads to the activation of adenylate cyclase and to an increase in the intracellular concentration of cyclic-3',5'-adenosine monophosphate (cyclic AMP). The increase in cyclic AMP is associated with the activation of protein kinase A, which in turn inhibits the phosphorylation of myosin and lowers intracellular ionic calcium concentrations, resulting in muscle relaxation. Levalbuterol relaxes the smooth muscles of all airways, from the trachea to the terminal bronchioles.","i":["Asthma"],"cn":"Instruct patient on proper inhaler technique. . Store the inhaler at room temperature, away from heat and direct light. Do not freeze. Do not keep this medicine inside a car where it could be exposed to extreme heat or cold. Contact prescriber if the need to use more levalbuterol to control symptoms than usual as this may indicate asthma deterioration.","p":"simlar to albuterol. an enantiomer. potentially can cause less AE like jitteriness","lo":"45 mcg every 4-6 hours as needed","ty":"90 mcg every 4-6 hours as needed","mx":"540 mcg per day"},{"id":38,"w":7,"g":"Alprazolam","b":"Xanax","c":"Benzodiazepine, Short or Intermediate Acting, C-IV","m":"Enhances the postsynaptic effect of the inhibitory neurotransmitter, 𝛾-aminobutyric acid (GABA).","i":["Anxiety","Panic disorder","Alcohol withdrawal syndrome"],"cn":"May cause drowsiness, falls, and memory impairment; avoid driving or other tasks requiring motor coordination. Avoid alcohol as \"blackouts\" can occur.","p":"Fast onset benzodiazepine with short elimination half-life. Avoid use in elderly patients. Use CNS depressants with caution, may have additive effects. Avoid abrupt discontinuation after chronic use; may cause seizures. Respiratory depression with concomitant opioid use.","lo":"0.25 mg once daily","ty":"0.5-1 mg three times daily","mx":"4 mg per day"},{"id":100,"w":7,"g":"Lorazepam","b":"Ativan","c":"Benzodiazepine, Short or Intermediate Acting, C-IV","m":"Enhance the postsynaptic effect of the inhibitory neurotransmitter, GABA.","i":["Anxiety","Insomnia","Alcohol withdrawal syndrome"],"cn":"May cause drowsiness, falls, and memory impairment; avoid driving or other tasks requiring motor coordination. Avoid alcohol as \"blackouts\" can occur.","p":"Moderate onset benzodiazepine with moderate elimination half-life. Intravenous, liquid, and intramuscular formulations available. Avoid use in elderly patients. Use CNS depressants with caution, may have additive effects. Avoid abrupt discontinuation after chronic use; may cause seizures. Respiratory depression with concomitant opioid use.","lo":"0.5 mg once daily","ty":"1-2 mg two to three times daily","mx":"10 mg per day"},{"id":40,"w":7,"g":"Hydroxyzine","b":"Atarax, Vistaril","c":"Histamine H1 Antagonist, First Generation","m":"A rapid-acting agent with probable action of suppressing activity in key locations of the subcortical area of the CNS. Primary skeletal muscle relaxation, bronchodilator activity, antiemetic effects, and antihistaminic and analgesic effects have been demonstrated experimentally and confirmed clinically.","i":["Anxiety","Insomnia (off-label)","Pruritus and Seasonal allergic rhinitis"],"cn":"Patients should avoid activities requiring mental alertness or coordination until drug effects are known, as drug may cause dizziness or sedative effects.","p":"Side effects are similar to diphenhydramine (benadryl): sedation, dizziness, dry mouth. May be used on scheduled or as-needed basis for anxiety. Non addictive.","lo":"10 mg once daily","ty":"25-50 mg 3-4 times daily","mx":"100 mg four times daily (400 mg per day)"},{"id":138,"w":7,"g":"Meclizine","b":"Antivert","c":"Antihistamine, Antiemetic","m":"An antihistamine that suppresses the vasodepressor response to histamine while only slightly inhibiting acetylcholine.","i":["Motion sickness","Vertigo"],"cn":"May cause drowsiness; avoid driving or operating dangerous machinery until you know how this medication affects you. Avoid alcoholic beverages and other CNS depressants while taking this drug. Take with food to decrease GI symptoms. Because of its potential anticholinergic action, this drug should be used with caution in patients with asthma, glaucoma, or enlargement of the prostate gland. Formulations that are not identified as chewable should not be crushed or chewed.","p":"Meclizine is available OTC in many different products, and by prescription. Caution should be used to avoid duplication of therapy and patients should be advised on product selection. Take 1 h before travel if used for motion sickness.","lo":"","ty":"","mx":""},{"id":41,"w":7,"g":"Buspirone","b":"Buspar","c":"Antianxiety","m":"The first of a class of selective serotonin-5-HT1A receptor partial agonists. It also has some effect on dopamine-D2 auto-receptors and, like antidepressants, can downregulate β-adrenergic receptors. Unlike benzodiazepines, it lacks amnestic, anticonvulsant, muscle relaxant, and hypnotic effects. Its exact anxiolytic mechanism of action is complex and not clearly defined.","i":["Generalized Anxiety Disorder","Depression (off-label)"],"cn":"Takes weeks for full effects. Patient should avoid activities requiring mental alertness or coordination until drug effects are realized. Advise patient that symptomatic improvement may not be seen for a few weeks. Advise patient against sudden discontinuation of drug. Patient may take with or without food, but should always take drug consistently. Patient should not drink alcohol or large amounts of grapefruit juice while taking this drug. Avoid concomitant use with MAOI.","p":"Should not be used on an as-needed basis due to ineffectiveness. Safety and efficacy not established in patients <18 y of age.","lo":"5 mg two to three times daily","ty":"10 mg two to three times daily","mx":"60 mg per day"},{"id":181,"w":7,"g":"Diazepam","b":"Valium","c":"Benzodiazepine, C-IV","m":"Enhanced postsynaptic effect of the inhibitory neurotransmitter, 𝛾-aminobutyric acid (GABA).","i":["Anxiety","Seizures","Alcohol withdrawal syndrome"],"cn":"May cause drowsiness, falls, and memory impairment; avoid driving or other tasks requiring motor coordination. Avoid alcohol as \"blackouts\" can occur.","p":"Fast onset benzodiazepine with long elimination half-life and risk of accumulation. Injectable and Rectal gel formulation (Diastat Acudial) are available. Avoid use in elderly patients. Use CNS depressants with caution, may have additive effects. Avoid abrupt discontinuation after chronic use; may cause seizures. Respiratory depression with concomitant opioid use.","lo":"2 mg once daily","ty":"5-10 mg 2-4 times daily","mx":"10 mg four times daily (40 mg per day)"},{"id":63,"w":7,"g":"Clonazepam","b":"Klonopin","c":"Benzodiazepine, C-IV","m":"Enhances the postsynaptic effect of the inhibitory neurotransmitter, 𝛾-aminobutyric acid (GABA).","i":["Panic disorder","Seizures","Restless legs syndrome","Anxiety"],"cn":"May cause drowsiness, falls, and memory impairment; avoid driving or other tasks requiring motor coordination. Avoid alcohol as \"blackouts\" can occur.","p":"Relatively longer elimination half-life than several other benzodiazepines. Avoid use in elderly patients. Use CNS depressants with caution, may have additive effects. Avoid abrupt discontinuation after chronic use; may cause seizures. Respiratory depression with concomitant opioid use.","lo":"0.25 mg once daily","ty":"0.5-1 mg twice daily","mx":"2 mg three times daily (6 mg per day)"},{"id":216,"w":7,"g":"Ketorolac","b":"Toradol","c":"Nonsteroidal Anti-Inflammatory Drug","m":"Reversibly inhibits COX-1 and COX-2 enzymes, reducing prosaglandin synthesis, has antipyretic, analgesic and anti-inflammatory properties","i":["Moderate to severe pain; acute severe migraine headache."],"cn":"For short-term relief of moderate to severe pain. - Limit use to 5 days. - Do not exceed the recommended dosage.","p":"Ketorolac is intended for short-term use and may increase the risk of gastrointestinal bleeding, cardiovascular events or kidney injury. Follow weight-based dosing guidelines. - Monitor renal function, blood pressure, and signs of bleeding. Opthalmic formulation used to reduce eye inflammation/pain after eye surgery or from conjunctivitis.","lo":"10 mg every 4-6 hours as needed","ty":"10-20 mg every 4-6 hours as needed","mx":"40 mg per day (for up to 5 days)"},{"id":78,"w":7,"g":"Pregabalin","b":"Lyrica","c":"Analgesic, Anticonvulsant. C-V","m":"GABA analogue that strongly binds to the α2-delta site (a subunit of voltage-gated calcium channels) in CNS tissues. Binding to the α2-delta subunit may be involved in pregabalin’s effects on neuropathic pain and seizure control. Pregabalin reduces the calcium-dependent release of several neurotransmitters; however, the exact mechanism of action is unknown.","i":["Neuropathic pain","Fibromyalgia","Seizures","Postherpetic neuralgia"],"cn":"Solution must be used within 45 d of first opening the bottle. Avoid activities requiring mental alertness or coordination until drug effects are realized. Avoid sudden discontinuation of drug due to risk of withdrawal, including increased seizure frequency. Avoid concurrent use of CNS depressants, such as alcohol.","p":"Safety and efficacy have not been established in children. Data suggest an increased risk of suicidal behavior or ideation may exist in patients receiving therapy with AEDs. The dose of the solution should be written as milligrams.","lo":"50 mg twice daily","ty":"150-600 mg per day","mx":"300 mg twice daily (600 mg per day)"},{"id":243,"w":7,"g":"Lidocaine topical patch","b":"Lidoderm","c":"Local Anesthetic","m":"An amide-type local anesthetic agent and is suggested to stabilize neuronal membranes by inhibiting the ionic fluxes required for the initiation and conduction of impulses. The penetration of lidocaine in patch form into intact skin is sufficient to produce an analgesic effect, but less than the amount necessary to produce a complete sensory block.","i":["Localized pain","Postherpetic neuralgia"],"cn":"Instruct patients on the appropriate application process. Leave patches on skin for no >12 h within a 24-h period. Caution patients to administer only as directed, to intact skin, without covering with occlusive dressing or tight clothes.","p":"Patches may be cut into smaller sizes prior to removal of release liner to refine dose to meet patients’ needs. Patients should be instructed to fold used patches after removal so that the adhesive side sticks to itself and safely discard used patches or pieces of cut patches where children and pets cannot get to them. Accidental ingestion of used patches can lead to serious adverse effects. Lidocaine also available in a wide range of other dosage forms, including topical ointments, lotions, gels and creams, injectables, and oral sprays and gels. Most Lidocaine patches are sold as the OTC 4% patch rather than prescription 5% patch.","lo":"5% patch up to 12 hours per day","ty":"1 patch up to 12 hours per day","mx":"3 patches up to 12 hours per day"},{"id":21,"w":8,"g":"Trazodone","b":"Desyrel","c":"Antidepressant","m":"The mechanism of antidepressant action is not fully understood but suspected to be related to its potentiation of serotonergic activity in the CNS by inhibiting reuptake of serotonin. Trazodone also significantly blocks histamine (H1) and α1-adrenergic receptors","i":["Depression","Insomnia (off-label)"],"cn":"Avoid driving and other activities requiring mental alertness or coordination until drug effects are realized, as this medicine may cause dizziness or somnolence. Report signs/symptoms of priapism immediately. Avoid use of MAOI within the past 14 d. Do not drink alcohol, or use barbiturates or other CNS depressants while taking this drug.","p":"Antidepressants increased the risk of suicidal thinking and behavior in children, adolescents, and young adults in short-term studies with major depressive disorder (MDD) and other psychiatric disorders. This risk must be balanced with the clinical need. Monitor patients closely for clinical worsening, suicidality, or unusual changes in behavior.","lo":"25 mg once nightly","ty":"50-150 mg once nightly","mx":"400 mg daily in divided doses"},{"id":160,"w":8,"g":"Divalproex","b":"Depakote","c":"Anticonvulsant","m":"Composed of sodium valproate and valproic acid. Valproic acid is a carboxylic acid compound whose anticonvulsant activity might be mediated by an inhibitory neurotransmitter, GABA. Valproic acid might increase GABA levels by inhibiting GABA metabolism or enhancing postsynaptic GABA activity. Valproic acid also limits repetitive neuronal firing through voltage- and usage-dependent sodium channels.","i":["Seizures","Manic bipolar disorder","Migraine prophylaxis"],"cn":"Avoid activities requiring mental alertness until drug effects are realized; drug may cause somnolence or dizziness. Seek medical attention for signs and symptoms of liver dysfunction (eg, dark-colored urine, light-colored stools, yellowing of skin or eyes, etc), especially during first 6 mo of therapy. Take with food to avoid GI irritation. Do not discontinue drug abruptly, as this may precipitate seizures. Avoid alcohol. Sprinkle capsules can be swallowed whole or opened and sprinkled onto soft food; do not chew.","p":"Safety and efficacy in children <10 y of age have not been established. To convert from valproic acid to divalproex, initiate divalproex at the same daily dose and schedule; once stabilized, give divalproex bid or tid. Divalproex is teratogenic, so cover with other BC options; add FA in women of childbearing potential. Multiple other dosage forms available as valproate sodium and valproic acid.","lo":"","ty":"","mx":""},{"id":55,"w":8,"g":"Zolpidem","b":"Ambien","c":"Nonbarbiturate Hypnotic. C-IV","m":"Binds the benzodiazepine receptor but is structurally different from a benzodiazepine. Sedative and hypnotic effects are due to increased chloride conductance, neuronal hyperpolarization, inhibition of action potential, and decrease in neuronal excitability.","i":["Insomnia"],"cn":"Take on an empty stomach. May cause daytime drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol. Take immediately prior to bedtime. Warn patient of the risk of “sleep-driving” and other complex behaviors (eg, preparing and eating food, making phone calls) when the patient is not fully awake. Risk is increased when drug is combined with alcohol or other CNS depressants. Bed partner should monitor for irregular respiration.","p":"Not for long-term use (goal <4-5 weeks for insomnia disorder) or approved in children. Long-term use may result in dependence, abuse, or tolerance. Use caution in elderly. Use of CNS depressants with caution, may have additive effects. Grapefruit juice may increase concentrations.","lo":"5 mg once daily","ty":"5-10 mg once daily","mx":"10 mg once daily"},{"id":165,"w":8,"g":"Melatonin","b":"N/A","c":"Hormone","m":"Regulates sleep-wake cycles and circadian rhythm","i":["Cirrcadian-rhythm disorders","Insomnia"],"cn":"- Take the medication as directed for the management of insomnia. - Follow the recommended dosage.","p":"Minimal side effect profile, but also minimal benefits on sleep-onset time. No clear dose-response relationship, so low doses are acceptable (eg. 3 mg) to initiate. Melatonin is available over-the-counter as a dietary supplement. - It may cause drowsiness, so avoid operating machinery or driving until the effects are known.","lo":"1 mg once daily","ty":"3-5 mg once daily","mx":"10 mg per day"},{"id":60,"w":8,"g":"Lamotrigine","b":"Lamictal","c":"Phenyltriazine Anticonvulsant","m":"A phenyltriazine derivative unrelated to other marketed antiepileptic drugs (AEDs). Lamotrigine inhibits voltage-dependent sodium channels, thereby stabilizing neuronal membranes and reducing the release of excitatory neurotransmitters such as glutamate and aspartate.","i":["Seizures","Bipolar I disorder"],"cn":"Seek medical attention if blistering rash develops or if yellowing of skin or eyes, unusual bruising or bleeding, shortness of breath, or suicidal thoughts occur. Slow titration necessary to minimize side effects. Avoid alcohol. Talk to your HCP if you become or plan to become pregnant. Review driving restrictions for patients with seizures. Place oral disintegrating tablet formulation on tongue and allow to dissolve.","p":"Rash is more common in children, when quickly titrated and with high starting doses. Rash usually occurs 2-8 wk after start of therapy. Extended-release products are not approved for use in children <13 y of age. Bipolar patients have an increased risk of suicide during 1st 24 wk of therapy. Avoid abrupt discontinuation, increases risk of seizures. Medication guide required at dispensing, which includes illustrations to help identify tablets and strengths. Patients should pay particular attention to tablet identification to reduce risk of medication error. Starter packs with multiple dosage strengths available to facilitate treatment initiation.","lo":"","ty":"","mx":""},{"id":214,"w":8,"g":"Oxcarbazepine","b":"Trileptal","c":"Dibenzazepine Carboxamide, Anticonvulsant","m":"A 10-keto analogue of carbamazepine that exerts its anticonvulsant effect through an active 10-monohydroxy metabolite (MHD). Its mechanism of action is not known but likely involves blockade of voltage-dependent sodium channels and inhibition of repetitive neuronal firing.","i":["Seizures"],"cn":"Suspension should be shaken well and dose prepared immediately using oral dosing syringe. Suspension can be mixed in a small glass of water just prior to administration or may be swallowed directly from the syringe. Avoid activities requiring mental alertness or coordination until drug effects are realized. Advise patient to report signs/symptoms of serious dermatologic reactions, myelosuppression, or hepatotoxicity. Take with food, but not alcohol, grapefruit, or grapefruit juice. Avoid abrupt discontinuation to avoid risk of seizure","p":"Safety and efficacy not established in pediatric patients <2 y of age. With adjunctive therapy, children 2-4 y of age may require up to twice the oxcarbazepine dose per body weight compared to adults, and children 4-12 y of age may require a 50% higher oxcarbazepine dose per body weight compared to adults. Medication guide required at dispensing. Taper dose when discontinuing to reduce risk of increased seizures. Consider monitoring sodium levels, particularly in the first 3 mo of treatment in patients at risk for hyponatremia.","lo":"","ty":"","mx":""},{"id":71,"w":8,"g":"Topiramate","b":"Topamax","c":"Anticonvulsant","m":"The exact mechanisms by which topiramate exerts its anticonvulsant and migraine prophylaxis effects are unknown. Electrophysiologic and biochemical evidence suggests that topiramate blocks voltage-dependent sodium channels, augments the activity of the neurotransmitter gamma-aminobutyrate at some subtypes of the GABA-A receptor, antagonizes the AMPA/kainate subtype of the glutamate receptor, and inhibits the carbonic anhydrase enzyme, particularly isozymes II and IV.","i":["Seizures","Migraine prophylaxis"],"cn":"Avoid activities requiring mental alertness and coordination until drug effects are realized. Drug may cause dizziness and somnolence, especially if taken with alcohol or other CNS depressants. May cause diplopia, nervousness, confusion, and many other CNS effects. Do not discontinue drug abruptly, as this may cause increased seizure activity. Seek medical attention for new eye problems or high body temperature. May decrease sweating; avoid hot temperatures (including hot tubs and saunas). Maintain adequate fluid intake to minimize the risk of kidney stones. Instruct females on estrogen-progestin contraceptives to use an additional form of contraception due to decreased effectiveness of oral contraceptives. Take a missed dose as soon as possible, if more than 1 dose is missed, consult HCP.","p":"When adjusting dose, make small changes slowly (“start low and go slow”) to avoid acute adverse effects. Avoid alcohol use within 6 h of Trokendi XR to prevent dose dumping.","lo":"","ty":"","mx":""},{"id":284,"w":8,"g":"Phenytoin","b":"Dilantin","c":"Hydantoin Anticonvulsant","m":"A hydantoin that suppresses the spread of seizure activity mainly by inhibiting synaptic posttetanic potentiation and blocking the propagation of electric discharge. Phenytoin might decrease sodium transport and block calcium channels at the cellular level to produce these actions.","i":["Seizures"],"cn":"Suspension requires extensive shaking before administration. Do not crush extended-release capsules. Avoid activities requiring mental alertness or coordination until drug effects are realized. Report signs/symptoms of pancytopenia, hepatotoxicity, systemic lupus erythematosus, or severe skin reaction. Do not drink alcohol while taking this drug. Many drug interactions; check with health-care provider when starting new medications or OTC products.","p":"Highly protein bound, so albumin levels should be taken into account when measuring phenytoin concentration; dose adjustment based on free phenytoin concentration. Injectable formulation available but not for use IM (causes “purple glove syndrome” related to tissue necrosis). Medication guide required at dispensing. Non–1st-order pharmacokinetics.","lo":"","ty":"","mx":""},{"id":101,"w":8,"g":"Levetiracetam","b":"Keppra","c":"Anticonvulsant","m":"A pyrrolidine derivative that is structurally unrelated to other AEDs. Its mechanism of action is unclear and does not relate to any known mechanisms of neuronal excitation or inhibition. The action of levetiracetam in animal models of seizures and epilepsy is unique from other AEDs.","i":["Seizures"],"cn":"Instruct patient to swallow extended-release tablet whole; do not chew, break, or crush. Avoid activities requiring mental alertness or coordination until drug effects are realized. Report mood swings, agitation, hostile behavior, suicidal ideation, or unusual changes in behavior. Avoid sudden discontinuation of drug; may increase seizure activity.","p":"Safety and efficacy of extended-release tablet not established in children <16 y of age. Patients weighing <20 kg should receive the oral solution. Data suggest an increased risk of suicidal behavior, or ideation may exist in patients receiving therapy with AEDs. Pregnancy: up to a 50% dose increase during 3rd trimester with subsequent dose reduction after delivery may be necessary. Do not stop abruptly; increased risk of seizures. Dispense with medication safety guideline. Injectable formulation also available.","lo":"","ty":"","mx":""},{"id":292,"w":8,"g":"Temazepam","b":"Restoril","c":"Benzodiazepine, C-IV","m":"A minor metabolite of diazepam. Enhances the postsynaptic effect of the inhibitory neurotransmitter, 𝛾-aminobutyric acid (GABA)","i":["Insomnia"],"cn":"Take 30 min prior to bedtime. May cause drowsiness, falls, and memory impairment; avoid driving or other tasks requiring motor coordination. Avoid alcohol as \"blackouts\" can occur.","p":"Relatively shorter elimination half-life compared to other benzodiazepines. Not for long-term use for insomnia disorder (goal 4-5 weeks treatment). Use caution in elderly. Use CNS depressants with caution; may have additive effects. Avoid abrupt discontinuation after chronic use; may cause seizures. Respiratory depression with concomitant opioid use.","lo":"7.5 mg once daily","ty":"15-30 mg once daily","mx":"30 mg once daily"},{"id":61,"w":9,"g":"Quetiapine","b":"Seroquel","c":"Antipsychotic (Atypical)","m":"An antagonist at multiple neurotransmitter receptors in the brain. It antagonizes serotonin 5-HT1A and 5-HT2, dopamine D1 and D2, histamine H1, and adrenergic α1 and α2 receptors. Efficacy in schizophrenia and bipolar disorder is due to the antagonism of a combination of D2 and 5-HT2 receptors.","i":["Schizophrenia","Bipolar disorder","Depression, adjunctive with antidepressant (XR formulation)","Insomnia (off-label)"],"cn":"Takes weeks for full effects. Avoid abrupt discontinuation due to relapse potential. Common side effects are sedation, dizziness, dry mouth; may cause weight gain, increased cholesterol or blood sugar; may cause involuntary body movements. May intensify effects of alcohol. Avoid activities requiring mental alertness or coordination. Use caution with activities leading to an increased core temperature. Report signs/symptoms of hyperglycemia, bradycardia, arrhythmia, tardive dyskinesia, or neuroleptic malignant syndrome.","p":"Most often used at bedtime due to sedation. Regular release may be switched to extended release at the equivalent total daily dose taken once daily; individual dosage adjustments may be required.","lo":"25 mg once nightly","ty":"150-300 mg once nightly","mx":"800 mg per day"},{"id":184,"w":9,"g":"Lithium","b":"Eskalith, Lithobid","c":"Antimanic","m":"The mechanism of antimanic effect is unknown; it alters the actions of several second-messenger systems (eg, adenylate cyclase and phosphoinositol). Alters cation transport across cell membrane in nerve and muscle cells and influences reuptake of serotonin and/or norepinephrine; second-messenger systems involving the phosphatidylinositol cycle are inhibited.","i":["Bipolar Disorder","Depression (off-label)"],"cn":"Takes weeks for full effects. Take lithium as prescribed and do not abruptly discontinue due to risk of relapse. Maintain adequate fluid intake and normal salt intake. Swallow extended-release tablets whole; do not crush or chew. Avoid activities requiring mental alertness or coordination until drug effects are realized. Report signs/symptoms of toxicity: diarrhea, vomiting, tremor, ataxia, drowsiness, muscle weakness, lack of coordination, giddiness, blurred vision, tinnitus, or large volumes of dilute urine.","p":"Lithium dosing is based off lithium levels in the blood. Blood tests along with lithium levels are renal and thyroid function as these can be impaired with long-term use. Lithium toxicity is closely related to serum lithium levels and can occur at doses close to therapeutic levels. Ability to tolerate lithium is greater during the acute manic phase and decreases when manic symptoms subside.","lo":"300 mg twice daily","ty":"600-1800 mg per day","mx":"1200 mg twice daily (2400 mg per day)"},{"id":95,"w":9,"g":"Aripiprazole","b":"Abilify","c":"Atypical Antipsychotic","m":"An atypical antipsychotic agent (quinolinone derivative). It exhibits partial agonist activity at dopamine D2 and D3 receptors and serotonin 5-HT1A receptors and antagonist activity at 5-HT2A receptors.","i":["Schizophrenia* Bipolar disorder, manic or mixed episodes","Major depressive disorder, adjunctive with antidepressant","Tourette syndrome","Irritability with autistic disorder"],"cn":"Takes weeks for full effects. Avoid abrupt discontinuation due to relapse potential. Common side effects are sedation, dizziness, dry mouth; may cause weight gain, increased cholesterol or blood sugar; may cause involuntary body movements. May intensify effects of alcohol. Avoid activities requiring mental alertness or coordination. Use caution with activities leading to an increased core temperature. Report signs/symptoms of hyperglycemia, bradycardia, arrhythmia, tardive dyskinesia, or neuroleptic malignant syndrome.","p":"Lower sedation and weight gain than some other antipsychotics. Potential to cause compulsive or uncontrollable urge to gamble, binge eat, shop, or have sex. Long-acting injectable formulations are available.","lo":"2 mg once daily","ty":"10-15 mg once daily","mx":"30 mg once daily"},{"id":195,"w":9,"g":"Pramipexole","b":"Mirapex","c":"Dopamine Agonist, Antiparkinson","m":"A nonergot-derived dopamine subtype selective agonist that exerts activity in the CNS at D2 and D3 receptors but has no activity at the D1 receptor. D2 receptors are thought to play an important role in improving the akinesia, bradykinesia, rigidity, and gait disturbances of Parkinson disease.","i":["Parkinson disease","Restless legs syndrome"],"cn":"Take with food if nausea occurs. Avoid activities requiring mental alertness or coordination until drug effects are realized. Rise slowly from a sitting/lying-down position. Report new or increased gambling urges, sexual urges, compulsive eating or buying, as well as new-onset or worsening dyskinesia (abnormal involuntary movements). Do not discontinue abruptly, as this may cause emergent hyperpyrexia (fever) and confusion. Do not drink alcohol, and avoid concomitant use of other CNS depressants.","p":"Safety and efficacy in children not established. May switch patient from immediate-release to extended-release tablets overnight at same daily dose.","lo":"0.125 mg once daily","ty":"0.5-1.5 mg three times daily","mx":"4.5 mg per day"},{"id":161,"w":9,"g":"Valproate","b":"Depakote","c":"Anticonvulsant","m":"Increases the inhibitory effect of GABA in the brain","i":["Seizure disorders, bipolar disorder"],"cn":"- Take the medication as prescribed for the treatment of seizures or bipolar disorder. - Follow the recommended dosage.","p":"- Valproate requires monitoring of liver function, blood levels, and signs of hepatotoxicity. - Educate about the risk of teratogenicity and potential drug interactions. - Monitor for signs of mood changes or suicidal ideation.","lo":"","ty":"","mx":""},{"id":203,"w":9,"g":"Ropinirole","b":"Requip","c":"Dopamine Agonist, Antiparkinson","m":"A nonergoline dopamine agonist that has a higher specificity to D3 than to D2 and D4 subtypes of dopamine receptors. The drug has a moderate affinity for opioid receptors and has insignificant effects on D1, 5-hydroxytryptamine 1 (5-HT1), 5-HT2, benzodiazepine, GABA, muscarinic, α1-, α2-, and β-adrenoreceptors. It is suggested that ropinirole stimulates the postsynaptic D2-type receptor found in the brain’s caudate putamen in Parkinson disease.","i":["Parkinson disease","Restless legs syndrome"],"cn":"Take with food if nausea occurs. Avoid activities requiring mental alertness or coordination until drug effects are realized. Rise slowly from a sitting/lying-down position. Report new or increased gambling urges, sexual urges, compulsive eating or buying, as well as new-onset or worsening dyskinesia (abnormal involuntary movements). Do not discontinue abruptly, as this may cause emergent hyperpyrexia (fever) and confusion. Do not drink alcohol, and avoid concomitant use of other CNS depressants.","p":"May switch directly from immediate-release ropinirole to extended release; start an extended-release dose that matches most closely with the total daily immediate-release dose.","lo":"0.25 mg once daily","ty":"1-4 mg once daily","mx":"24 mg per day"},{"id":167,"w":9,"g":"Olanzapine","b":"Zyprexa","c":"Thienobenzodiazepine, Atypical Antipsychotic","m":"An atypical antipsychotic agent that is a potent serotonin-5-HT2 and dopamine-D2 antagonist. Antipsychotic effect is most likely related to blockade of postsynaptic dopaminergic receptors in the mesolimbic and prefrontal cortexes of the brain, although other neurotransmitter systems also are involved.","i":["Bipolar Disorder, maintenance and mixed/manic episodes","Schizophrenia","Depression","Chemotherapy induced nausea and vomiting (off-label)"],"cn":"Takes weeks for full effects. Avoid abrupt discontinuation due to relapse potential. Common side effects are sedation, dizziness, dry mouth; may cause weight gain, increased cholesterol or blood sugar; may cause involuntary body movements. May intensify effects of alcohol. Avoid activities requiring mental alertness or coordination. Use caution with activities leading to an increased core temperature. Report signs/symptoms of hyperglycemia, bradycardia, arrhythmia, tardive dyskinesia, or neuroleptic malignant syndrome.","p":"Most often used at bedtime due to sedation. Higher weight gain and metabolic syndrome risks. Short- and long-acting injection available.","lo":"5 mg once nightly","ty":"5-20 mg once nightly","mx":"20 mg once daily"},{"id":254,"w":9,"g":"Carbidopa/levodopa","b":"Sinemet","c":"Antiparkinsonian","m":"When levodopa is administered orally, it is rapidly decarboxylated to dopamine in extracerebral tissues so that only a small portion of a given dose is transported unchanged to the CNS. For this reason, when given alone, large doses of levodopa are required for adequate therapeutic effect. However, these doses often result in nausea and other adverse reactions. Carbidopa inhibits decarboxylation of circulating levodopa, preventing nausea and allowing more levodopa to reach the CNS. Carbidopa does not cross the blood-brain barrier and does not affect the metabolism of levodopa within the CNS.","i":["Parkinson disease","Restless legs syndrome"],"cn":"Take daily for parkinsonian symptoms (tremor/stiffness/slowness)- may require more frequent use if symptoms progress. This medication treats symptoms, but there is no cure for Parkinson's disease. Common side effects are dizziness, somnolence, but can include impulse control problems (eg. Gambling) or change in behavior (eg. delusions/hallucinations).","p":"Since levodopa competes with certain amino acids for transport across the gut wall, the absorption of levodopa may be impaired in some patients on a high protein diet. When changing from regular release to extended release, doses may need to be increased by ≥20%. A combination product of carbidopa, levodopa, and entacapone (Stalevo) is also available. Suspension formulation (Duopa) available for continuous delivery via pump directly into jejunal tube.","lo":"25 mg/100 mg three times daily","ty":"25-100 mg/100-250 mg three to four times daily","mx":"200 mg/2000 mg per day"},{"id":175,"w":9,"g":"Risperidone","b":"Risperdal","c":"Benzisoxazole, Antipsychotic","m":"A potent serotonin-5-HT2 antagonist with weaker dopamine-D2 antagonism. Whereas typical antipsychotics are dopamine antagonists, the additional serotonin antagonism increases efficacy for negative symptoms of schizophrenia and reduces the likelihood of extrapyramidal symptoms.","i":["Schizophrenia","Bipolar disorder","Autistic disorder, irritability","PTSD (off-label)"],"cn":"Takes weeks for full effects. Avoid abrupt discontinuation due to relapse potential. Common side effects are sedation, dizziness, dry mouth; may cause weight gain, increased cholesterol or blood sugar; may cause involuntary body movements. May intensify effects of alcohol. Avoid activities requiring mental alertness or coordination. Use caution with activities leading to an increased core temperature. Report signs/symptoms of hyperglycemia, bradycardia, arrhythmia, tardive dyskinesia, or neuroleptic malignant syndrome.","p":"May be taken once nightly or split dosing throughout the day. Higher risk of elevated prolactin levels, tremor/parkinsonism adverse effects. Long-acting injectable formulations available.","lo":"0.5 mg once daily","ty":"1-2 mg twice daily","mx":"8 mg per day"},{"id":279,"w":9,"g":"Lurasidone","b":"Latuda","c":"Second-Generation (Atypical) Antipsychotic","m":"An atypical antipsychotic agent (benzisothiazole-derivative). It exhibits relatively high affinity for dopamine D2 receptor and serotonin 5-HT7 and 5-HT2A receptors.","i":["Depressive episodes associated with bipolar disorder","Schizophrenia","Bipolar disorder with mixed features (off-label)"],"cn":"Takes weeks for full effects. Take with food for improved absorption (350 cal). Avoid abrupt discontinuation due to relapse potential. Common side effects are sedation, dizziness, dry mouth; may cause weight gain, increased cholesterol or blood sugar; may cause involuntary body movements. May intensify effects of alco
