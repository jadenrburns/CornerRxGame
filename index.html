hol. Avoid activities requiring mental alertness or coordination. Use caution with activities leading to an increased core temperature. Report signs/symptoms of hyperglycemia, bradycardia, arrhythmia, tardive dyskinesia, or neuroleptic malignant syndrome.","p":"Take with food for better absorption. Most often used with breakfast or dinner. Lower weight gain and metabolic syndrome risks.","lo":"20 mg once daily","ty":"40-80 mg once daily","mx":"160 mg per day"},{"id":11,"w":10,"g":"Sertraline","b":"Zoloft","c":"SSRI Antidepressant","m":"An SSRI that indirectly results in a downregulation of β-adrenergic receptors. It has no clinically important effect on noradrenergic or histamine receptors and no effect on MAO. It lacks stimulant, cardiovascular, anticholinergic, and convulsant effects.","i":["Depression","OCD","Panic disorder","Premenstrual dysphoric disorder","Binge eating disorder","Bulimia nervosa","Anxiety"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). May cause nausea, sedation, headache, constipation, and dry mouth. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"Commonly taken in the morning. Not FDA approved for use in children for depression.","lo":"25 mg once daily","ty":"50-100 mg once daily","mx":"200 mg once daily"},{"id":32,"w":10,"g":"Duloxetine","b":"Cymbalta","c":"Serotonin/Norepinephrine Reuptake Inhibitor (SNRI)","m":"A selective serotonin and norepinephrine reuptake inhibitor that exerts its antidepressant and pain inhibitory actions by potentiating the serotonergic and noradrenergic activity in the CNS. It has no significant affinity for adrenergic, dopaminergic, cholinergic, opioid, glutamate, or histaminergic receptors in vitro and does not inhibit monoamine oxidase.","i":["Depression","Anxiety","Diabetic peripheral neuropathy, pain, fibromyalgia"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). Take in the morning. May cause nausea, insomnia, headache, constipation. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"May benefit patients with nerve and muscular skeltal pain conditions. Duloxetine approved for generalized anxiety disorder in children (age 7 and greater). May have higher risk of hepatotoxicity than other antidepressants","lo":"20 mg once daily","ty":"40-60 mg once daily","mx":"120 mg once daily"},{"id":14,"w":10,"g":"Escitalopram","b":"Lexapro","c":"SSRI Antidepressant","m":"The s-enantiomer of racemic citalopram and is an antidepressant that is a selective and potent inhibitor of presynaptic reuptake of serotonin. It does not affect reuptake of norepinephrine or dopamine and has a relative lack of affinity for muscarinic, histamine, α1- and α2-adrenergic, and serotonin receptors.","i":["Depression","Anxiety","OCD","Panic disorder","Hot flashes","Binge eating disorder"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). Take in the morning. May cause nausea, insomnia, headache, constipation. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"Small risk of QTc prolongation. Commonly taken in the morning. FDA approved for use in children (age 12 and above for depression).","lo":"5 mg once daily","ty":"10-20 mg once daily","mx":"20 mg once daily"},{"id":51,"w":10,"g":"Methylphenidate","b":"Ritalin","c":"CNS Stimulant, C-II","m":"A stimulant that increases CNS activity by inhibiting reuptake of norepinephrine and dopamine, increasing neuronal firing rate and stimulating the cerebral cortex and subcortical structures.","i":["ADHD","Narcolepsy","Depression (off-label)"],"cn":"Avoid late evening doses due to resulting insomnia. If you cannot swallow the extended-release capsule, you may open it and pour the medicine into a small amount of soft food such as applesauce. Stir this mixture well and swallow it without chewing.For the patch formulation, apply same time each day, alternating hips. Remove after 9 h.","p":"Available as patch formulation as well as tablet. Some generic versions of the extended-release product are not interchangeable. Administration for prolonged periods of time may lead to drug dependence. Misuse of amphetamines (overuse or crushing/snorting) may cause psychosis, mania, sudden death, and serious cardiovascular adverse events. A complete family and patient history for conditions associated with sudden cardiac death is required.","lo":"5 mg twice daily","ty":"10-60 mg once or twice daily","mx":"60 mg per day"},{"id":15,"w":10,"g":"Dextroamphetamine; amphetamine (mixed salts)","b":"Adderall","c":"CNS Stimulant","m":"Enhances the release and inhibits the reuptake of norepinephrine and dopamine","i":["Attention-deficit hyperactivity disorder (ADHD)","narcolepsy"],"cn":"Take dose in the morning with or without food. Monitor growth rate and weight in children as food intake may be reduced. If capsule opened for administration, drug should be dissolved in water, yogurt, or orange juice and consumed immediately. Report new or worsened psychiatric problems (behavior and thought problems, bipolar illness, aggressive behavior or hostility). Also report chest pain, palpitations, dyspnea, or signs/symptoms of cardiac dysrhythmia, AMI, or cerebrovascular accident.","p":"Administration for prolonged periods of time may lead to drug dependence. Misuse of amphetamines (overuse or crushing/snorting) may cause psychosis, mania, sudden death, and serious cardiovascular adverse events. A complete family and patient history for conditions associated with sudden cardiac death is required.","lo":"5 mg once daily","ty":"10-20 mg once daily","mx":"60 mg per day"},{"id":76,"w":10,"g":"Lisdexamfetamine","b":"Vyvanse","c":"Amphetamine, CNS Stimulant. C-II","m":"A prodrug converted to dextroamphetamine. The mechanism of action of dextroamphetamine in the treatment of ADHD is unknown. Amphetamines cause the release of dopamine and norepinephrine at presynaptic nerve terminals and may block the reuptake of norepinephrine and dopamine by competitive inhibition.","i":["ADHD","Binge eating disorder"],"cn":"Take dose in the morning with or without food. Monitor growth rate and weight in children as food intake may be reduced. If capsule opened for administration, drug should be dissolved in water, yogurt, or orange juice and consumed immediately. Report new or worsened psychiatric problems (behavior and thought problems, bipolar illness, aggressive behavior or hostility). Also report chest pain, palpitations, dyspnea, or signs/symptoms of cardiac dysrhythmia, or cerebrovascular accident.","p":"Vyvanse is a pro-drug which reduces abuse potential (cannot crush and snort). Administration for prolonged periods of time may lead to drug dependence. Misuse of amphetamines may cause psychosis, mania, sudden death, and serious cardiovascular adverse events. A complete family and patient history for conditions associated with sudden cardiac death is required.","lo":"20 mg once daily","ty":"20-70 mg once daily","mx":"70 mg once daily"},{"id":17,"w":10,"g":"Bupropion","b":"Aplenzin, Wellbutrin","c":"Dopamine and norepinephrine uptake inhibitor","m":"A monocyclic antidepressant, unique as a mild dopamine and norepinephrine uptake inhibitor with no direct effect on serotonin receptors or MAO.","i":["Depression","Smoking Cessation","anxiety disorders (off-label)","ADHD (off-label)"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential. Take in the morning for extended release products, and morning and mid-afternoon for twice daily products. May cause insomnia, headache, constipation. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"Stimulating antidepressants may cause insomnia, weight loss, or jitteriness. Avoid in patients with seizure disorders and eating disorders due to seizure risk. Limited risk of withdrawal syndrome or sexual-related side effects compared to other antidepressants. Not FDA approved for use in children.","lo":"150 mg once daily","ty":"150-300 mg once daily","mx":"450 mg once daily"},{"id":128,"w":10,"g":"Dexmethylphenidate","b":"Focalin","c":"CNS Stimulant, C-II","m":"A stimulant that increases CNS activity by inhibiting reuptake of norepinephrine and dopamine, increasing neuronal firing rate and stimulating the cerebral cortex and subcortical structures.","i":["ADHD"],"cn":"Avoid late evening doses due to resulting insomnia. If you cannot swallow the extended-release capsule, you may open it and pour the medicine into a small amount of soft food such as applesauce. Stir this mixture well and swallow it without chewing.","p":"Amphetamines have a high potential for abuse, and administration for prolonged periods of time may lead to drug dependence and should be avoided. Misuse of amphetamines may cause sudden death and serious cardiovascular adverse effects.","lo":"2.5 mg once daily","ty":"5-10 mg once or twice daily","mx":"20 mg twice daily"},{"id":18,"w":10,"g":"Fluoxetine","b":"Prozac","c":"SSRI Antidepressant","m":"A bicyclic antidepressant that is a selective and potent inhibitor of presynaptic reuptake of serotonin.","i":["Depression","OCD","Panic disorder","Bulimia nervosa","PTSD"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). May cause nausea, sedation, headache, constipation, and dry mouth. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"Due to long half-life, does not require taper on discontinuation or conversion to another antidepressant, but this can be done. FDA approved for use in children (age 8 and above) for Depression. When used for premenstrual dysphoric disorder, can be dosed continuously or intermittently (starting 14 d prior to onset of menstruation through the 1st d of menstruation and repeated each cycle).","lo":"10 mg once daily","ty":"20-40 mg once daily","mx":"80 mg once daily"},{"id":162,"w":10,"g":"Atomoxetine","b":"Strattera","c":"Norepinephrine Reuptake Inhibitor, CNS Stimulant","m":"A selective norepinephrine reuptake inhibitor that produces therapeutic effects in patients with ADHD. The exact mechanism of how selective inhibition of presynaptic norepinephrine exerts effects in ADHD has not been determined.","i":["ADHD"],"cn":"Takes weeks for full effects. Take every day and do not abruptly discontinue unless instructed by your provider. Common side effects are dizziness, sedation, and lowered heart rate and blood pressure. Avoid activities requiring mental alertness or coordination until drug effects are realized. Growth rate and weight loss is lower risk with non-stimulants in ADHD. Report new or worsened psychiatric problems, chest pain, palpitations, dyspnea, or signs/symptoms of cardiac dysrhythmias, MI, or cerebrovascular accident.","p":"Not approved by FDA for combination with stimulants for Adhd. May be used for Adult ADHD and lower abuse potential than stimulants. May cause mania in patients with bipolar disorder. Monitor patients closely for suicidality (suicidal thinking and behavior), clinical worsening, or unusual changes in behavior. Close observation and communication with the prescriber by families and caregivers is recommended.","lo":"40 mg once daily","ty":"80 mg once daily","mx":"100 mg once daily"},{"id":9,"w":11,"g":"Gabapentin","b":"Neurontin","c":"Gamma Aminobutyric Acid Analog, Anticonvulsant;\n\nC-V in some states","m":"A cyclohexane compound that is structurally related to GABA; its mechanism of action is not known. Gabapentin does not interact with GABA receptors or alter the formation, release, degradation, or reuptake of GABA.","i":["Seizures","Postherpetic neuralgia","Diabetic peripheral nephropathy","Restless leg syndrome","Neuropathic pain"],"cn":"First dose on 1st day should be taken at bedtime. ER formulation should be taken with the evening meal. Patient should avoid activities requiring mental alertness or coordination until drug effects are realized, as drug may cause dizziness and somnolence. Report worsening depression, suicidal ideation, or unusual changes in behavior. Avoid sudden discontinuation of drug, as this may precipitate seizures. Wait 2 h after antacid before taking gabapentin.","p":"Use in renally compromised patients <12 y of age has not been studied. Renal dosage adjustments needed. Gabapentin dose reductions, discontinuation, or substitutions with alternative medications should be performed gradually over a min 1 wk. Medication guide required at dispensing. Has been scheduled (C-V) in Kentucky and Michigan due to increasing recreational use. Under consideration for scheduling federally as well.","lo":"300 mg once daily","ty":"300-600 mg three times daily","mx":"1200 mg three times daily (3600 mg per day)"},{"id":121,"w":11,"g":"Methocarbamol","b":"Robaxin","c":"Centrally Acting Skeletal Muscle Relaxant","m":"The mechanism of action in humans has not been established but may be due to general CNS depression. It has no direct action on the contractile mechanism of striated muscle, the motor end plate, or the nerve fiber.","i":["Musculoskeletal postop pain or spasms"],"cn":"Patients should avoid activities requiring mental alertness or coordination until drug effects are known, as drug may cause dizziness or sedative effects.","p":"Methocarbamol is used for the relief of discomfort associated with acute, painful musculoskeletal conditions in adults and should be used for only short periods (up to 2 or 3 wk). Drug may color urine brown, black, or green. Injectable form available, used for spasticity associated with tetanus. Should avoid concomitant use with opioids.","lo":"500 mg 3-4 times daily","ty":"1500 mg 3-4 times daily","mx":"8000 mg per day"},{"id":25,"w":11,"g":"Hydrocodone","b":"Norco","c":"Opioid, C-II","m":"An opioid analgesic and antitussive with unknown mechanism of action, but it is thought to be related to the presence of opiate receptors in the CNS.","i":["Pain, severe"],"cn":"Use a stool softener and/or laxative for preventing constipation with chronic use. May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol and other CNS depressants.","p":"Use caution in elderly; appear more sensitive to the effect. Should avoid concomitant use with benzodiazepines. Tolerance and physical dependence may occur with chronic use; avoid abrupt discontinuation. If using a combination product including acetaminophen, do not exceed max daily dose (3 g) of acetaminophen. All hydrocodone-containing combination products are now schedule II, including Vicodin, while other opioid/acetaminophen combinations are in less restrictive schedules. Various other combinations available, including hydrocodone with chlorpheniramine cough liquid (Tussionex).","lo":"2.5 mg every 4-6 hours as needed","ty":"5-10 mg every 4-6 hours as needed","mx":"20 mg every 4-6 hours as needed"},{"id":146,"w":11,"g":"Memantine","b":"Namenda","c":"N-Methyl-D-Aspartate (NMDA) Receptor Antagonist","m":"Activation of NMDA receptors by glutamate is believed to contribute to the symptomatology of Alzheimer disease. It is believed to act as an uncompetitive (open-channel) NMDA receptor antagonist that binds preferentially to the NMDA receptor-operated cation channels. There is no evidence that memantine prevents or slows neurodegeneration in patients with Alzheimer disease.","i":["Alzheimer disease"],"cn":"Takes weeks for full effects. Will not reverse symptoms of alzheimer's disease but can slow the progression. May be taken with or without food. Should not be abruptly discontinued unless patient has severe adverse reaction. Common side effects include: diarrhea, cough, dizziness, headache.","p":"May be combined with donepezil or other cholinesterase inhibitors for moderate-severe alzheimer's disease. Little data support efficacy in vascular dementia; small, short placebo-controlled trials have demonstrated improved cognition but not activities of daily living.","lo":"5 mg once daily","ty":"10-20 mg once daily","mx":"28 mg per day"},{"id":37,"w":11,"g":"Tramadol","b":"Ultram","c":"Opioid, C-IV","m":"A mu agonist and a weak inhibitor of serotonin and norepinephrine reuptake. Mu receptors are responsible for analgesia, respiratory depression, miosis, decreased GI motility, and euphoria. In the CNS, it promotes analgesia and respiratory depression by decreasing brain stem respiratory centers’ response to carbon dioxide tension and electrical stimulation.","i":["Pain, chonic"],"cn":"Use a laxative for preventing constipation if used chronically. May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol and other CNS depressants. Extended-release products must not be crushed or chewed, but may be taken with or without food, and always the same way to avoid variability in absorption.","p":"Tolerance and physical dependence may occur with chronic use; avoid abrupt discontinuation. Tramadol-related deaths have been reported in patients with histories of emotional disturbances, suicidal ideation/attempts, or misuse of tranquilizers, alcohol, and other CNS-active drugs. Suspension and creams are available in compounding kits. Avoid concomitant use with benzodiazepines. Although tramadol is an opiate receptor agonist, it does not appear to produce significant respiratory depression or cardiovascular effects in most patients.","lo":"50 mg every 4-6 hours as needed","ty":"50-100 mg every 4-6 hours as needed","mx":"100 mg four times daily (400 mg per day)"},{"id":157,"w":11,"g":"Morphine","b":"MS Contin","c":"Opioid, C-II","m":"A pure mu agonist. Mu receptors are responsible for analgesia, respiratory depression, miosis, decreased GI motility, and euphoria. In the CNS, it promotes analgesia and respiratory depression by decreasing brain stem respiratory centers’ response to carbon dioxide tension and electrical stimulation. It also decreases gastric, biliary, and pancreatic secretion, induces peripheral vasodilation, and promotes opioid-induced hypotension due to histamine release.","i":["Pain, chronic or acute"],"cn":"Use a stimulant laxative for preventing opioid-induced constipation. May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol and other CNS depressants. Extended-release products must not be crushed or chewed. Crushing or chewing will release the total dose of morphine at once and increase risk of respiratory depression. ER capsule can be opened and sprinkled on soft food but must be swallowed whole and not chewed.","p":"Tolerance and physical dependence may occur with chronic use; avoid abrupt discontinuation. Extended-release products are not for use in children. Fatal respiratory depression has occurred; highest risk at initiation and with dosage increases. Do not administer Avinza with alcoholic beverages or ethanol-containing products, which may disrupt extended-release characteristic of product. Highly concentrated oral solutions are available. Check doses carefully when using highly concentrated oral solutions. Avoid concomitant use with benzodiazepines. The 100 mg/5 mL (20 mg/mL) concentration is indicated for use in opioid-tolerant patients only. Under REMS program requirements.","lo":"10 mg every 4 hours as needed","ty":"15-30 mg every 4 hours as needed","mx":"200 mg per day"},{"id":50,"w":11,"g":"Oxycodone ir, oxycodone er","b":"OxyContin","c":"Opioid, C-II","m":"A pure mu agonist. Mu receptors are responsible for analgesia, respiratory depression, miosis, decreased GI motility, and euphoria. In the CNS, it promotes analgesia and respiratory depression by decreasing the brain stem respiratory centers’ response to carbon dioxide tension and electrical stimulation. It also decreases gastric, biliary, and pancreatic secretion, induces peripheral vasodilation, and promotes opioid-induced hypotension due to histamine release.","i":["Pain, chonic"],"cn":"Use laxative for preventing constipation. May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol and other CNS depressants.","p":"Significant drug of abuse. Tolerance and physical dependence may occur with chronic use; avoid abrupt discontinuation. Extended-release products must not be crushed or chewed. Crushing or chewing will release the total dose of oxycodone at once and increase risk of respiratory depression. Extended-release products are not for use in children. Advise patients to keep in safe place, and dispose properly when no longer needed. Under REMS program requirements. Medication guide required when dispensing. Avoid concomitant use with benzodiazepines. Use of combination product with acetaminophen preferred due to beneficial pain management effect abuse potential.","lo":"5 mg every 4-6 hours as needed","ty":"5-10 mg every 4-6 hours as needed","mx":"30 mg every 4 hours (90 mg per day)"},{"id":253,"w":11,"g":"Hydromorphone","b":"Dilaudid","c":"Opioid Analgesic CII","m":"Binds to opioid receptors in the CNS","i":["Moderate to severe pain"],"cn":"- Take the medication as directed for moderate to severe pain relief. - Avoid concomitant use with other central nervous system depressants.","p":"- Hydromorphone is a potent opioid analgesic. - Monitor for respiratory depression, sedation, and potential opioid-related adverse effects. - Educate about the risk of dependence and overdose.","lo":"2 mg every 4-6 hours as needed","ty":"4-8 mg every 4-6 hours as needed","mx":"64 mg per day"},{"id":93,"w":11,"g":"Acetaminophen; oxycodone","b":"Percocet, Endocet","c":"","m":"","i":[],"cn":"","p":"","lo":"","ty":"","mx":""},{"id":271,"w":11,"g":"Fentanyl transdermal","b":"Duragesic","c":"Opioid, C-II","m":"A phenylpiperidine opioid agonist with predominant effects on the mu opioid receptor and is about 50-100 times more potent as an analgesic than morphine.","i":["Chronic pain"],"cn":"Use a laxative for preventing constipation. May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol and other CNS depressants. Apply to clean, dry skin and rotate spots. Skin breaks may increase absorption. Remove old patch when new patch applied. Flush old patches down toilet. Febrile patients may have increased absorption. Monitor carefully.","p":"Not appropriate for treatment of acute pain. Use caution in elderly; appear more sensitive to the effects. Tolerance and physical dependence may occur with chronic use; avoid abrupt discontinuation. Significant addiction potential, care with storage and disposal. Under REMS program requirements. Also available as injectable, nasal spray, oral liquid, buccal film, buccal tablet, and sublingual tablet. Do not convert patients on a mcg-per-mcg basis from one fentanyl product to another fentanyl product; the substitution of one fentanyl product for another fentanyl product may result in a fatal overdose. Do not cut patch. Contraindicated in opioid-naïve patients; use limited to opioid tolerant patients. Avoid concomitant use with benzodiazepines, alcohol or other CNS depressants. Absorption from patch is delayed 12-24 h after patch placement due to depot effect in the outer layer of skin. Skin depot also results in lingering presence of drug in serum after patch removal.","lo":"12 mcg/hour patch every 72 hours","ty":"25-100 mcg/hour patch every 72 hours","mx":"100 mcg/hour patch every 72 hours"},{"id":44,"w":12,"g":"Citalopram","b":"Celexa","c":"SSRI Antidepressant","m":"A bicyclic antidepressant that is a selective and potent inhibitor of presynaptic reuptake of serotonin (an SSRI). It does not affect reuptake of norepinephrine or dopamine and has a relative lack of affinity for muscarinic, histamine, α1- and α2-adrenergic, and serotonin receptors.","i":["Depression"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). May cause nausea, sedation, headache, constipation, and dry mouth. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"Small risk of QTc prolongation. Commonly taken in the morning. Not FDA approved for use in children for depression.","lo":"10 mg once daily","ty":"20-40 mg once daily","mx":"40 mg once daily"},{"id":197,"w":12,"g":"Nortriptyline","b":"Pamelor","c":"Tricyclic Antidepressant","m":"The demethylated metabolite of amitriptyline, a heterocyclic antidepressant that blocks presynaptic reuptake of norepinephrine with subsequent downregulation of adrenergic receptors. Heterocyclic antidepressants have less effect on serotonergic activity than on other neurotransmitters.","i":["Depression","Pain, chronic","Diabetic neuropathy"],"cn":"Avoid activities requiring mental alertness or coordination until drug effects are realized, as drug may cause somnolence and dizziness. Report worsening depression, suicidal ideation, unusual changes in behavior, or unusual bleeding. Avoid abrupt discontinuation; may precipitate withdrawal symptoms. Do not drink alcohol while taking this drug.","p":"Symptomatic improvement may not be seen for 4-8 wk. Medication guide required at dispensing. Taper dose over 2-4 wk if discontinuing therapy which lasted >3 wk.","lo":"10 mg once daily","ty":"25-50 mg once daily","mx":"150 mg per day"},{"id":48,"w":12,"g":"Cyclobenzaprine","b":"Flexeril","c":"Centrally Acting Skeletal Muscle Relaxant","m":"Relieves skeletal muscle spasm of local origin without interfering with muscle function. It is ineffective in muscle spasm due to CNS disease. Evidence suggests that the net effect of cyclobenzaprine is a reduction in tonic motor activity, influencing both gamma (𝛾) and alpha (α) motor systems.","i":["Skeletal muscle spasms","Fibromyalgia"],"cn":"Patients should avoid activities requiring mental alertness or coordination until drug effects are known, as drug may cause dizziness or sedative effects. Take extended-release capsule same time each day.","p":"Should be used for only short periods (up to 2-3 wk). Should avoid concomitant use with opioids. Should be used with caution in patients with glaucoma, increased IOP, urinary retention, etc, as cyclobenzaprine has anticholinergic-like effects. Avoid use in elderly; may be more sensitive to effects.","lo":"5 mg three times daily","ty":"10 mg three times daily","mx":"10 mg three times daily"},{"id":201,"w":12,"g":"Codeine","b":"Tylenol with Codeine","c":"Opioid, C-II; \n\nCIII if combined with acetaminophen in tablet;\n\nCIV if combined with acetaminophen in liquid","m":"3-methylmorphine, a phenanthrene opioid with very low affinity for opioid receptors. Its analgesic activity appears to result from conversion to morphine.","i":["Pain","Cough"],"cn":"If using chronically, use laxative for preventing constipation. May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol.","p":"Use caution in elderly, appear more sensitive to the effects. Use CNS depressants with caution; may have additive effects. Avoid concomitant use with benzodiazepines. Tolerance and physical dependence may occur; avoid abrupt discontinuation. Patients with multiple CYP2D6 gene copies metabolize codeine more rapidly (ultrarapid metabolism), whereas patients who lack functional CYP2D6 genes do not metabolize codeine to morphine and do not experience analgesic effects. In ultrarapid metabolizers, deaths in children and nursing infants have been reported resulting in contraindication against use in children < 12 y of age. CYP2D6 inhibitors, especially SSRIs, may also prevent activation of codeine to morphine. Codeine also available in liquid formulation in combination with guaifenesin for cough. Under REMS program requirements for all opioids. When in combination with APAP, C-III for tablets and C-V for liquid.","lo":"15 mg every 4-6 hours as needed","ty":"30 mg every 4-6 hours as needed","mx":"60 mg every 4-6 hours (360 mg per day)"},{"id":52,"w":12,"g":"Venlafaxine","b":"Effexor","c":"Serotonin/Norepinephrine Reuptake Inhibitor (SNRI)","m":"Potent reuptake inhibitor of serotonin and norepinephrine but lacks effects on muscarinic, α-adrenergic, or histamine receptors.","i":["Depression","Anxiety","Panic disorder","OCD","Hot flashes"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). Take in the morning. May cause nausea, insomnia, headache, constipation. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"Take medication in the morning due to stimulating effects. Withdrawal syndromes more common and slower titrations off medication needed. Not FDA approved for use in children.","lo":"37.5 mg once daily","ty":"75-150 mg once daily","mx":"225 mg once daily"},{"id":238,"w":12,"g":"Acetaminophen; butalbital; caffeine","b":"Fioricet","c":"Analgesic; Barbiturate; Stimulant","m":"Acetaminophen: Inhibits prostaglandin synthesis; Butalbital: Enhances GABA activity; Caffeine: CNS stimulant","i":["Tension headaches"],"cn":"Take as directed for the relief of tension headaches. - Avoid excessive caffeine intake from other sources. - Limit the use to avoid medication overuse headache.","p":"- Butalbital is a barbiturate and may cause sedation or dependence with long-term use. - Acetaminophen can cause liver toxicity if taken in high doses or combined with alcohol.","lo":"","ty":"","mx":""},{"id":99,"w":12,"g":"Mirtazapine","b":"Remeron","c":"α2-Antagonist","m":"An antidepressant that antagonizes presynaptic α2-adrenergic auto- and heteroreceptors that are responsible for controlling the release of norepinephrine and serotonin (5-HT). It is also a potent antagonist of postsynaptic 5-HT2 and 5-HT3 receptors. The net outcome of these effects is increased noradrenergic activity and enhanced 5-HT activity, especially at 5-HT1A receptors. This unique mechanism of action preserves antidepressant efficacy but minimizes many of the adverse effects common to heterocyclic antidepressants and SSRIs.","i":["Depression","Insomnia (off-label)x","Headache (off-label)","Panic disorder (off-label)"],"cn":"Takes weeks for full effects for depression; insomnia may improve with first dose. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential. Nightime dosing is common due to sedation. May cause nausea, sedation, headache, constipation, and dry mouth. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"Usually taken at bedtime due to sedation. This drug can cause anticholinergic side effects, weight gain, and QTc prolongation. Limited risk of withdrawal syndrome or sexual-related side effects compared to other antidepressants.","lo":"7.5 mg nightly","ty":"15-30 mg nightly","mx":"45 mg once daily"},{"id":246,"w":12,"g":"Diphenhydramine","b":"Benadryl","c":"Antihistamine","m":"Blocks histamine receptors in the body","i":["Allergic reactions, insomnia"],"cn":"- Take the medication as directed for the relief of allergy symptoms or as a sleep aid. - Avoid driving or operating machinery if drowsiness occurs.","p":"- Diphenhydramine can cause drowsiness and anticholinergic side effects. - Use caution in elderly patients.","lo":"","ty":"","mx":""},{"id":185,"w":12,"g":"Desvenlafaxine","b":"Pristiq","c":"Serotonin/\nNorepinephrine Reuptake Inhibitor (SNRI)","m":"A potent reuptake inhibitor of serotonin and norepinephrine but lacks effects on muscarinic, α-adrenergic, or histamine receptors.","i":["Depression","Vasomotor symptoms of menopause"],"cn":"Takes weeks for full effects. Do not stop taking medication once depression improves and do not stop abruptly due to relapse potential and risk of withdrawal symptoms (eg. dizziness, flu-like symptoms, brain zaps). Take in the morning. May cause nausea, insomnia, headache, constipation. May excerbate or cause mania in patients with bipolar disorder. Avoid alcohol as it may worsen depression. CNS depressants may impair mental alertness, so evaluate how you feel before driving or operating machinery.","p":"Similar side effects as venlafaxine. Withdrawal syndromes more common and slower titrations off medication needed. Not FDA approved for use in children.","lo":"25 mg once daily","ty":"50 mg once daily","mx":"100 mg once daily"},{"id":258,"w":12,"g":"Buprenorphine/naloxone","b":"Bunavail","c":"Opioid Partial Agonist and Antagonist Combination","m":"A μ-opioid receptor partial agonist and a κ-opioid receptor antagonist. Naloxone is a μ-opioid receptor antagonist that causes opioid withdrawal when injected parenterally and is included in the formulation to reduce the risk of abuse.","i":["Opioid use disorder"],"cn":"Use a stool softener and/or laxative for preventing constipation. May cause drowsiness; avoid driving or other tasks requiring motor coordination. Avoid alcohol and other CNS depressants. Do not crush or swallow the sublingual tablet. Place the tablet under the tongue until it is dissolved. If you take ≥2 tablets at a time, place all of the tablets under the tongue together.","p":"The opioid agonist properties of buprenorphine are limited by a ceiling effect which occurs at higher doses. Monitor for signs of diversion; case reports exist of users crushing or dissolving various formulations of buprenorphine/naloxone. The strengths of sublingual films and tablets are not interchangeable. Not recommended for treatment of dependence on long-acting opiates or methadone; useful for withdrawal of short-acting opiates and heroin. Both naloxone and buprenorphine are available as separate agents in a wide range of formulations.","lo":"2 mg/0.5 mg once daily","ty":"8-16 mg/2-4 mg once daily","mx":"32 mg/8 mg per day"},{"id":67,"w":13,"g":"Latanoprost","b":"Xalatan","c":"Prostaglandin, Antiglaucoma Agent","m":"A prostaglandin F2-alpha analog. It is believed to reduce IOP by increasing the outflow of aqueous humor. Studies suggest that the main mechanism of action is increased uveoscleral outflow, but the exact mechanism is unknown","i":["Open-angle glaucoma","Ocular HTN"],"cn":"Wash hands and remove contact lenses before using the medicine. For administration, lie down or tilt your head back. With your index finger, pull down the lower lid of your eye to form a pocket. Hold the dropper close to your eye with the other hand. Drop the correct number of drops into the pocket made between your lower lid and eyeball. Gently close your eyes. Place your index finger over the inner corner of your eye for 1 min. Do not rinse or wipe the dropper or allow it to touch anything, including your eye. Put the cap on the bottle right away.","p":"If used concurrently with pilocarpine, separate dose by 1 h if possible. Separate administration from other ophthalmic products by at least 5 min. Advise patients that there is a risk of permanent increased iris pigmentation associated with instillation of this product. Do not administer more than once daily to avoid loss of therapeutic effect. Store intact bottles under refrigeration. Opened bottles may be stored at room temperature for 6 wk.","lo":"","ty":"","mx":""},{"id":217,"w":13,"g":"Dorzolamide; timolol","b":"Cosopt","c":"Carbonic Anhydrase Inhibitor; Beta Blocker","m":"Dorzolamide: Reduces aqueous humor production; Timolol: Reduces aqueous humor production and intraocular pressure","i":["Glaucoma"],"cn":"- Use the medication as prescribed to lower intraocular pressure. - Administer eye drops as instructed, and do not touch the dropper tip.","p":"- Dorzolamide can cause local ocular irritation and allergic reactions. - Timolol can mask symptoms of hypoglycemia. - Monitor intraocular pressure and assess for systemic beta-blocker adverse effects.","lo":"","ty":"","mx":""},{"id":172,"w":13,"g":"Timolol","b":"Betimol","c":"Beta-blocker, Antiglaucoma Agent","m":"Blocks both beta1- and beta2-adrenergic receptors and reduces intraocular pressure by reducing aqueous humor production.","i":["Open-angle glaucoma","Ocular HTN"],"cn":"Wash your hands and remove contact lenses before using the medicine. For administration of Lumigan, lie down or tilt head back. With index finger, pull down the lower lid of eye to form a pocket. Hold the dropper close to eye with the other hand. Drop the correct number of drops into the pocket made between lower lid and eyeball. Gently close eyes. Place index finger over the inner corner of eye for 1 min. Do not rinse or wipe the dropper or allow it to touch anything, including eye. Put the cap on the bottle right away. Separate from other eye drops by 5 min. Reinsert contact lens after 15 min.","p":"Systematic absorption occurs and can cause systemic adverse effects. Topical prostaglandins are usual drugs of first choice, although beta blockers can be used as initial therapy in patients who are not able to tolerate prostaglandins.","lo":"","ty":"","mx":""},{"id":222,"w":13,"g":"Moxifloxacin","b":"Avelox","c":"Fluoroquinolone Antibiotic, Ophthalmic","m":"A fluoroquinolone that inhibits bacterial topoisomerase II and IV. It has a broad spectrum of activity, including gram-positive and gram-negative organisms, and anaerobes.","i":["Bacterial conjunctivitis"],"cn":"Symptoms should improve within 2-3 d but complete full course of therapy. If symptoms worsen, seek follow-up with health-care practitioner. Wash hands with soap and water before and after use. Lie down or tilt your head back. With your index finger, pull down the lower lid of your eye to form a pocket. Hold the dropper close to your eye, but not touching, with the other hand. Drop the correct number of drops into the pocket made between your lower lid and eyeball. Gently close your eyes. Place your index finger over the inner corner of your eye for 1 min. Do not rinse or wipe the dropper or allow it to touch anything, including your eye. Contact lenses should not be worn during therapy","p":"Bacterial conjunctivitis is very contagious and spreads by direct contact.","lo":"400 mg once daily","ty":"400 mg once daily","mx":"400 mg once daily"},{"id":177,"w":13,"g":"Cyclosporine ophthalmic","b":"Restasis","c":"Calcineurin Inhibitor","m":"Ocular inflammation associated with keratoconjunctivitis sicca results in reduced tear production. Cyclosporin binds to cyclophilin, which inhibits the antigenic response of helper T lymphocytes, which reduces the production of interleukin 2 and suppresses interferon-gamma. Inhibition of the immune response limits inflammation.","i":["Keratoconjunctivitis sicca"],"cn":"Cyclosprine ophthalmic comes in single-use packages. After you open a single-use package, use immediately. Mix well just before using it. To do this, turn the single-use package upside down a few times. Remove contact lenses before using this medicine. Wait at least 15 min before inserting contact lenses after use. May be used with artificial tears as long as there is 15-min interval in between.","p":"Not for use in children <16 y of age. Oral and injectable formulations available for transplant rejection prevention.","lo":"","ty":"","mx":""},{"id":224,"w":13,"g":"Bimatoprost","b":"Lumigan","c":"Prostaglandin","m":"A synthetic prostaglandin analogue. Bimatoprost lowers intraocular pressure (IOP) by increasing the outflow of aqueous humor through both the trabecular meshwork and uveoscleral drainage systems. The exact mechanism of action for bimatoprost in stimulating eyelash growth is unknown.","i":["Ocular hypertension and open-angle glaucom","Hypotrichosis of the eyelashes"],"cn":"Wash your hands and remove contact lenses before using the medicine. For administration of Lumigan, lie down or tilt head back. With index finger, pull down the lower lid of eye to form a pocket. Hold the dropper close to eye with the other hand. Drop the correct number of drops into the pocket made between lower lid and eyeball. Gently close eyes. Place index finger over the inner corner of eye for 1 min. Do not rinse or wipe the dropper or allow it to touch anything, including eye. Put the cap on the bottle right away. Separate from other eye drops by 5 min. For administration of Latisse, wash face and remove makeup before applying. Do not rinse eye if solution gets into the eye. Do not reuse supplied sterile applicators or use any other brush/applicator other than those supplied. Use a new applicator for second eye. Do not apply to lower lid, or more than once per day. Reinsert contact lens after 15 min.","p":"There is a risk of permanent increased brown iris pigmentation associated with instillation of this product, and with leakage of Latisse into the eye. The effect of Latisse on eyelash length, thickness, and darkness is not permanent and will return to baseline upon discontinuation of bimatoprost.","lo":"","ty":"","mx":""},{"id":186,"w":13,"g":"Dorzolamide","b":"Trusopt","c":"Carbonic Anhydrase Inhibitor","m":"Reduces aqueous humor production","i":["Glaucoma"],"cn":"- Use the medication as prescribed to lower intraocular pressure. - Administer eye drops as instructed, and do not touch the dropper tip.","p":"- Dorzolamide eye drops can cause local ocular irritation and allergic reactions. - Monitor for signs of ocular surface disease or electrolyte imbalance.","lo":"","ty":"","mx":""},{"id":240,"w":13,"g":"Olopatadine","b":"Patanol","c":"Antihistamine, Ophthalmic","m":"A relatively selective histamine H1-antagonist that exerts its effect by inhibiting the release of histamine from mast cells. It also blocks the type 1 immediate hypersensitivity reactions, including prevention of histamine-mediated effects on human conjunctival epithelial cells. It has no activity on dopamine, α-adrenergic, and muscarinic types 1 and 2 receptors.","i":["Allergic conjunctivitis"],"cn":"Wash hands. For administration, lie down or tilt head back. With index finger, pull down the lower lid of eye to form a pocket. Hold the dropper close to eye with the other hand. Drop the correct number of drops into the pocket made between lower lid and eyeball. Gently close eyes. Place index finger over the inner corner of your eye for 1 min. Do not rinse or wipe the dropper or allow it to touch anything, including eye. Put the cap on the bottle right away. Twice-daily dosing should be at least 6-8 h apart. Remove contact lens prior to administration and wait at least 10 min before reinserting. Do not use contact lenses if eyes are irritated.","p":"Not for use to treat contact lens-related irritation. Efficacy and safety established for patients ≥3 y of age. Also available in nasal formulation for seasonal allergic rhinitis. OTC formulation also available.","lo":"","ty":"","mx":""},{"id":204,"w":13,"g":"Brimonidine","b":"Alphagan","c":"Adrenergic Agonist","m":"A relatively selective α-adrenergic agonist, reduces aqueous humor production and increases uveoscleral outflow. It is used to lower IOP in open-angle glaucoma or ocular hypertension.","i":["Open-angle glaucoma","Ocular redness (OTC indication","Ocular hypertension"],"cn":"Wash your hands and remove contact lenses before using the medicine. For administration, lie down or tilt head back. With index finger, pull down the lower lid of eye to form a pocket. Hold the dropper close to eye with the other hand. Drop the correct number of drops into the pocket made between lower lid and eyeball. Gently close eyes. Place index finger over the inner corner of your eye for 1 min. Do not rinse or wipe the dropper or allow it to touch anything, including eye. Put the cap on bottle right away. Reinsert contacts after 15 min. Separate administration of other ophthalmic agents by 5 min.","p":"This agent has no specific advantage over other similar products for the reduction in IOP in chronic ocular hypertension or in the treatment of glaucoma. Topical product available for treatment of rosacea. Also available in combination with timolol (Combigan) or brinzolamide (Simbrinza) for treatment of glaucoma. Low-concentration product (Lumify) available OTC for the treatment of redness of the eye due to minor eye irritations.","lo":"","ty":"","mx":""},{"id":294,"w":13,"g":"Travoprost","b":"Travatan","c":"Prostaglandin, Antiglaucoma Agent","m":"A prostaglandin F2-alpha analogue. It is believed to reduce intraocular pressure by increasing the outflow of aqueous humor. Studies suggest that the main mechanism of action is increased uveoscleral outflow, but the exact mechanism is unknown.","i":["Open-angle glaucoma","Ocular HTN"],"cn":"Wash your hands and remove contact lenses before using the medicine. For administration, lie down or tilt your head back. With your index finger, pull down the lower lid of your eye to form a pocket. Hold the dropper close to your eye with the other hand. Drop the correct number of drops into the pocket made between your lower lid and eyeball. Gently close your eyes. Place your index finger over the inner corner of your eye for 1 min. Do not rinse or wipe the dropper or allow it to touch anything, including your eye. Put the cap on the bottle right away. Do not exceed once-daily dosing (may decrease efficacy). Separate administration of other ophthalmic agents by at least 5 min.","p":"Advise patients that there is a risk of permanent increased iris pigmentation associated with instillation of this product. May change length and number of eye lashes.","lo":"","ty":"","mx":""},{"id":57,"w":14,"g":"Estradiol oral","b":"Estrace","c":"Estrogen","m":"Estradiol (17β-estradiol; E2) is the most potent of the naturally occurring estrogens and the major estrogen secreted during the reproductive years. Estradiol and other estrogens produce characteristic effects on specific tissues (such as breast), cause proliferation of vaginal and uterine mucosa, increase calcium deposition in bone, and accelerate epiphyseal closure after initial growth stimulation.","i":["Menopause associated vasomotor function and atrophy of vagina/vulva","Breast cancer","Carcinoma of prostate","Postmenopausal osteoporosis","Hypoestrogenism,  transgender female hormonal therapy"],"cn":"Report abnormal vaginal bleeding or signs/symptoms of a thromboembolic disorder. Do not smoke during therapy, as this increases the risk of thromboembolic events.","p":"Estrogens increase the risk of endometrial cancer; monitor for abnormal vaginal bleeding. Increased risks of MI, stroke, invasive breast cancer, pulmonary emboli, and DVT in postmenopausal women have been reported. An increased risk of developing dementia in women ≥65 y of age has also been reported. Estrogens, with or without progestins, should be prescribed at the lowest effective doses and for the shortest duration possible. Also available as injectable, in a variety of topical formulations (gel, cream, aerosol spray, patch, etc) and as a vaginal ring.","lo":"0.5 mg once daily","ty":"1-2 mg once daily","mx":"2 mg once daily"},{"id":117,"w":14,"g":"Progesterone","b":"Prometrium","c":"Progestin Hormone","m":"Transforms proliferative endometrium into secretory endometrium. Parenterally administered progesterone inhibits gonadotropin production, which in turn prevents follicular maturation and ovulation.","i":["Prevention of estrogen-induced endometrial hyperplasia","Secondary physiologic amenorrhea"],"cn":"Take at bedtime once daily, without regard to meals. If GI upset occurs, taking with food may help. Common ADRs include nausea, abdominal pain, bloating, breast tenderness.","p":"Indicated in patients with a uterus receiving estrogen therapy (eg, for vasomotor symptoms associated with menopause or secondary amenorrhea). May be administered either cyclically (preferred in late menopausal transition and early postmenopause or functional hypothalamic amenorrhea) or continuously (preferred if >2 to 3 years postmenopause).","lo":"","ty":"","mx":""},{"id":58,"w":14,"g":"Estradiol transdermal patch","b":"Climara, multiple brands","c":"Estrogen","m":"Estradiol (17β-estradiol; E2) is the most potent of the naturally occurring estrogens and the major estrogen secreted during the reproductive years. Estradiol and other estrogens produce characteristic effects on specific tissues (such as breast), cause proliferation of vaginal and uterine mucosa, increase calcium deposition in bone, and accelerate epiphyseal closure after initial growth stimulation.","i":["Menopause associated vasomotor function and atrophy of vagina/vulva","Postmenopausal osteoporisis"],"cn":"Report abnormal vaginal bleeding or signs/symptoms of a thromboembolic disorder. Do not smoke during therapy, as this increases the risk of thromboembolic events. Place patch on clean, dry skin, preferably on the lower abdomen, upper quadrant of the buttock, or outer aspect of the hip; do not apply to the breasts or waistline; rotate sites of application with 1 wk allowed between applications to a particular site.","p":"Estrogens increase the risk of endometrial cancer; monitor for abnormal vaginal bleeding. Increased risks of MI, stroke, invasive breast cancer, pulmonary emboli, and DVT in postmenopausal women have been reported. An increased risk of developing dementia in women ≥65 y of age has also been reported. Estrogens, with or without progestins, should be prescribed at the lowest effective doses and for the shortest duration possible. Also available in injectable, oral, and vaginal formulations, as well as a number of other topical formulations. Patch contains metal; remove prior to MRI. Do not cut patch.","lo":"0.025 mg/day patch twice weekly","ty":"0.05 mg/day patch twice weekly","mx":"0.1 mg/day patch twice weekly"},{"id":119,"w":14,"g":"Testosterone","b":"AndroGel","c":"Androgen. C-III","m":"An endogenous androgen. Androgens are responsible for normal growth and development of male sex organs. Testosterone is involved in the growth and maturation of the prostate, seminal vesicles, penis, and scrotum; development of male hair distribution; laryngeal enlargement; vocal cord thickening; alterations in body musculature; and fat distribution.","i":["Hypogonadism","Female-to-male gender affirming treatment (off-label)"],"cn":"Gel to be applied to clean, dry, intact skin of the shoulders and upper arms and/or abdomen but should not be applied to genitals. Gel should be allowed to dry well; swimming and showering should be avoided for 5-6 h after application. Patients should keep application site covered, as direct skin contact can transfer drug to others. Male patients should report too frequent or persistent erections. Female sexual partners of patients using drug should report male-like changes. Do not use higher doses than you have been prescribed, or combine with other anabolic steroids, serious adverse effects can occur. Seek medical attention if chest pain, shortness of breath, signs of stroke, or behavioral changes.","p":"In addition to topical dosage forms (gel and patch), other dosage forms include subcutaneous implants and injectable, which are indicated for delayed puberty, breast cancer, female-to-male gender identity disorder, and others. Avoid other medications containing testosterone, including those purchased without a prescription in health food stores or on the Internet. The patch may contain metal; remove prior to MRIs. Testosterone has been subject to abuse, typically at doses higher than recommended for the approved indication and in combination with other anabolic androgenic steroids.","lo":"50 mg once daily","ty":"50-100 mg once daily","mx":"100 mg once daily"},{"id":79,"w":14,"g":"Ethinyl estradiol; norethindrone","b":"Loestrin","c":"Combined hormonal contraceptive (estrogen/progestin)","m":"Prevents ovulation through suppression of follicle-stimulating hormone (FSH) and luteinizing hormone (LH); thins cervical mucus; alters endometrial lining, alters ovum transport.","i":["Contraception, acne treatment"],"cn":"Take once daily at the same time each day. Combined hormonal contraceptives increase the risk of thrombotic events, counsel patients on s/sx of stroke, PE, DVT. Common ADRs include menstrual irregularities, mood changes, nausea, headache, breast tenderness. Counsel that symptoms often resolve within 3 cycles-- if severe or unresolved after several cycles, product switch is recommended.","p":"Obtain medical history and BP before initiation of CHC.","lo":"","ty":"","mx":""},{"id":137,"w":14,"g":"Norethindrone","b":"Micronor, Aygestin","c":"Progestin-only contraceptive","m":"Progestins inhibit ovulation by suppression of LH, inhibit sperm capacitation, slow ovum transport, produce a thinning endometrium that hampers implantation, and cause cervical mucus changes that are hostile to sperm migration.","i":["Contraception, abnormal uterine bleeding, endometriosis"],"cn":"Important to take at the same time every day for best efficacy; if dose is taken >3 hours later than usual scheduled time, need to use a backup method for at least 48 hrs.","p":"Obtain medical history and BP before initiation of contraceptive. Does not carry same risks of thrombosis as estrogen-containing contraceptive options.","lo":"","ty":"","mx":""},{"id":91,"w":14,"g":"Finasteride","b":"Proscar (BPH) Propecia (alopecia)","c":"5α-Reductase Inhibitor","m":"Inhibits the conversion of testosterone to 5α-dihydrotestosterone (DHT) by 5α-reductase, isoform 2.","i":["Benign prostatic hyperplasia","Male pattern alopecia"],"cn":"For hair loss, you may need to take this medicine for 3 mo or longer before you see an effect. For an enlarged prostate, you may need to take this medicine for up to 6 mo to see the full effect. Women who are pregnant or may become pregnant should avoid touching or handling this medicine. This medicine can get into the body through the skin and may prevent development of genitalia in an unborn male baby. They should also avoid semen of a man taking finasteride. Report shortness of breath, breast swelling or breast mass to HCP.","p":"Not effective for the treatment of prostate cancer. Is effective in reducing the overall incidence of prostate cancer, although an increase in the incidence of high-grade prostate cancers has been observed. Draw baseline PSA before initiating therapy. Note that PSA will decrease by 50% with treatment, double PSA values when assessing for prostate cancer. Does not affect free PSA level. For BPH, often used in combination with alpha-blocker (eg, tamsulosin) which provides more rapid symptom relief but does not impact gland size. Hazardous agent: Use appropriate precautions for handling and disposal. Case reports exist associating suicidal ideation with finasteride administration.","lo":"1 mg once daily","ty":"1 mg once daily","mx":"1 mg once daily"},{"id":139,"w":14,"g":"Ethinyl estradiol; levonorgestrel","b":"Alesse, Aviane, Seasonale","c":"Combined hormonal contraceptive (estrogen/progestin)","m":"Prevents ovulation through suppression of follicle-stimulating hormone (FSH) and luteinizing hormone (LH); thins cervical mucus; alters endometrial lining, alters ovum transport.","i":["Contraception"],"cn":"Take once daily at the same time each day. Combined hormonal contraceptives increase the risk of thrombotic events, counsel patients on s/sx of stroke, PE, DVT. Common ADRs include menstrual irregularities, mood changes, nausea, headache, breast tenderness. Counsel that symptoms often resolve within 3 cycles-- if severe or unresolved after several cycles, product switch is recommended.","p":"Levonorgestrel has highest androgenic activity of progestin options in CHC. Obtain medical history and BP before initiation of CHC.","lo":"","ty":"","mx":""},{"id":97,"w":14,"g":"Ethinyl estradiol; norgestimate","b":"Ortho Tri-Cyclen, TriNessa, Sprintec","c":"Combined hormonal contraceptive (estrogen/progestin)","m":"Prevents ovulation through suppression of follicle-stimulating hormone (FSH) and luteinizing hormone (LH); thins cervical mucus; alters endometrial lining, alters ovum transport.","i":["Contraception, acne treatment"],"cn":"Take once daily at the same time each day. Combined hormonal contraceptives increase the risk of thrombotic events, counsel patients on s/sx of stroke, PE, DVT. Common ADRs include menstrual irregularities, mood changes, nausea, headache, breast tenderness. Counsel that symptoms often resolve within 3 cycles-- if severe or unresolved after several cycles, product switch is recommended.","p":"Obtain medical history and BP before initiation of CHC.","lo":"","ty":"","mx":""},{"id":155,"w":14,"g":"Drospirenone; ethinyl estradiol","b":"Yasmin, Yaz","c":"Combined hormonal contraceptive (estrogen/progestin)","m":"Prevents ovulation through suppression of follicle-stimulating hormone (FSH) and luteinizing hormone (LH); thins cervical mucus; alters endometrial lining, alters ovum transport.","i":["Contraception, acne treatment, premenstrual dysphoric disorder; PCOS"],"cn":"Take once daily at the same time each day. Combined hormonal contraceptives increase the risk of thrombotic events, counsel patients on s/sx of stroke, PE, DVT. Common ADRs include menstrual irregularities, mood changes, nausea, headache, breast tenderness. Counsel that symptoms often resolve within 3 cycles--if severe or unresolved after several cycles, product switch is recommended.","p":"Drospirenone has anti-androgen/antimineralocorticoid activity. Monitor K if taking higher dose (3-4 mg). CYP3A4 DDI. Obtain medical history and BP before initiation of CHC.","lo":"","ty":"","mx":""},{"id":53,"w":15,"g":"Spironolactone","b":"Aldactone","c":"Potassium-Sparing Diuretic; Selective Aldosterone Blocker","m":"A steroidal competitive aldosterone antagonist that acts from the interstitial side of the distal and collecting tubular epithelium to block sodium-potassium exchange, producing a delayed and mild diuresis. The diuretic effect is maximal in states of hyperaldosteronism. Excretion of sodium and chloride excretion is increased; excretion of potassium and magnesium is decreased. Has mild antihypertensive activity and has demonstrated a beneficial effect in NYHA class III and IV heart failure","i":["Heart failure","Edema associated with heart failure","Nephrotic syndrome","HTN","Hypokalemia","Ascites, liver cirrhosis","Acne vulgaris"],"cn":"May cause dizziness. Avoid driving, using machinery, or doing anything else that could be dangerous if not alert. Report signs/symptoms of hyperkalemia (muscle weakness, fatigue, bradycardia) and hyponatremia (confusion, dry mouth, thirst, weakness, hypotension, decreased urination). Avoid potassium supplements, foods/salt substitutes that are high in potassium. Avoid alcohol and NSAIDs.","p":"Dose is usually HF dose (12.5-25mg). Is an MRA in HF not a diuretic. Tablets smell like peppermint.","lo":"","ty":"","mx":""},{"id":158,"w":15,"g":"Insulin isophane","b":"Humulin N, Novolin N","c":"Intermediate-Acting Insulin","m":"Facilitates cellular uptake of glucose and promotes glycogen storage","i":["Diabetes mellitus"],"cn":"Counsel on s/sx of hypoglycemia and appropriate treatment. Rotate injection sites to prevent lipodystrophy. Monitor blood glucose and adjust dosage based on blood glucose monitoring as directed by prescriber.","p":"Typical duration of action: 6-12 hrs. Can be used for both basal and prandial coverage. NPH suspension is cloudy, must be gently mixed before administration.","lo":"Individualized","ty":"Individualized","mx":"Individualized"},{"id":80,"w":15,"g":"Glimepiride","b":"Amaryl","c":"Sulfonylurea","m":"Stimulates insulin release from pancreatic beta cells, reduces secretion of glucagon","i":["T2DM"],"cn":"Take with food (with first main meal of the day if taking once daily). Counsel on s/sx of hypoglycemia and appropriate hypoglycemia management; May need to reduce dose or hold doses if not eating. May cause weight gain. Associated with photosensitivity (counsel on sun safety). Rare hypersensitivity reactions.","p":"Glimepiride has moderate risk of hypoglycemia vs other sulfonylureas (glipizide < glimepiride < glyburide); avoid use in renal impairment (<60 ml/min); discontinue when more complex insulin regimens begin (e.g., basal + prandial); use caution in older adults. Sulfonylureas lose effectiveness over time.","lo":"1-2 mg once daily","ty":"2-4 mg once daily","mx":"8 mg once daily"},{"id":168,"w":15,"g":"Phentermine","b":"Adipex-P; Lomaira","c":"Centrally Acting Appetite Suppressant. C-IV","m":"A sympathomimetic amine with pharmacologic activity similar to amphetamines. Actions include CNS stimulation and elevation of BP. Weight loss is due to anorectic effect, primarily one of appetite suppression, but may also have other CNS or metabolic effects.","i":["Obesity"],"cn":"Take during day to avoid insomnia. Phentermine may impair ability to engage in potentially hazardous activities such as operating machinery or driving a motor vehicle; avoid.","p":"Phentermine is indicated only as short-term monotherapy for the management of exogenous obesity in conjunction with a comprehensive weight management program. Tolerance to the anorectic effect usually develops within a few weeks. When this occurs, the recommended dose should not be exceeded in an attempt to increase the effect; rather, the drug should be discontinued.","lo":"15 mg once daily","ty":"15-37.5 mg once daily","mx":"37.5 mg once daily"},{"id":111,"w":15,"g":"Tirzepatide","b":"Mounjaro","c":"Glucagon-Like Peptide-1 (GLP-1)/Glucose-Dependent Insulinotropic Polypeptide (GIP) Receptor Agonist","m":"Increases glucose-dependent insulin secretion, decreases inappropriate glucagon secretion, slows gastric emptying, and decreases food intake.","i":["T2DM","Chronic weight management (under brand name Zepbound)"],"cn":"Inject subcutaneously once weekly into the upper arm, thigh, or abdomen; use a different injection site each week. Administer on the same day each week, without regard to meals or time of day. GI effects are common dose-dependent ADR (N/V, appetite change), dose titration may help reduce this effect. Counsel on weight loss benefit. If a dose is missed and it is <4 days until next scheduled dose, skip dose and resume at next scheduled weekly dose. If multiple weeks are missed, patient may need to re-titrate from starting dose (2.5 mg) or initial theraputic dose(5 mg) to target dose to avoid GI ADRs. Keep refrigerated until first use, may be stored at RT after first use for up to 21 d.","p":"First-line option for T2DM with need for concomittant weight loss. BBW for CI in personal or family hx of medullary thyroid carcinoma or multiple endocrine neoplasia syndrome type 2. Low risk of hypoglycemia when used as monotherapy, but may increase risk of hypoglycemia if used with insulin or sulfonylurea. Use is not recommended in patients with severe GI disease or hx of pancreatitis. May decrease efficacy of oral contraception for 4 wks following initiation or dose increase. Monitor renal function. *Note: Zepbound has the same dosing as Mounjaro.","lo":"2.5 mg once weekly","ty":"5-15 mg once weekly","mx":"15 mg once weekly"},{"id":169,"w":15,"g":"Ethinyl estradiol and etonogestrel ring","b":"NuvaRing","c":"Combined hormonal contraceptive (estrogen/progestin)","m":"Prevents ovulation through suppression of follicle-stimulating hormone (FSH) and luteinizing hormone (LH); thins cervical mucus; alters endometrial lining, alters ovum transport.","i":["Contraception","Treatment of menorrhagia","Dysfunctional uterine bleeding"],"cn":"Vaginal ring inserted and left in place X 21 d, then removed X 7d for 4 week cycle. Recommended to leave inserted during sex. If the vaginal ring is inadvertently expelled or removed, it may be rinsed in cool to lukewarm water and reinserted as soon as possible, at the latest within 3 h. If left out for extended period, consult package insert for instructions and use backup method of contraception.","p":"Hormones are absorbed intravaginally but results in systemic exposure and carries risks similar to oral contraceptives with estrogen. Can be used for continuous cycle tx.","lo":"","ty":"","mx":""},{"id":136,"w":15,"g":"Methylprednisolone","b":"Medrol","c":"Adrenal Corticosteroid","m":"Corticosteroids are naturally occurring and synthetic adrenocortical steroids that cause varied metabolic effects, modify the body’s immune responses to diverse stimuli, and are used primarily for their anti-inflammatory effects in disorders of many organ systems.","i":["Inflammatory and autoimmune conditions","Allergic Reactions","Asthma/COPD","Adrenocorticoid deficiency"],"cn":"Take with meals to prevent GI upset and in the morning to help prevent insomnia. For high dose or long-term treatment, advise patients to monitor for signs of hyperglycemia, osteoporosis, adrenocortical insufficiency, and infection. Patient may experience insomnia, anxiety, aggression at higher doses.","p":"Available in oral and parenteral formulations. Acetate formulation is IM only. Succinate formulation used IV. Use the lowest effective dose and discontinue as soon as possible to avoid serious long-term adverse effects. Use with caution in patient with history of diabetes. Longer therapies (~ 2 weeks) need to be tapered to avoid adrenal insufficiency.","lo":"Oral: 4 mg once daily\n\nIV: < 40 mg daily","ty":"Oral: 4-48 mg once daily\n\nIV: 40 - 60 mg daily","mx":"Oral: 64 mg once daily or in divided doses\n\nIV: 1 - 2 mg/kg/day"},{"id":215,"w":15,"g":"Desogestrel; ethinyl estradiol","b":"Desogen, Apri, Reclipsen","c":"Combined hormonal contraceptive (estrogen/progestin)","m":"Prevents ovulation through suppression of follicle-stimulating hormone (FSH) and luteinizing hormone (LH); thins cervical mucus; alters endometrial lining, alters ovum transport.","i":["Contraception, acne treatment"],"cn":"Take once daily at the same time each day. Combined hormonal contraceptives increase the risk of thrombotic events, counsel patients on s/sx of stroke, PE, DVT. Common ADRs include menstrual irregularities, mood changes, nausea, headache, breast tenderness. Counsel that symptoms often resolve within 3 cycles-- if severe or unresolved after several cycles, product switch is recommended.","p":"Obtain medical history and BP before initiation of CHC.","lo":"","ty":"","mx":""},{"id":147,"w":15,"g":"Prednisolone oral","b":"Orapred, Prelone","c":"Adrenal Corticosteroid","m":"Glucocorticosteroids are naturally occurring and synthetic adrenocortical steroids that cause varied metabolic effects, modify the body’s immune responses to diverse stimuli, and are used primarily for their anti-inflammatory effects in disorders of many organ systems.","i":["Inflammatory and autoimmune conditions","Allergic Reactions","Asthma/COPD","Adrenocorticoid deficiency"],"cn":"Take with meals to prevent GI upset and in the morning to help prevent insomnia. For high dose or long-term treatment, advise patients to monitor for signs of hyperglycemia, osteoporosis, adrenocortical insufficiency, and infection. Patient may experience insomnia, anxiety, aggression at higher doses. Some formulations taste worse than others; chocolate milk may mask taste best","p":"Available in oral and ophthalmic preparations.Use the lowest effective dose and discontinue as soon as possible to avoid serious long-term adverse effects. Use with caution in patient with history of diabetes. Longer therapies (~ 2 weeks) need to be tapered to avoid adrenal insufficiency. 1 mg prednisolone is typically equivalent to 1 mg prednisone. Prednisolone is the active metabolite of prednisone and is preferred in in patients with impaired liver metabolism.","lo":"5 mg once daily","ty":"10-60 mg once daily or divided doses","mx":"100 mg once daily or divided doses"},{"id":236,"w":15,"g":"Medroxyprogesterone","b":"Depo-Provera","c":"Progestin-only contraceptive","m":"Progestins inhibit ovulation by suppression of LH, inhibit sperm capacitation, slow ovum transport, produce a thinning endometrium that hampers implantation, and cause cervical mucus changes that are hostile to sperm migration.","i":["Contraception"],"cn":"Administered as SQ injection into anterior thigh or abdomen once every 3 months (12-14 weeks). May cause weight gain, menstrual irregularities; amenorrhea in up to 50% of users after 12 months of use","p":"Associated with short-term bone density loss, avoid in those taking long-term corticosteroids or w/ history of high risk fracture. May result in longer delay in return to fertility after discontinuation when compared to other options.","lo":"","ty":"","mx":""},{"id":24,"w":16,"g":"Tamsulosin","b":"Flomax","c":"α1-Adrenergic Blocker","m":"Is closely related to quinazoline derivatives that selectively block postsynaptic α1-adrenergic receptors. Total peripheral resistance is reduced through arterial and venous dilations. Reflex tachycardia that occurs with other vasodilators is infrequent because there is no presynaptic α2-receptor blockade. The drugs also decrease total cholesterol, increase HDL-cholesterol, and may improve glucose tolerance and reduce left ventricular mass during long-term therapy. They increase urine flow in BPH by relaxing smooth muscle tone in the bladder neck and prostate.","i":["Benign prostatic hyperplasia"],"cn":"Administer 30 min after same meal daily as fasting increases bioavailability by 30%. Avoid activities requiring coordination until drug effects are realized, as drug may cause vertigo or dizziness. Rise slowly from a sitting/lying position, as this drug may cause orthostatic hypotension. Syncope or loss of consciousness is possible with 1st dose or dose increases, especially if in an upright position.","p":"Alpha-blockers commonly used for HTN. Patients with both HTN and BPH should avoid taking other α-adrenergic blocking agents while taking this drug. Tamsulosin is not indicated for HTN.","lo":"0.4 mg once daily","ty":"0.4 mg once daily","mx":"0.8 mg once daily"},{"id":178,"w":16,"g":"Doxazosin","b":"Cardura","c":"α1-Adrenergic Blocker","m":"Selectively blocks postsynaptic α1-adrenergic receptors, reducing peripheral resistance through arterial and venous dilations. Reflex tachycardia that occurs with other vasodilators is infrequent because there is no presynaptic α2-receptor blockade. Increase urine flow by relaxing smooth muscle tone in the bladder neck and prostate.","i":["Benign prostatic hyperplasia","HTN"],"cn":"Initial dose should be taken with breakfast, particularly with sustained-release products. Avoid activities requiring coordination until drug effects are realized, as drug may cause vertigo or dizziness. Rise slowly from a sitting/lying position, as this drug may cause orthostatic hypotension. Syncope or loss of consciousness is possible with first dose or dose increases, especially if patient is in an upright position. Report priapism to HCP immediately.","p":"Safety and effectiveness not established in children.","lo":"1 mg once daily","ty":"2-4 mg once daily","mx":"8 mg once daily"},{"id":28,"w":16,"g":"Meloxicam","b":"Mobic","c":"NSAID","m":"COX-1 and COX-2 (modestly selective) inhibitor which results in decreased formation of prostaglandin precursors; has antipyretic, analgesic, and anti-inflammatory properties; reversibly alters platelet function and prolongs bleeding time.","i":["Osteoarthritis","Rheumatoid arthritis","Gout"],"cn":"Take with food or milk to decrease GI upset. For suspension, shake gently before using. Avoid use around 20 wk gestation. Pregnant women should consult OB/GYN before using.","p":"Elderly patients are at increased risk of GI ulceration. Use lowest effective dose for shortest possible duration; after observing initial response, adjust dose and frequency to meet individual patient’s needs. Once daily dosing is an advantage.","lo":"7.5 mg once daily","ty":"15 mg once daily","mx":"15 mg once daily"},{"id":206,"w":16,"g":"Colchicine","b":"Colcrys","c":"Antigout","m":"May interrupt and inhibit cycle of monosodium urate crystal deposition in joint tissues and reduce resultant inflammatory response. Exact mechanism unknown.","i":["Acute gout flare","Gout prophylaxis"],"cn":"For acute flare, should be initiated within 12 hours of onset of symptoms (use an alternative agent if it have been >36 hours since symptom onset); GI side effects occur in ~25% of patients (diarrhea, N/V, abdominal pain)","p":"Can be used for both prophylaxis and treatment of gout; requires dose adjustment with concurrent use of CYP3A4 and P-gp inhibitors; use with caution and avoid long-term use in renal and hepatic impairment","lo":"","ty":"","mx":""},{"id":33,"w":16,"g":"Ibuprofen","b":"Motrin","c":"NSAID","m":"Nonselective inhibitor of cyclo-oxygenase-1 (COX-1) and cyclo-oxygenase-2 (COX-2), and reversibly alters platelet function and prolongs bleeding time.","i":["Pain","Headache","Fever","Osteoarthritis","Rheumatoid arthritis"],"cn":"Take with food or milk to decrease GI upset. Counsel heart failure patients post discharge on NSAIDs avoidance due to fluid retention, edema leading to exacerbations.","p":"Elderly patients are at increased risk of GI ulceration. NSAIDs are associated with an increased risk of adverse cardiovascular thrombotic events, including fatal MI and stroke. Use the lowest effective dose for the shortest possible duration; after observing initial response, adjust dose and frequency to meet individual patient’s needs. NSAIDs are also associated with renal adverse events, especially in patients with preexisting CKD, nephrotic syndrome, liver disease, and patients who are volume depleted. Various OTC ibuprofen products are available","lo":"200 mg every 4-6 hours as needed","ty":"400-600 mg every 4-6 hours as needed","mx":"800 mg every 6 hours (3200 mg per day)"},{"id":208,"w":16,"g":"Terazosin","b":"Hytrin","c":"α1-Adrenergic Blocker","m":"Selectively blocks postsynaptic α1-adrenergic receptors. Total peripheral resistance is reduced through arterial and venous dilations. Reflex tachycardia that occurs with other vasodilators is infrequent because there is no presynaptic α2-receptor blockade. Increases urine flow in BPH by relaxing smooth muscle tone in the bladder neck and prostate.","i":["Benign prostatic hyperplasia","HTN"],"cn":"Avoid activities requiring mental alertness or coordination until drug effects are realized, as drug may cause dizziness and somnolence. Rise slowly from a sitting/lying position, as this drug may cause orthostatic hypotension. May experience syncope or loss of consciousness with 1st dose. Take drug at bedtime to minimize side effects, especially the 1st dose. Avoid sudden discontinuation of drug, as this may cause rebound HTN. Avoid alcohol while taking this drug.","p":"JNC 8 guidelines do not recommend the use of terazosin, or other alpha-blockers, for the treatment of HTN. Clinical use should be restricted to the management of BPH.","lo":"1 mg once daily","ty":"5-10 mg once daily","mx":"20 mg once daily"},{"id":73,"w":16,"g":"Diclofenac","b":"Cataflam, Voltaren","c":"NSAID","m":"Nonselective inhibitor of cyclo-oxygenase-1 (COX-1) and cyclo-oxygenase-2 (COX-2)","i":["Pain","Migraine","Osteoarthritis","Dysmenorrhea","Rheumatoid arthritis","Acute gout flare"],"cn":"Take with food or milk to decrease GI upset.","p":"Elderly patients are at increased risk of GI ulceration. Patients with underlying cardiac dysfunction are at increased risk of cardiovascular events. Use lowest dose for shortest period of time to minimize toxicity. Available in both sodium and potassium salts, in combination with misoprostol, and in parenteral, ophthalmic, and topical products. Medication guide required at dispensing.","lo":"50 mg twice daily","ty":"75 mg twice daily","mx":"150 mg twice daily"},{"id":270,"w":16,"g":"Febuxostat","b":"Uloric","c":"Xanthine Oxidase Inhibitor","m":"Selectively inhibits xanthine oxidase, the enzyme responsible for converting xanthine to uric acid. Lowers uric acid and reduces gout.","i":["Gout"],"cn":"Counsel on risk of increased frequency of gout flares during early prophylactic treatment and importance of adherence and treating to target serum urate <6 mg/dL for optimal effect. Take with or without food, maintain adequate hydration. ADRs: GI (diarrhea, nausea), elevated LFTs (rare hepatic failure).","p":"Generally considered second-line urate lowering therapy after allopurinol but may have more potent urate-lowering effect. BBW: risk of CV death in those with established CVD, avoid use. An increase in gout flares is typically seen when initiating urate-lowering therapy and prophylactic therapy (NSAID, colchicine, corticosteroid) at initiation of therapy for 3-6 mo may be beneficial to prevent gout flares. Renal dosing required for CrCl <30 ml/min, monitor LFTs at baseline and periodically, monitor serum urate q2-4 weeks after initiation and during titration","lo":"","ty":"","mx":""},{"id":103,"w":16,"g":"Naproxen","b":"Naprosyn","c":"NSAID","m":"Nonselective inhibitor of COX-1 and COX-2.","i":["Osteoarthritis","Rheumatoid arthritis","Gout, acute","Fever","Pain","Migraine"],"cn":"Take with food or milk to decrease GI upset. Don't exceed maximum recommended dose.","p":"Elderly patients are at increased risk of GI ulceration. Patients with underlying cardiac dysfunction are at increased risk of cardiovascular effects. Use lowest dose for shortest duration to minimize toxicity. Naproxen is also available OTC as a 220 mg tablet. If taken as OTC for fever, do not take longer than 10 d unless directed by physician.","lo":"250 mg twice daily","ty":"500 mg twice daily","mx":"1000 mg twice daily (2000 mg per day)"},{"id":287,"w":16,"g":"Prazosin","b":"Minipress","c":"Alpha-1 Blocker","m":"Blocks alpha-1 adrenergic receptors, reducing vascular tone","i":["PTSD nightmares (off-label)","Hypertension","benign prostatic hyperplasia"],"cn":"- Take the medication as prescribed. - Take the first dose at bedtime to minimize the risk of dizziness and fainting. - Rise slowly from sitting or lying down to prevent postural hypotension.","p":"Often taken at bedtime for nightmares. Prazosin can cause orthostatic hypotension, especially with initial dosing. - Monitor nightmare frequncy/severity, blood pressure and heart rate.","lo":"1 mg once nighly","ty":"1-10 mg nightly","mx":"20 mg per day"},{"id":1,"w":17,"g":"Atorvastatin","b":"Lipi
